/* ================= PORTRAITS ET PODIUM (GDD §16) =================
   Le visage est généré par DiceBear — style « Micah » (Micah Lanier,
   CC BY 4.0) — plutôt que dessiné à la main. La bibliothèque est vendée
   localement (vendor/dicebear.bundle.js, voir vendor/README.md) : aucun
   appel réseau, ça marche hors ligne. Le portrait reste déterministe — la
   seed est l'identifiant du pilote, donc un pilote donné garde toujours le
   même visage — et vieillit un peu avec l'âge (grisonnement, barbe). */

/* DiceBear réutilise toujours les huit mêmes ids internes (des masques de
   découpe). Sans renommage, deux portraits affichés côte à côte — le vivier,
   une grille de départ — se marchent dessus : le second n'hérite que du
   masque du premier. La liste est figée (balayée exhaustivement par
   unit23.js sur tout le domaine du style) et ne change pas d'une version de
   la bibliothèque à l'autre sans que le test s'en aperçoive. */
const AVATAR_ID_TOKENS = ['viewboxMask'];
function namespaceAvatarIds(svg, suffix){
  let s = svg;
  for(const id of AVATAR_ID_TOKENS){
    s = s.split('id="'+id+'"').join('id="'+id+suffix+'"');
    s = s.split('url(#'+id+')').join('url(#'+id+suffix+')');
  }
  return s;
}

/* Assombrit une couleur (0 = inchangée, 1 = noire). Sert au podium. */
function assombrir(hex, part){
  const n = parseInt(hex.slice(1),16);
  const c = [(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*(1-part)));
  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* Buste DiceBear (style Micah, plus adulte que le précédent Personas) pour ce
   pilote : combinaison aux couleurs de l'écurie, débarrassé de son <svg>
   englobant et de ses métadonnées (l'attribution vit une seule fois, dans
   l'onglet Crédits — pas la peine de la répéter à chaque portrait). */
function avatarInterieur(p, coul){
  const vieux = clamp((p.age-34)/10, 0, 1);
  const opts = {
    shirtColor: [coul.replace('#','')],
    // « beard » se dessine comme un aplat noir plein qui masque tout le bas
    // du visage — bien plus proche d'une cagoule que d'une barbe dans ce
    // style. « scruff » (repousse) reste sobre et naturel à tout âge.
    facialHair: ['scruff'],
    // sous 19 ans, jamais de barbe — un jeune de 14 ans n'en a pas ;
    // au-delà, une chance normale par pilote, stable d'un affichage à l'autre
    facialHairProbability: p.age>=19 ? 12 : 0,
    // les bouches grande ouverte (« surprised », « nervous », « pucker »)
    // donnent un air alarmé à un roster entier de pilotes ; on garde les
    // expressions posées.
    mouth: ['smile','smirk','frown','laughing'],
  };
  // Grisonnement : plus grossier que l'ancien dégradé continu (un pas net
  // plutôt qu'un mélange), mais le principe — le portrait vieillit — tient.
  // La palette par défaut est très pastel (menthe, lavande, cyan) : bien
  // pour un jeune pilote, mais aucune de ces teintes ne se lit comme un
  // cheveu naturel une fois âgé — le blanc est réservé à ce cas précis.
  if(vieux>0.4) opts.hairColor = ['ffffff'];
  else opts.hairColor = ['000000','f4d150','ac6651','77311d'];
  const svg = window.DicebearPersona.svgFor(p.id, opts);
  const inner = svg.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '')
                    .replace(/<metadata[\s\S]*?<\/metadata>/, '');
  return namespaceAvatarIds(inner, '-'+p.id);
}

/* Portrait SVG. `opt.integre` renvoie le dessin nu (sans <svg> ni fond) pour
   l'insérer dans une autre scène SVG — le podium, par exemple. */
function portraitPilote(p, opt={}){
  if(!p) return '';
  const coul = opt.coul || '#3a4552';
  const buste = avatarInterieur(p, coul);
  const fond = opt.integre ? '' : `<rect width="100" height="120" fill="#e3e9ec"/>
      <circle cx="50" cy="44" r="40" fill="${coul}" opacity=".16"/>`;
  // Le buste DiceBear tient dans un carré 360×360 ; on le met à l'échelle du
  // gabarit 100×120 en le recouvrant entièrement (scale = max des deux
  // rapports, soit 120/360) et en le recentrant horizontalement — comme un
  // fond `cover` en CSS. Le débord gauche/droit est rogné par le clipPath.
  const ECH_AVATAR = 120/360, DX_AVATAR = (100 - 360*ECH_AVATAR)/2;
  const dessin = `${fond}<g transform="translate(${round(DX_AVATAR,2)},0) scale(${ECH_AVATAR})">${buste}</g>`;
  if(opt.integre) return dessin;
  return `<svg viewBox="0 0 100 120" class="portrait" role="img" aria-label="Portrait de ${escapeHtml(p.nom)}">
    <defs><clipPath id="pc${p.id}"><rect x="0" y="0" width="100" height="120" rx="14"/></clipPath></defs>
    <g clip-path="url(#pc${p.id})">${dessin}</g>
  </svg>`;
}

/* Livrée du pilote : l'écurie de la saison en cours, sinon celle du contrat
   déjà signé pour la saison à venir — sans quoi le portrait redevient gris
   entre la signature et le lancement de la saison. */
function coulPilote(){
  if(!S.pilote) return '#3a4552';
  if(S.saison && S.saison.ecurieId) return coulEcurie(S.saison.ecurieId, S.saison.catId);
  if(S.contrat && S.contrat.ecurieId) return coulEcurie(S.contrat.ecurieId, S.contrat.catId);
  return '#3a4552';
}

/* Couleur de l'écurie courante du pilote. */
function coulEcurie(ecurieId, catId){
  if(!ecurieId) return '#3a4552';
  const e = (ecuriesPour(catId||(S.pilote?S.pilote.catId:'kmini'))||[]).find(x=>x.id===ecurieId);
  return (e && e.coul) || '#3a4552';
}

/* Podium 2D : marches, portrait du vainqueur, trophée, confettis (GDD §16).
   Géométrie : viewBox 200×160, trois marches de 52 de large centrées, tout
   tient dans le cadre — rien ne doit déborder sur la carte qui l'entoure. */
function scenePodium(pos, nomsTop3){
  const p = S.pilote, coul = coulPilote();
  const SOL = 150, L = 52;
  const X = {1:74, 2:12, 3:136};             // abscisse de chaque marche
  const H = {1:60, 2:44, 3:34};              // hauteur de chaque marche
  // la marche du joueur reprend la couleur de l'écurie, assombrie pour que
  // la combinaison du pilote (même couleur) se détache dessus
  const marche = rang => {
    const x = X[rang], haut = H[rang], moi = rang===pos;
    return `<g transform="translate(${x},${SOL-haut})">
      <rect width="${L}" height="${haut}" rx="3" fill="${moi?assombrir(coul,0.45):'#2a323d'}"
        ${moi?`stroke="${coul}" stroke-width="1.5"`:''}/>
      <rect width="${L}" height="4" rx="2" fill="#ffffff" opacity=".18"/>
      <text x="${L/2}" y="${haut/2+8}" text-anchor="middle" font-family="Barlow Condensed, sans-serif"
        font-size="22" font-weight="700" fill="${moi?'#fff':'#8d98a5'}">${rang}</text>
    </g>`;
  };
  const xMoi = X[pos], yMoi = SOL - H[pos];
  const confettis = pos===1 ? Array.from({length:20},(_,i)=>{
    const cx = 6 + (i*97)%188, delai = -(i%10)*0.26;   // négatif : chute déjà entamée
    const cc = ['#ffd257','#ff6b6b','#4dabf7','#69db7c','#ffffff'][i%5];
    return `<rect class="confetti" x="${cx}" y="-6" width="4" height="7" rx="1" fill="${cc}"
      style="animation-delay:${delai}s"/>`;
  }).join('') : '';
  // trophée posé à côté du vainqueur. L'animation CSS pose un `transform` qui
  // écraserait celui de l'attribut : le placement va donc sur un groupe parent.
  const trophee = pos===1
    ? `<g transform="translate(${xMoi+27},${yMoi-25})"><g class="trophee">
        <path d="M4 0 h18 v8 a9 9 0 0 1 -18 0z" fill="#ffd257"/>
        <path d="M2 1 h3 v5 a4.5 4.5 0 0 1 -3 -5z M21 1 h3 a4.5 4.5 0 0 1 -3 5z" fill="#ffd257"/>
        <rect x="11" y="16" width="4" height="6" fill="#e0b43f"/>
        <rect x="7" y="21" width="12" height="3" rx="1" fill="#e0b43f"/>
      </g></g>` : '';
  // portrait inséré en dessin nu : un <svg> imbriqué se recadrerait tout seul
  const ECH = 0.46;
  const decale = pos===1 ? -8 : (L-100*ECH)/2;   // le vainqueur laisse la place au trophée
  const figure = `<g transform="translate(${xMoi+decale},${yMoi-120*ECH+4}) scale(${ECH})">
    ${portraitPilote(p,{coul, integre:true})}</g>`;
  return `<svg viewBox="0 22 200 132" class="podium" role="img"
      aria-label="Podium, ${escapeHtml(p.nom)} ${ordinal(pos)}">
    ${confettis}
    ${marche(2)}${marche(3)}
    ${figure}
    ${marche(1)}
    ${trophee}
  </svg>
  <div class="podium-noms">${nomsTop3.map((n,i)=>`<span class="${i+1===pos?'moi':''}">${i+1}. ${escapeHtml(n)}</span>`).join('')}</div>`;
}

/* Illustration du hero d'accueil : garage stylisé (silhouette de voiture,
   drapeau à damier, ligne de piste), dans les couleurs de l'écurie si le
   pilote en a une. Pas une scène 3D — un aplat simple, cohérent avec le

    </g>
    <g transform="translate(18,38)">

/* Barre de sélection des pilotes gérés (GDD §15). Masquée tant qu'il n'y en a
   qu'un : elle n'apporte rien et mange de la hauteur d'écran. */
function renderBarrePilotes(){
  const bar = $('#barrePilotes');
  if(!S){ bar.hidden=true; bar.innerHTML=''; return; }
  const plusieurs = nbDossiers()>1 || (nbPilotes()>=1 && placesPilotes()>1);
  if(!S.dossiers || !plusieurs){ bar.hidden=true; bar.innerHTML=''; return; }
  bar.hidden=false;
  const aCourir = new Set(coursesDuTour().map(x=>x.i));
  let h='';
  S.dossiers.forEach((d,i)=>{
    const v = vueDossier(i);
    if(!v.pilote){
      h += `<div class="chip-pil vide" data-act="choisirDossier" data-i="${i}">Place libre</div>`;
      return;
    }
    const cat = CAT[v.pilote.catId];
    const coul = v.saison ? coulEcurie(v.saison.ecurieId, v.saison.catId)
               : v.contrat ? coulEcurie(v.contrat.ecurieId, v.contrat.catId) : '#3a4552';
    h += `<div class="chip-pil ${i===S.actif?'actif':''}" data-act="choisirDossier" data-i="${i}">
      <span class="av">${portraitPilote(v.pilote,{coul})}</span>
      <span class="tx"><span class="nm">${escapeHtml(v.pilote.nom)}</span><br>
        <span class="ct">${cat.court}${v.saison&&!v.saison.finie?` · ${v.saison.pts} pts`:''}</span></span>
      ${blesse(v.pilote)?'<span class="pastille" style="background:var(--red)" title="Blessé"></span>'
        : aCourir.has(i)?'<span class="pastille" title="Court cette manche"></span>':''}
    </div>`;
  });
  if(resteDeLaPlace() && nbPilotes()<placesPilotes())
    h += `<div class="chip-pil vide" data-act="recruterEnPlus">+ Recruter</div>`;
  bar.innerHTML = h;
}
function render(){
  const enJeu = !!S;
  $('#nav').hidden = !enJeu;
  $('#hdrRep').hidden = !enJeu; $('#hdrCash').hidden = !enJeu;
  $$('.view').forEach(v=>v.classList.remove('active'));

  if(!enJeu){ $('#v-splash').classList.add('active'); renderSplash(); return; }

  // en-tête
  const rp = repPalier(S.manager.repPoints);
  $('#hdrRep .v').textContent = rp.p+'/10';
  $('#hdrRep .l').textContent = rp.nom;
  const c = $('#hdrCash .v');
  c.textContent = fmtEur(S.manager.budget);
  c.classList.toggle('neg', S.manager.budget<0);
  $('#hdrSub').textContent = S.pilote
    ? `${S.pilote.nom} · ${CAT[S.pilote.catId].nom} · ${S.annee}`
    : `Saison ${S.annee} · aucun pilote`;

  const u = nbNonLus();
  $('#navUnread').hidden = u===0; $('#navUnread').textContent = u;
  renderBarrePilotes();

  $$('.tab-btn').forEach(b=>{
    const t=b.dataset.tab;
    b.classList.toggle('active', t===UI.tab);
    b.classList.toggle('locked', (t==='weekend' && !S.weekend));
  });

  $('#v-'+UI.tab).classList.add('active');
  (RENDERERS[UI.tab]||renderBureau)();
}
$$('.tab-btn').forEach(b=> b.onclick = ()=>go(b.dataset.tab));

/* Délégation d'événements : data-act="nom" data-x="…" */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(ACTIONS[act]){ e.preventDefault(); ACTIONS[act](el.dataset, el); }
});
const ACTIONS = {};

ACTIONS.choisirDossier = d=>{
  const i = +d.i;
  const v = vueDossier(i);
  if(!v) return;
  if(!v.pilote){ ACTIONS.recruterEnPlus(); return; }
  if(activerDossier(i)){ saveGame(); showToast('Dossier : '+v.pilote.nom); }
  render();
};
/* Aucun pilote engagé cette manche : on avance le calendrier commun. */
ACTIONS.passerManche = ()=>{
  if(coursesDuTour().length){ showToast('Un pilote court encore cette manche'); return; }
  if(!forfaitsDuTour().length && manchesTotales()===0){ showToast('Aucune saison en cours'); return; }
  avancerCalendrier();
  saveGame(); render();
};
ACTIONS.recruterEnPlus = ()=>{
  if(nbPilotes()>=placesPilotes()){
    showToast('Réputation insuffisante pour un pilote de plus');
    return;
  }
  UI.viserVivier = true;
  go('pilote');
};

ACTIONS.reprendre = ()=>{

/* Ce que la migration ne peut pas fabriquer sans le contexte de la partie :

/* ------------------------------------------------- ÉCRAN : BUREAU */
function renderBureau(){
  const p=S.pilote, sa=S.saison, rp=repPalier(S.manager.repPoints), suiv=repProchain(S.manager.repPoints);
  let h='';

  if(S.phase==='faillite'){
    $('#v-bureau').innerHTML = `<div class="card accent center">
      <h2 style="justify-content:center">Fin de partie</h2>
      <div class="sect-title">Faillite</div>
      <div class="note mb">Votre trésorerie est descendue à ${fmtEurFull(S.manager.budget)}. Plus personne ne vous suit.</div>
      <div class="note mb">${S.stats.saisonsJouees} saison(s) · ${S.stats.coursesGagnees} victoire(s) · ${S.stats.titres} titre(s)</div>
      <button class="btn btn-cta btn-block mt" data-act="nouvellePartieDepuisFin">Recommencer une carrière</button>
    </div>`;
    return;
  }

  // ---- hero : identité + illustration de garage. Le bouton reste général
  // (« gérer l'écurie ») à dessein : l'action précise du moment a déjà sa
  // propre carte juste en dessous (ctaBureau()) — doublonner le même libellé
  // aux deux endroits serait plus confus qu'utile.
  const heroCta = p ? {lab:'Gérer mon pilote', tab:'pilote'} : {lab:'Consulter le vivier', tab:'pilote'};
  h += `<div class="card hero-bureau">
    <div class="split">
      <div class="txt">
        <div class="eyebrow">${S.annee}${p?' · '+CAT[p.catId].nom:''}</div>
        <div class="titre">${escapeHtml(S.manager.nom||'Manager')}</div>
        <div class="sous">${p?escapeHtml(p.nom)+' · '+rp.nom:'Aucun pilote sous contrat — '+rp.nom}</div>
      </div>
      <div class="art">${sceneGarage()}</div>
    </div>
    <button class="btn btn-cta hero-cta" data-act="tab" data-tab="${heroCta.tab}">${escapeHtml(heroCta.lab)}</button>
  </div>`;

  // ---- rangée de cartes de résumé
  h += `<div class="sumrow">
    <div class="sumcard">
      <div class="ico">⭐</div>
      <div class="val">${rp.p}/10</div>
      <div class="lab">${escapeHtml(rp.nom)}</div>
    </div>
    <div class="sumcard">
      <div class="ico">💰</div>
      <div class="val ${S.manager.budget<0?'txt-red':S.manager.budget<20000?'txt-amber':'txt-green'}">${fmtEur(S.manager.budget)}</div>
      <div class="lab">Trésorerie</div>
    </div>
    <div class="sumcard">
      <div class="ico">🏁</div>
      <div class="val ${!sa?'':sa.caisse<0?'txt-red':sa.caisse<Math.round(sa.coutTotal/CAT[sa.catId].courses)?'txt-amber':'txt-green'}">${sa?fmtEur(sa.caisse):'—'}</div>
      <div class="lab">Caisse de saison</div>
    </div>
    <div class="sumcard">
      <div class="ico">📣</div>
      <div class="val txt-blue">${Math.round(S.manager.image)}</div>
      <div class="lab">Image médiatique</div>
      <button class="btn-ghost btn-sm" data-act="tab" data-tab="sponsors">Gérer sponsors</button>
    </div>
  </div>`;

  // ---- accès aux écrans de gestion : plus dans la barre d'onglets du haut,
  // regroupés ici pour que rien ne devienne injoignable.
  h += `<div class="card flat"><h2>Gérer l’écurie<span class="hint">accessible depuis le Bureau</span></h2>
    <div class="hubgrid">
      <button data-act="tab" data-tab="sponsors"><span class="hi">💼</span>Sponsors</button>
      <button data-act="tab" data-tab="contrats"><span class="hi">📄</span>Contrats</button>
      <button data-act="tab" data-tab="staff"><span class="hi">🧑‍🔧</span>Staff</button>
      <button data-act="tab" data-tab="champ"><span class="hi">🏆</span>Championnat</button>
      <button data-act="tab" data-tab="finances"><span class="hi">📊</span>Finances</button>
      <button data-act="tab" data-tab="save"><span class="hi">⚙️</span>Sauvegarde</button>
    </div>
  </div>`;

  if(suiv){
    const prev = rp.seuil, span = suiv.seuil-prev, fait = S.manager.repPoints-prev;
    // Densité faible sur l'accueil (GDD §23.2) : le détail du palier se déplie.
    h += `<div class="card"><h2><span class="vig"><span>★</span></span>Réputation<span class="hint">vers ${suiv.nom}</span></h2>
      ${gline('Palier '+suiv.p, fait/span*100, 'blue','%')}
      <details class="repli"><summary>Ce que ce palier ouvre</summary>
        <div class="note mt">${suiv.acces}</div>
        <div class="note txt-muted mt">Chaque palier est plus long que le précédent : ${Math.round(span)} points à couvrir ici.</div>
      </details>
    </div>`;
  }

  // ---- CTA principal selon la phase
  h += ctaBureau();

  // ---- règlement en vigueur : il conditionne le baquet et la R&D (GDD §11).
  // Placé sous le CTA : c'est un cadre de décision, pas l'action du moment.
  if(p) h += sa
    ? carteReglement(domaineRegl(sa.catId), false, reglSaison(sa), 'Règlement '+sa.annee+' — '+CAT[sa.catId].nom)
    : carteReglement(domaineRegl(p.catId));

  // ---- pilote
  if(p){
    const n=notePilote(p);
    h += `<div class="card"><h2><span class="vig"><span>🏎</span></span>Votre pilote</h2>
      <div class="ovr">
        <div class="portrait-box">${portraitPilote(p,{coul:coulPilote()})}</div>
        ${noteBadge(n)}
        <div style="flex:1">
          <div style="font-family:var(--cond);font-size:20px;font-weight:700">${escapeHtml(p.nom)}</div>
          <div class="note">${p.age} ans · ${p.pays} · ${CAT[p.catId].nom}</div>

      ${gline('Forme', p.forme, couleurMoral(p.forme))}
      ${gline('Relation', p.relation, couleurMoral(p.relation))}
      ${gline('Réputation', p.reputation, 'blue')}
      ${p.relation<RELATION_RUPTURE?`<div class="note warn mt">⚠ <b>Rupture imminente.</b>
        ${(p.rupture||0)>=2?'Il a déjà rencontré un autre manager. Une manche de plus dans cet état et il part.'
          :'Il ne se sent plus suivi. Encore '+(3-(p.rupture||0))+' manche(s) ainsi et il changera de manager.'}</div>`
        : p.relation<32?`<div class="note warn mt">⚠ La relation se dégrade sérieusement. Sous ${RELATION_RUPTURE}/100, un pilote mal suivi finit par changer de manager — et vous perdez toutes vos commissions.</div>`:''}

    </div>`;
  }

  // ---- saison en cours
  if(sa && !sa.finie){
    const c=CAT[sa.catId], prochaine=sa.calendrier[sa.courseIndex];
    const cv = financementCouvert();
    h += `<div class="card"><h2>Saison ${sa.annee} — ${c.nom}<span class="hint">${sa.ecurieNom}</span></h2>
      ${echelle(sa.catId)}
      <div class="kpis" style="margin:10px 0 6px">
        ${kpi('Manche', (sa.courseIndex+1)+' / '+c.courses, prochaine?prochaine.nom:'—','')}
        ${kpi('Points', sa.pts, ordinal(positionChampionnat())+' au général','')}
        ${kpi('Victoires', sa.victoires, sa.podiums+' podium(s)', sa.victoires?'amber':'')}
        ${kpi('Voiture', Math.round(sa.voiture + bonusDevMoyen()), bonusDevMoyen()>0.05?`base ${Math.round(sa.voiture)} + R&D ${round(bonusDevMoyen(),1)}`:'Performance matériel','blue')}
      </div>
      ${gline('Financement couvert', cv*100, cv>=1?'green':cv>=0.7?'amber':'red','%')}
      ${cv<1?`<div class="note warn mt">Il manque du sponsoring pour boucler la saison. Chaque manche non financée est prélevée sur votre trésorerie.</div>`:''}
    </div>`;
  }

  // ---- écurie de management (GDD §15) : l'état de chaque pilote d'un coup d'œil
  if(nbPilotes()>1){
    h += `<div class="card"><h2><span class="vig"><span>👥</span></span>Écurie de management<span class="hint">${nbPilotes()} / ${placesPilotes()} places</span></h2>
      <div class="tw"><table><thead><tr><th>Pilote</th><th>Catégorie</th><th>Écurie</th>
        <th class="num">Pts</th><th class="num">Class.</th><th></th></tr></thead><tbody>
      ${S.dossiers.map((d,i)=>{
        const v = vueDossier(i);
        if(!v.pilote) return '';
        const sa = v.saison;
        const enCours = sa && !sa.finie;
        const court = coursesDuTour().some(x=>x.i===i);
        return `<tr class="${i===S.actif?'me':''}" data-act="choisirDossier" data-i="${i}" style="cursor:pointer">
          <td><b>${escapeHtml(v.pilote.nom)}</b><div class="small txt-muted">${v.pilote.age} ans</div></td>
          <td>${CAT[v.pilote.catId].court}</td>
          <td class="txt-2">${sa?escapeHtml(sa.ecurieNom):(v.contrat?escapeHtml(v.contrat.ecurieNom):'—')}</td>
          <td class="num">${sa?sa.pts:'—'}</td>
          <td class="num">${sa&&sa.posChamp?ordinal(sa.posChamp):(enCours?'en cours':'—')}</td>
          <td>${court?tag('Court','t-amber'):(sa?'':tag('Sans baquet','t-red'))}</td>
        </tr>`;
      }).join('')}
      </tbody></table></div>
      ${nbPilotes()<placesPilotes()?`<button class="btn-ghost btn-sm mt" data-act="recruterEnPlus">Recruter un pilote de plus</button>`:''}
    </div>`;
  }

  // ---- derniers messages
  const derniers = S.inbox.slice(0,3);
  if(derniers.length){
    h += `<div class="card"><h2><span class="vig"><span>✉</span></span>Messagerie<span class="hint">${nbNonLus()} non lu(s)</span></h2>
      ${derniers.map(m=>`<div class="msg ${m.lu?'':'unread'}" data-act="ouvrirMsg" data-id="${m.id}">
        <div class="top"><span class="fr">${escapeHtml(m.from)}</span><span>${escapeHtml(m.date)}</span></div>
        <div class="sj">${escapeHtml(m.sujet)}</div></div>`).join('')}
      <button class="btn-ghost btn-sm btn-block mt" data-act="tab" data-tab="inbox">Toute la messagerie</button>
    </div>`;

  $('#v-bureau').innerHTML = h;

/* Phase vue depuis le dossier actif. La phase globale mène le calendrier, mais
   chaque pilote peut en être à un point différent : l'un court, l'autre cherche
   encore un baquet (GDD §15). */
function phaseDossier(){
  if(S.phase==='faillite') return 'faillite';
  if(!S.pilote) return 'scouting';
  if(!S.saison || S.saison.finie) return S.phase==='finSaison' ? 'finSaison' : 'intersaison';
  if(S.weekend) return 'weekend';
  return 'semaine';
}
function ctaBureau(){
  const p=S.pilote, sa=S.saison, ph=phaseDossier();
  if(ph==='scouting'){
    return `<div class="card accent"><h2>À faire maintenant</h2>
      <div class="note mb">Vous n’avez pas de pilote. Sans pilote, pas de commission, et le staff continue de coûter.</div>
      <button class="btn btn-cta btn-block" data-act="tab" data-tab="pilote">Consulter le vivier de jeunes pilotes</button></div>`;
  }
  if(ph==='intersaison' && S.contrat && S.contrat.anneeDebut===S.annee && S.flags.signatureRecente){
    const sg = S.flags.signatureRecente;
    const coul = coulEcurie(S.contrat.ecurieId, S.contrat.catId);
    return `<div class="card accent anim-entree">
      <h2>Contrat signé</h2>
      <div class="row" style="align-items:center;gap:14px">
        <div class="portrait-box lg">${portraitPilote(p,{coul})}</div>
        <div style="flex:1">
          <div style="font-family:var(--cond);font-size:20px;font-weight:700">${escapeHtml(p.nom)}</div>
          <div class="note">rejoint <b style="color:${coul}">${escapeHtml(sg.ecurie)}</b> en ${sg.cat} pour ${sg.annee}.</div>
          ${S.contrat.apport>0
            ? `<div class="note mt">Apport à financer : <b class="txt-amber">${fmtEurFull(S.contrat.apport)}</b>.</div>`
            : `<div class="note mt txt-green">Le pilote est payé par l’écurie.</div>`}
        </div>
      </div>
      <div class="row mt">
        <button class="btn-ghost" data-act="tab" data-tab="sponsors">Chercher des sponsors</button>
        <button class="btn btn-cta" style="flex:1" data-act="lancerSaison">Lancer la saison</button>
      </div>
    </div>`;
  }
  // Le mandat prime : sans lui, tout le reste est prématuré.
  if(ph==='intersaison' && mandatEchu()){
    const essais = S.flags['renouRefus_'+p.id]||0;
    return `<div class="card accent"><h2>Mandat à renouveler</h2>
      <div class="note mb">Votre accord avec <b>${escapeHtml(p.nom)}</b> est arrivé à terme.
        Tant qu’il n’est pas renouvelé, <b class="txt-red">il est libre</b> : un concurrent peut le
        prendre sans rien vous verser.</div>
      ${essais?`<div class="note warn mb">Il a déjà décliné ${essais} proposition(s). Descendez, ou renoncez.</div>`:''}
      <div class="note mb">Quelle commission lui proposez-vous ?</div>
      ${[0.05,0.08,0.12].map(tx=>`<button class="btn-ghost btn-block mt" data-act="renouveler" data-tx="${tx}">
        ${Math.round(tx*100)} % — il accepte à ${Math.round(probaRenouvellement(tx)*100)} %</button>`).join('')}
      <button class="btn-ghost btn-sm btn-block mt" data-act="modalRompre">Le laisser partir</button>
    </div>`;
  }
  if(ph==='intersaison'){
    if(!S.contrat || S.contrat.anneeDebut!==S.annee){
      const enRetrait = S.flags['retrait_'+p.id]===S.annee;
      if(enRetrait){
        // Si plus personne n'est engagé, il faut pouvoir passer l'année.
        const aucunEngage = !S.dossiers || !S.dossiers.some((d,i)=>{
          const v=vueDossier(i);
          return v.pilote && v.contrat && v.contrat.anneeDebut===S.annee;
        });
        return `<div class="card"><h2>Saison blanche ${S.annee}</h2>
          <div class="note mb">${escapeHtml(p.nom)} ne court pas cette année. Il ne coûte rien,
            mais il ne progresse pas non plus et prend un an de plus.</div>
          <button class="btn-ghost btn-block" data-act="annulerRetrait">Finalement, lui chercher un baquet</button>
          ${aucunEngage?`<button class="btn btn-cta btn-block mt" data-act="passerSaisonBlanche">Passer la saison ${S.annee}</button>
            <div class="note txt-muted mt">Aucun de vos pilotes n’est engagé : l’année passera sans course.</div>`:''}
        </div>`;
      }
      return `<div class="card accent"><h2>Intersaison ${S.annee}</h2>
        <div class="note mb">Aucun engagement pour cette saison. Il faut trouver un baquet à ${escapeHtml(p.nom)}.</div>
        <button class="btn btn-cta btn-block" data-act="ouvrirOffres">Étudier les offres d’écuries</button>
        ${nbPilotes()>1?`<button class="btn-ghost btn-sm btn-block mt" data-act="mettreEnRetrait">Ne pas l’engager cette saison</button>
          <div class="note txt-muted mt">Une saison sans baquet ne coûte rien, mais elle est perdue :
            pas de progression, pas de points de superlicence, et le pilote le prend mal.</div>`:''}
      </div>`;
    }
    const c=CAT[S.contrat.catId];
    const apport = S.contrat.apport;
    const sponsorise = sum(S.sponsors.actifs, s=>s.montant);
    return `<div class="card accent"><h2>Prêt pour la saison ${S.annee}</h2>
      <div class="note mb">Engagement en <b>${c.nom}</b> avec <b>${escapeHtml(S.contrat.ecurieNom)}</b>.
      ${apport>0?`Apport à financer : <b>${fmtEurFull(apport)}</b> — sponsors actuels : <b class="${sponsorise>=apport?'txt-green':'txt-amber'}">${fmtEurFull(sponsorise)}</b>.`:'Le pilote est payé par l’écurie.'}</div>
      ${apport>0 && sponsorise<apport*0.5 ? `<div class="note warn mb">Vous pouvez démarrer sans le budget complet, mais chaque manche non couverte tapera dans votre trésorerie.</div>`:''}
      <div class="row">
        <button class="btn-ghost" data-act="tab" data-tab="sponsors">Chercher des sponsors</button>
        <button class="btn btn-cta" style="flex:1" data-act="lancerSaison">Lancer la saison</button>
      </div></div>`;
  }
  if(ph==='semaine'){
    const prochaine=sa.calendrier[sa.courseIndex];
    // Avec plusieurs pilotes, tous ne courent pas à chaque manche : la
    // préparation ne mène au week-end que pour ceux qui sont engagés (GDD §15).
    const tour = coursesDuTour();
    const moiCeTour = tour.some(x=>x.i===S.actif);
    const autres = tour.filter(x=>x.i!==S.actif);
    const listeAutres = autres.length
      ? `<div class="note txt-muted mt">Aussi engagés cette manche : `
        + autres.map(x=>`<b>${escapeHtml(x.pilote.nom)}</b> (${CAT[x.sa.catId].court})`).join(' · ')
        + ` — passez à leur dossier depuis la barre du haut.</div>`
      : '';
    if(blesse(p)){
      const b = p.blessure;
      return `<div class="card accent"><h2>${escapeHtml(p.nom)} est blessé<span class="hint">${S.actions} action(s) restante(s)</span></h2>
        <div class="note mb"><b class="txt-red">${escapeHtml(b.nom)}</b> — ${escapeHtml(b.txt)}</div>
        <div class="note mb">Indisponible pour <b>${b.manches} manche${b.manches>1?'s':''}</b>.
          Il déclarera forfait, et le championnat continuera sans lui.</div>
        <div class="row tight mb">
          <button class="btn-ghost btn-sm" data-act="modalDiscussion" ${S.actions<=0?'disabled':''}>Parler au pilote</button>
          <button class="btn-ghost btn-sm" data-act="tab" data-tab="sponsors" ${S.actions<=0?'disabled':''}>Démarcher un sponsor</button>
          <button class="btn-ghost btn-sm" data-act="tab" data-tab="staff">Préparateur physique</button>
        </div>
        ${listeAutres}
        ${coursesDuTour().length?'':`<button class="btn btn-cta btn-block" data-act="passerManche">Passer la manche</button>`}
        <div class="note txt-muted mt">Un préparateur physique de bon niveau raccourcit les convalescences.</div>
      </div>`;
    }
    if(!moiCeTour){
      return `<div class="card"><h2>Manche ${(S.manche||0)+1}<span class="hint">${S.actions} action(s) restante(s)</span></h2>
        <div class="note mb">${escapeHtml(S.pilote.nom)} ne court pas cette manche — son championnat compte
          ${sa.calendrier.length} courses, réparties sur les ${manchesTotales()} manches de votre saison.
          Prochaine sortie : <b>${prochaine?escapeHtml(prochaine.nom):'—'}</b>.</div>
        <div class="row tight mb">
          <button class="btn-ghost btn-sm" data-act="modalEntrainement" ${S.actions<=0?'disabled':''}>Entraînement</button>
          <button class="btn-ghost btn-sm" data-act="actionRepos" ${S.actions<=0?'disabled':''}>Repos</button>
          <button class="btn-ghost btn-sm" data-act="modalDiscussion" ${S.actions<=0?'disabled':''}>Parler au pilote</button>
          <button class="btn-ghost btn-sm" data-act="modalDev" ${S.actions<=0?'disabled':''}>Développement</button>
          <button class="btn-ghost btn-sm" data-act="tab" data-tab="sponsors" ${S.actions<=0?'disabled':''}>Démarcher un sponsor</button>
        </div>${listeAutres}
        ${autres.length?'':`<button class="btn btn-cta btn-block" data-act="passerManche">Passer à la manche suivante</button>`}
      </div>`;
    }
    return `<div class="card accent"><h2>Préparation — manche ${sa.courseIndex+1}<span class="hint">${S.actions} action(s) restante(s)</span></h2>
      <div class="note mb">Prochaine manche : <b>${prochaine.nom}</b> (${prochaine.pays}) — circuit ${prochaine.type.toLowerCase()}.</div>
      <div class="row tight mb">
        <button class="btn-ghost btn-sm" data-act="modalEntrainement" ${S.actions<=0?'disabled':''}>Entraînement</button>
        <button class="btn-ghost btn-sm" data-act="actionRepos" ${S.actions<=0?'disabled':''}>Repos</button>
        <button class="btn-ghost btn-sm" data-act="modalDiscussion" ${S.actions<=0?'disabled':''}>Parler au pilote</button>
        <button class="btn-ghost btn-sm" data-act="modalDev" ${S.actions<=0?'disabled':''}>Développement</button>
        <button class="btn-ghost btn-sm" data-act="tab" data-tab="sponsors" ${S.actions<=0?'disabled':''}>Démarcher un sponsor</button>
      </div>
      <div class="row">
        <button class="btn-ghost" style="flex:1" data-act="simRapide">Simulation rapide</button>
        <button class="btn btn-cta" style="flex:2" data-act="allerWeekend">Aller au week-end de course</button>
      </div>
      <div class="note txt-muted mt">La simulation rapide règle la voiture toute seule (selon votre ingénieur) et donne le résultat immédiatement.</div>
      ${listeAutres}
    </div>`;
  }
  if(ph==='weekend'){
    const w=S.weekend, et=w.etapes[Math.min(w.etape,w.etapes.length-1)];
    return `<div class="card accent"><h2>Week-end en cours</h2>
      <div class="note mb">${sa.calendrier[w.courseIdx].nom} — étape : <b>${w.etape>=w.etapes.length?'Débrief':ETAPE_NOM[et]}</b></div>
      <button class="btn btn-cta btn-block" data-act="tab" data-tab="weekend">Reprendre le week-end</button></div>`;
  }
  if(ph==='finSaison'){
    return `<div class="card accent"><h2>Saison ${S.annee} terminée</h2>
      <button class="btn btn-cta btn-block" data-act="bilanSaison">Voir le bilan de saison</button></div>`;
  }
  return '';
}

ACTIONS.tab = d=>go(d.tab);
ACTIONS.nouvellePartieDepuisFin = ()=>{ wipeGame(); UI.tab='bureau'; render(); };
/* GDD §15 — avec plusieurs pilotes, engager tout le monde chaque année ruine :
   en karting un pilote ne rapporte aucune commission et sa saison se finance sur
   ses seuls sponsors. Mettre un pilote en retrait est donc une vraie décision. */
/* Rompre soi-même la collaboration. */
/* Approcher un pilote sous mandat rival : on choisit d'abord son taux. */
ACTIONS.modalApprocher = d=>{
  const cible = marcheTransferts().find(x=>x.eleve.id===d.id);
  if(!cible) return;
  const {eleve, manager} = cible;
  const indem = indemniteTransfert(eleve, eleve.catId, 2);
  const ligne = tx => {
    const d = detailInteret(eleve, manager, tx);
    return `<button class="btn-ghost btn-block mt" data-act="confirmApprocher" data-id="${eleve.id}" data-tx="${tx}">
      Commission ${Math.round(tx*100)} % — il accepte à ${Math.round(d.proba*100)} %</button>`;
  };
  const det = detailInteret(eleve, manager, 0.06);
  openModal('Approcher '+escapeHtml(eleve.nom),
    `<div class="note mb">Il est représenté par <b>${escapeHtml(manager.nom)}</b>.
       Plus vous lui prenez peu, plus il est tenté de changer — mais moins il vous rapportera.</div>
     <div class="slider-box">
       <div class="top"><b>Indemnité à ${escapeHtml(manager.nom)}</b><span class="${S.manager.budget>=indem?'txt-amber':'txt-red'}">${fmtEurFull(indem)}</span></div>
       <div class="note">Versée seulement s’il accepte. Vous avez ${fmtEur(S.manager.budget)}.</div>
     </div>
     <div class="card flat" style="margin:10px 0">
       <div class="small txt-muted b" style="text-transform:uppercase;letter-spacing:.05em">Ce qui le décide</div>
       ${ligneFacteur('Votre réputation face à la sienne', det.prestige,
         `Vous ${det.rp}/10 contre ${manager.rep}/10.`)}
       ${ligneFacteur('Ce qu’il vit chez lui', det.lassitude,
         `Estimé à ${Math.round(det.relChezLui)}/100.`)}
       <div class="note txt-muted mt">La commission, elle, dépend du taux que vous choisissez ci-dessous.</div>
     </div>
     ${[0.06,0.10,0.15].map(ligne).join('')}
     <div class="note txt-muted mt">Une approche refusée se sait : le pilote devient plus difficile à convaincre,
       et son manager vous en tiendra rigueur — <b>8 points de réputation</b> en moins.</div>`,
    `<button class="btn-ghost" data-act="fermerModal">Renoncer</button>`);
};
ACTIONS.confirmApprocher = d=>{
  const tx = +d.tx;
  const cible = marcheTransferts().find(x=>x.eleve.id===d.id);
  if(!cible){ closeModal(); return; }
  const indem = indemniteTransfert(cible.eleve, cible.eleve.catId, 2);
  if(S.manager.budget < indem){ showToast('Il vous manque '+fmtEur(indem-S.manager.budget)); return; }
  if(!resteDeLaPlace()){ showToast('Plus de place dans votre écurie'); return; }
  const r = approcherPilote(d.id, tx);
  if(r.issue!=='accord'){
    gagnerRep(-8, 'approche refusée');
    closeModal(); saveGame(); render();
    showToast(r.nom+' décline votre proposition');
    return;
  }
  // Il accepte : on indemnise, on le retire de chez son manager, on le prend.
  argent('Indemnité de transfert — '+r.manager.nom, -indem, 'transfert');
  r.manager.pilotes = r.manager.pilotes.filter(x=>x.id!==r.eleve.id);
  const place = ouvrirPlace();
  if(place<0){ closeModal(); showToast('Plus de place'); return; }
  const p = pilotePourTransfert(r.eleve);
  syncDossier();
  S.actif = place;
  for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[place][k];
  S.pilote = p;
  S.contrat = null;
  S.mandat = {anneeDebut:S.annee, anneeFin:S.annee+2, duree:3, commission:tx, indemnite:indem};
  S.sponsors = {actifs:[],prospects:[],vus:[]};
  S.offres = null;
  syncDossier();
  gagnerRep(Math.round(10 + notePlafond(p)/8), 'transfert réussi');
  msg('pilote', p.nom, 'Il change de manager',
    `${p.nom} quitte ${r.manager.nom} pour vous rejoindre.\n\n`+
    `Indemnité versée : <em>${fmtEurFull(indem)}</em>. Votre commission : <em>${Math.round(tx*100)} %</em>, `+
    `sur trois saisons.`);
  closeModal(); saveGame(); go('bureau');
  showToast(p.nom+' rejoint votre écurie');
};
ACTIONS.renouveler = d=>{
  const r = renouvelerMandat(+d.tx);
  saveGame(); render();
  if(r.issue==='accord') showToast('Mandat renouvelé à '+Math.round(r.taux*100)+' %');
  else if(r.issue==='refus') showToast(S.pilote.nom+' décline — il veut mieux');
};
ACTIONS.modalRompre = ()=>{
  const p = S.pilote; if(!p) return;
  const c = coutRupture();
  openModal('Mettre fin à la collaboration ?',
    `<div class="note mb">Vous ne représenteriez plus <b>${escapeHtml(p.nom)}</b>.
       Il retournera dans le vivier, où un autre manager pourra le signer.</div>
     <div class="note mb">Ce que cela vous coûte :</div>
     <div class="slider-box">
       <div class="top"><b>Réputation</b><span class="txt-red">−${c.rep} points</span></div>
       <div class="note">Le paddock retient qu’on a lâché un pilote${c.enSaison?', et en pleine saison':''}.</div>
     </div>
     ${c.indem>0?`<div class="slider-box">
       <div class="top"><b>Indemnité à l’écurie</b><span class="txt-red">${fmtEurFull(c.indem)}</span></div>
       <div class="note">Vous rompez un engagement en cours auprès de ${escapeHtml(S.contrat?S.contrat.ecurieNom:'l’écurie')}.</div>
     </div>`:''}
     ${c.enSaison?`<div class="note warn mt">La saison en cours s’arrête là pour lui :
