<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manager de Pilote</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="Simulation de gestion : menez un pilote du karting à la F1. Sponsors, contrats, réglages, courses.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manager">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --bg2:#0a0e14; --card:#161b22; --card2:#1c232d;
  --border:#252c37; --border2:#333c4a;
  --text:#e6edf3; --text2:#9aa7b5; --muted:#66727f;
  --red:#ff2f2f; --red-d:#c81e1e; --red-bg:#2a1214;
  --amber:#f5b700; --amber-bg:#2a2210;
  --green:#2ecc71; --green-bg:#0f2419;
  --blue:#3d9bff; --blue-bg:#0f1d2e;
  --purple:#a970ff; --purple-bg:#1c1430;
  --gold:#ffd257; --silver:#c8d2dc; --bronze:#cd8b52;
  --r:10px; --r-sm:7px; --r-lg:16px;
  --shadow:0 4px 22px rgba(0,0,0,.4);
  --cond:'Barlow Condensed','Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--text);
  font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:14.5px;
  min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.45;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r-sm);padding:8px 10px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
button{cursor:pointer;border:none;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;transition:all .15s}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--red);color:#fff}
.btn:hover:not(:disabled){background:var(--red-d)}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:hover:not(:disabled){border-color:var(--red);color:#fff}
.btn-ok{background:var(--green);color:#062012}
.btn-warn{background:var(--amber);color:#241c00}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px}
.btn-xs{padding:4px 9px;font-size:11.5px;border-radius:5px;font-weight:600}
.btn-block{width:100%;display:block}
.btn-cta{background:linear-gradient(135deg,#ff2f2f,#c81e1e);color:#fff;font-family:var(--cond);font-size:19px;letter-spacing:.03em;text-transform:uppercase;padding:15px;border-radius:var(--r)}
.btn-cta:hover:not(:disabled){filter:brightness(1.12)}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:var(--cond);letter-spacing:.01em;line-height:1.15}

/* ---- header ---- */
#hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(180deg,#171d26,#10151c);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:30}
#hdr .mark{width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:linear-gradient(135deg,#ff2f2f,#8e0f0f);
  display:grid;place-items:center;font-family:var(--cond);font-weight:700;color:#fff;font-size:17px}
#hdr h1{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
@media(max-width:430px){
  #hdr h1{font-size:14.5px;letter-spacing:.03em}
  #hdr .sub{font-size:10.5px}
  #hdr .mark{width:28px;height:28px;flex-basis:28px;font-size:15px}
  .hdr-stat .v{font-size:14px}
  .hdr-stat+.hdr-stat{margin-left:10px}
}
#hdr .sub{font-size:11px;color:var(--text2);font-weight:500;letter-spacing:.02em}
#hdr .spacer{flex:1}
.hdr-stat{text-align:right;font-family:var(--cond);line-height:1.05}
.hdr-stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:'Barlow',sans-serif;font-weight:600}
.hdr-stat .v{font-size:16px;font-weight:700}
.hdr-stat .v.neg{color:var(--red)}
.hdr-stat+.hdr-stat{margin-left:14px}

/* ---- nav ---- */
#nav{display:flex;gap:2px;padding:0 8px;overflow-x:auto;background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:25;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;color:var(--text2);font-weight:600;font-size:12.5px;padding:11px 12px;border-radius:0;
  white-space:nowrap;border-bottom:2.5px solid transparent;position:relative}
.tab-btn:has(.dot:not([hidden])){padding-right:24px}
.tab-btn.active{color:#fff;border-bottom-color:var(--red)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-btn .dot{position:absolute;top:6px;right:3px;min-width:15px;height:15px;padding:0 4px;border-radius:9px;background:var(--red);
  color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.tab-btn.locked{opacity:.35}

main{max-width:1080px;margin:0 auto;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
.view{display:none}
.view.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);
  margin-bottom:11px;display:flex;align-items:center;gap:7px}
.card>h2 .hint{margin-left:auto;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;font-family:'Barlow',sans-serif}
.card.accent{border-color:var(--red-d);background:linear-gradient(180deg,#1d1418,var(--card))}
.card.flat{background:var(--card2)}
.sect-title{font-family:var(--cond);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 9px}
.sect-title:first-child{margin-top:0}

/* ---- kpi ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px}
.kpi .l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-family:var(--cond);font-size:25px;font-weight:700;margin-top:2px;line-height:1}
.kpi .s{font-size:11px;color:var(--text2);margin-top:3px}
.v.red{color:var(--red)}.v.green{color:var(--green)}.v.amber{color:var(--amber)}.v.blue{color:var(--blue)}
.txt-red{color:var(--red)}.txt-green{color:var(--green)}.txt-amber{color:var(--amber)}.txt-blue{color:var(--blue)}
.txt-muted{color:var(--muted)}.txt-2{color:var(--text2)}

/* ---- grids ---- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.spacer{flex:1}

/* ---- tables ---- */
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;
  padding:7px 8px;border-bottom:1.5px solid var(--border2);white-space:nowrap}
tbody td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr.me{background:rgba(255,47,47,.09)}
tbody tr.me td{font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--cond);font-size:14px;font-weight:600}
.pos{font-family:var(--cond);font-weight:700;font-size:15px;width:30px;text-align:center}
.pos.p1{color:var(--gold)}.pos.p2{color:var(--silver)}.pos.p3{color:var(--bronze)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-style:italic;font-size:13px}
/* colonnes secondaires masquées sur petit écran, pour que le montant reste visible */
@media(max-width:560px){.hide-s{display:none}}
td.wrap{white-space:normal;min-width:130px}

/* ---- tags ---- */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.t-red{background:var(--red-bg);color:#ff7b7b}
.t-green{background:var(--green-bg);color:#5ee397}
.t-amber{background:var(--amber-bg);color:var(--amber)}
.t-blue{background:var(--blue-bg);color:#79bcff}
.t-purple{background:var(--purple-bg);color:#c3a0ff}
.t-grey{background:#20262f;color:var(--text2)}

/* ---- stat bars ---- */
.stat-line{display:flex;align-items:center;gap:9px;padding:5px 0}
.stat-line .n{font-size:12.5px;color:var(--text2);width:96px;flex:0 0 96px}
.stat-line .bar{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.stat-line .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ff2f2f,#ff8a3d)}
.stat-line .bar u{position:absolute;top:-2px;width:2px;height:11px;background:var(--text2);opacity:.5}
.stat-line .v{font-family:var(--cond);font-weight:700;font-size:15px;width:56px;text-align:right;flex:0 0 56px}
.grp{background:var(--card2);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:8px}
.grp>.h{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.grp>.h b{font-family:var(--cond);font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.grp>.h span{margin-left:auto;font-family:var(--cond);font-size:20px;font-weight:700}

/* ---- overall badge ---- */
.ovr{display:flex;align-items:center;gap:12px}
.ovr .big{width:64px;height:64px;flex:0 0 64px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#2a323d,#171d26);border:2px solid var(--border2);font-family:var(--cond);
  font-size:32px;font-weight:700;line-height:1}
.ovr .big.hi{border-color:var(--amber);color:var(--amber)}
.ovr .big.top{border-color:var(--red);color:var(--red)}

/* ---- inbox ---- */
.msg{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r-sm);
  padding:11px 13px;margin-bottom:8px;cursor:pointer}
.msg.unread{border-left-color:var(--red);background:var(--card2)}
.msg.unread .sj{color:#fff}
.msg .top{display:flex;gap:8px;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:2px}
.msg .fr{font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.msg .sj{font-weight:600;font-size:14px;color:var(--text2)}
.msg .bd{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5;white-space:pre-wrap}
.msg .bd em{color:var(--amber);font-style:normal;font-weight:600}
.msg-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

/* ---- sliders ---- */
.setup-row{padding:9px 0;border-bottom:1px solid var(--border)}
.setup-row:last-child{border-bottom:none}
.setup-row .lab{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.setup-row .lab b{font-size:13.5px;font-weight:600}
.setup-row .lab span{margin-left:auto;font-family:var(--cond);font-size:18px;font-weight:700;color:var(--amber)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:0;border:none;height:22px;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--bg2);border-radius:3px;border:1px solid var(--border2)}
input[type=range]::-moz-range-track{height:5px;background:var(--bg2);border-radius:3px;border:1px solid var(--border2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--red);
  margin-top:-8.5px;border:2px solid #fff2}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff2}

/* ---- feedback quotes ---- */
.quote{background:var(--bg2);border-left:3px solid var(--amber);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:9px 12px;margin:7px 0;font-size:13.5px;font-style:italic;color:#dfe7ef}
.quote .who{display:block;font-style:normal;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;font-weight:700;margin-bottom:3px}

/* ---- modal ---- */
#overlay{position:fixed;inset:0;background:rgba(4,7,11,.82);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
#overlay.on{display:flex}
#modal{background:var(--card);border:1px solid var(--border2);border-radius:var(--r-lg);max-width:640px;width:100%;
  margin:auto 0;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
#modal .mh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#1d242e,var(--card))}
#modal .mh h3{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
#modal .mh .x{margin-left:auto;background:transparent;color:var(--muted);font-size:22px;padding:0 6px;line-height:1}
#modal .mb{padding:16px;max-height:calc(100dvh - 190px);overflow-y:auto}
#modal .mf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---- choice list ---- */
.choice{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px;font-weight:500}
.choice:hover:not(:disabled){border-color:var(--red);background:#20262f}
.choice b{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.choice small{color:var(--text2);font-size:12px;line-height:1.4;display:block}

/* ---- pills / selectors ---- */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card2);border:1.5px solid var(--border);color:var(--text2);border-radius:20px;
  padding:6px 13px;font-size:12.5px;font-weight:600}
.pill.on{background:var(--red-bg);border-color:var(--red);color:#ff9a9a}

/* ---- progress / gauges ---- */
.gauge{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.gauge i{display:block;height:100%;border-radius:4px;transition:width .3s}
.gauge.g-green i{background:linear-gradient(90deg,#1e8f4e,#2ecc71)}
.gauge.g-amber i{background:linear-gradient(90deg,#b98a00,#f5b700)}
.gauge.g-red i{background:linear-gradient(90deg,#8e1414,#ff2f2f)}
.gauge.g-blue i{background:linear-gradient(90deg,#1c5f9e,#3d9bff)}
.gline{display:flex;align-items:center;gap:9px;padding:4px 0}
.gline .n{font-size:12px;color:var(--text2);width:98px;flex:0 0 98px}
.gline .gauge{flex:1}
.gline .v{font-family:var(--cond);font-weight:700;font-size:14px;width:42px;text-align:right;flex:0 0 42px}

/* ---- race log ---- */
.log{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;
  max-height:290px;overflow-y:auto;font-size:13px;line-height:1.55}
.log .li{padding:4px 0;border-bottom:1px dashed #1e242d;display:flex;gap:9px}
.log .li:last-child{border-bottom:none}
.log .lp{font-family:var(--cond);font-weight:700;color:var(--muted);flex:0 0 40px;font-size:12px}
.log .li.big{color:var(--amber);font-weight:600}
.log .li.bad{color:#ff8a8a}
.log .li.good{color:#7ee6a8}

/* ---- weather strip ---- */
.strip{display:flex;gap:8px;flex-wrap:wrap;background:var(--card2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 11px;margin-bottom:11px;font-size:12.5px;align-items:center}
.strip .it{display:flex;align-items:center;gap:5px}
.strip .it b{font-weight:700}
.strip .sep{width:1px;height:15px;background:var(--border2)}

/* ---- offer compare ---- */
.offer{border:1.5px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--card2)}
.offer.best{border-color:var(--amber)}
.offer .oh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.offer .oh b{font-family:var(--cond);font-size:18px;font-weight:700}
.omat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0;text-align:center}
.omat div{background:var(--bg2);border-radius:6px;padding:7px 4px}
.omat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.omat .v{font-family:var(--cond);font-size:15px;font-weight:700;margin-top:2px}

/* ---- misc ---- */
.note{font-size:12.5px;color:var(--text2);line-height:1.55}
.note.warn{color:var(--amber)}
.hr{height:1px;background:var(--border);margin:12px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);background:#e6edf3;color:#0d1117;
  padding:11px 20px;border-radius:30px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;
  z-index:200;box-shadow:0 6px 26px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.mono{font-variant-numeric:tabular-nums}
.small{font-size:12px}
.b{font-weight:700}
.mt{margin-top:10px}.mt2{margin-top:18px}.mb{margin-bottom:10px}
.scroll-x{overflow-x:auto}
#splash{max-width:560px;margin:0 auto}
#splash .hero{text-align:center;padding:22px 10px 6px}
#splash .hero .t{font-family:var(--cond);font-size:38px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1}
#splash .hero .t em{color:var(--red);font-style:normal}
#splash .hero .s{color:var(--text2);font-size:14px;margin-top:6px}
.slider-box{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:11px}
.slider-box .top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.slider-box .top b{font-family:var(--cond);font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.slider-box .top span{margin-left:auto;font-family:var(--cond);font-size:20px;font-weight:700;color:var(--amber)}
.ladder{display:flex;gap:3px;align-items:flex-end;margin:10px 0}
.ladder .st{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:4px 4px 0 0;
  padding:5px 2px;text-align:center;font-size:9px;font-weight:700;color:var(--muted);line-height:1.15;
  text-transform:uppercase;letter-spacing:.02em}
.ladder .st.done{background:var(--green-bg);color:#5ee397;border-color:#1e5a38}
.ladder .st.now{background:var(--red-bg);color:#ff8a8a;border-color:var(--red-d)}
</style>
</head>
<body>

<header id="hdr">
  <div class="mark">MP</div>
  <div>
    <h1>Manager de Pilote</h1>
    <div class="sub" id="hdrSub">Du karting à la F1</div>
  </div>
  <div class="spacer"></div>
  <div class="hdr-stat" id="hdrRep" hidden><div class="l">Réputation</div><div class="v"></div></div>
  <div class="hdr-stat" id="hdrCash" hidden><div class="l">Trésorerie</div><div class="v"></div></div>
</header>

<nav id="nav" hidden>
  <button class="tab-btn active" data-tab="bureau">Bureau</button>
  <button class="tab-btn" data-tab="inbox">Messagerie<span class="dot" id="navUnread" hidden>0</span></button>
  <button class="tab-btn" data-tab="pilote">Pilote</button>
  <button class="tab-btn" data-tab="weekend">Week-end</button>

/* Génère les 9 stats d'un pilote à partir de son potentiel et de son âge.
   Chaque stat a son propre plafond (plafond de base ± 3, GDD §17.1). */
function genStats(potId, age, niveauDepart){
  const base = POT[potId].plafond;
  const plafonds = {}, stats = {};
  for(const k of ALL_STATS){
    plafonds[k] = clamp(Math.round(base + rint(-3,3)), 20, 99);
    // niveauDepart 0..1 : part du plafond déjà atteinte
    const part = clamp(niveauDepart + gauss()*0.07, 0.15, 0.96);
    stats[k] = clamp(Math.round(plafonds[k]*part), 8, 99);
  }
  return {stats, plafonds};
}

function noteGroupe(p, gid){
  const g = STAT_GROUPES.find(x=>x.id===gid);
  return avg(g.stats.map(s=>p.stats[s[0]]));
}
/* GDD §17.2 : Note = Pace×0,40 + Consistency×0,30 + Racecraft×0,30 */
function notePilote(p){
  return STAT_GROUPES.reduce((s,g)=>s + noteGroupe(p,g.id)*g.poids, 0);
}
function notePlafond(p){
  return STAT_GROUPES.reduce((s,g)=>s + avg(g.stats.map(x=>p.plafonds[x[0]]))*g.poids, 0);
}

/* Crée un pilote complet. role : 'joueur' | 'ia' | 'rival' */
function creerPilote(opt={}){
  const age  = opt.age  ?? rint(9,13);
  const potId= opt.potId?? (Math.random()<0.55?2:Math.random()<0.75?3:Math.random()<0.9?1:4);
  const part = opt.part ?? clamp(0.30 + (age-8)*0.035 + gauss()*0.06, 0.18, 0.9);
  const {stats,plafonds} = genStats(potId, age, part);
  const nbTraits = Math.random()<0.35?2:1;
  const traits = shuffle(TRAIT_IDS).slice(0,nbTraits);
  const p = {
    id: opt.id || uid(),
    nom: opt.nom || nomAleatoire(),
    pays: opt.pays || pick(PAYS),
    age, potId, stats, plafonds, traits,
    agressivite: clamp(Math.round(45 + gauss()*22 + (traits.includes('tetebrulee')?26:0) - (traits.includes('regulier')?14:0)), 10, 98),
    moral: opt.moral ?? rint(58,76),
    forme: opt.forme ?? rint(84,96),
    fatigue: 0,
    reputation: opt.reputation ?? clamp(Math.round(rnd(14,4)), 1, 100),
    relation: 55,
    // préférences de réglages : le style propre du pilote (GDD §18)
    prefs: Object.fromEntries([...SETUP_MONO,...SETUP_KART].map(s=>[s.k, rint(-3,3)])),
    catId: opt.catId || 'kmini',
    superlicence: [],       // [{annee, pts}]
    palmares: [],           // [{annee, catId, pos, pts, victoires, podiums}]
    retraite: false,
    role: opt.role || 'ia',
    // Estimation du scout (le joueur ne voit jamais la vraie valeur — GDD §5.1)
    observe: 0,
    seedEst: Math.random(),
  };
  return p;
}

/* Un pilote IA n'a besoin que d'une note synthétique pour la simulation.
   On garde tout de même la structure complète pour les rivaux persistants. */
function creerPiloteIA(catId, forceCible){
  const c = CAT[catId];
  const age = rint(c.ageMin, Math.min(c.ageMax, c.ageMin+ (c.format==='kart'?4:6)));
  const potId = Math.random()<0.4?2:Math.random()<0.7?3:Math.random()<0.88?1:4;
  const cible = forceCible ?? (NIVEAU_GRILLE[catId] - 4 + gauss()*8);
  const plaf = POT[potId].plafond;
  const part = clamp(cible/plaf, 0.2, 0.97);
  const p = creerPilote({age, potId, part, catId, role:'ia'});
  return p;
}

/* --------------------------------------- 7. SCOUTING (GDD §5, §13) */
/* Taille et qualité du vivier selon la réputation du manager. */
function genererScoutPool(){
  const rp = repPalier(S.manager.repPoints).p;
  const n  = clamp(4 + Math.floor(rp*0.9), 4, 12);
  const pool = [];
  for(let i=0;i<n;i++){
    // Plus la réputation est haute, plus on tombe sur de vrais talents.
    const r = Math.random() + rp*0.045;
    const potId = r>1.02?4 : r>0.78?3 : r>0.38?2 : 1;
    const age = rint(9,14);
    const catKart = age<=10?'kmini' : age<=12?'kcadet' : 'kjunior';
    pool.push(creerPilote({age, potId, role:'candidat', catId:catKart}));
  }
  // Un manager très réputé voit aussi des pilotes déjà installés en monoplace —
  // mais seulement dans une catégorie qu'il peut réellement financer. Proposer un
  // pilote de F3 à un manager qui a 20 000 € n'est pas une opportunité, c'est un
  // piège : le §8.2 bloquera la suite et la trésorerie fondra pour rien.
  if(rp>=4){
    const vise = rp>=9?'f2' : rp>=7?'f3' : 'f4';
    let c = null;
    for(let niv=CAT[vise].niv; niv>=5; niv--){
      const cand = catByNiv(niv);
      if(S.manager.budget + potentielSponsorsSaison(cand.id) >= cand.cout*0.6){ c = cand.id; break; }
    }
    if(c){
      for(let i=0;i<(rp>=7?3:2);i++){
        const p = creerPiloteIA(c);
        p.role='candidat'; p.observe=0; p.seedEst=Math.random();
        p.reputation = clamp(Math.round(20+CAT[c].niv*6+rnd(18)),5,90);
        pool.push(p);
      }
    }
  }
  S.monde.scoutPool = pool;
  S.monde.poolAnnee = S.annee;
}

/* Ce qu'un manager de cette réputation peut raisonnablement lever en sponsors
   sur une saison, compte tenu des emplacements publicitaires de la catégorie.
   Sert à ne proposer que des pilotes dont la saison est finançable. */
function potentielSponsorsSaison(catId){
  const rp = repPalier(S.manager.repPoints).p;
  const slots = CAT[catId].slots;
  const acc = SPONSOR_NIVEAUX.filter(n=>rp >= n.repMin-1);
  if(!acc.length) return 0;
  const med = n => (n.min+n.max)/2 * 0.55;      // estimation prudente
  const top = acc[acc.length-1];
  const sous = acc[Math.max(0, acc.length-2)];
  return Math.round(Math.ceil(slots/2)*med(top) + Math.floor(slots/2)*med(sous));
}

/* Estimation floue d'une valeur — la marge dépend du scout et des observations.
   GDD §5.1 : le joueur ne voit jamais la vraie valeur exacte. */
function marge(p){
  const niv = staffNiv('scout');
  const base = [16,11,8,5.5,3.5,2][niv];      // niv 0 = aucun scout
  return Math.max(1, base - p.observe*1.6);
}
function estim(p, val, salt){
  const m = marge(p);
  // Biais stable par pilote+stat pour que l'estimation ne change pas à chaque rendu
  const biais = (hash01(p.id+salt+p.seedEst)*2-1) * m;
  const c = clamp(Math.round(val + biais), 1, 99);
  return {lo:clamp(Math.round(c-m),1,99), hi:clamp(Math.round(c+m),1,99), c};
}
function estimTexte(p, val, salt){
  const e = estim(p,val,salt);
  return marge(p)<=2.2 ? String(e.c) : e.lo+'–'+e.hi;
}
/* Estimation du potentiel : fourchette de libellés (ex. « Moyen à Élevé ») */
function estimPotentiel(p){
  const m = marge(p);
  const span = m>13?3 : m>9?2 : m>5?1 : 0;
  const biais = Math.round((hash01(p.id+'pot'+p.seedEst)*2-1)*span*0.7);
  const c  = clamp(p.potId+biais,1,4);
  const lo = clamp(c-Math.ceil(span/2),1,4), hi = clamp(c+Math.floor(span/2),1,4);
  return lo===hi ? POT[lo].nom : POT[lo].nom+' à '+POT[hi].nom;
}

/* ------------------------------------------- 8. SAISON & CALENDRIER */
function genererCalendrier(catId, annee){
  const c = CAT[catId];
  const src = c.format==='kart' ? CIRCUITS_KART : CIRCUITS_MONO;
  const list = shuffle(src);
  const cal = [];
  for(let i=0;i<c.courses;i++){
    const ci = list[i % list.length];
    cal.push({
      i, nom:ci.n, pays:ci.p, type:ci.t, w:ci.w,
      seed: ci.n+'|'+annee+'|'+catId+'|'+i,
      meteo: null, fait:false,
    });
  }
  return cal;
}

/* Grille adverse d'une saison. Les rivaux persistants y sont injectés
   quand ils courent dans la même catégorie. */
function genererGrille(catId){
  const c = CAT[catId];
  const ecu = ecuriesPour(catId);
  const n = c.grille - 1;                 // -1 : la place du pilote du joueur
  const g = [];
  for(let i=0;i<n;i++){
    // Répartition : chaque écurie aligne ~2 pilotes, les meilleures écuries
    // attirent les meilleurs pilotes.
    const e = ecu[Math.min(ecu.length-1, Math.floor(i/Math.ceil(n/ecu.length)))];
    const cible = NIVEAU_GRILLE[catId] + (e.prestige-50)*0.30 + gauss()*6;
    const p = creerPiloteIA(catId, cible);
    g.push({
      id:p.id, nom:p.nom, pays:p.pays, note:notePilote(p), age:p.age,
      agressivite:p.agressivite, ecurieId:e.id, ecurie:e.nom,
      voiture:clamp(e.voiture + rint(-2,2),30,99), fiab:e.fiab,
      pts:0, victoires:0, podiums:0, abandons:0, rival:false, p,
    });
  }
  // Injection des rivaux persistants présents dans la catégorie
  for(const r of S.monde.rivaux){
    if(r.catId!==catId || r.retraite) continue;
    const e = pick(ecu.slice(0, Math.max(2,Math.ceil(ecu.length/2))));
    g.pop();
    g.push({
      id:r.id, nom:r.nom, pays:r.pays, note:notePilote(r), age:r.age,
      agressivite:r.agressivite, ecurieId:e.id, ecurie:e.nom,
      voiture:clamp(e.voiture+rint(-1,2),30,99), fiab:e.fiab,
      pts:0, victoires:0, podiums:0, abandons:0, rival:true, p:r,
    });
  }
  return g;
}

function creerRivaux(){
  // 3 rivaux qui suivront la carrière du joueur (GDD §5.3 en germe côté pilotes)
  const cat = S.pilote ? S.pilote.catId : 'kmini';
  S.monde.rivaux = [];
  for(let i=0;i<3;i++){
    const r = creerPilote({age: (S.pilote?S.pilote.age:12)+rint(-1,1), potId: i===0?4:3, catId:cat, role:'rival',
      part: clamp(0.34+gauss()*0.05,0.24,0.55)});
    S.monde.rivaux.push(r);
  }
}

function demarrerSaison(catId, ecurieId){
  const c = CAT[catId];
  const ecu = ecuriesPour(catId).find(e=>e.id===ecurieId) || ecuriesPour(catId)[Math.floor(ecuriesPour(catId).length/2)];
  S.pilote.catId = catId;
  S.saison = {
    annee: S.annee, catId, courseIndex:0,
    calendrier: genererCalendrier(catId, S.annee),
    grille: genererGrille(catId),
    ecurieId: ecu.id, ecurieNom: ecu.nom,
    voiture: clamp(ecu.voiture + (S.contrat && S.contrat.bonusVoiture ? S.contrat.bonusVoiture : 0) + rint(-2,2), 30, 99),
    fiab: ecu.fiab,
    pts:0, victoires:0, podiums:0, abandons:0, meilleur:99,
    dernierBilan: null,
    coutTotal: c.cout,
    coutRestant: c.cout,
    caisse: 0,
    mouvements: [],
    resultats: [],
    avertissements: 0,
    devDepense: 0,
    finie:false,
  };
  // Apport de l'écurie (programme jeunes) : elle prend une part du budget à sa charge
  if(S.contrat && S.contrat.partEcurie>0){
    const part = Math.round(c.cout * S.contrat.partEcurie);
    S.saison.coutRestant -= part;
    S.saison.coutTotal   -= part;
    S.saison.priseEnCharge = part;
  }
  // Apport familial en karting (petit, mais il sauve les débuts)
  if(c.format==='kart'){
    const fam = Math.round(c.cout * rnd(0.22,0.10));
    caisse('Apport de la famille du pilote', fam, 'famille');
  }
  S.phase = 'semaine';
  S.actions = actionsParSemaine();
  S.stats.saisonsJouees++;
  majSponsorsProspects();
  msg('systeme','Fédération','Engagement validé — saison '+S.annee,
    `${S.pilote.nom} est engagé en ${c.nom} avec ${ecu.nom}.\n\n`+
    `Budget de saison à financer : <em>${fmtEurFull(S.saison.coutTotal)}</em> sur ${c.courses} manches.\n`+
    `Chaque manche prélève ${fmtEurFull(Math.round(S.saison.coutTotal/c.courses))} sur la caisse de saison.\n\n`+
    `Rappel : cet argent vient des sponsors, pas de votre trésorerie. Si la caisse est vide, c’est vous qui comblez.`);
  saveGame();
}

const actionsParSemaine = ()=> 3;

/* Temps de piste disponible sur un week-end. Trois runs de base : c'est court,
   et c'est voulu — quand c'est trop juste, la réponse est de recruter un
   ingénieur de course, qui en dégage jusqu'à trois de plus.
   0 → 3 runs · 1-2 → 4 · 3-4 → 5 · 5 → 6 (un de plus en F1). */
function runsDisponibles(){
  const base = CAT[S.saison.catId].format==='f1' ? 4 : 3;
  return base + Math.ceil(staffNiv('ingenieur')/2);
}

/* ------------------------------------ 9. RÉGLAGES (GDD §18) */
function optimalCircuit(course, k){
  // valeur cachée 1..20, stable pour un circuit / une saison / un paramètre
  return 1 + Math.floor(hash01(course.seed+'#'+k)*20);
}
function cibleReglage(course, k, pilote){
  return clamp(optimalCircuit(course,k) + (pilote.prefs[k]||0), 1, 20);
}
/* GDD §18.2 : Écart = |choisi - (optimal + préférence)| ; Réglages = 100 - somme normalisée */
function scoreReglages(course, setup, pilote){
  const params = setupParams(S.saison.catId);
  const ecarts = params.map(p=>Math.abs((setup[p.k]??10) - cibleReglage(course,p.k,pilote)));
  const moy = avg(ecarts);
  const score = 100 * (1 - Math.pow(Math.min(1, moy/9), 1.25)) + (S.flags.bonusReglages||0);
  return {score: clamp(score,0,100), ecarts, moy};
}
/* Ce que le stand croit savoir de la qualité d'un réglage.
   Sans ingénieur il n'y a pas de mesure : il ne reste que le ressenti du pilote,
   qui se trompe. C'est ce qui justifie d'investir dans le staff (GDD §18.3) —
   sinon il suffirait d'optimiser un chiffre affiché sans jamais écouter personne. */
const BRUIT_MESURE = [12, 9, 7, 5, 2.5, 0];
function scorePercu(scoreReel, seed){
  const niv = staffNiv('ingenieur');
  const bruit = BRUIT_MESURE[niv];
  if(bruit<=0) return scoreReel;
  return clamp(scoreReel + (hash01(String(seed))*2-1)*bruit, 0, 100);
}
/* Rendu du score selon ce que l'ingénieur permet de savoir. */
function afficheScore(percu, nivForce){
  const niv = nivForce ?? staffNiv('ingenieur');
  if(niv>=5) return {txt:Math.round(percu)+'/100', cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
  if(niv>=3){
    const m = BRUIT_MESURE[niv];
    return {txt:Math.max(0,Math.round(percu-m))+'–'+Math.min(100,Math.round(percu+m))+'/100',
            cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
  }
  const lab = percu<45 ? 'il n’est pas à l’aise'
            : percu<62 ? 'ça reste moyen'
            : percu<78 ? 'ça commence à venir'
            : percu<90 ? 'il est bien dedans'
            : 'il adore la voiture';
  return {txt:lab, cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
}

/* Retour du pilote en langage naturel. La précision dépend de l'ingénieur (GDD §18.3). */
function retourPilote(course, setup, pilote){
  const params = setupParams(S.saison.catId);
  const niv = staffNiv('ingenieur');
  const detail = params.map(p=>{
    const cible = cibleReglage(course,p.k,pilote);
    const d = (setup[p.k]??10) - cible;
    return {p, d, abs:Math.abs(d)};
  }).sort((a,b)=>b.abs-a.abs);

  const lignes = [];
  // Chaque niveau d'ingénieur achète quelque chose de précis :
  //   0-1 : le pilote décrit ce qu'il sent, à vous de traduire (aide-mémoire)
  //   2-3 : l'ingénieur nomme le correctif, sans son ampleur
  //     4 : il chiffre l'ampleur, et repère les écarts à partir de 2 crans
  //     5 : il repère jusqu'au cran près, sur tous les paramètres
  const nbSymptomes = niv>=4 ? params.length : niv===3 ? 4 : niv===2 ? 3 : 2;
  const seuil       = niv>=5 ? 1 : niv>=3 ? 2 : niv===2 ? 3 : 4;

  for(const it of detail.slice(0,nbSymptomes)){
    if(it.abs<seuil) continue;
    const symptome = it.d<0 ? it.p.lo : it.p.hi;
    const correctif= it.d<0 ? it.p.loFix : it.p.hiFix;
    if(niv<=1){
      lignes.push(symptome);                                    // symptôme seul
    }else if(niv<=3){
      lignes.push(symptome+' Il faudrait '+correctif+'.');      // + direction
    }else{
      const crans = Math.max(1, Math.round(it.abs));
      lignes.push(symptome+' Il faudrait '+correctif+', environ '+crans+' cran'+(crans>1?'s':'')+'.');
    }
  }
  if(!lignes.length){
    lignes.push(niv>=3 ? 'La voiture est équilibrée, je n’ai plus rien à redire.' : 'Ça va, je m’y retrouve bien.');
  }
  // Le commentaire doit décrire exactement ce que les lignes ci-dessus disent.
  const commentaireIng = niv===0
    ? 'Sans ingénieur, personne ne traduit ces sensations en réglages : à vous de faire le lien.'
    : niv===1 ? 'Votre ingénieur confirme les sensations sans savoir quoi corriger.'
    : niv<=3 ? 'Votre ingénieur nomme le correctif, mais pas son ampleur.'
    : niv===4 ? 'Votre ingénieur chiffre la correction à un cran près.'
    : 'Votre ingénieur lit la voiture comme un livre : correctif et ampleur exacts.';
  return {lignes, commentaireIng};
}

/* --------------------------------- 10. SIMULATION DE COURSE (GDD §17.3) */

/* Note pondérée du pilote selon le profil du circuit et la météo */
function notePondere(p, course, meteo){
  const [wp,wc,wr] = course.w;
  const pace = noteGroupe(p,'pace'), cons = noteGroupe(p,'consistency'), race = noteGroupe(p,'racecraft');
  let n = pace*wp + cons*wc + race*wr;
  // Sous la pluie, la régularité et l'adaptabilité pèsent bien plus lourd
  if(meteo.pluie>0){
    const adapt = p.stats.adaptabilite, ctrl = p.stats.controle;
    n = n*(1-meteo.adapt) + (cons*0.45 + adapt*0.35 + ctrl*0.20)*meteo.adapt;
  }
  // Moral et forme physique
  const mf = 1 + ((p.moral-60)/100)*0.10 + ((p.forme-85)/100)*0.14;
  return n*mf;
}
function notePondereIA(g, course, meteo){
  return notePondere(g.p, course, meteo);
}

/* GDD §17.3 : PerfTotale = Pilote×0,40 + Voiture×0,35 + Réglages×0,15 + Aléa×0,10 */
function perfTotale(notePilote_, voiture, reglages, aleaMult=1){
  const alea = clamp(50 + gauss()*45, 0, 100);
  return notePilote_*0.40 + voiture*0.35 + reglages*0.15 + alea*0.10*aleaMult;
}

function meteoPour(course){
  const h = hash01(course.seed+'meteo');
  return h<0.55 ? METEOS[0] : h<0.75 ? METEOS[1] : h<0.9 ? METEOS[2] : METEOS[3];
}

/* Réglages de l'IA. Les écuries adverses ont elles aussi des ingénieurs et le
   même temps de piste : leur niveau de réglage suit leurs moyens. Le joueur qui
   travaille ses essais garde l'avantage, mais il n'a plus la piste pour lui seul. */
function reglagesIA(g){ return clamp(62 + (g.voiture-60)*0.55 + rnd(14,-7), 30, 96); }

/* Session de qualification / essais chronométrés */
function simulerQualif(course, meteo, reglagesJoueur){
  const res = [];
  const p = S.pilote;
  res.push({id:p.id, nom:p.nom, moi:true, ecurie:S.saison.ecurieNom,
    perf: perfTotale(notePondere(p,course,meteo), S.saison.voiture, reglagesJoueur, 0.7)});
  for(const g of S.saison.grille){
    res.push({id:g.id, nom:g.nom, moi:false, ecurie:g.ecurie,
      perf: perfTotale(notePondereIA(g,course,meteo), g.voiture, reglagesIA(g), 0.7)});
  }
  res.sort((a,b)=>b.perf-a.perf);
  res.forEach((r,i)=>r.pos=i+1);
  return res;
}

/* Course complète : grille de départ + incidents + fiabilité + récit */
function simulerCourse(course, meteo, reglagesJoueur, grilleDepart, strat){
  const p = S.pilote;
  const log = [];
  const st = STRATS.find(s=>s.id===strat) || STRATS[1];
  const field = [];

  // --- performance de course
  const perfJoueur = perfTotale(notePondere(p,course,meteo), S.saison.voiture, reglagesJoueur, 1)
                   + st.perf
                   + (p.traits.includes('regulier')?1.0:0);
  field.push({id:p.id, nom:p.nom, moi:true, ecurie:S.saison.ecurieNom, perf:perfJoueur,
    fiab:S.saison.fiab, agr:p.agressivite, note:notePilote(p), racecraft:noteGroupe(p,'racecraft')});
  for(const g of S.saison.grille){
    field.push({id:g.id, nom:g.nom, moi:false, ecurie:g.ecurie,
      perf: perfTotale(notePondereIA(g,course,meteo), g.voiture, reglagesIA(g), 1),
      fiab:g.fiab, agr:g.agressivite, note:g.note, racecraft:noteGroupe(g.p,'racecraft'), ref:g});
  }
  // position de départ : la grille compte, mais la course peut tout changer
  const gridPos = Object.fromEntries(grilleDepart.map(r=>[r.id, r.pos]));
  for(const f of field){
    const gp = gridPos[f.id] || field.length;
    f.perf += (field.length - gp) * 0.28;         // avantage réel de la grille
  }

  // --- voiture de sécurité
  const scChance = 0.16*meteo.incident + (CAT[S.saison.catId].format==='kart'?-0.05:0.04);
  const safetyCar = Math.random() < scChance;
  if(safetyCar) log.push({t:'Course', s:'Voiture de sécurité en piste, le peloton se regroupe.', c:'big'});

  // --- incidents & fiabilité
  for(const f of field){
    f.abandon = null;
    const risqueMeca = (100-f.fiab)/100 * 0.55 * st.usure;
    if(Math.random() < risqueMeca){ f.abandon='Panne mécanique'; continue; }
    const risqueCrash = (0.035 + (f.agr/100)*0.055) * meteo.incident * (f.moi?st.risque:1)
                      * (1 - (f.racecraft-50)/280);
    if(Math.random() < risqueCrash){ f.abandon = Math.random()<0.5?'Accrochage':'Sortie de piste'; }
  }
  if(safetyCar){
    // la neutralisation resserre les écarts
    const m = avg(field.filter(f=>!f.abandon), f=>f.perf);
    for(const f of field) f.perf = f.perf*0.82 + m*0.18;
  }

  const finishers = field.filter(f=>!f.abandon).sort((a,b)=>b.perf-a.perf);
  const dnf       = field.filter(f=> f.abandon);
  finishers.forEach((f,i)=>f.pos=i+1);
  dnf.forEach((f,i)=>f.pos=finishers.length+i+1);
  const classement = [...finishers, ...dnf];

  // --- récit de course
  const moi = field.find(f=>f.moi);
  const gp  = gridPos[p.id] || field.length;
  log.unshift({t:'Départ', s:`${p.nom} s’élance de la ${ordinal(gp)} place. Météo : ${meteo.nom.toLowerCase()}.`, c:''});
  if(!moi.abandon){
    const delta = gp - moi.pos;
    if(delta>=4) log.push({t:'Course', s:`Départ canon : ${Math.abs(delta)} places gagnées dans les premiers tours.`, c:'good'});
    else if(delta<=-4) log.push({t:'Course', s:`Départ manqué, ${Math.abs(delta)} places perdues.`, c:'bad'});
    if(meteo.pluie>0) log.push({t:'Piste', s: p.stats.adaptabilite>72
      ? 'Sur le mouillé, il trouve des trajectoires que les autres n’osent pas.'
      : 'Sur le mouillé, il peine à trouver ses repères.', c: p.stats.adaptabilite>72?'good':'bad'});
    if(moi.pos===1) log.push({t:'Arrivée', s:'VICTOIRE ! Drapeau à damier pour '+p.nom+'.', c:'big'});
    else if(moi.pos<=3) log.push({t:'Arrivée', s:'Podium — '+ordinal(moi.pos)+' place.', c:'good'});
    else log.push({t:'Arrivée', s:p.nom+' termine '+ordinal(moi.pos)+'.', c:''});
  }else{
    log.push({t:'Abandon', s:moi.abandon+' — la course de '+p.nom+' s’arrête là.', c:'bad'});
  }
  const top3 = finishers.slice(0,3).map((f,i)=>`${i+1}. ${f.nom}`).join('  ·  ');
  log.push({t:'Podium', s:top3, c:''});

  return {classement, log, safetyCar, moi};
}

/* Points de championnat */
function pointsPour(catId, pos){
  const bareme = PTS[CAT[catId].ptsSys];
  return pos>=1 && pos<=bareme.length ? bareme[pos-1] : 0;
}

/* ------------------------------------ 11. WEEK-END DE COURSE (GDD §21.2) */
function etapesWeekend(catId){
  const f = CAT[catId].format;
  if(f==='kart') return ['essais','course'];
  if(f==='f1')   return ['libres','essais','qualifs','course'];
  return ['essais','qualifs','course'];
}
const ETAPE_NOM = {libres:'Essais libres', essais:'Essais', qualifs:'Qualifications', course:'Course'};

function ouvrirWeekend(){
  const course = S.saison.calendrier[S.saison.courseIndex];
  const meteo  = meteoPour(course);
  course.meteo = meteo.id;
  const params = setupParams(S.saison.catId);
  // On repart d'un réglage neutre : le pilote perd son réglage à chaque circuit (GDD §18.3)
  const setup = Object.fromEntries(params.map(p=>[p.k,10]));
  S.weekend = {
    courseIdx:S.saison.courseIndex, meteoId:meteo.id,
    etapes: etapesWeekend(S.saison.catId), etape:0,
    setup, runs:[], runsRestants: runsDisponibles(),
    grille:null, resultat:null, strat:'equi', debrief:null, presse:null,
  };
  S.phase='weekend';
  saveGame();
}

function faireRun(){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  if(w.runsRestants<=0) return;
  w.runsRestants--;
  const sc = scoreReglages(course, w.setup, S.pilote);
  const ret= retourPilote(course, w.setup, S.pilote);
  const n = w.runs.length+1;
  w.runs.unshift({setup:{...w.setup}, score:sc.score,
    percu: scorePercu(sc.score, course.seed+'|run'+n+'|'+Math.round(sc.score)),
    nivIng: staffNiv('ingenieur'),
    lignes:ret.lignes, ing:ret.commentaireIng, n});
  // Un run coûte quelques tours de fraîcheur, pas beaucoup plus.
  S.pilote.fatigue = clamp(S.pilote.fatigue + rint(0,2) - staffNiv('prepa'), 0, 100);
  majForme();
  saveGame();
}

function reglagesActuels(){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx];
  return scoreReglages(course, w.setup, S.pilote).score;
}

function etapeSuivante(){
  const w=S.weekend;
  const course = S.saison.calendrier[w.courseIdx];
  const meteo  = METEOS.find(m=>m.id===w.meteoId);
  const etape  = w.etapes[w.etape];

  if(etape==='libres' || etape==='essais'){
    w.etape++;
    // Karting : pas de qualif, la grille sort directement des essais (GDD §21.2)
    if(w.etapes[w.etape]==='course'){
      w.grille = simulerQualif(course, meteo, reglagesActuels());
    }
  }else if(etape==='qualifs'){
    // 1er appel : on qualifie et on affiche la grille. 2e appel : on part en course.
    if(!w.grille) w.grille = simulerQualif(course, meteo, reglagesActuels());
    else w.etape++;
  }else if(etape==='course'){
    lancerCourse(false);
  }
  saveGame();
}

/* Simulation rapide d'un week-end complet (GDD §21.1) */
function simulationRapide(){
  ouvrirWeekend();
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  // Sans travail d'essais, l'ingénieur règle seul : le résultat se situe au
  // niveau des écuries adverses, un peu en dessous. Travailler soi-même les
  // essais reste le seul moyen de dépasser 90 (GDD §18, §21.1).
  const base = 54 + staffNiv('ingenieur')*5.5 + rnd(6,-6);
  w.setupAuto = clamp(base,40,88);
  w.grille = simulerQualif(course, meteo, w.setupAuto);
  lancerCourse(true);
}

function lancerCourse(rapide){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  const reg = rapide ? w.setupAuto : reglagesActuels();
  const r = simulerCourse(course, meteo, reg, w.grille, w.strat);
  w.resultat = {
    classement: r.classement.map(f=>({id:f.id,nom:f.nom,ecurie:f.ecurie,pos:f.pos,moi:!!f.moi,abandon:f.abandon||null})),
    log:r.log, reglages:round(reg,1), rapide:!!rapide,
    grillePos: (w.grille.find(g=>g.id===S.pilote.id)||{}).pos || null,
  };
  w.etape = w.etapes.length;         // on passe au débrief
  traiterResultat(course, meteo, r, reg);
  saveGame();
}

/* ------------------------------- 12. APRÈS-COURSE : effets & progression */
function traiterResultat(course, meteo, r, reg){
  const p=S.pilote, sa=S.saison, c=CAT[sa.catId];
  const moi = r.classement.find(f=>f.moi);
  const pos = moi.pos, dnf = !!moi.abandon;
  const pts = dnf?0:pointsPour(sa.catId,pos);

  // --- championnat
  sa.pts += pts;
  if(!dnf && pos===1){ sa.victoires++; S.stats.coursesGagnees++; }
  if(!dnf && pos<=3){ sa.podiums++; S.stats.podiums++; }
  if(dnf) sa.abandons++;
  if(!dnf) sa.meilleur = Math.min(sa.meilleur,pos);
  for(const f of r.classement){
    if(f.moi) continue;
    const g = sa.grille.find(x=>x.id===f.id);
    if(!g) continue;
    g.pts += f.abandon?0:pointsPour(sa.catId,f.pos);
    if(!f.abandon && f.pos===1) g.victoires++;
    if(!f.abandon && f.pos<=3) g.podiums++;
    if(f.abandon) g.abandons++;
  }
  sa.resultats.push({i:sa.courseIndex, circuit:course.nom, pays:course.pays, meteo:meteo.id,
    grille:(S.weekend&&S.weekend.resultat)?S.weekend.resultat.grillePos:null,
    pos: dnf?null:pos, dnf:dnf?moi.abandon:null, pts, reglages:round(reg)});

  // --- argent (GDD §19.1 option A : gains dans la caisse, commission au manager)
  verserSponsors();
  const coutManche = Math.round(sa.coutTotal / c.courses);
  if(coutManche>0) caisse('Engagement, transport, pneus — '+course.nom, -coutManche, 'course');
  let gain = 0;
  if(!dnf){
    if(pos===1) gain = c.vict;
    else if(pos===2) gain = Math.round(c.vict*0.6);
    else if(pos===3) gain = Math.round(c.vict*0.4);
    else if(pos<=6) gain = Math.round(c.vict*0.18);
    else if(pos<=10) gain = Math.round(c.vict*0.07);
  }
  if(gain>0){
    caisse('Prime de course — '+ordinal(pos), gain, 'gain');
    const com = Math.round(gain*0.10);
    argent('Commission course '+course.nom+' (10 %)', com, 'commission');
  }
  // salaire F1 : versé par manche
  if(sa.catId==='f1' && S.contrat && S.contrat.salaire>0){
    const parManche = Math.round(S.contrat.salaire/c.courses);
    const com = Math.round(parManche*0.10);
    argent('Commission sur salaire — '+course.nom+' (10 %)', com, 'commission');
    // primes de résultat
    let prime=0;
    if(!dnf && pos===1) prime = S.contrat.primeVictoire||0;
    else if(!dnf && pos<=3) prime = Math.round((S.contrat.primeVictoire||0)*0.4);
    else if(pts>0) prime = (S.contrat.primePoint||0)*pts;
    if(prime>0) argent('Commission primes '+course.nom+' (10 %)', Math.round(prime*0.10), 'commission');
  }
  // staff : 12 mois de salaire répartis sur la saison
  const staffManche = Math.round(staffCoutMensuel()*12/c.courses);
  if(staffManche>0) argent('Salaires du staff', -staffManche, 'staff');
  // caisse négative -> le manager comble de sa poche
  if(sa.caisse<0){
    const trou = -sa.caisse;
    argent('Comblement de la caisse de saison', -trou, 'sauvetage');
    caisse('Avance du manager', trou, 'avance');
    msg('finance','Comptabilité','La caisse de saison est à sec',
      `Vous avez dû avancer <em>${fmtEurFull(trou)}</em> de votre trésorerie pour couvrir la manche.\n\n`+
      `C’est exactement ce que le métier ne doit pas être : trouvez des sponsors, vite.`);
  }

  // --- progression du pilote (GDD §17.1)
  progresserPilote(dnf?null:pos);
  // --- moral, fatigue, réputation
  effetsPsy(pos, dnf, r.classement.length);
  // --- rivaux et IA progressent aussi
  progresserGrille();
  // --- contrat : évaluation, avertissements (GDD §9.5)
  evaluerContrat(pos, dnf);
  // --- sponsors : objectifs, obligations, ruptures
  evaluerSponsors(pos, dnf);
  // --- réputation du manager
  if(!dnf){
    if(pos===1) gagnerRep(Math.round(6+c.niv*2.6), 'victoire en '+c.court);
    else if(pos<=3) gagnerRep(Math.round(2.5+c.niv*1.1), 'podium en '+c.court);
    else if(pos<=6) gagnerRep(Math.round(0.8+c.niv*0.35), '');
  }
  // --- conférence de presse (GDD §20.2)
  if(S.weekend) S.weekend.presse = genererQuestionPresse(pos, dnf, c);
  // --- message du pilote (GDD §20.3)
  peutEtreMessagePilote(pos, dnf);
}

function progresserPilote(pos){
  const p=S.pilote, c=CAT[S.saison.catId];
  const cAge = coeffAge(p.age);
  const cStaff = 1 + staffNiv('ingenieur')*0.045 + staffNiv('prepa')*0.035;   // 1,0 → ~1,4
  const cMoral = 0.7 + (p.moral/100)*0.6;                                     // 0,7 → 1,3
  const cTrait = p.traits.includes('bosseur')?1.18:1;
  const base = GAIN_SAISON / c.courses;
  const gains = {};
  for(const k of ALL_STATS){
    const marge = 1 - p.stats[k]/p.plafonds[k];
    if(marge<=0){ gains[k]=0; continue; }
    // Chaque stat progresse à son rythme : profil unique
    const g = base * cAge * cStaff * cMoral * cTrait * marge * rnd(1.35,0.55);
    p.stats[k] = clamp(p.stats[k] + g, 1, 99);
    gains[k]=g;
  }
  // Déclin après 32 ans (GDD §17.1)
  if(p.age>=33){
    const perte = rnd(3,1)/c.courses;
    p.stats.reactions = clamp(p.stats.reactions-perte,1,99);
    p.forme = clamp(p.forme - perte*0.6, 20, 100);
  }
  p.progression = gains;
}

function progresserGrille(){
  const c=CAT[S.saison.catId];
  const base = GAIN_SAISON/c.courses;
  for(const g of S.saison.grille){
    const cAge=coeffAge(g.p.age), cM=1.0;
    for(const k of ALL_STATS){
      const m = 1 - g.p.stats[k]/g.p.plafonds[k];
      if(m<=0) continue;
      g.p.stats[k] = clamp(g.p.stats[k] + base*cAge*cM*m*rnd(1.2,0.6), 1, 99);
    }
    g.note = notePilote(g.p);
  }
}

function majForme(){
  const p=S.pilote;
  const recup = 4 + staffNiv('prepa')*2.4;
  p.fatigue = clamp(p.fatigue, 0, 100);
  p.forme = clamp(96 - p.fatigue*0.55 - Math.max(0,p.age-32)*1.6 + staffNiv('prepa')*1.2, 25, 100);
  return recup;
}

function effetsPsy(pos, dnf, grilleN){
  const p=S.pilote, c=CAT[S.saison.catId];
  // attente = position moyenne attendue vu la voiture et le niveau du pilote
  const attendu = positionAttendue();
  let d = dnf ? -6 : (attendu - pos);          // positif = mieux que prévu
  let dm = clamp(d*1.7, -22, 22);
  if(dnf) dm = -10;
  if(p.traits.includes('fragile') && dm<0) dm *= 1.75;
  if(p.traits.includes('regulier')) dm *= 0.8;
  // Finir loin reste une contre-performance, même si la voiture ne valait pas mieux :
  // on plafonne le gain de moral sur un résultat absolu médiocre.
  if(dm>0 && !dnf && pos > grilleN*0.4) dm = Math.min(dm, 4);
  if(dm>0 && !dnf && pos > grilleN*0.65) dm = Math.min(dm, 1.5);
  p.moral = clamp(p.moral + dm, 5, 100);
  p.fatigue = clamp(p.fatigue + rint(6,12) - staffNiv('prepa')*2, 0, 100);
  majForme();
  // réputation du pilote
  let dr = 0;
  if(!dnf){
    if(pos===1) dr = 3.2 + c.niv*0.55;
    else if(pos<=3) dr = 1.6 + c.niv*0.3;
    else if(pos<=6) dr = 0.6;
    else if(pos>grilleN*0.7) dr = -0.5;
  }else dr = -0.4;
  if(p.traits.includes('medias')) dr *= 1.3;
  p.reputation = clamp(p.reputation + dr, 1, 100);
  // image médiatique du manager suit doucement
  S.manager.image = clamp(S.manager.image + dr*0.25 + staffNiv('presse')*0.08, 0, 100);
  // relation : de bons résultats et de la considération l'entretiennent
  p.relation = clamp(p.relation + (dnf?-1: pos<=3?1.2 : pos<=attendu?0.4:-0.8), 0, 100);
}

/* Position que l'on peut raisonnablement attendre du duo pilote/voiture */
function positionAttendue(){
  const sa=S.saison;
  const perfMoi = notePilote(S.pilote)*0.53 + sa.voiture*0.47;
  const tous = sa.grille.map(g=>g.note*0.53 + g.voiture*0.47);
  const mieux = tous.filter(v=>v>perfMoi).length;
  return mieux+1;
}

/* -------------------------------- 13. RÉPUTATION MANAGER (GDD §3) */
function gagnerRep(pts, motif){
  if(!pts) return;
  const avant = repPalier(S.manager.repPoints).p;
  S.manager.repPoints = Math.max(0, S.manager.repPoints + pts);
  const apres = repPalier(S.manager.repPoints).p;
  if(apres>avant){
    const r = REP_PALIERS[apres-1];
    msg('systeme','Paddock','Votre réputation grandit — palier '+apres+' : '+r.nom,
      `Vous êtes désormais reconnu comme « <em>${r.nom}</em> » (${apres}/10).\n\n${r.acces}\n\n`+
      (pilotesMax(apres)>1 ? `À ce palier, un manager peut suivre jusqu’à ${pilotesMax(apres)} pilotes. Cette extension est prévue après la V1.` : ''));
    majSponsorsProspects();
  }else if(apres<avant){
    msg('systeme','Paddock','Votre réputation recule — palier '+apres,
      `Le paddock vous fait moins confiance. Vous retombez au palier ${apres} : « ${REP_PALIERS[apres-1].nom} ».`);
  }
}

/* ------------------------------------ 14. CONTRATS (GDD §9.5) */
function evaluerContrat(pos, dnf){
  const ct = S.contrat; if(!ct || !ct.objectifPos) return;
  const sa = S.saison;
  const derniers = sa.resultats.slice(-4);
  if(derniers.length<4) return;
  // L'écurie fait le point toutes les 4 manches, pas après chaque course :
  // c'est une série de résultats qui déclenche un avertissement, pas une seule.
  if(sa.dernierBilan!=null && sa.courseIndex - sa.dernierBilan < 4) return;
  sa.dernierBilan = sa.courseIndex;
  const moyenne = avg(derniers, r=> r.pos===null ? CAT[sa.catId].grille : r.pos);
  if(moyenne > ct.objectifPos + 3.5){
    sa.avertissements++;
    if(sa.avertissements===1 || sa.avertissements===2){
      msg('ecurie', ct.ecurieNom, 'Avertissement — résultats insuffisants',
        `Vos quatre dernières manches donnent une moyenne de ${round(moyenne,1)}, loin de l’objectif contractuel `+
        `(${ordinal(ct.objectifPos)} au championnat).\n\n`+
        (sa.avertissements===1 ? 'Considérez ceci comme un premier avertissement.'
                               : '<em>Deuxième avertissement.</em> Le prochain sera une rupture de contrat.'));
    }
    if(sa.avertissements>=3){ rompreContrat(); }
  }else if(sa.avertissements>0 && moyenne <= ct.objectifPos+1){
    sa.avertissements = Math.max(0, sa.avertissements-1);
  }
}
function rompreContrat(){
  const ct=S.contrat, sa=S.saison;
  msg('ecurie', ct.ecurieNom, 'Rupture de contrat',
    `${ct.ecurieNom} met fin au contrat de ${S.pilote.nom} avec effet immédiat.\n\n`+
    `La saison s’arrête ici. Il faudra redescendre d’une catégorie pour reconstruire sa réputation.`);
  gagnerRep(-Math.round(60+CAT[sa.catId].niv*18), 'renvoi');
  S.pilote.moral = clamp(S.pilote.moral-25,5,100);
  S.pilote.relation = clamp(S.pilote.relation-12,0,100);
  S.flags.renvoye = true;
  S.flags.ruptureEnCours = true;
}

/* ------------------------------------ 15. SPONSORS (GDD §4, §19.5) */
function slotsSponsors(){ return CAT[S.pilote?S.pilote.catId:'kmini'].slots; }
function slotsLibres(){ return slotsSponsors() - S.sponsors.actifs.length; }
function secteursOccupes(){ return S.sponsors.actifs.map(s=>s.secteur); }

function genererSponsor(niv){
  const N = SPONSOR_NIVEAUX[niv-1];
  const pool = SPONSOR_POOLS[N.pool];
  const dispo = pool.filter(x=>!S.sponsors.actifs.some(s=>s.nom===x[0]) && !S.sponsors.prospects.some(s=>s.nom===x[0]));
  if(!dispo.length) return null;
  const [nom,secteur] = pick(dispo);
  const spread = N.max-N.min;
  const montant = Math.round((N.min + spread*Math.pow(Math.random(),1.6))/100)*100;
  const obl = [];
  if(Math.random()<0.45) obl.push('presse');
  if(Math.random()<0.30) obl.push('objectif');
  if(Math.random()<0.25) obl.push('pub');
  if(niv>=3) obl.push('exclu');
  if(!obl.length) obl.push('aucune');
  return {
    id:uid(), nom, secteur, niv, montant,
    objectifPos: obl.includes('objectif') ? rint(3, Math.max(5, Math.round(CAT[S.pilote.catId].grille*0.45))) : null,
    partConditionnelle: obl.includes('objectif') ? 0.3 : 0,
    obligations: obl,
    duree: rint(1,niv>=3?3:2),
    // critères d'intérêt (GDD §4.2)
    exigeRepManager: Math.max(1, N.repMin - 1 + rint(0,1)),
    exigeRepPilote: clamp(Math.round((niv-1)*16 + rnd(14)), 0, 92),
    approches:0, statut:'prospect',
  };
}

function majSponsorsProspects(){
  if(!S.pilote){ S.sponsors.prospects = []; return; }
  const rp = repPalier(S.manager.repPoints).p;
  const niveauxOuverts = SPONSOR_NIVEAUX.filter(n=>rp >= n.repMin-1).map(n=>n.niv);
  const cible = clamp(3 + rp, 4, 11);
  // On retire les prospects devenus hors sujet, on complète
  S.sponsors.prospects = S.sponsors.prospects.filter(s=>niveauxOuverts.includes(s.niv));
  let garde=0;
  while(S.sponsors.prospects.length<cible && garde++<40){
    const niv = pick(niveauxOuverts);
    const s = genererSponsor(niv);
    if(s) S.sponsors.prospects.push(s);
  }
  S.sponsors.prospects.sort((a,b)=>b.niv-a.niv || b.montant-a.montant);
}

/* Score d'intérêt d'un sponsor pour le duo manager/pilote (GDD §4.2) */
function interetSponsor(s){
  const p=S.pilote, rp=repPalier(S.manager.repPoints).p;
  let sc = 0;
  sc += clamp((rp - s.exigeRepManager)*11, -55, 30);
  sc += clamp((p.reputation - s.exigeRepPilote)*0.75, -45, 28);
  // résultats récents
  if(S.saison && S.saison.resultats.length){
    const der = S.saison.resultats.slice(-4);
    const moy = avg(der, r=>r.pos===null?CAT[S.saison.catId].grille:r.pos);
    const att = positionAttendue();
    sc += clamp((att-moy)*3.2, -18, 18);
  }
  sc += (S.manager.image-40)*0.30;                    // image médiatique
  sc += staffNiv('presse')*5.5;                       // attaché de presse
  if(p.traits.includes('medias')) sc += 9;
  sc += (CAT[p.catId].niv - (s.niv*1.4))*3.2;         // cohérence catégorie / niveau du sponsor
  sc += s.approches*4;                                // relancer paie un peu
  return sc;
}
function probaSponsor(s){ return clamp(0.5 + interetSponsor(s)/120, 0.03, 0.94); }

function demarcher(sponsorId){
  const s = S.sponsors.prospects.find(x=>x.id===sponsorId); if(!s) return null;
  const N = SPONSOR_NIVEAUX[s.niv-1];
  if(S.manager.budget < N.coutDemarche){ showToast('Trésorerie insuffisante pour monter le dossier'); return null; }
  if(S.actions<=0){ showToast('Plus d’action disponible cette semaine'); return null; }
  S.actions--;
  argent('Démarchage — '+s.nom+' (dossier, déplacement)', -N.coutDemarche, 'demarchage');
  s.approches++;
  const pr = probaSponsor(s);
  const r = Math.random();
  let issue;
  if(r < pr*0.72){
    issue = {type:'accepte', montant:s.montant};
  }else if(r < pr*0.72 + 0.30){
    const coef = rnd(0.80,0.45);
    issue = {type:'contre', montant: Math.max(N.min, Math.round(s.montant*coef/100)*100)};
  }else if(s.approches>=3){
    issue = {type:'definitif'};
  }else{
    issue = {type:'refus'};
  }
  s.derniereIssue = issue;
  saveGame();
  return issue;
}

function signerSponsor(sponsorId, montant){
  const s = S.sponsors.prospects.find(x=>x.id===sponsorId); if(!s) return false;
  if(slotsLibres()<=0){ showToast('Aucun emplacement publicitaire libre'); return false; }
  if(secteursOccupes().includes(s.secteur)){ showToast('Conflit de secteur avec un sponsor déjà en place'); return false; }
  s.montant = montant;
  s.statut='actif';
  s.anneeSignature = S.annee;
  s.verseSaison = 0;
  S.sponsors.actifs.push(s);
  S.sponsors.prospects = S.sponsors.prospects.filter(x=>x.id!==s.id);
  S.stats.sponsorsSignes++;
  const com = Math.round(montant*0.15);
  argent('Commission sponsor — '+s.nom+' (15 %)', com, 'commission');
  gagnerRep(Math.round(4 + s.niv*9), 'sponsor');
  // Le montant alimente la caisse de saison, pas la poche du manager (GDD §19.1)
  if(S.saison){
    const parManche = Math.round(montant / Math.max(1, CAT[S.saison.catId].courses - S.saison.courseIndex));
    s.parManche = parManche;
  }
  msg('sponsor', s.nom, 'Contrat de partenariat signé',
    `${s.nom} s’engage pour <em>${fmtEurFull(montant)}</em> sur la saison`+(s.duree>1?` (contrat de ${s.duree} ans)`:'')+`.\n\n`+
    `Secteur : ${s.secteur}. Contreparties : ${s.obligations.map(o=>OBLIGATIONS.find(x=>x.id===o).lab).join(', ')}.\n\n`+
    `Votre commission de 15 % (${fmtEurFull(com)}) est créditée. Le reste finance la saison du pilote.`);
  majSponsorsProspects();
  saveGame();
  return true;
}

/* Versement des sponsors : à chaque manche, par tranches */
function verserSponsors(){
  if(!S.saison) return;
  const c = CAT[S.saison.catId];
  for(const s of S.sponsors.actifs){
    const partFixe = s.montant*(1-s.partConditionnelle);
    const tranche = Math.round(partFixe / c.courses);
    caisse('Sponsor — '+s.nom, tranche, 'sponsor');
    s.verseSaison = (s.verseSaison||0)+tranche;
    // obligations d'image : elles coûtent de la fraîcheur (GDD §4.3)
    if(s.obligations.includes('presse') && Math.random()<0.35){
      S.pilote.fatigue = clamp(S.pilote.fatigue+rint(3,7),0,100);
      S.manager.image = clamp(S.manager.image+1.2,0,100);
    }
  }
  majForme();
}

function evaluerSponsors(pos, dnf){
  if(!S.saison) return;
  const restants = CAT[S.saison.catId].courses - S.saison.courseIndex - 1;
  for(const s of [...S.sponsors.actifs]){
    // rupture si la saison est catastrophique
    const der = S.saison.resultats.slice(-5);
    if(der.length>=5){
      const moy = avg(der, r=>r.pos===null?CAT[S.saison.catId].grille:r.pos);
      const att = positionAttendue();
      if(moy > att+6 && Math.random()<0.16){
        S.sponsors.actifs = S.sponsors.actifs.filter(x=>x.id!==s.id);
        msg('sponsor', s.nom, 'Fin de partenariat anticipée',
          `${s.nom} met fin au partenariat : les résultats ne sont pas au rendez-vous et l’exposition n’est plus jugée suffisante.\n\n`+
          `Le versement des tranches restantes (environ ${fmtEurFull(Math.round(s.montant/CAT[S.saison.catId].courses*restants))}) est annulé.`);
        gagnerRep(-8,'rupture sponsor');
      }
    }
  }
}

/* Primes conditionnelles versées en fin de saison */
function primesSponsorsFinSaison(posChamp){
  let total=0;
  for(const s of S.sponsors.actifs){
    if(!s.objectifPos) continue;
    if(posChamp && posChamp<=s.objectifPos){
      const prime = Math.round(s.montant*s.partConditionnelle);
      total += prime;
      caisse('Prime d’objectif — '+s.nom, prime, 'sponsor');
      argent('Commission prime sponsor — '+s.nom+' (15 %)', Math.round(prime*0.15), 'commission');
    }
  }
  return total;
}

/* ------------------------- 16. INTERACTIONS HUMAINES (GDD §20) */

/* 20.1 — Le manager s'adresse à son pilote. L'effet dépend du trait. */
const TONS = [
  {id:'feliciter', nom:'Féliciter',      desc:'Souligner ce qu’il a réussi.'},
  {id:'encourager',nom:'Encourager',     desc:'Le remettre en confiance sans en faire trop.'},
  {id:'recadrer',  nom:'Recadrer',       desc:'Hausser le ton, exiger davantage.'},
  {id:'rassurer',  nom:'Rassurer',       desc:'Dédramatiser, protéger la tête.'},
  {id:'ultimatum', nom:'Fixer un ultimatum',desc:'Mettre la pression, sans filet.'},
];
function parlerAuPilote(tonId, contexteBon){
  const p=S.pilote;
  const t = TONS.find(x=>x.id===tonId);
  let dm=0, dr=0, dagr=0, txt='';
  const fragile = p.traits.includes('fragile');
  const brulee  = p.traits.includes('tetebrulee');
  const merc    = p.traits.includes('mercenaire');
  const leader  = p.traits.includes('leader');

  switch(tonId){
    case 'feliciter':
      if(contexteBon){ dm=+12; dr=+4; txt='Il rayonne. Le message est passé au bon moment.'; }
      else { dm=+3; dr=-3; txt='Le féliciter après ça sonne faux : il ne vous croit pas vraiment.'; }
      if(contexteBon && merc){ dm=+7; dr=+1; txt='Il encaisse le compliment sans s’émouvoir. Ce qui l’intéresse, c’est le contrat.'; }
      break;
    case 'encourager':
      dm=+6; dr=+2; txt='Un mot juste, sans excès. Il repart plus léger.';
      if(fragile){ dm=+10; txt='Il avait besoin exactement de ça.'; }
      break;
    case 'recadrer':
      if(brulee){ dm=+7; dagr=+7; dr=+3; txt='Sursaut d’orgueil : il veut vous prouver quelque chose dès la prochaine course.'; }
      else if(fragile){ dm=-20; dr=-11; txt='Il se referme complètement. Vous venez de casser quelque chose.'; }
      else if(contexteBon){ dm=-9; dr=-6; txt='Le recadrer après une bonne course : il ne comprend pas.'; }
      else { dm=-3; dagr=+4; dr=-2; txt='Il encaisse, tête basse, et promet de faire mieux.'; }
      break;
    case 'rassurer':
      dm = contexteBon ? +2 : +9; dr=+3;
      txt = contexteBon ? 'Rien à rassurer aujourd’hui, mais l’intention est notée.' : 'Il souffle. La pression retombe.';
      if(fragile && !contexteBon){ dm=+14; dr=+5; txt='Vous venez d’éviter une spirale.'; }
      break;
    case 'ultimatum':
      if(brulee || leader){ dm=+10; dagr=+9; dr=-2; txt='Il prend le défi de plein fouet. Ça va attaquer.'; }
      else if(fragile){ dm=-26; dr=-18; txt='Rupture de confiance. Il doute désormais de vous autant que de lui.'; }
      else { dm=-6; dagr=+6; dr=-9; txt='Il accepte, mais la relation se refroidit nettement.'; }
      break;
  }
  p.moral = clamp(p.moral+dm,5,100);
  p.relation = clamp(p.relation+dr,0,100);
  p.agressivite = clamp(p.agressivite+dagr,10,99);
  return {txt, dm, dr, dagr, ton:t.nom};
}

/* 20.2 — Conférence de presse (GDD §20.2)
   Le barème d'effets reste celui du GDD — moral du pilote, relation avec
   l'écurie, image médiatique — mais chaque question a ses propres réponses,
   rédigées pour la situation. Une victoire n'appelle pas « reconnaître l'échec ». */
const PRESSE_EFFETS = {
  defendre:    {moral:+9,  ecurie:-7,  image:-5, relation:+4},
  admettre:    {moral:-8,  ecurie:+3,  image:+8, relation:-3},
  blamer:      {moral:+6,  ecurie:-16, image:+2, relation:+5},
  eluder:      {moral:0,   ecurie:0,   image:-1, relation:0},
  creditPilote:{moral:+11, ecurie:-5,  image:+1, relation:+5},
  creditEcurie:{moral:-4,  ecurie:+12, image:+4, relation:-2},
  ambition:    {moral:+7,  ecurie:-2,  image:+9, relation:+2, repPilote:+1.5},
  humilite:    {moral:+3,  ecurie:+6,  image:+5, relation:+1},
};

/* Chaque entrée : à quel type de résultat elle s'applique, la question, et 4 réponses.
   ctx = {nom, pos, cat, circuit, ecurie, coequipier, att, serie} */
const PRESSE_QUESTIONS = [
  /* ---------------------------------------------------------------- VICTOIRE */
  {id:'v1', cat:'victoire',
   q:c=>`Belle victoire à ${c.circuit}. Certains disent dans le paddock que c’est surtout la voiture. Vous répondez quoi ?`,
   reps:[

function categoriePresse(pos, dnf, att, grilleN){
  if(dnf) return 'abandon';
  if(pos===1) return 'victoire';
  if(pos<=3) return 'podium';
  if(pos > att+4) return 'deception';
  if(pointsPour(S.saison.catId, pos) > 0) return 'points';
  return 'neutre';
}

function genererQuestionPresse(pos, dnf, c){
  const p=S.pilote, sa=S.saison, att=positionAttendue();
  const cat = categoriePresse(pos, dnf, att, c.grille);
  const coequipier = (sa.grille.find(g=>g.ecurieId===sa.ecurieId)||{}).nom || 'son coéquipier';
  const ctx = {
    nom:p.nom, pos, cat:c.nom, circuit:sa.calendrier[sa.courseIndex].nom,
    ecurie:sa.ecurieNom, coequipier, att,
  };
  // On évite de reposer une question déjà servie récemment.
  sa.pressePosees = sa.pressePosees || [];
  let pool = PRESSE_QUESTIONS.filter(x=>x.cat===cat);
  const frais = pool.filter(x=>!sa.pressePosees.includes(x.id));
  if(frais.length) pool = frais;
  const q = pick(pool);
  sa.pressePosees.push(q.id);
  if(sa.pressePosees.length>8) sa.pressePosees.shift();
  return {qid:q.id, q:q.q(ctx), reps:q.reps, pos, dnf, repondu:false};
}

function repondrePresse(typeId){
  const w = S.weekend;
  if(!w || !w.presse) return null;
  const rep = w.presse.reps.find(r=>r.t===typeId);
  const e = PRESSE_EFFETS[typeId];
  if(!rep || !e) return null;
  const p=S.pilote;
  let dm=e.moral;
  if(p.traits.includes('fragile') && dm<0) dm*=1.6;
  if(p.traits.includes('medias')) dm = dm>0?dm*1.2:dm*0.8;
  p.moral = clamp(p.moral+dm,5,100);
  p.relation = clamp(p.relation + e.relation, 0, 100);
  p.reputation = clamp(p.reputation + (e.repPilote||0), 1, 100);
  S.manager.image = clamp(S.manager.image + e.image, 0, 100);
  if(S.contrat) S.contrat.relationEcurie = clamp((S.contrat.relationEcurie ?? 60) + e.ecurie, 0, 100);
  w.presse.repondu = rep.lab;
  // Une écurie vraiment vexée resserre la vis
  if(S.contrat && S.contrat.relationEcurie < 22 && Math.random()<0.4){
    msg('ecurie', S.contrat.ecurieNom, 'Mise au point',
      `Vos déclarations publiques passent mal. ${S.contrat.ecurieNom} vous rappelle que le contrat contient une clause de bonne conduite médiatique.`);
    S.contrat.relationEcurie = clamp(S.contrat.relationEcurie+8,0,100);
  }
  saveGame();
  return {...rep, ...e};
}

function peutEtreMessagePilote(pos, dnf){
  const p=S.pilote;
  let proba = 0.16;
  if(p.relation<45) proba += 0.14;
  if(p.moral<45) proba += 0.12;
  if(Math.random()>proba) return;
  let d;
  if(p.relation<35) d = DEMANDES_PILOTE.find(x=>x.id==='offre');
  else if(p.moral<45) d = pick(DEMANDES_PILOTE.filter(x=>x.id!=='offre'));
  else d = pick(DEMANDES_PILOTE.filter(x=>x.id!=='offre'));
  msg('pilote', p.nom, d.sujet, d.corps, {kind:'demandePilote', demandeId:d.id});
}
function repondreDemande(msgObj, choix){
  const p=S.pilote, d=DEMANDES_PILOTE.find(x=>x.id===msgObj.actions.demandeId);
  let txt='';
  if(d.id==='essais'){
    if(choix===0){
      const cout = Math.round(CAT[p.catId].cout*0.035);
      if(S.manager.budget<cout){ showToast('Trésorerie insuffisante'); return null; }
      argent('Journée d’essais privés', -cout, 'pilote');
      p.relation=clamp(p.relation+9,0,100); p.moral=clamp(p.moral+5,5,100);
      p.fatigue=clamp(p.fatigue+6,0,100);
      S.flags.bonusReglages = 12;
      txt=`Journée réservée pour ${fmtEurFull(cout)}. Il arrivera avec des repères sur le prochain circuit (+12 sur les réglages).`;
    }else{ p.relation=clamp(p.relation-7,0,100); txt='Il comprend, mais il n’est pas dupe : l’argent manque.'; }
  }
  if(d.id==='materiel'){
    if(choix===0){
      p.relation=clamp(p.relation+11,0,100);
      if(S.contrat) S.contrat.relationEcurie=clamp((S.contrat.relationEcurie??60)-12,0,100);
      txt='Vous montez au créneau. Le pilote apprécie, l’écurie beaucoup moins.';
    }else{ p.relation=clamp(p.relation-8,0,100); p.moral=clamp(p.moral-7,5,100); txt='Il se sent seul. Le message est reçu, mal.'; }
  }
  if(d.id==='confiance'){
    if(choix===0){ p.moral=clamp(p.moral+8,5,100); p.relation=clamp(p.relation+6,0,100); txt='Il repart apaisé.'; }
    else{ p.moral=clamp(p.moral+14,5,100); p.relation=clamp(p.relation+12,0,100); S.flags.promesseTransfert=S.annee;
          txt='Vous vous êtes engagé. S’il reste dans la même écurie l’an prochain, il ne l’oubliera pas.'; }
  }
  if(d.id==='offre'){
    if(choix===0){ p.relation=clamp(p.relation+14,0,100); txt='Il reste. Pour l’instant.'; }
    else{
      if(Math.random() < (1 - p.relation/100)*0.7){ perdrePilote(); return {txt:'Il a signé ailleurs.'}; }
      p.relation=clamp(p.relation+3,0,100); txt='Il décline l’offre… de justesse.';
    }
  }
  msgObj.actions=null; msgObj.reponse=txt;
  saveGame();
  return {txt};
}
function perdrePilote(){
  msg('pilote', S.pilote.nom, 'Fin de collaboration',

    `C’était le risque d’une relation laissée se dégrader. Il faut repartir sur un nouveau pilote.`);
  gagnerRep(-120,'départ du pilote');

  S.pilote=null; S.contrat=null; S.saison=null; S.weekend=null;
  S.sponsors.actifs=[]; S.sponsors.prospects=[];
  S.phase='scouting';
  genererScoutPool();
  saveGame();
}
