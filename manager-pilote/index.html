     <div class="note txt-muted mt">Attendre la fin de saison coûterait nettement moins cher.</div>`,
    `<button class="btn-ghost" data-act="fermerModal">Annuler</button>
     <button class="btn" data-act="confirmRompre">Mettre fin à la collaboration</button>`);
};
ACTIONS.confirmRompre = ()=>{
  const p = S.pilote; if(!p) return;
  const c = coutRupture();
  if(c.indem>0) argent('Indemnité de rupture — '+(S.contrat?S.contrat.ecurieNom:'écurie'), -c.indem, 'rupture');
  gagnerRep(-c.rep, 'rupture avec le pilote');
  perdrePilote('manager');
  closeModal(); saveGame();
  UI.tab = nbPilotes() ? 'bureau' : 'pilote';
  render();
  showToast('Collaboration terminée');
};
ACTIONS.mettreEnRetrait = ()=>{
  const p=S.pilote; if(!p) return;
  S.flags['retrait_'+p.id] = S.annee;
  p.moral = clamp(p.moral - 14, 5, 100);
  p.relation = clamp(p.relation - 10, 0, 100);
  msg('pilote', p.nom, 'Une année sans rouler',
    `« Tu me mets sur la touche pour ${S.annee} ? Je comprends que l’argent manque, `+
    `mais une saison blanche à mon âge, ça se rattrape mal. »`);
  saveGame(); render();
  showToast(p.nom+' ne courra pas cette saison');
};
/* Antennes régionales (GDD §5.2). Ouvrir coûte trois mois d'avance, comme un
   dépôt : sans cela on ouvrirait et fermerait au gré des intersaisons. */
/* Académie (GDD §22.2) */
ACTIONS.ouvrirAcademie = ()=>{
  if(academieOuverte()) return;
  if(S.manager.budget < ACADEMIE.achat){ showToast('Trésorerie insuffisante'); return; }
  argent('Ouverture de l’académie', -ACADEMIE.achat, 'structure');
  S.academie = {ouverte:true, eleves:[], candidats:null};
  msg('scout','Votre académie','L’académie est ouverte',
    `Vous pouvez désormais former vos propres pilotes, à partir de ${ACADEMIE.ageMin} ans.\n\n`+
    `C’est un investissement long : cinq à sept saisons avant qu’un élève ne sorte. `+
    `En échange, vous connaîtrez leur potentiel réel, sans estimation.`);
  saveGame(); render();
};
ACTIONS.recruterEleves = ()=>{
  if(!academieOuverte()) return;
  S.academie.candidats = candidatsAcademie();
  saveGame(); render();
};
ACTIONS.fermerCandidats = ()=>{ if(S.academie) S.academie.candidats=null; saveGame(); render(); };
ACTIONS.prendreEleve = d=>{
  if(!academieOuverte()) return;
  if(elevesAcademie().length >= placesAcademie()){ showToast('Académie complète'); return; }
  const c = (S.academie.candidats||[]).find(x=>x.id===d.id); if(!c) return;
  c.anneesFormation = 0;
  S.academie.eleves = elevesAcademie().concat([c]);
  S.academie.candidats = S.academie.candidats.filter(x=>x.id!==c.id);
  saveGame(); render();
  showToast(c.nom+' entre à l’académie');
};
ACTIONS.vendreEleve = d=>{
  const e = elevesAcademie().find(x=>x.id===d.id); if(!e) return;
  const prix = valeurEleve(e);
  argent('Vente d’un élève — '+e.nom, prix, 'commission');
  S.academie.eleves = elevesAcademie().filter(x=>x.id!==e.id);
  gagnerRep(Math.round(6 + notePlafond(e)/12), 'formation revendue');
  msg('finance','Votre académie','Transfert — '+e.nom,
    `${e.nom} rejoint une autre structure pour ${fmtEurFull(prix)}.\n\n`+
    `Former des pilotes en surplus et les revendre est une source de revenus à part entière.`);
  saveGame(); render();
  showToast(e.nom+' vendu — '+fmtEur(prix));
};
ACTIONS.acheterLocal = d=>{
  const l = LOCAL[d.l]; if(!l) return;
  const cout = coutAchatLocal(l.id);
  if(cout===null){ showToast('Déjà au niveau maximal'); return; }
  if(S.manager.budget < cout){ showToast('Trésorerie insuffisante'); return; }
  argent((niveauLocal(l.id)?'Agrandissement — ':'Acquisition — ')+l.nom, -cout, 'structure');
  if(!S.locaux) S.locaux = {};
  S.locaux[l.id] = niveauLocal(l.id)+1;
  msg('finance','Votre structure', l.nom+' — niveau '+S.locaux[l.id],
    `${l.effet}\n\nCharges mensuelles : ${fmtEurFull(S.locaux[l.id]*l.charges)}.`);
  saveGame(); render();
  showToast(l.nom+' — niveau '+S.locaux[l.id]);
};
ACTIONS.ouvrirAntenne = d=>{
  const r = REGION[d.r];
  if(!r || regionCouverte(r.id)) return;
  if(regionsCouvertes().length-1 >= antennesMax()){
    showToast('Votre structure ne peut pas suivre plus de '+antennesMax()+' antennes');
    return;
  }
  const avance = r.cout*3;
  if(S.manager.budget < avance){ showToast('Il faut '+fmtEur(avance)+' d’avance'); return; }
  argent('Ouverture d’une antenne — '+r.nom, -avance, 'scouting');
  S.scoutsRegion = (S.scoutsRegion||[]).concat([r.id]);
  msg('scout','Votre réseau','Antenne ouverte — '+r.nom,
    `Vous avez désormais un correspondant en ${r.nom}.\n\n${r.d}\n\n`+
    `Les jeunes de cette région apparaîtront dans votre vivier à la prochaine intersaison.`);
  saveGame(); render();
  showToast('Antenne ouverte : '+r.nom);
};
ACTIONS.fermerAntenne = d=>{
  const r = REGION[d.r];
  if(!r || r.id==='fr') return;
  S.scoutsRegion = (S.scoutsRegion||[]).filter(x=>x!==r.id);
  saveGame(); render();
  showToast('Antenne fermée : '+r.nom);
};
ACTIONS.passerSaisonBlanche = ()=>{
  passerAnneeSuivante();
  render(); showToast('Saison passée');
};
ACTIONS.annulerRetrait = ()=>{
  if(S.pilote) delete S.flags['retrait_'+S.pilote.id];
  saveGame(); render();
};
ACTIONS.lancerSaison = ()=>{
  demarrerSaison(S.contrat.catId, S.contrat.ecurieId);
  render(); showToast('Saison lancée');
};
ACTIONS.allerWeekend = ()=>{ avancerSemaine(); go('weekend'); };
ACTIONS.simRapide = ()=>{ simulationRapide(); go('weekend'); };

/* ------------------------------------------------- ÉCRAN : PILOTE */
function renderPilote(){
  if(!S.pilote || UI.viserVivier){ UI.viserVivier=false; renderScouting(); return; }
  const p=S.pilote, n=notePilote(p), plaf=notePlafond(p);
  const ePlaf = estimTexte(p, plaf, 'plafGlobal');
  let h='';
  const coulP = coulPilote();
  if(CAT[p.catId].format==='kart'){
    const e = ENTOURAGE[p.entourage||'discret'];
    const pat = p.patienceFamille===undefined ? 100 : p.patienceFamille;
    const apport = apportFamilial(p.catId, p);
    h += `<div class="card"><h2><span class="vig"><span>👨‍👩‍👦</span></span>Entourage<span class="hint">${escapeHtml(e.nom)}</span></h2>
      <div class="note mb">${escapeHtml(e.d)}</div>
      ${e.part>0.05 ? `<div class="note mb">Apport à la saison : environ
        <b class="txt-green">${fmtEur(apport)}</b> (${Math.round(e.part*100)} % du budget de la catégorie).</div>` : ''}
      ${e.exigence ? gline('Patience de la famille', pat, couleurMoral(pat)) : ''}
      ${e.exigence>=2 && pat<40 ? `<div class="note warn mt">Ils financent une part importante de la saison
        et n’en voient pas le retour. À bout de patience, ils peuvent confier le pilote à un autre manager.</div>` : ''}
      <div class="note txt-muted mt">L’apport familial ne vaut qu’en karting : au-delà, les budgets
        sont hors de portée d’une famille et le sponsoring prend le relais.</div>
    </div>`;
  }
  if(blesse(p)){
    h += `<div class="card accent"><h2><span class="vig"><span>🩹</span></span>Infirmerie</h2>
      <div class="note"><b class="txt-red">${escapeHtml(p.blessure.nom)}</b> — ${escapeHtml(p.blessure.txt)}</div>
      <div class="note mt">Indisponible pour <b>${p.blessure.manches}</b> manche(s)
        sur les ${p.blessure.total} d’arrêt initial.</div></div>`;
  }
  h += `<div class="card">
    <div class="ovr">
      <div class="portrait-box lg">${portraitPilote(p,{coul:coulP})}</div>
      ${noteBadge(n)}
      <div style="flex:1">
        <div style="font-family:var(--cond);font-size:23px;font-weight:700;line-height:1.05">${escapeHtml(p.nom)}</div>
        <div class="note">${p.age} ans · ${p.pays} · ${CAT[p.catId].nom}${S.contrat?' · '+escapeHtml(S.contrat.ecurieNom):''}</div>
        <div class="row tight mt">${p.traits.map(t=>tag(TRAITS[t].nom,TRAITS[t].coul)).join('')}</div>
      </div>
    </div>
    <div class="note txt-muted mt">Plafond <b>estimé</b> de la note globale : <b>${ePlaf}</b> — potentiel estimé « ${estimPotentiel(p)} ».
    Les repères clairs sur les barres situent le plafond estimé de chaque statistique : vous ne connaîtrez jamais sa vraie limite,
    seulement une fourchette qui se resserre avec un bon scout et les saisons passées ensemble.</div>
  </div>`;

  h += `<div class="card"><h2>Statistiques<span class="hint">Note = Pace×0,40 + Consistency×0,30 + Racecraft×0,30</span></h2>`;
  for(const g of STAT_GROUPES){
    const gv = noteGroupe(p,g.id);
    h += `<div class="grp"><div class="h"><b>${g.nom}</b><span>${Math.round(gv)}</span></div>
      ${g.stats.map(([k,nom])=>bar(nom,p.stats[k],estim(p,p.plafonds[k],'plaf'+k).c)).join('')}</div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>État du pilote</h2>
    ${gline('Moral', p.moral, couleurMoral(p.moral))}
    ${gline('Forme physique', p.forme, couleurMoral(p.forme))}
    ${gline('Fatigue', p.fatigue, p.fatigue>60?'red':p.fatigue>35?'amber':'green')}
    ${gline('Relation avec vous', p.relation, couleurMoral(p.relation))}
    ${S.mandat?`<div class="hr"></div>
      <div class="row" style="gap:14px;flex-wrap:wrap">
        <div><div class="small txt-muted">Votre commission</div>
          <div class="b">${Math.round(S.mandat.commission*100)} % <span class="txt-2 small">(course)</span></div></div>
        <div><div class="small txt-muted">Sponsors / titre</div>
          <div class="b txt-2">${Math.round(tauxCommission('sponsor')*100)} % · ${Math.round(tauxCommission('titre')*100)} %</div></div>
        <div><div class="small txt-muted">Mandat</div>
          <div class="b ${anneesMandatRestantes()<=1?'txt-amber':''}">${anneesMandatRestantes()} saison(s)</div></div>
        <div><div class="small txt-muted">Valeur estimée</div>
          <div class="b txt-green">${fmtEur(valeurMarchande(p))}</div></div>
      </div>
      ${anneesMandatRestantes()<=1?`<div class="note warn mt">Le mandat arrive à échéance : un concurrent
        peut le débaucher sans rien vous verser une fois qu’il aura expiré.</div>`:''}`:''}
    ${p.relation<RELATION_RUPTURE?`<div class="note warn mt">⚠ <b>Rupture imminente.</b>
      ${(p.rupture||0)>=2?'Il a déjà rencontré un autre manager. Une manche de plus dans cet état et il part.'
        :'Il ne se sent plus suivi. Encore '+(3-(p.rupture||0))+' manche(s) ainsi et il changera de manager.'}</div>`:''}
    <div class="row mt"><div class="spacer"></div>
      <button class="btn-ghost btn-sm" data-act="modalRompre">Mettre fin à la collaboration</button></div>
    ${gline('Réputation du pilote', p.reputation, 'blue')}
    ${gline('Agressivité', p.agressivite, p.agressivite>75?'red':'amber')}
    <div class="note txt-muted mt">Une agressivité élevée multiplie les dépassements… et les abandons.</div>
  </div>`;

  // superlicence
  const tot = totalSuperlicence();
  h += `<div class="card"><h2>Superlicence FIA<span class="hint">${SUPERLIC_REQUIS} points sur 3 ans</span></h2>
    ${gline('Points acquis', tot/SUPERLIC_REQUIS*100, tot>=SUPERLIC_REQUIS?'green':'amber', '%')}
    <div class="note mt"><b>${tot} / ${SUPERLIC_REQUIS} points</b> ${tot>=SUPERLIC_REQUIS?'— éligible à la Formule 1'+(p.age<18?' dès ses 18 ans':''):'— la F1 reste fermée'}.</div>
    ${p.superlicence.length?`<div class="tw mt"><table><thead><tr><th>Année</th><th>Catégorie</th><th>Classement</th><th class="num">Points</th></tr></thead><tbody>
      ${p.superlicence.slice().reverse().map(s=>`<tr><td>${s.annee}</td><td>${CAT[s.catId].court}</td><td>${ordinal(s.pos)}</td><td class="num">${s.pts}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="note txt-muted mt">Aucun point pour l’instant. Seuls la KZ, la F4, la F3 et la F2 en rapportent.</div>'}
  </div>`;

  // palmarès
  if(p.palmares.length){
    h += `<div class="card"><h2>Palmarès</h2><div class="tw"><table>
      <thead><tr><th>Saison</th><th>Catégorie</th><th>Écurie</th><th>Class.</th><th class="num">Pts</th><th class="num">V</th><th class="num">P</th></tr></thead><tbody>
      ${p.palmares.slice().reverse().map((x,i)=>{
        const hi=S.historique.filter(z=>z.annee===x.annee)[0]||{};
        return `<tr><td>${x.annee}</td><td>${CAT[x.catId].nom}</td><td>${escapeHtml(hi.ecurie||'—')}</td>
        <td><span class="pos p${x.pos<=3?x.pos:''}">${x.pos}</span></td><td class="num">${x.pts}</td>
        <td class="num">${x.victoires}</td><td class="num">${x.podiums}</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  }

  h += `<div class="card"><h2>Parcours</h2>${echelle(p.catId)}
    <div class="note txt-muted mt">Karting Mini → Cadet → Junior → Senior → KZ → F4 → F3 → F2 → F1</div></div>`;

  $('#v-pilote').innerHTML = h;
}

/* -------------------------- ÉCRAN : SCOUTING (pas encore de pilote) */
function renderScouting(){
  const rp=repPalier(S.manager.repPoints);
  const sc=staffNiv('scout');
  let h = `<div class="card accent"><h2>Repérage</h2>
    <div class="note mb">Votre réputation (« ${rp.nom} ») détermine qui accepte de vous rencontrer.
    ${sc? `Votre scout ${NIV_LABEL[sc].toLowerCase()} affine les estimations.` : `<b class="txt-amber">Vous n’avez aucun scout :</b> les estimations sont très larges.`}</div>
    <div class="note txt-muted">Vous ne verrez <b>jamais</b> la valeur exacte d’un jeune. Une observation supplémentaire (payante) resserre la fourchette.</div>
    ${!sc?`<button class="btn-ghost btn-sm mt" data-act="tab" data-tab="staff">Recruter un scout</button>`:''}
  </div>`;

  // Places disponibles (GDD §15) : le nombre de pilotes suivis dépend de la réputation.
  const places = placesPilotes(), pris = nbPilotes();
  h += `<div class="card"><h2><span class="vig"><span>👥</span></span>Votre écurie de management<span class="hint">${pris} / ${places} place(s)</span></h2>
    <div class="note">${pris>=places
      ? `Vous suivez déjà ${pris===1?'un pilote':pris+' pilotes'}, le maximum à votre réputation.
         ${places<5?`Le palier suivant en débloquera un de plus.`:''}`
      : `Il vous reste <b class="txt-amber">${places-pris} place${places-pris>1?'s':''}</b> : vous pouvez signer un pilote de plus.`}</div>
    ${pris && pris<places && (S.dossiers||[]).every((d,i)=>{
        const v=vueDossier(i); return !v || !v.pilote || CAT[v.pilote.catId].format==='kart'; })
      ? `<div class="note warn mt">Un pilote de karting ne rapporte presque aucune commission : sa saison se
          finance sur ses seuls sponsors, et c’est vous qui comblez le manque. Un second pilote en karting est
          un <b>investissement</b>, pas un revenu — il ne paiera qu’en atteignant la monoplace.</div>`
      : ''}
    <div class="note txt-muted mt">Réputation 1-3 : un pilote · 4-6 : deux · 7-8 : trois · 9-10 : cinq.</div>
  </div>`;

  for(const c of S.monde.scoutPool){
    const noteEst = estimTexte(c, notePilote(c), 'note');
    const pot = estimPotentiel(c);
    const coutObs = 400 + c.observe*700 + CAT[c.catId].niv*450;
    h += `<div class="card">
      <div class="row" style="align-items:flex-start">
        <div class="portrait-box">${portraitPilote(c)}</div>
        <div style="flex:1">
          <div style="font-family:var(--cond);font-size:19px;font-weight:700">${escapeHtml(c.nom)}</div>
          <div class="note">${c.age} ans · ${c.pays} · ${CAT[c.catId].nom}</div>
        </div>
        <div class="center">
          <div class="l small txt-muted">NOTE ESTIMÉE</div>
          <div style="font-family:var(--cond);font-size:24px;font-weight:700;color:var(--amber)">${noteEst}</div>
        </div>
      </div>
      ${c.convoite ? `<div class="note ${c.convoite>=2?'warn':''} mt">
        ${c.convoite>=2
          ? `<b class="txt-red">Très convoité</b> — ${c.convoite} managers le suivent. Il ne restera pas longtemps.`
          : `<b class="txt-amber">Convoité</b> — un autre manager s’y intéresse.`}</div>` : ''}
      <div class="hr"></div>
      <div class="row" style="gap:14px">
        <div><div class="small txt-muted">Potentiel estimé</div><div class="b">${pot}</div></div>
        <div><div class="small txt-muted">Observations</div><div class="b">${c.observe} · marge ±${round(marge(c),1)}</div></div>
      </div>
      <div class="row tight mt">${traitsRevele(c).map(t=>tag(TRAITS[t].nom,TRAITS[t].coul)).join('') || tag('Personnalité inconnue','t-grey')}
        ${(staffNiv('scout')>=2 || c.observe>=1)
          ? tag(ENTOURAGE[c.entourage||'discret'].nom, c.entourage==='envahissant'?'t-amber':'t-grey')
          : tag('Entourage inconnu','t-grey')}</div>
      <div class="mt">${STAT_GROUPES.map(g=>{
        const v = noteGroupe(c,g.id);
        return `<div class="stat-line"><span class="n">${g.nom}</span>
          <span class="bar"><i style="width:${clamp(v,0,99)}%;opacity:.55"></i></span>
          <span class="v" style="width:70px;flex:0 0 70px">${estimTexte(c,v,g.id)}</span></div>`;
      }).join('')}</div>
      <div class="row mt">
        <button class="btn-ghost btn-sm" data-act="observer" data-id="${c.id}">Observer — ${fmtEur(coutObs)}</button>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-act="signerPilote" data-id="${c.id}">Proposer un management</button>
      </div>
    </div>`;
  }
  // ---- renvoi vers l'onglet Transferts : le vivier et le débauchage sont deux
  // métiers différents, ils ne tiennent plus sur le même écran.
  const marche = marcheTransferts();
  if(marche.length){
    h += `<div class="card"><h2><span class="vig"><span>🔁</span></span>Marché des transferts
        <span class="hint">${marche.length} pilote(s) à portée</span></h2>
      <div class="note mb">Le vivier n’est pas le seul moyen de trouver un pilote : ceux qui courent déjà
        sont représentés par un concurrent, et peuvent être débauchés.</div>
      <button class="btn btn-block" data-act="tab" data-tab="transferts">Ouvrir le marché des transferts</button>
    </div>`;
  }

  h += `<div class="card flat"><div class="note txt-muted">Le vivier se renouvelle à chaque nouvelle saison, et s’élargit avec votre réputation.
    Vous n’êtes pas seul à le regarder : les managers concurrents signent aussi, et un jeune observé trop longtemps finit par partir.</div></div>`;
  $('#v-pilote').innerHTML = h;
}

/* ---------------------------------------- ÉCRAN : MARCHÉ DES TRANSFERTS
   Signalé en jouant : on ne savait pas ce qu'il fallait pour approcher un
   pilote. Les conditions existaient toutes dans le code — portée du nom,
   place libre, indemnité, intérêt du pilote — mais aucune n'était écrite.
   Cet écran les énonce, chiffrées et à jour, avant même de proposer quoi que
   ce soit (GDD §20.2). */
const MARCHE_AFFICHES = 12;
function ligneCondition(ok, titre, detail){
  return `<div class="row mt" style="align-items:flex-start">
    <b class="${ok?'txt-green':'txt-red'}" style="flex:0 0 20px;font-size:16px;line-height:1.3">${ok?'✓':'✗'}</b>
    <div style="flex:1"><b>${titre}</b><div class="note txt-muted">${detail}</div></div></div>`;
}

function renderTransferts(){
  const rp = repPalier(S.manager.repPoints).p;
  const nivMax = niveauMarche(rp);
  const suivant = prochainPalierMarche(rp);
  const catMax = catByNiv(nivMax);
  const tous = marcheTransferts(true);
  const dispo = tous.filter(x=>!x.horsPortee);
  const horsPortee = tous.filter(x=>x.horsPortee);
  const place = resteDeLaPlace();
  const parRep = pilotesMax(rp), parLoc = capaciteLocaux();
  const moinsCher = dispo.length
    ? Math.min(...dispo.map(x=>indemniteTransfert(x.eleve, x.eleve.catId, 2)))
    : null;

  let h = '';

  // ---- 1. Les conditions, énoncées
  h += `<div class="card accent"><h2><span class="vig"><span>📋</span></span>Approcher un pilote
      <span class="hint">4 conditions</span></h2>
    <div class="note mb">Débaucher le pilote d’un concurrent n’a rien d’automatique. Voici ce qu’il faut,
      et où vous en êtes aujourd’hui.</div>

    ${ligneCondition(place, 'Une place libre dans votre écurie',
      `Vous suivez ${nbPilotes()} pilote(s) sur ${placesPilotes()} possibles — `+
      `${parRep} autorisé(s) par votre réputation, ${parLoc} par vos locaux, c’est le plus petit qui compte.`+
      (place?'' : ` Libérez un dossier, montez d’un palier de réputation, ou agrandissez le bureau.`))}

    ${ligneCondition(!tous.length || dispo.length>0, 'Un nom qui porte jusqu’à lui',
      `Réputation ${rp}/10 : vous pouvez approcher les pilotes jusqu’à la <b>${escapeHtml(catMax?catMax.nom:'—')}</b>.`+
      (suivant ? ` À partir du palier ${suivant.rep}/10, vous atteindrez la ${escapeHtml((catByNiv(suivant.niv)||{}).nom||'catégorie supérieure')}.`
               : ` C’est la portée maximale : tout le plateau vous est ouvert.`)+
      ` ${dispo.length} pilote(s) à portée, ${horsPortee.length} encore hors d’atteinte.`)}

    ${ligneCondition(moinsCher===null || S.manager.budget>=moinsCher, 'De quoi indemniser son manager',
      moinsCher===null
        ? `Aucun pilote sur le marché pour l’instant.`
        : `L’indemnité va de ${fmtEur(moinsCher)} à `+
          `${fmtEur(Math.max(...dispo.map(x=>indemniteTransfert(x.eleve, x.eleve.catId, 2))))} selon le pilote. `+
          `Vous avez ${fmtEur(S.manager.budget)}. Elle n’est versée que s’il accepte.`)}

    ${ligneCondition(true, 'Et surtout : qu’il dise oui',
      `Trois choses le décident — la commission que vous lui prenez (moins vous prenez, plus il est tenté,
       mais moins il vous rapporte), votre réputation face à celle de son manager actuel, et à quel point
       il est bien là où il est. Ce dernier point ne joue jamais en votre faveur : au mieux il est neutre,
       au pire il le retient. Les deux vrais leviers sont donc votre taux et votre nom.
       Le détail chiffré est donné pilote par pilote ci-dessous.`)}

    <div class="note warn mt">Un refus coûte <b>8 points de réputation</b>, et le pilote devient plus
      difficile à convaincre ensuite. On n’approche pas au hasard.</div>
  </div>`;

  // ---- 2. Les pilotes à portée
  if(dispo.length){
    h += `<div class="card"><h2><span class="vig"><span>🔁</span></span>Pilotes approchables
        <span class="hint">${dispo.length}</span></h2>
      <div class="note mb">Classés par potentiel. Le pourcentage annoncé est sa chance d’accepter au
        taux le plus généreux pour lui (6 %) ; plus vous montez votre commission, plus elle baisse.</div>
      ${dispo.length>MARCHE_AFFICHES?`<div class="note txt-muted mb">${dispo.length-MARCHE_AFFICHES}
        autre(s) pilote(s) à votre portée ne sont pas listés ici : ils ont moins de potentiel que ceux-ci.</div>`:''}`;
    for(const {eleve, manager} of dispo.slice(0, MARCHE_AFFICHES)){
      const indem = indemniteTransfert(eleve, eleve.catId, 2);
      const d6  = detailInteret(eleve, manager, 0.06);
      const d15 = detailInteret(eleve, manager, 0.15);
      const payable = S.manager.budget >= indem;
      h += `<div class="slider-box">
        <div class="top"><b>${escapeHtml(eleve.nom)}</b><span>${CAT[eleve.catId].court} · ${eleve.age} ans</span></div>
        <div class="note">Sous mandat de <b>${escapeHtml(manager.nom)}</b> (réputation ${manager.rep}/10)</div>
        <div class="row tight mt">
          ${tag('Note '+Math.round(eleve.note),'t-blue')}
          ${tag('Plafond '+Math.round(eleve.plafond),'t-green')}
          ${tag('Indemnité '+fmtEur(indem), payable?'t-amber':'t-red')}
          ${tag('Il accepte à '+Math.round(d6.proba*100)+' %', d6.proba>0.5?'t-green':d6.proba>0.25?'t-amber':'t-red')}
          ${eleve.approches?tag(eleve.approches+' approche(s) déjà','t-grey'):''}
        </div>
        <details class="repli mt"><summary>Ce qui le décide</summary>
          ${ligneFacteur('Commission proposée', d6.gain,
            `À 6 % il gagne par rapport aux 10 % habituels ; à 15 % l’argument se retourne (${Math.round(d15.gain)}).`)}
          ${ligneFacteur('Votre réputation face à la sienne', d6.prestige,
            `Vous ${rp}/10 contre ${manager.rep}/10 pour ${escapeHtml(manager.nom)}.`)}
          ${ligneFacteur('Ce qu’il vit chez lui', d6.lassitude,
            `Estimé à ${Math.round(d6.relChezLui)}/100. ${d6.lassitude>-3
              ? 'Sa situation ne le retient pas particulièrement.'
              : d6.lassitude<-8
                ? 'Il est très bien où il est — manager réputé, belle catégorie. Difficile à sortir de là.'
                : 'Sa situation le retient un peu.'}`)}
          <div class="note mt">Total : <b>${Math.round(d6.interet)}</b> d’intérêt →
            <b class="${d6.proba>0.5?'txt-green':'txt-amber'}">${Math.round(d6.proba*100)} %</b> de chances à 6 %,
            <b>${Math.round(d15.proba*100)} %</b> à 15 %.</div>
        </details>
        <button class="btn btn-block mt" data-act="modalApprocher" data-id="${eleve.id}"
          ${(place && payable)?'':'disabled'}>${
            !place ? 'Aucune place libre'
            : !payable ? 'Il vous manque '+fmtEur(indem-S.manager.budget)
            : 'Approcher '+escapeHtml(eleve.nom)}</button>
      </div>`;
    }
    h += `</div>`;
  }else{
    h += `<div class="card"><h2><span class="vig"><span>🔁</span></span>Pilotes approchables</h2>
      <div class="empty">Aucun pilote à votre portée pour l’instant.</div>
      <div class="note txt-muted mt">Les managers concurrents signent au fil des saisons : le marché
        se remplit tout seul. Montez en réputation pour voir plus haut.</div></div>`;
  }

  // ---- 3. Ce que la réputation débloquera
  if(horsPortee.length){
    h += `<div class="card"><h2><span class="vig"><span>🔒</span></span>Hors de portée
        <span class="hint">${horsPortee.length}</span></h2>
      <div class="note mb">Ces pilotes existent, courent, et progressent. Votre nom ne porte simplement
        pas encore jusqu’à eux${suivant?` — il faudra le palier ${suivant.rep}/10`:''}.</div>
      ${horsPortee.slice(0,6).map(({eleve,manager})=>`<div class="row tight mt">
        <b class="txt-muted">${escapeHtml(eleve.nom)}</b>
        ${tag(CAT[eleve.catId].court,'t-grey')}
        <span class="note txt-muted">chez ${escapeHtml(manager.nom)}</span>
        <div class="spacer"></div>
        <span class="note txt-muted">plafond ${Math.round(eleve.plafond)}</span>
      </div>`).join('')}
    </div>`;
  }

  // ---- 4. L'autre sens : vos pilotes sont regardés aussi
  h += blocExposition();

  h += `<div class="card flat"><div class="note txt-muted">Le marché fonctionne dans les deux sens :
    ce que vous pouvez faire à un concurrent, il peut vous le faire.
    <button class="btn-ghost btn-sm mt" data-act="tab" data-tab="champ">Voir le classement des managers</button></div></div>`;

  $('#v-transferts').innerHTML = h;
}

/* Une ligne de facteur, signée : on voit tout de suite ce qui pousse et ce qui retient. */
function ligneFacteur(nom, valeur, detail){
  const v = Math.round(valeur);
  return `<div class="row tight mt">
    <b class="${v>0?'txt-green':v<0?'txt-red':'txt-muted'}" style="flex:0 0 46px">${v>0?'+':''}${v}</b>
    <div style="flex:1"><b class="small">${nom}</b><div class="note txt-muted">${detail}</div></div></div>`;
}

/* Vos pilotes vus depuis l'extérieur : ce qui les rend prenables. */
function blocExposition(){
  const mesPilotes = [];
  pourChaqueDossier(()=>{ if(S.pilote) mesPilotes.push({p:S.pilote, mandat:S.mandat}); });
  if(!mesPilotes.length) return '';
  return `<div class="card"><h2><span class="vig"><span>🛡️</span></span>Vos pilotes, vus d’en face
      <span class="hint">${mesPilotes.length}</span></h2>
    <div class="note mb">Un concurrent regarde exactement les mêmes choses que vous : la relation que
      vous entretenez, la commission que vous prenez, et si votre mandat court encore.</div>
    ${mesPilotes.map(({p,mandat})=>{
      const rel = p.relation ?? 60;
      const tx = mandat ? mandat.commission : COMMISSION_BASE;
      const reste = mandat ? (mandat.anneeFin - S.annee + 1) : 0;
      const risque = rel<35 || reste<=0 ? 'élevé' : rel<55 || reste<=1 ? 'réel' : 'faible';
      const cls = risque==='élevé' ? 't-red' : risque==='réel' ? 't-amber' : 't-green';
      return `<div class="slider-box">
        <div class="top"><b>${escapeHtml(p.nom)}</b><span>${CAT[p.catId].court} · ${p.age} ans</span></div>
        <div class="row tight mt">
          ${tag('Risque '+risque, cls)}
          ${tag('Relation '+Math.round(rel), rel>60?'t-green':rel>40?'t-amber':'t-red')}
          ${tag('Commission '+Math.round(tx*100)+' %','t-blue')}
          ${tag(reste>0?reste+' saison(s) de mandat':'mandat échu', reste>0?'t-grey':'t-red')}
        </div>
        <div class="note txt-muted mt">${
          reste<=0 ? `Mandat échu : un concurrent peut le prendre <b>sans rien vous verser</b>. Renégociez.`
          : rel<35 ? `La relation est mauvaise : il écoutera la première offre venue.`
          : rel<55 ? `La relation se distend. Parlez-lui, ou baissez votre commission.`
          : `Il est bien chez vous. Un concurrent devra payer cher pour le convaincre.`}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* Un élève formé par vous n'a plus de secret : le §22.2 supprime l'estimation
   floue pour eux, c'est la contrepartie de dix saisons d'investissement. */
function traitsRevele(c){
  if(c.formeParVous) return c.traits;
  const niv=staffNiv('scout');
  if(niv>=4 || c.observe>=3) return c.traits;
  if(niv>=2 || c.observe>=2) return c.traits.slice(0,2);
  if(niv>=1 || c.observe>=1) return c.traits.slice(0,1);
  return [];
}
ACTIONS.observer = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  const cout = 400 + c.observe*700 + CAT[c.catId].niv*450;
  if(S.manager.budget<cout){ showToast('Trésorerie insuffisante'); return; }
  argent('Observation — '+c.nom, -cout, 'scouting');
  c.observe++;
  const marg = round(marge(c),1);
  // Observer prend du temps, et pendant ce temps les autres managers avancent :
  // c'est l'arbitrage du §5.3 — affiner l'estimation ou sécuriser le pilote.
  const parti = !!mouvementsRivaux(0.72);
  const perdu = parti && !S.monde.scoutPool.some(x=>x.id===c.id);
  saveGame(); render();
  if(perdu) showToast(c.nom+' vous est passé sous le nez');
  else showToast('Fourchette resserrée : ±'+marg);
};
ACTIONS.signerPilote = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  const rp=repPalier(S.manager.repPoints).p;
  // Un jeune très prometteur ne signe pas avec n'importe qui
  const exigence = CAT[c.catId].niv*0.9 + (c.potId-1)*1.1;
  const proba = clamp(0.45 + (rp-exigence)*0.13, 0.08, 0.97);
  openModal('Proposer un management',
    `<div class="note mb">Vous proposez à <b>${escapeHtml(c.nom)}</b> (et à son entourage) de le représenter.</div>
     <div class="note mb">Votre réputation : <b>${rp}/10</b>. Chances estimées d’acceptation : <b>${Math.round(proba*100)} %</b>.</div>
     <div class="note txt-muted">Un refus ne coûte rien d’autre que du temps — mais un jeune approché trop tôt se souvient de vous.</div>`,
    `<button class="btn-ghost" data-act="fermerModal">Annuler</button>
     <button class="btn" data-act="confirmSignerPilote" data-id="${c.id}" data-proba="${proba}">Faire la proposition</button>`);
};
ACTIONS.confirmSignerPilote = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  if(Math.random() > +d.proba){
    c.refus=(c.refus||0)+1;
    closeModal(); render();
    showToast(c.nom+' décline votre proposition');
    return;
  }
  // Le nouveau pilote prend un dossier libre — celui d'un retraité, ou un
  // dossier neuf si la réputation ouvre une place de plus (GDD §15).
  const place = ouvrirPlace();
  if(place<0){ closeModal(); showToast('Plus de place : votre réputation n’en autorise pas davantage'); return; }
  c.role='joueur'; c.relation=58; c.moral=Math.max(c.moral,62);
  const commission = UI.commissionProposee || COMMISSION_BASE;
  syncDossier();
  S.actif = place;
  for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[place][k];
  S.pilote=c;
  S.contrat=null;
  S.mandat={anneeDebut:S.annee, anneeFin:S.annee+2, duree:3, commission, indemnite:0};
  S.sponsors={actifs:[],prospects:[],vus:[]};
  S.offres=null;
  syncDossier();
  S.monde.scoutPool = S.monde.scoutPool.filter(x=>x.id!==c.id);
  if(!S.monde.rivaux.length) creerRivaux();
  // Un pilote signé en pleine saison ne rembobine pas l'année en cours.
  if(S.phase==='scouting'){ S.phase='intersaison'; S.actions=6; }
  majSponsorsProspects();
  msg('pilote', c.nom, 'Ravi de travailler avec vous',
    `« Merci de croire en moi. Maintenant il faut trouver de quoi rouler. »\n\n`+
    `Prochaine étape : lui trouver un baquet (onglet Contrats) puis financer la saison (onglet Sponsors).`);
  closeModal(); saveGame(); go('bureau');
  showToast(c.nom+' rejoint votre écurie de management');
};
ACTIONS.fermerModal = ()=>closeModal();

/* ------------------------------------------------ ÉCRAN : MESSAGERIE */
const MSG_TAG = {sponsor:['Sponsor','t-green'], ecurie:['Écurie','t-red'], pilote:['Pilote','t-blue'],
  presse:['Presse','t-purple'], scout:['Scout','t-amber'], systeme:['Officiel','t-grey'], finance:['Finances','t-amber']};
function renderInbox(){
  let h = `<div class="row mb"><div class="sect-title" style="margin:0">Messagerie</div><div class="spacer"></div>
    <button class="btn-ghost btn-sm" data-act="toutLu">Tout marquer comme lu</button></div>`;
  if(!S.inbox.length) h += `<div class="card"><div class="empty">Aucun message.</div></div>`;
  for(const m of S.inbox){
    const t = MSG_TAG[m.type]||['Info','t-grey'];
    h += `<div class="msg ${m.lu?'':'unread'}" data-act="ouvrirMsg" data-id="${m.id}">
      <div class="top"><span class="fr">${escapeHtml(m.from)}</span>${tag(t[0],t[1])}<span class="spacer"></span><span>${escapeHtml(m.date)}</span></div>
      <div class="sj">${escapeHtml(m.sujet)}</div>
      ${m.ouvert?`<div class="bd">${m.corps}</div>
        ${m.reponse?`<div class="quote"><span class="who">Suite donnée</span>${escapeHtml(m.reponse)}</div>`:''}
        ${m.actions?renderMsgActions(m):''}`:''}
    </div>`;
  }
  $('#v-inbox').innerHTML = h;
}
function renderMsgActions(m){
  if(m.actions.kind==='demandePilote'){
    const d = DEMANDES_PILOTE.find(x=>x.id===m.actions.demandeId);
    return `<div class="msg-actions">`+d.options.map((o,i)=>
      `<button class="btn-ghost btn-sm" data-act="repDemande" data-id="${m.id}" data-i="${i}">${escapeHtml(o.lab)}</button>`).join('')+`</div>`;
  }
  if(m.actions.kind==='offreRivale'){
    const o = S.flags['offreEnCours_'+m.actions.pilId];
    if(!o) return '';
    return `<div class="msg-actions">
      <button class="btn-ghost btn-sm" data-act="repOffre" data-id="${m.id}" data-c="aligner">S’aligner sur ${Math.round(o.commission*100)} %</button>
      <button class="btn-ghost btn-sm" data-act="repOffre" data-id="${m.id}" data-c="prolonger">Le convaincre sans baisser</button>
      <button class="btn-ghost btn-sm" data-act="repOffre" data-id="${m.id}" data-c="refuser">Ne rien proposer</button>
    </div>`;
  }
  return '';
}
ACTIONS.repOffre = d=>{
  const m = S.inbox.find(x=>x.id===d.id); if(!m || !m.actions) return;
  const pilId = m.actions.pilId;
  // Se placer sur le bon dossier avant de répondre.
  if(S.dossiers) for(let i=0;i<S.dossiers.length;i++){
    const v = vueDossier(i);
    if(v && v.pilote && v.pilote.id===pilId){ activerDossier(i); break; }
  }
  const r = repondreOffreRivale(pilId, d.c);
  m.actions = null;
  m.reponse = r ? r.txt : 'La proposition n’est plus d’actualité.';
  saveGame(); render();
  if(r) showToast(r.txt.slice(0,60));
};
ACTIONS.ouvrirMsg = d=>{
  const m=S.inbox.find(x=>x.id===d.id); if(!m) return;
  m.lu=true; m.ouvert=!m.ouvert;
  saveGame();
  if(UI.tab!=='inbox'){ go('inbox'); } else render();
};
ACTIONS.toutLu = ()=>{ S.inbox.forEach(m=>m.lu=true); saveGame(); render(); };
ACTIONS.repDemande = d=>{
  const m=S.inbox.find(x=>x.id===d.id); if(!m||!m.actions) return;
  const r = repondreDemande(m, +d.i);
  if(r) showToast(r.txt.slice(0,80));
  render();
};

/* ------------------------------------------- ÉCRAN : WEEK-END */
function renderWeekend(){
  if(S.phase!=='weekend' || !S.weekend){
    $('#v-weekend').innerHTML = `<div class="card"><div class="empty">Aucun week-end de course en cours.<br>Lancez-le depuis le Bureau.</div></div>`;
    return;
  }
  const w=S.weekend, sa=S.saison, course=sa.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  const et = w.etape>=w.etapes.length ? 'debrief' : w.etapes[w.etape];
  let h='';

  const tc = traceCircuit(course.nom);
  h += `<div class="card">
    <div class="row"><div style="flex:1">
      <div class="sect-title" style="margin:0">${escapeHtml(course.nom)}</div>
      <div class="note">${course.pays} · circuit ${course.type.toLowerCase()} · manche ${w.courseIdx+1}/${sa.calendrier.length}
        ${tc.reel?tag((tc.km?tc.km+' km · ':'')+'tracé réel','t-grey'):''}</div>
    </div>
    <div class="center"><div style="font-size:26px">${meteo.ico}</div><div class="small txt-2">${meteo.nom}</div></div></div>
    <div class="circuit-map" style="color:${coulPilote()}">${circuitSvg(course.nom)}</div>
    <div class="strip mt">
      <div class="it">Voiture ici <b class="txt-blue">${Math.round(voitureEffective(course))}</b></div>
      <div class="sep"></div>
      ${w.etapes.map((e,i)=>`<div class="it">${i<w.etape?'✓':i===w.etape?'▶':'·'} <b class="${i===w.etape?'txt-red':''}">${ETAPE_NOM[e]}</b></div>`).join('<div class="sep"></div>')}
      <div class="sep"></div><div class="it">${w.etape>=w.etapes.length?'▶ <b class="txt-red">Débrief</b>':'· Débrief'}</div>
    </div>
  </div>`;

  const animant = w.animCourse && et==='debrief';
  if(animant){
    const photo = circuitPhotoPour(course.nom);
    h += photo ? sceneAnimationCourse(photo, w.animCourse.classement) : '';
  }
  if(animant && circuitPhotoPour(course.nom)){ /* la scène ci-dessus remplace le débrief pendant l'animation */ }
  else if(et==='libres')            h += vueEssaisLibres(course, meteo);
  else if(et==='essais')            h += vueEssais(course, meteo);
  else if(et==='qualifs')           h += vueQualifs(course);
  else if(et==='course')            h += vueCourse(course, meteo);
  else                              h += vueDebrief(course);

  $('#v-weekend').innerHTML = h;
  // brancher les sliders
  $$('input[data-setup]').forEach(inp=>{
    inp.oninput = e=>{
      S.weekend.setup[e.target.dataset.setup] = +e.target.value;
      const lab = e.target.closest('.setup-row').querySelector('.lab span');
      if(lab) lab.textContent = e.target.value;
    };
    inp.onchange = ()=>saveGame();
  });
  if(animant) demarrerBoucleAnimation();
}

/* Le « meilleur » run est le meilleur selon ce que le stand croit savoir.
   Sans ingénieur, ce jugement est celui du pilote — et il peut se tromper. */
function meilleurRun(){
  const w=S.weekend;
  if(!w || !w.runs.length) return null;
  return w.runs.reduce((b,r)=> !b || (r.percu??r.score)>(b.percu??b.score) ? r : b, null);
}
function memeSetup(a,b){
  return setupParams(S.saison.catId).every(p=>(a[p.k]??10)===(b[p.k]??10));
}
/* Bandeau proposant de revenir au meilleur réglage trouvé pendant les essais.
   Affiché aussi avant les qualifs et avant la course : c'est là qu'on en a besoin. */
function rappelMeilleurReglage(course){
  const w=S.weekend, best=meilleurRun();
  if(!best) return '';
  const dejaDessus = memeSetup(w.setup, best.setup);
  const niv = staffNiv('ingenieur');
  const runMonte = w.runs.find(r=>memeSetup(w.setup, r.setup));
  const aff = afficheScore(best.percu??best.score, best.nivIng, best.att);
  const affMonte = runMonte ? afficheScore(runMonte.percu??runMonte.score, runMonte.nivIng, runMonte.att) : null;
  return `<div class="card ${dejaDessus?'flat':'accent'}">
    <h2>Réglage retenu<span class="hint">${w.runs.length} run(s) fait(s)</span></h2>
    <div class="row" style="align-items:center">
      <div style="flex:1">
        <div class="note">Sur la voiture : ${runMonte
          ? `réglage du run ${runMonte.n} — <b class="${affMonte.cls==='t-green'?'txt-green':affMonte.cls==='t-amber'?'txt-amber':'txt-red'}">${affMonte.txt}</b>`
          : `<span class="txt-muted">un réglage jamais essayé en piste</span>`}</div>
        <div class="note txt-muted">${niv>=3?'Meilleur':'Le mieux ressenti'} en essais : <b>${aff.txt}</b> (run ${best.n})</div>
      </div>
      ${dejaDessus
        ? tag(niv>=3?'C’est le meilleur':'C’est celui-là','t-green')
        : `<button class="btn btn-sm" data-act="reprendreReglage" data-n="${best.n}">Reprendre ${niv>=3?'le meilleur':'celui-là'}</button>`}
    </div>
    ${niv<3?`<div class="note txt-muted mt">Sans ingénieur confirmé, personne ne mesure vraiment le réglage :
      ce classement est le ressenti du pilote, et il peut se tromper.</div>`:''}
  </div>`;
}

/* Écran des essais libres : un choix, quatre programmes, aucune marche arrière.
   On y affiche ce que la séance change concrètement pour la suite (GDD §12). */
function vueEssaisLibres(course, meteo){
  const w=S.weekend, p=S.pilote;
  let h = `<div class="card"><h2><span class="vig"><span>🏁</span></span>Essais libres
      <span class="hint">${w.runsRestants} run(s) prévus ensuite</span></h2>
    <div class="note mb">Une seule séance, un seul programme. Ce que vous en faites vaut pour
    tout le reste du week-end — vous ne pourrez pas revenir dessus.</div>
    <div class="note txt-muted mb">${escapeHtml(course.nom)} · circuit ${course.type.toLowerCase()} ·
      ${meteo.nom.toLowerCase()} · ${p.nom} : forme ${Math.round(p.forme)}, fatigue ${Math.round(p.fatigue)}.</div>`;

  const conseil = conseilEL();
  for(const prog of PROGRAMMES_EL){
    const vise = conseil && conseil.id===prog.id;
    h += `<div class="grp">
      <div class="h"><b>${prog.ico} ${escapeHtml(prog.nom)}</b>${vise?tag('conseillé','t-green'):''}</div>
      <div class="note txt-muted">${escapeHtml(prog.desc)}</div>
      <div class="note"><b class="txt-amber">${escapeHtml(prog.effet)}</b></div>
      <div class="note txt-muted small">${vise?'Conseillé ici : '+escapeHtml(conseil.raison)+'.':'Utile : '+escapeHtml(prog.pour)}</div>
      <button class="${vise?'btn':'btn-ghost'} btn-block mt" data-act="programmeEL" data-id="${prog.id}">Lancer cette séance</button>
    </div>`;
  }
  h += `</div>`;
  return h;
}

function vueEssais(course, meteo){
  const w=S.weekend, params=setupParams(S.saison.catId);
  const sc = scoreReglages(course, w.setup, S.pilote).score;
  const ing = staffNiv('ingenieur');
  const best = meilleurRun();
  const prog = progEL();
  let h = `<div class="card"><h2>Réglages<span class="hint">${w.runsRestants} run(s) restant(s)</span></h2>
    ${prog?`<div class="note mb">Essais libres : <b>${prog.ico} ${escapeHtml(prog.nom)}</b> — ${escapeHtml(prog.effet)}</div>`:''}
    <div class="note mb">Chaque circuit a un réglage optimal <b>caché</b>, décalé par les préférences du pilote.
    Vous le cherchez par essais successifs — et vous repartez de zéro au circuit suivant.</div>
    ${params.map(p=>`<div class="setup-row">
      <div class="lab"><b>${p.n}</b><span>${w.setup[p.k]}</span></div>
      <input type="range" min="1" max="20" step="1" value="${w.setup[p.k]}" data-setup="${p.k}">
    </div>`).join('')}
    <div class="row mt">
      <button class="btn" style="flex:1" data-act="faireRun" ${w.runsRestants<=0?'disabled':''}>Envoyer en piste</button>
      <button class="btn-ghost" data-act="etapeSuivante">Passer à « ${ETAPE_NOM[w.etapes[w.etape+1]]} »</button>
    </div>
    ${w.runsRestants<=0?`<div class="note warn mt">Plus de temps de piste. Vous pouvez encore ajuster les curseurs
      ou reprendre un réglage déjà essayé — mais vous ne saurez pas ce que ça donne avant la course.</div>`:''}
  </div>`;

  h += rappelMeilleurReglage(course);

  if(w.runs.length){
    h += `<div class="card"><h2>Retour du pilote<span class="hint">${ing?NIV_LABEL[ing]+' à l’ingénierie':'Aucun ingénieur'}</span></h2>`;
    w.runs.forEach((r,i)=>{
      const estBest = best && r.n===best.n;
      const monte = memeSetup(w.setup, r.setup);
      h += `<div class="${i?'mt2':''}">
        <div class="row tight">
          <b class="small">Run ${r.n}</b>
          ${(()=>{const a=afficheScore(r.percu??r.score, r.nivIng, r.att);return tag(a.txt,a.cls);})()}
          ${estBest?tag(staffNiv('ingenieur')>=3?'meilleur':'le mieux ressenti','t-amber'):''}
          <div class="spacer"></div>
          ${monte
            ? `<span class="small txt-muted">monté sur la voiture</span>`
            : `<button class="btn-ghost btn-xs" data-act="reprendreReglage" data-n="${r.n}">Reprendre</button>`}
        </div>
        ${r.lignes.map(l=>`<div class="quote"><span class="who">${escapeHtml(S.pilote.nom)}</span>${escapeHtml(l)}</div>`).join('')}
        <div class="note txt-muted">${escapeHtml(r.ing)}</div>
      </div>`;
    });
    h += `</div>`;
  }else{
    h += `<div class="card flat"><div class="note">Envoyez le pilote en piste pour obtenir ses sensations.
      Sans ingénieur de course, il décrira ce qu’il ressent sans que personne ne traduise ça en réglage —
      à vous de faire le lien.</div></div>`;
  }

  h += `<div class="card flat">
    <h2>Traduire ce que dit le pilote<span class="hint">aide-mémoire</span></h2>
    <div class="note mb">Ce tableau ne change jamais : c’est le métier. Ce qui reste caché, c’est
    <b>à quelle valeur</b> le circuit et le pilote sont bons.</div>
    <div class="tw"><table><thead><tr><th>Il se plaint de…</th><th>Paramètre</th><th>Correction</th></tr></thead><tbody>
    ${params.map(pm=>`
      <tr><td class="wrap">${escapeHtml(pm.lo)}</td><td>${pm.n}</td><td class="txt-green">${escapeHtml(pm.loFix)}</td></tr>
      <tr><td class="wrap">${escapeHtml(pm.hi)}</td><td>${pm.n}</td><td class="txt-blue">${escapeHtml(pm.hiFix)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note txt-muted mt">${staffNiv('ingenieur')>=5
      ? `Votre ingénieur expert mesure le réglage actuel à <b>${Math.round(sc)}/100</b>.`
      : `La qualité d’un réglage ne se mesure qu’en piste, et seul un ingénieur expert la chiffre exactement.`}
      Cette variable pèse 15 % de la performance en course.</div>
  </div>`;
  return h;
}

function vueQualifs(course){
  const w=S.weekend;
  if(!w.grille){
    return `<div class="card accent"><h2>Qualifications</h2>
      <div class="note mb">Un tour lancé, sans trafic, avec les réglages trouvés en essais. La grille de départ compte beaucoup — surtout sur un circuit ${course.type.toLowerCase()}.</div>
      <button class="btn btn-cta btn-block" data-act="etapeSuivante">Lancer les qualifications</button></div>`;
  }
  const moi = w.grille.find(g=>g.id===S.pilote.id);
  let h = rappelMeilleurReglage(course);
  h += `<div class="card"><h2>Grille de départ<span class="hint">${ordinal(moi.pos)} sur ${w.grille.length}</span></h2>
    <div class="tw"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th></tr></thead><tbody>
    ${w.grille.slice(0,14).map(g=>`<tr class="${g.moi?'me':''}"><td><span class="pos p${g.pos<=3?g.pos:''}">${g.pos}</span></td>
      <td>${escapeHtml(g.nom)}</td><td class="txt-2">${escapeHtml(g.ecurie)}</td></tr>`).join('')}
    ${moi.pos>14?`<tr class="me"><td><span class="pos">${moi.pos}</span></td><td>${escapeHtml(moi.nom)}</td><td class="txt-2">${escapeHtml(moi.ecurie)}</td></tr>`:''}
    </tbody></table></div>
    <button class="btn btn-cta btn-block mt" data-act="etapeSuivante">Aller à la course</button></div>`;
  return h;
}

function vueCourse(course, meteo){
  const w=S.weekend;
  const moi = w.grille ? w.grille.find(g=>g.id===S.pilote.id) : null;
  const kart = CAT[S.saison.catId].format==='kart';

  // Course en cours, arrêtée sur un choix de mi-course (GDD §12)
  if(w.evenement){
    return `<div class="card accent">
      <h2>${escapeHtml(w.evenement.titre)}<span class="hint">à mi-course</span></h2>
      <div class="quote"><span class="who">Muret des stands</span>${escapeHtml(w.evenement.texte)}</div>
      ${w.evenement.choix.map(c=>`<button class="choice" data-act="choixCourse" data-i="${c.i}">
        <b>${escapeHtml(c.lab)}</b><small>${escapeHtml(c.d)}</small></button>`).join('')}
      <div class="note txt-muted">Il faut trancher maintenant : la seconde moitié de course en dépend.</div>
    </div>`;
  }

  let h = rappelMeilleurReglage(course);
  h += `<div class="card"><h2>Stratégie de course</h2>
    <div class="note mb">Départ ${moi?`en ${ordinal(moi.pos)} position`:''} · ${meteo.nom.toLowerCase()}.
    ${kart?'En karting, pas d’arrêt : tout se joue sur la gestion des pneus et l’agressivité.':'Une stratégie agressive gagne du temps mais use le matériel et augmente le risque d’abandon.'}</div>
    <div class="pills mb">${STRATS.map(s=>`<button class="pill ${w.strat===s.id?'on':''}" data-act="setStrat" data-id="${s.id}">${s.nom}</button>`).join('')}</div>
    <div class="note">${escapeHtml(STRATS.find(s=>s.id===w.strat).desc)}</div>
    <button class="btn btn-cta btn-block mt" data-act="lancerCourse">Départ</button>
  </div>`;
  return h;
}

function vueDebrief(course){
  const w=S.weekend, r=w.resultat, sa=S.saison;
  if(!r) return `<div class="card"><div class="empty">—</div></div>`;
  const moi = r.classement.find(x=>x.moi);
  let h = '';
  if(!moi.abandon && moi.pos<=3){
    const top3 = r.classement.filter(x=>!x.abandon).slice(0,3).map(x=>x.nom);
    h += `<div class="card podium-carte anim-entree">
      <h2>${moi.pos===1?'Victoire':'Podium'} — ${escapeHtml(course.nom)}<span class="hint">${ordinal(moi.pos)} place</span></h2>
      ${scenePodium(moi.pos, top3)}
    </div>`;

function renderSponsors(){
  if(!S.pilote){ $('#v-sponsors').innerHTML=`<div class="card"><div class="empty">Trouvez d’abord un pilote.</div></div>`; return; }
  const libres = slotsLibres(), rp=repPalier(S.manager.repPoints).p;
  const totalActif = sum(S.sponsors.actifs, s=>s.montant);
  let h='';

  h += `<div class="kpis">
    ${kpi('Emplacements', S.sponsors.actifs.length+' / '+slotsSponsors(), CAT[S.pilote.catId].court, libres?'':'amber')}
    ${kpi('Budget sponsors', fmtEur(totalActif), 'par saison', totalActif?'green':'')}
    ${kpi('Actions', S.actions, 'cette semaine', S.actions?'':'red')}
    ${S.saison?kpi('Coût saison', fmtEur(S.saison.coutTotal), CAT[S.saison.catId].nom,''):kpi('Coût saison','—','hors saison','')}
  </div>`;

  h += `<div class="card flat"><div class="note">
    <b>L’argent des sponsors ne va pas dans votre poche.</b> Il alimente la caisse de saison qui paie engagements,
    pneus et transport. Vous touchez <b>15 % de commission</b> à la signature. C’est votre vrai métier :
    sans sponsors, la saison ne se court pas.</div></div>`;

  // actifs
  h += `<div class="card"><h2>Partenaires actifs</h2>`;
  if(!S.sponsors.actifs.length) h += `<div class="empty">Aucun sponsor. Le pilote roule à crédit — le vôtre.</div>`;
  for(const s of S.sponsors.actifs){
    h += `<div class="offer">
      <div class="oh"><b>${escapeHtml(s.nom)}</b>${tag(SPONSOR_NIVEAUX[s.niv-1].lab,'t-green')}<div class="spacer"></div>
        <span class="num" style="font-size:17px">${fmtEur(s.montant)}</span></div>
      <div class="note">Secteur : ${escapeHtml(s.secteur)} · contrat ${s.duree} an(s) restant(s)
        ${s.objectifPos?` · prime conditionnelle (${Math.round(s.partConditionnelle*100)} %) si ${ordinal(s.objectifPos)} au championnat`:''}</div>
      <div class="row tight mt">${s.obligations.map(o=>tag(OBLIGATIONS.find(x=>x.id===o).lab,'t-grey')).join('')}</div>
    </div>`;
  }
  h += `</div>`;

  // prospects
  h += `<div class="card"><h2>Sponsors à démarcher<span class="hint">réputation ${rp}/10</span></h2>`;
  if(!S.sponsors.prospects.length) h += `<div class="empty">Aucune piste. Faites grimper votre réputation.</div>`;
  for(const s of S.sponsors.prospects){
    const N=SPONSOR_NIVEAUX[s.niv-1];

    const conflit = secteursOccupes().includes(s.secteur);
    h += `<div class="offer ${pr>0.6?'best':''}">
      <div class="oh"><b>${escapeHtml(s.nom)}</b>${tag(N.lab, s.niv>=4?'t-purple':s.niv>=3?'t-blue':'t-grey')}
        <div class="spacer"></div><span class="num" style="font-size:17px">${fmtEur(s.montant)}</span></div>
      <div class="omat">
        <div><div class="l">Intérêt</div><div class="v ${pr>0.6?'txt-green':pr>0.3?'txt-amber':'txt-red'}">${Math.round(pr*100)} %</div></div>
        <div><div class="l">Secteur</div><div class="v" style="font-size:12px">${escapeHtml(s.secteur)}</div></div>
        <div><div class="l">Durée</div><div class="v">${s.duree} an</div></div>
        <div><div class="l">Dossier</div><div class="v">${fmtEur(N.coutDemarche)}</div></div>
      </div>
      <div class="note">Attend un manager de palier ≥ ${s.exigeRepManager} et un pilote d’au moins ${s.exigeRepPilote} de réputation.</div>
      <div class="row tight mt">${s.obligations.map(o=>tag(OBLIGATIONS.find(x=>x.id===o).lab,'t-grey')).join('')}</div>
      ${conflit?`<div class="note warn mt">⚠ Conflit de secteur avec un partenaire déjà en place — signature impossible.</div>`:''}
      ${s.approches?`<div class="note txt-muted mt">${s.approches} approche(s) déjà effectuée(s).</div>`:''}
      <div class="row mt">
        <div class="spacer"></div>
        <button class="btn btn-sm" data-act="demarcher" data-id="${s.id}"
          ${(S.actions<=0||S.manager.budget<N.coutDemarche||conflit||libres<=0)?'disabled':''}>Démarcher</button>
      </div>
    </div>`;
  }
  h += `</div>`;
  $('#v-sponsors').innerHTML = h;
}
ACTIONS.demarcher = d=>{
  const s=S.sponsors.prospects.find(x=>x.id===d.id);
  const issue = demarcher(d.id);
  if(!issue){ render(); return; }
  let body='', foot='';
  if(issue.type==='accepte'){
    body = `<div class="quote"><span class="who">${escapeHtml(s.nom)}</span>Nous acceptons votre dossier. Nous nous engageons sur la saison au montant proposé.</div>
      <div class="note">Montant : <b>${fmtEurFull(issue.montant)}</b> · votre commission : <b>${fmtEurFull(Math.round(issue.montant*0.15))}</b>.</div>`;
    foot = `<button class="btn-ghost" data-act="fermerModal">Décliner</button>
            <button class="btn" data-act="signSponsor" data-id="${s.id}" data-m="${issue.montant}">Signer</button>`;
  }else if(issue.type==='contre'){
    body = `<div class="quote"><span class="who">${escapeHtml(s.nom)}</span>Le projet nous intéresse, mais pas à ce prix. Voici ce que nous pouvons mettre.</div>
      <div class="note">Contre-proposition : <b>${fmtEurFull(issue.montant)}</b> au lieu de ${fmtEurFull(s.montant)}.</div>
      <div class="note txt-muted mt">Vous pouvez accepter, ou relancer plus tard avec de meilleurs résultats.</div>`;
    foot = `<button class="btn-ghost" data-act="fermerModal">Refuser</button>
            <button class="btn" data-act="signSponsor" data-id="${s.id}" data-m="${issue.montant}">Accepter</button>`;
  }else if(issue.type==='definitif'){
    S.sponsors.prospects = S.sponsors.prospects.filter(x=>x.id!==s.id);
    body = `<div class="quote"><span class="who">${escapeHtml(s.nom)}</span>Nous vous avons déjà répondu. Le dossier est clos pour cette saison.</div>`;
    foot = `<button class="btn" data-act="fermerModal">Fermer</button>`;
  }else{
    body = `<div class="quote"><span class="who">${escapeHtml(s.nom)}</span>${escapeHtml(raisonRefus(s))}</div>
      <div class="note txt-muted">Le dossier reste ouvert. Revenez avec de meilleurs résultats, une meilleure image, ou un attaché de presse.</div>`;
    foot = `<button class="btn" data-act="fermerModal">Fermer</button>`;
  }
  openModal('Démarchage — '+s.nom, body, foot);
  render();
};
function raisonRefus(s){
  const rp=repPalier(S.manager.repPoints).p, p=S.pilote;
  if(rp < s.exigeRepManager) return 'Nous ne vous connaissons pas assez. Revenez quand votre nom circulera davantage.';
  if(p.reputation < s.exigeRepPilote) return 'Votre pilote n’a pas encore l’exposition que nous recherchons.';
  if(S.manager.image < 35) return 'Votre communication n’est pas assez soignée pour associer notre marque.';
  return 'Ce n’est pas le bon moment pour nous. Le budget marketing est déjà engagé ailleurs.';
}

/* Encart règlement, réutilisé partout où une décision en dépend : choix du
   baquet, répartition de la R&D, tableau de bord (GDD §11). */
function carteReglement(dom, plate, r, titre){
  // Une saison en cours tourne sous SON règlement, figé à l'engagement : afficher
  // celui du monde pendant qu'elle court induirait le joueur en erreur.
  r = r || reglMondeDom(dom);
  return `<div class="card ${plate?'flat':''}">
    <div class="small txt-muted b" style="text-transform:uppercase;letter-spacing:.05em">${titre || ('Règlement '+S.annee+' — '+DOM_NOM[dom])}</div>
    <div class="note mt"><b class="txt-amber">${r.ico} ${escapeHtml(r.nom)}</b> — ${escapeHtml(r.resume)}</div>
    <div class="note txt-muted mt">${escapeHtml(r.effet)}</div>
    ${r.id!=='stable'?`<div class="note txt-muted"><em>${escapeHtml(r.conseil)}</em></div>`:''}
  </div>`;
}

/* ---------------------- OFFRES : comparaison + négociation (GDD §9.2/9.4) */
ACTIONS.ouvrirOffres = ()=>{
  if(!S.offres || !S.offres.length) S.offres = genererOffres();
  saveGame();
  afficherOffres();
};
/* GDD §8.2, condition 2 : le budget de la saison suivante doit être sécurisé.
   Les sponsors sous contrat le sécurisent ; la trésorerie du manager ne fait que
   combler un manque, et cela se voit. */
function etatBudgetOffre(o){
  if(o.apport<=0) return '';
  const secure = budgetSecurise();
  const manque = Math.max(0, o.apport - secure);
  if(manque<=0){
    return `<div class="note txt-green mt">✓ Budget sécurisé : ${fmtEur(secure)} de sponsors sous contrat couvrent l’apport.</div>`;
  }
  const couvrable = S.manager.budget >= manque;
  return `<div class="note ${couvrable?'warn':'txt-red'} mt">
    ${couvrable?'⚠':'✗'} Budget non sécurisé : ${fmtEur(secure)} de sponsors pour ${fmtEur(o.apport)} d’apport,
    il manque <b>${fmtEur(manque)}</b>.<br>
    ${couvrable
      ? `Vous pouvez vous porter garant sur votre trésorerie (${fmtEur(S.manager.budget)}), mais elle y passera.`
      : `Votre trésorerie (${fmtEur(S.manager.budget)}) ne comble pas le manque. Trouvez des sponsors avant de signer.`}
  </div>`;
}
function boutonSignature(o){
  if(o.apport<=0) return `<button class="btn btn-sm" data-act="accepterOffre" data-id="${o.id}">Accepter</button>`;
  const manque = Math.max(0, o.apport - budgetSecurise());
  if(manque<=0) return `<button class="btn btn-sm" data-act="accepterOffre" data-id="${o.id}">Accepter</button>`;
  if(S.manager.budget >= manque)
    return `<button class="btn-warn btn-sm" data-act="accepterOffre" data-id="${o.id}">Signer et se porter garant</button>`;
  return `<button class="btn btn-sm" disabled>Budget insuffisant</button>`;
}

    const descend = cs.niv < CAT[S.pilote.catId].niv;
    openModal('Marché des baquets',
      `<div class="note mb">Aucune écurie ne se manifeste. Le résultat sportif, votre réputation ou le budget disponible ne suffisent pas.</div>
       <div class="note mb">Il reste un baquet chez l’écurie la plus modeste de <b>${cs.nom}</b>
       (apport ${fmtEur(Math.round(coutEngagement(cs.id)*0.65))}, l’écurie prend 35 % à sa charge)${descend
         ? ` — soit une descente d’${CAT[S.pilote.catId].niv-cs.niv===1?'une catégorie':'échelon'}, le temps de reconstruire.`
         : `, dans la même catégorie.`}</div>
       <div class="note txt-muted">Le GDD le prévoit : on redescend quand le budget ne suit pas. Ce n’est pas une fin de partie.</div>
       ${carteReglement(domaineRegl(cs.id), true)}`,
      `<button class="btn-ghost" data-act="fermerModal">Fermer</button>
       <button class="btn" data-act="baquetSecours">Prendre ce baquet</button>`);
    return;
  }
  const doms = [...new Set(list.map(o=>domaineRegl(o.catId)))];
  const body = `<div class="note mb">Comparez au-delà du seul salaire : la vitesse de progression et le risque de renvoi comptent autant.</div>`
   + doms.map(d=>carteReglement(d, true)).join('')
   + list.map(o=>{
      const c=CAT[o.catId];
      const progr = o.junior?'Élevée' : c.niv>CAT[S.pilote.catId].niv?'Très élevée':'Moyenne';
      return `<div class="offer">
        <div class="oh"><b>${escapeHtml(o.ecurieNom)}</b>${tag(c.court, c.niv>CAT[S.pilote.catId].niv?'t-green':'t-grey')}
        ${o.junior?tag('Programme jeunes','t-purple'):''}<div class="spacer"></div></div>
        <div class="omat">
          <div><div class="l">Salaire</div><div class="v">${o.salaire?fmtEur(o.salaire):'—'}</div></div>
          <div><div class="l">Progression</div><div class="v" style="font-size:12.5px">${progr}</div></div>
          <div><div class="l">Risque renvoi</div><div class="v ${o.risque>55?'txt-red':o.risque>30?'txt-amber':'txt-green'}">${o.risque} %</div></div>
          <div><div class="l">Prestige</div><div class="v">${o.prestige}</div></div>
        </div>
        <div class="note">${escapeHtml(o.progression)} · voiture ${o.voiture}/100 · objectif ${ordinal(o.objectifPos)} · ${o.duree} an(s)</div>
        <div class="note mt">${o.apport>0
          ? `Apport à financer : <b class="txt-amber">${fmtEurFull(o.apport)}</b> (l’écurie prend ${Math.round(o.partEcurie*100)} % à sa charge)`
          : `<b class="txt-green">Aucun apport</b> — le pilote est payé.`}
          ${o.clauseLiberation?' · clause de libération incluse':''}</div>
        ${etatBudgetOffre(o)}
        <div class="row mt">
          <button class="btn-ghost btn-sm" data-act="negocierOffre" data-id="${o.id}">Négocier (${o.tours} relance${o.tours>1?'s':''})</button>
          <div class="spacer"></div>
          ${boutonSignature(o)}
        </div>
      </div>`;
    }).join('');
  openModal('Offres — saison '+S.annee, body,
    `<button class="btn-ghost" data-act="fermerModal">Y réfléchir</button>`);
}
ACTIONS.negocierOffre = d=>{
  const o=S.offres.find(x=>x.id===d.id); if(!o) return;
  const body = `<div class="note mb">Négocier avec <b>${escapeHtml(o.ecurieNom)}</b>. Relance n° ${o.tours+1}.</div>
    <div class="note warn mb">Plus vous relancez, plus le risque que l’écurie se retire augmente.</div>
    ${LEVIERS.filter(l=>l.id!=='salaire'||o.salaire>0).map(l=>
      `<button class="choice" data-act="appliquerLevier" data-id="${o.id}" data-l="${l.id}">
        <b>${escapeHtml(l.lab)}</b><small>${escapeHtml(l.desc)}</small></button>`).join('')}`;
  openModal('Négociation', body, `<button class="btn-ghost" data-act="retourOffres">Retour aux offres</button>`);
};
ACTIONS.appliquerLevier = d=>{
  const o=S.offres.find(x=>x.id===d.id); if(!o) return;
  const r = negocier(o, d.l);
  saveGame();
  openModal(r.issue==='retrait'?'Négociation rompue':'Réponse de l’écurie',
    `<div class="quote"><span class="who">${escapeHtml(o.ecurieNom)}</span>${escapeHtml(r.txt)}</div>`,
    `<button class="btn" data-act="retourOffres">Retour aux offres</button>`);
};
ACTIONS.retourOffres = ()=>afficherOffres();
ACTIONS.allerSponsors = ()=>{ closeModal(); go('sponsors'); };
ACTIONS.accepterOffre = d=>{
  const o=S.offres.find(x=>x.id===d.id); if(!o) return;
  const manque = o.apport>0 ? Math.max(0, o.apport - budgetSecurise()) : 0;
  if(manque>0 && S.manager.budget < manque){
    openModal('Budget non sécurisé',
      `<div class="note mb">Le §8.2 est sans appel : sans budget, un pilote ne monte pas, quel que soit son talent.</div>
       <div class="note mb">Apport exigé par ${escapeHtml(o.ecurieNom)} : <b>${fmtEurFull(o.apport)}</b><br>
       Sponsors sous contrat : <b>${fmtEurFull(budgetSecurise())}</b><br>
       Trésorerie : <b>${fmtEurFull(S.manager.budget)}</b><br>
       Il manque <b class="txt-red">${fmtEurFull(manque)}</b>.</div>
       <div class="note txt-muted">Démarchez des sponsors pendant l’intersaison, ou prenez un baquet moins cher.</div>`,
      `<button class="btn-ghost" data-act="retourOffres">Retour aux offres</button>
       <button class="btn" data-act="allerSponsors">Chercher des sponsors</button>`);
    return;
  }
  if(manque>0){
    msg('finance','Comptabilité','Vous vous portez garant',
      `Les sponsors sous contrat couvrent ${fmtEurFull(budgetSecurise())} des ${fmtEurFull(o.apport)} exigés par ${o.ecurieNom}.\n\n`+
      `Le manque de <em>${fmtEurFull(manque)}</em> sera prélevé sur votre trésorerie au fil des manches, `+
      `sauf si vous trouvez d’autres sponsors d’ici là.`);
  }
  signerOffre(o);
  S.phase='intersaison';
  S.offres=null;
  closeModal(); saveGame(); go('bureau');
  showToast('Contrat signé avec '+o.ecurieNom);
};
/* Baquet de secours. GDD §8.2 : « Descendre d'une catégorie survient après un
   renvoi, ou lorsqu'aucun budget n'a pu être réuni pour la saison suivante. »
   On redescend donc jusqu'à la première catégorie réellement finançable, chez
   l'écurie la plus modeste — qui prend une part du budget à sa charge, faute
   de mieux. Le bas de l'échelle est toujours accessible : c'est le filet. */
function categorieDeSecours(){
  const dispo = budgetSecurise() + Math.max(0, S.manager.budget);
  const age = S.pilote.age;
  // On ne redescend pas plus bas que ce que l'âge du pilote autorise : un pilote
  // de 17 ans n'a rien à faire en Karting Mini, dont la limite est 13 ans.
  const acceptent = CATS.filter(c=>age<=c.ageMax).map(c=>c.niv);
  const nivPlancher = acceptent.length ? Math.min(...acceptent) : 0;
  // Le plancher joue aussi vers le haut : un pilote qui a passé la limite d'âge
  // de sa catégorie ne peut pas y rester, il est poussé vers la première qui
  // l'accepte encore. Sans cela il vieillissait indéfiniment en Karting Senior.
  let niv = Math.max(CAT[S.pilote.catId].niv, nivPlancher);
  while(niv>nivPlancher){
    const c = catByNiv(niv);
    if(coutEngagement(c.id)*0.65 <= dispo) break;   // l'écurie modeste prend 35 % à sa charge
    niv--;
  }
  return catByNiv(niv);
}
ACTIONS.baquetSecours = ()=>{
  const c = categorieDeSecours();
  const e = ecuriesPour(c.id).slice(-1)[0];
  const partEcurie = 0.35;
  const apport = Math.max(0, Math.round(coutEngagement(c.id)*(1-partEcurie)/1000)*1000);
  const descente = c.niv < CAT[S.pilote.catId].niv;
  signerOffre({id:uid(), catId:c.id, ecurieId:e.id, ecurieNom:e.nom, prestige:e.prestige, voiture:e.voiture,
    junior:false, partEcurie, apport, salaire:0, primeVictoire:0, primePoint:0, duree:1,
    objectifPos:Math.round(c.grille*0.7), clauseLiberation:false, bonusFidelite:0, bonusVoiture:0});
  if(descente){
    msg('systeme','Paddock','Retour en '+c.nom,
      `Faute de budget et d’offre, ${S.pilote.nom} redescend en ${c.nom} chez ${e.nom}.\n\n`+
      `Ce n’est pas la fin : c’est là qu’on reconstruit une réputation et qu’on retrouve des sponsors.`);
    gagnerRep(-Math.round(15 + CAT[S.pilote.catId].niv*5), 'descente de catégorie');
  }
  S.phase='intersaison';
  closeModal(); saveGame(); go('bureau');
};

/* Panneau des conditions cumulatives du GDD §8.2. C'est ce qui explique au
   joueur pourquoi la montée est ouverte ou fermée, avant qu'il ne cherche. */
function panneauMontee(){
  const p=S.pilote, catAct=CAT[p.catId];
  const sup = catByNiv(catAct.niv+1);
  if(!sup) return `<div class="card"><h2>Montée de catégorie</h2>
    <div class="note">${escapeHtml(p.nom)} est en Formule 1 : il n’y a rien au-dessus.</div></div>`;
  const apportType = Math.round(sup.cout * 0.6);
  const k = conditionsMontee(sup.id, apportType);
  if(!k) return '';
  const ligne = (ok, titre, detail) => `<div class="row" style="align-items:flex-start;gap:8px;padding:6px 0">
      <span style="flex:0 0 18px;font-weight:700" class="${ok?'txt-green':'txt-red'}">${ok?'✓':'✗'}</span>
      <div style="flex:1"><div class="b small">${titre}</div><div class="note txt-muted">${detail}</div></div>
    </div>`;

  const posTxt = k.pos===null
    ? 'Aucune saison complète terminée pour l’instant.'
    : `Dernier championnat : <b>${ordinal(k.pos)}</b> — il faut ${k.titre?'un titre':'un top '+k.posRequise}`
      + (k.bonus>0?` (top ${k.cond.pos} assoupli de ${k.bonus} places par le budget apporté)`:'')+'.';
  const slTxt = k.slRequis===0
    ? 'Aucun point de superlicence exigé à ce palier.'
    : `<b>${k.sl} / ${k.slRequis}</b> points sur 3 ans glissants. Les points ne s’achètent pas.`;
  const budTxt = `Sponsors sous contrat : <b>${fmtEur(k.secure)}</b>. `
    + `Un baquet type en ${sup.court} demande environ <b>${fmtEur(apportType)}</b> d’apport`
    + (k.manque>0 ? `, il manquerait <b class="txt-amber">${fmtEur(k.manque)}</b>.` : ` — c’est couvert.`);

  return `<div class="card ${k.ok?'':'accent'}">
    <h2>Monter en ${sup.nom}<span class="hint">4 conditions cumulatives</span></h2>
    <div class="note mb">${escapeHtml(k.cond.lib)} · âge conseillé ${k.cond.age[0]}-${k.cond.age[1]} ans.</div>
    ${ligne(k.sportifOk, 'Résultat sportif', posTxt)}
    ${ligne(k.slOk, 'Superlicence', slTxt)}
    ${ligne(k.ageOk, 'Âge', k.ageOk
      ? `${p.age} ans : les écuries de ${sup.court} peuvent l’engager${k.ageConseille?'':' — hors de la fenêtre idéale, elles seront plus difficiles à convaincre'}.`
      : `${p.age} ans : trop ${p.age<k.cond.age[0]?'jeune':'âgé'} pour la ${sup.court}, qui recrute entre ${k.cond.age[0]-1} et ${sup.ageMax} ans.`)}
    ${ligne(k.budgetOk, 'Budget sécurisé', budTxt)}
    <div class="note txt-muted mt">Une dernière condition ne se coche pas ici — qu’une écurie veuille du pilote :
      elle se lit dans les offres. Un champion sans budget ne monte pas : c’est l’argent le vrai filtre.</div>
  </div>` + panneauVoies();
}

/* Panneau des voies alternatives (GDD §8.4). Il n'apparaît que lorsqu'elles
   s'ouvrent : avant, l'horizon reste la F1 et l'afficher serait un contresens. */
function panneauVoies(){
  const voies = voiesOuvertes();
  if(!voies.length) return '';
  const p = S.pilote;
  const dejaAlt = estAlternative(p.catId);
  return `<div class="card"><h2>${dejaAlt?'Votre championnat':'Une autre carrière est possible'}
      <span class="hint">GDD §8.4</span></h2>
    <div class="note mb">${dejaAlt
      ? `${escapeHtml(p.nom)} court en ${CAT[p.catId].nom}. Le pilote y est payé, et peut y courir longtemps.`
      : `La F1 n’est plus l’horizon le plus réaliste pour ${escapeHtml(p.nom)}. Ces championnats
         recrutent des pilotes de monoplace confirmés — et surtout, <b>ils paient le pilote</b>
         au lieu de lui faire payer sa saison.`}</div>
    ${voies.map(v=>`<div class="slider-box">
      <div class="top"><b>${v.nom}</b><span>${v.courses} manches</span></div>
      <div class="note">${v.d}</div>
      <div class="row tight mt">
        ${tag('Salaire '+fmtEur(v.salaire[0])+' à '+fmtEur(v.salaire[1]),'t-green')}
        ${tag('Jusqu’à '+v.ageMax+' ans','t-blue')}
        ${v.risque>1.2?tag('Exposé','t-red') : v.risque<0.85?tag('Plus sûr','t-green') : tag('Risque courant','t-grey')}
        ${p.catId===v.id?tag('En cours','t-red'):''}
      </div>
    </div>`).join('')}
    <div class="note txt-muted mt">Ces championnats apparaissent dans vos offres.
      Ils ne mènent pas à la F1 : c’est une carrière différente, pas un détour.</div>
  </div>`;
}

    <div class="note txt-muted mt">Votre structure peut faire tourner <b>${antennesMax()}</b> antennes
      (${regionsCouvertes().length-1} ouverte(s)) — une cellule de recrutement en autorise deux de plus par niveau.
      Le vivier ne se recompose qu’à la saison suivante : ouvrir une antenne

  $('#v-staff').innerHTML=h;

/* Classement des écuries de management (GDD §5.3) : la place du joueur dans le
   métier, indépendamment du championnat de son pilote. */
function blocManagers(){
  const l = classementManagers();
  if(l.length<2) return '';
  const moi = l.find(x=>x.moi);
  return `<div class="card"><h2><span class="vig"><span>🏁</span></span>Managers<span class="hint">${ordinal(moi.pos)} sur ${l.length}</span></h2>
    <div class="note mb">Vous n’êtes pas seul à chercher des talents. Ces managers signent dans le même vivier.</div>
    <div class="tw"><table><thead><tr><th>Pos</th><th>Manager</th><th class="num">Rép.</th>

function renderChamp(){

  const sa=S.saison, c=CAT[sa.catId], cl=classementChampionnat();
  let h=`<div class="card"><h2>${c.nom} ${sa.annee}<span class="hint">manche ${Math.min(sa.courseIndex+1,c.courses)}/${c.courses}</span></h2>
    <div class="tw"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th><th class="num">Pts</th><th class="num">V</th><th class="num">P</th><th class="num">AB</th></tr></thead><tbody>

  </tbody></table></div></div>`;

  h+=`<div class="card"><h2>Calendrier</h2><div class="tw"><table>
    <thead><tr><th>#</th><th>Circuit</th><th class="hide-s">Pays</th><th class="hide-s">Type</th><th>Résultat</th><th class="num">Pts</th></tr></thead><tbody>

/* Paliers d'investissement lisibles, sans doublon : un arrondi fixe à 500 €
   écrasait les trois paliers en un seul sur les catégories bon marché. */
function paliersDev(cout){
  const arrondi = v => v<2000 ? Math.round(v/50)*50 : v<20000 ? Math.round(v/500)*500 : Math.round(v/5000)*5000;
  return [...new Set([0.02,0.05,0.10].map(x=>arrondi(cout*x)).filter(x=>x>0))];
}
ACTIONS.modalDev = ()=>{
  if(!S.saison){ showToast('Hors saison'); return; }
  const c=CAT[S.saison.catId], axes=axesDev(), dev=S.saison.dev||{chassis:0,aero:0,moteur:0};
  const mix=mixCircuits(), total=sum(Object.values(mix));
  // poids moyen de chaque axe sur les circuits qui restent à courir
  const poidsMoyen = k => total ? sum(Object.entries(mix), ([t,n])=>poidsDevCourse(t)[k]*n)/total : 1/3;
  // Un axe bloqué par le règlement ne doit jamais être conseillé (GDD §11).
  const libre = a => (dev[a]||0) < plafondAxeCourant(a)-0.01;
  const classes = axes.map(a=>({k:a.k, p:poidsMoyen(a.k)})).sort((x,y)=>y.p-x.p);
  const meilleur = classes.find(x=>libre(x.k)) || classes[0];
  const regl = reglSaison();
  const plafBudget = devPlafondSaison();
  const resteBudget = plafBudget===Infinity ? Infinity : Math.max(0, plafBudget-S.saison.devDepense);
  openModal('Développement technique',
    `<div class="note mb">Le budget R&D se répartit sur trois axes. Chaque type de circuit en privilégie un${regl.poids
       ? `, et le règlement de la saison redistribue encore ces poids`
       : ` : le moteur sur un tracé rapide, le châssis sur un tracé technique`}.
     L’argent sort de la <b>caisse de saison</b>.</div>
     <div class="note mb">Base de l’écurie : <b>${Math.round(S.saison.voiture)}/100</b> · caisse : <b>${fmtEur(S.saison.caisse)}</b>
     · déjà investi : ${fmtEur(S.saison.devDepense)}</div>
     ${regl.id!=='stable' ? `<div class="card flat" style="margin-bottom:12px">
       <div class="small txt-muted b" style="text-transform:uppercase;letter-spacing:.05em">Règlement ${S.saison.annee}</div>
       <div class="note"><b class="txt-amber">${regl.ico} ${escapeHtml(regl.nom)}</b> — ${escapeHtml(regl.effet)}</div>
       ${plafBudget!==Infinity?`<div class="note txt-muted mt">Plafond budgétaire : <b>${fmtEurFull(plafBudget)}</b> sur la saison —
         il vous reste <b class="${resteBudget>0?'txt-green':'txt-red'}">${fmtEurFull(resteBudget)}</b>.</div>`:''}
     </div>` : ''}
     <div class="card flat" style="margin-bottom:12px">
       <div class="small txt-muted b" style="text-transform:uppercase;letter-spacing:.05em">Circuits restants</div>
       <div class="note">${total?Object.entries(mix).map(([t,n])=>`${n} ${t.toLowerCase()}`).join(' · '):'—'}</div>
       <div class="note txt-muted mt">Sur ce calendrier, l’axe le plus rentable est
         <b class="txt-amber">${escapeHtml(axes.find(a=>a.k===meilleur.k).nom)}</b>.</div>
     </div>
     ${axes.map(a=>{
       const niv=dev[a.k]||0, pm=poidsMoyen(a.k), plaf=plafondAxeCourant(a.k), bloque=!libre(a.k);
       return `<div class="grp">
         <div class="h"><b>${escapeHtml(a.nom)}</b><span>${round(niv,1)}/${round(plaf,0)}</span></div>
         <div class="note txt-muted">${escapeHtml(a.desc)} — pèse ${Math.round(pm*100)} % sur les circuits restants.</div>
         ${plaf<PLAFOND_AXE?`<div class="note txt-amber">Plafonné à ${round(plaf,0)} par le règlement.</div>`:''}
         ${gline('Niveau', niv/plaf*100, niv/plaf>0.66?'green':'blue','')}
         <div class="row tight mt">${bloque
           ? `<span class="note txt-muted">Axe au plafond — plus rien à en tirer.</span>`
           : paliersDev(c.cout).map(m=>
             `<button class="btn-ghost btn-sm" data-act="investir" data-axe="${a.k}" data-m="${m}"
               ${(S.saison.caisse<m || m>resteBudget)?'disabled':''}>${fmtEurFull(m)}</button>`).join('')}</div>
       </div>`;
     }).join('')}
     <div class="note txt-muted">Rendement décroissant sur le <b>total dépensé</b> dans la saison, pas par axe :
     concentrer tout sur un seul axe reste payant si le calendrier s’y prête.</div>`,
    `<button class="btn-ghost" data-act="fermerModal">Fermer</button>`);
};

      <div><div class="l">Points</div><div class="v">${sa.pts}</div></div>
      <div><div class="l">Victoires</div><div class="v">${sa.victoires}</div></div>
      <div><div class="l">Podiums</div><div class="v">${sa.podiums}</div></div>
      <div><div class="l">Abandons</div><div class="v">${sa.abandons}</div></div>
    </div>
    <div class="card flat"><h2>Bilan financier</h2>
      <div class="tw"><table><tbody>
        <tr><td>Commissions encaissées</td><td class="num txt-green">${fmtEurFull(gainsCommission)}</td></tr>
        <tr><td>Dépenses du manager</td><td class="num txt-red">${fmtEurFull(depenses)}</td></tr>
        <tr><td>Solde de caisse de saison</td><td class="num ${sa.caisse<0?'txt-red':''}">${fmtEurFull(sa.caisse)}</td></tr>
        <tr><td><b>Trésorerie</b></td><td class="num ${S.manager.budget<0?'txt-red':'txt-green'}"><b>${fmtEurFull(S.manager.budget)}</b></td></tr>
      </tbody></table></div>
    </div>
    ${sl?`<div class="note mt">Superlicence : <b>+${sl} points</b> — total ${totalSuperlicence()}/${SUPERLIC_REQUIS} sur 3 ans.</div>`:''}
    <div class="note mt">Progression de ${escapeHtml(p.nom)} : note globale <b>${Math.round(notePilote(p))}</b> (plafond estimé ${estimTexte(p, notePlafond(p), 'plafGlobal')}).</div>
    ${p.age>=32?`<div class="note warn mt">${p.nom} a ${p.age} ans. Le déclin physique est engagé, la retraite approche.</div>`:''}`;
  openModal('Saison '+sa.annee+' — bilan', body,
    `<button class="btn btn-cta" data-act="allerIntersaison">Passer à l’intersaison</button>`);
};
ACTIONS.allerIntersaison = ()=>{
  passerAnneeSuivante();
  closeModal();
  if(S.pilote){
    S.offres = genererOffres();
    saveGame();
    go('bureau');
    afficherOffres();
  }else{
    go('pilote');
  }
};

/* ------------------------------------------------------- INIT */
function boot(){
  const sv = loadGame();
  if(sv){ S=sv; UI.tab = S.phase==='weekend'?'weekend':'bureau'; }
  render();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
