function classementChampionnat(){
  const sa=S.saison;
  const l = [{id:S.pilote.id, nom:S.pilote.nom, ecurie:sa.ecurieNom, pts:sa.pts, victoires:sa.victoires,
              podiums:sa.podiums, abandons:sa.abandons, moi:true}];
  for(const g of sa.grille) l.push({id:g.id,nom:g.nom,ecurie:g.ecurie,pts:g.pts,victoires:g.victoires,
              podiums:g.podiums,abandons:g.abandons,moi:false,rival:g.rival});
  l.sort((a,b)=> b.pts-a.pts || b.victoires-a.victoires || b.podiums-a.podiums);
  l.forEach((x,i)=>x.pos=i+1);
  return l;
}
function positionChampionnat(){ const c=classementChampionnat(); return (c.find(x=>x.moi)||{}).pos || null; }

function ptsSuperlicence(catId, posChamp){
  const t = SUPERLIC[catId];
  if(!t) return 0;
  return posChamp>=1 && posChamp<=t.length ? t[posChamp-1] : 0;
}
function totalSuperlicence(){
  if(!S.pilote) return 0;
  // Une fois la F1 atteinte, la superlicence est acquise et se renouvelle.
  if(S.pilote.palmares.some(x=>x.catId==='f1') || S.pilote.catId==='f1') return SUPERLIC_REQUIS;
  return sum(S.pilote.superlicence.filter(x=>x.annee > S.annee-3), x=>x.pts);
}

function terminerSaison(interrompue){
  const sa=S.saison, c=CAT[sa.catId], p=S.pilote;
  const cl = classementChampionnat();
  const pos = (cl.find(x=>x.moi)||{}).pos || cl.length;
  sa.finie=true;
  sa.posChamp=pos;

  if(!interrompue){
    // primes conditionnelles des sponsors
    primesSponsorsFinSaison(pos);
    // titre
    if(pos===1){
      S.stats.titres++;
      if(c.titre>0){
        caisse('Prime de champion — '+c.nom, c.titre, 'gain');
        argent('Commission titre (20 %)', Math.round(c.titre*0.20), 'commission');
      }
      gagnerRep(Math.round(80+c.niv*46), 'titre');
      msg('systeme','Fédération','Champion !', `${p.nom} est sacré champion de ${c.nom} ${S.annee}.\n\nVotre réputation en profite pleinement.`);
    }else if(pos<=3){
      gagnerRep(Math.round(24+c.niv*13),'podium championnat');
    }
    // points de superlicence
    const sl = ptsSuperlicence(sa.catId, pos);
    if(sl>0){
      p.superlicence.push({annee:S.annee, pts:sl, catId:sa.catId, pos});
      msg('systeme','FIA','Points de superlicence attribués',
        `${ordinal(pos)} en ${c.nom} : <em>${sl} points</em> de superlicence.\n\n`+
        `Total sur les 3 dernières années : ${totalSuperlicence()} / ${SUPERLIC_REQUIS}.`);
    }
  }

  p.palmares.push({annee:S.annee, catId:sa.catId, pos, pts:sa.pts, victoires:sa.victoires,
                   podiums:sa.podiums, abandons:sa.abandons, interrompue:!!interrompue});
  // Une saison complète passée avec lui vaut une observation de scout.
  p.observe = (p.observe||0) + 1;

  // Stagnation : rester dans une catégorie qu'on domine déjà use la motivation.
  const memeCat = p.palmares.filter(x=>x.catId===sa.catId);
  if(!interrompue && memeCat.length>=2 && pos<=3){
    const perte = 8 + (memeCat.length-2)*7;
    p.moral = clamp(p.moral - perte, 5, 100);
    p.relation = clamp(p.relation - perte*0.6, 0, 100);
    msg('pilote', p.nom, 'Je tourne en rond ici',
      `« ${memeCat.length} saisons en ${CAT[sa.catId].nom}, et je finis encore devant. `+
      `Si on ne monte pas, je vais finir par me demander ce que je fais avec toi. »`);
  }
  S.historique.push({annee:S.annee, catId:sa.catId, pos, pts:sa.pts, victoires:sa.victoires,
                     podiums:sa.podiums, pilote:p.nom, ecurie:sa.ecurieNom, interrompue:!!interrompue,
                     soldeManager:Math.round(S.manager.budget)});

  // Solde de caisse : un reliquat positif reste au pilote/à la structure, il n'enrichit pas le manager
  if(sa.caisse<0){
    argent('Régularisation de fin de saison', sa.caisse, 'sauvetage');
  }

  S.phase='finSaison';
  S.weekend=null;
  saveGame();
}

/* Vieillissement, retraite et progression du monde */
function passerAnneeSuivante(){
  const p=S.pilote;
  S.annee++;
  p.age++;
  for(const r of S.monde.rivaux){ r.age++; progresserPiloteAbstrait(r); }
  // Retraite (GDD §7.2)
  const proba = p.age<33?0 : clamp((p.age-32)*0.13 + (notePilote(p)<55?0.15:0), 0, 1);
  if(p.age>=34 && Math.random()<proba){ partirRetraite(); return; }
  // Nettoyage de saison
  S.saison=null; S.weekend=null;
  S.flags.renvoye=false;
  // sponsors : ceux dont le contrat pluriannuel court restent, les autres partent
  const gardes=[];
  for(const s of S.sponsors.actifs){
    s.duree--;
    if(s.duree>0){ s.verseSaison=0; gardes.push(s); }
    else msg('sponsor', s.nom, 'Fin de contrat', `Le partenariat avec ${s.nom} arrive à son terme. Il faudra le renégocier ou trouver mieux.`);
  }
  S.sponsors.actifs=gardes;
  S.phase='intersaison';
  S.actions=6;
  majSponsorsProspects();
  saveGame();
}
function progresserPiloteAbstrait(r){
  const cA=coeffAge(r.age);
  for(const k of ALL_STATS){
    const m=1-r.stats[k]/r.plafonds[k];
    if(m>0) r.stats[k]=clamp(r.stats[k]+GAIN_SAISON*cA*m*rnd(1.1,0.7),1,99);
  }
  // le rival monte d'une catégorie s'il est prêt
  const c=CAT[r.catId];
  if(notePilote(r) > 42+c.niv*6.2 && c.niv<8 && r.age>=catByNiv(c.niv+1).ageMin){
    r.catId = catByNiv(c.niv+1).id;
    msg('scout','Votre réseau','Un rival progresse',
      `${r.nom}, que vous croisez depuis les débuts de ${S.pilote?S.pilote.nom:'votre pilote'}, vient de signer en ${CAT[r.catId].nom}.`);
  }
}
function partirRetraite(){
  const p=S.pilote;
  const meilleur = p.palmares.reduce((b,x)=> (!b || CAT[x.catId].niv>CAT[b.catId].niv || (CAT[x.catId].niv===CAT[b.catId].niv&&x.pos<b.pos))?x:b, null);
  msg('pilote', p.nom, 'Fin de carrière',
    `Après ${p.palmares.length} saisons, ${p.nom} raccroche le casque à ${p.age} ans.\n\n`+
    (meilleur ? `Meilleure saison : ${ordinal(meilleur.pos)} en ${CAT[meilleur.catId].nom} (${meilleur.annee}).\n\n` : '')+
    `La carrière de manager continue : à vous de trouver le prochain.`);
  S.historique.push({annee:S.annee, type:'retraite', pilote:p.nom, palmares:p.palmares});
  gagnerRep(Math.round(10 + (meilleur?CAT[meilleur.catId].niv*6:0)), 'carrière accomplie');
  S.pilote=null; S.contrat=null; S.saison=null; S.weekend=null;
  S.sponsors.actifs=[]; S.sponsors.prospects=[];
  S.phase='scouting';
  genererScoutPool();
  saveGame();
}

/* ------------------- 17bis. CONDITIONS DE MONTÉE (GDD §8.2) */

/* Budget déjà sécurisé pour la saison à venir : les sponsors sous contrat.
   La trésorerie du manager n'en fait pas partie (GDD §19.1, option A) — elle
   ne peut que combler un manque, et cela se paie. */
function budgetSecurise(){
  return sum(S.sponsors.actifs, x=>x.montant);
}

/* Dernier classement de championnat connu du pilote. */
function dernierClassement(){
  if(S.saison && S.saison.posChamp) return S.saison.posChamp;
  const p=S.pilote;
  if(p && p.palmares.length){
    const d=p.palmares[p.palmares.length-1];
    if(!d.interrompue) return d.pos;
  }
  return null;
}

/* Assouplissement du résultat sportif obtenu par le budget apporté
   (GDD §8.2, « voie du pilote payant »). N'assouplit jamais la superlicence :
   c'est une règle FIA, elle ne s'achète pas. */
function assouplissementPayant(catCibleId){
  const c=CAT[catCibleId];
  if(!c.cout) return 0;
  return clamp(Math.floor(budgetSecurise() / c.cout * 6), 0, 6);
}

/* Âge autorisé pour monter dans une catégorie. C'est la table du §8.2 qui fait
   foi — une seule source de vérité. On tolère un an avant la fenêtre conseillée
   (un talent précoce), et jusqu'à la limite d'âge de la catégorie ensuite. */
function ageAutoriseMontee(catCibleId, age){
  const cond = MONTEE[catCibleId], c = CAT[catCibleId];
  if(!cond) return age>=c.ageMin-1 && age<=c.ageMax;
  return age >= cond.age[0]-1 && age <= c.ageMax;
}

/* Les trois conditions du §8.2, évaluées pour une catégorie visée.
   `ecurieOk` est fourni par l'existence d'une offre : on le passe de l'extérieur. */
function conditionsMontee(catCibleId, apport){
  const p=S.pilote, cond=MONTEE[catCibleId];
  const c=CAT[catCibleId];
  if(!cond) return null;
  const pos = dernierClassement();
  const bonus = assouplissementPayant(catCibleId);
  const posRequise = cond.pos + bonus;
  const titre = cond.titreSuffit && pos===1;
  const sportifOk = pos===null ? false : (pos<=posRequise || titre);
  const sl = totalSuperlicence();
  const slOk = sl >= cond.sl;
  const secure = budgetSecurise();
  const budgetOk = apport<=0 || secure >= apport;
  const manque = Math.max(0, apport - secure);
  return {
    cond, pos, posRequise, bonus, titre, sportifOk,
    sl, slRequis:cond.sl, slOk,
    secure, apport, budgetOk, manque,
    ageIdeal: cond.age, ageOk: ageAutoriseMontee(catCibleId, p.age),
    ageConseille: p.age>=cond.age[0] && p.age<=cond.age[1],
    ok: sportifOk && slOk && budgetOk && ageAutoriseMontee(catCibleId, p.age),
  };
}
/* Une montée est-elle envisageable sportivement ? (avant même de parler d'argent) */
function montePossibleSportivement(catCibleId){
  const k=conditionsMontee(catCibleId, 0);
  return k ? (k.sportifOk && k.slOk) : true;
}

/* --------------------------- 18. OFFRES & NÉGOCIATION (GDD §9.2, §9.4) */
/* Un « contrat » en catégorie junior est surtout un baquet à financer.
   En F1, le pilote est payé. Les pilotes payants (GDD §4.6) obtiennent
   un baquet au-dessus de leur niveau en apportant du budget. */
function genererOffres(){
  const p=S.pilote, rp=repPalier(S.manager.repPoints).p;
  const catAct = CAT[p.catId];
  const posChamp = S.saison ? (S.saison.posChamp||positionChampionnat()) : null;
  const note = notePilote(p);
  const budgetSponsors = sum(S.sponsors.actifs, s=>s.montant);
  const offres=[];

  const cibles=[];
  const sup = catByNiv(catAct.niv+1);
  // Monter d'une catégorie : le résultat sportif et la superlicence font barrage
  // avant même qu'une écurie se manifeste (GDD §8.2, conditions 1 et 3).
  if(sup && ageAutoriseMontee(sup.id, p.age)){
    if(montePossibleSportivement(sup.id) && (sup.id!=='f1' || p.age>=18)) cibles.push(sup.id);
  }
  cibles.push(catAct.id);                                     // rester
  // Redescendre est toujours possible : c'est la porte de sortie quand la saison
  // n'est pas finançable, et la seule option après un renvoi.
  if(catAct.niv>0) cibles.push(catByNiv(catAct.niv-1).id);

  for(const catId of [...new Set(cibles)]){
    const c=CAT[catId];
    const ecus = ecuriesPour(catId);
    for(const e of ecus){
      // Exigence sportive de l'écurie
      const exigNote = NIVEAU_GRILLE[catId] - 9 + (e.prestige-45)*0.30;
      const exigRep  = Math.max(1, Math.round(1 + c.niv*0.9 + (e.prestige-40)/22));
      // Un gros budget compense un déficit de niveau (pilote payant)
      const compensation = clamp(budgetSponsors / Math.max(60000, c.cout||3e6) * 16, 0, 22);
      const ecart = note + compensation - exigNote;
      if(ecart < -6) continue;
      if(rp < exigRep-2) continue;
      // Âge conseillé du §8.2 : hors de la fenêtre, les écuries se montrent
      // nettement moins intéressées — un pilote qui stagne perd de son attractivité.
      let appetit = clamp(0.35 + ecart/22, 0.12, 0.95);
      const mc = MONTEE[catId];
      if(mc && c.niv>catAct.niv){
        if(p.age < mc.age[0]-1) appetit *= 0.55;
        else if(p.age > mc.age[1]) appetit *= clamp(1 - (p.age-mc.age[1])*0.22, 0.15, 1);
      }
      const saisonsIci = p.palmares.filter(x=>x.catId===catAct.id).length;
      if(saisonsIci>=3) appetit *= clamp(1 - (saisonsIci-2)*0.18, 0.3, 1);
      if(Math.random() > appetit) continue;

      const junior = c.niv<8 && Math.random() < clamp(0.10 + ecart/45 + (posChamp&&posChamp<=3?0.25:0), 0, 0.55);
      // Part du budget prise en charge par l'écurie
      let partEcurie = 0;
      if(c.niv===8) partEcurie = 1;
      else if(junior) partEcurie = clamp(0.45 + ecart/60 + rnd(0.2), 0.4, 1);
      else partEcurie = clamp(ecart/55 + rnd(0.18) - 0.05, 0, 0.65);
      const apport = Math.max(0, Math.round(c.cout*(1-partEcurie)/1000)*1000);

      // Salaire (uniquement en F1)
      let salaire=0, primeVictoire=0, primePoint=0;
      if(c.niv===8){
        const base = e.prestige>85 ? 6e6 : e.prestige>65 ? 2.4e6 : 0.8e6;
        salaire = Math.round(base * clamp(0.6+ (note-70)/40, 0.5, 3.2) / 1e4)*1e4;
        primeVictoire = Math.round(salaire*0.06/1e3)*1e3;
        primePoint    = Math.round(salaire*0.002/100)*100;
      }
      const objectifPos = Math.max(1, Math.round(clamp(c.grille*0.5 - (e.prestige-45)*0.16 - ecart*0.30, 1, c.grille-2)));
      offres.push({
        id:uid(), catId, ecurieId:e.id, ecurieNom:e.nom, prestige:e.prestige, voiture:e.voiture,
        junior, partEcurie:round(partEcurie,2), apport, salaire, primeVictoire, primePoint,
        duree: junior?2:rint(1,2), objectifPos,
        clauseLiberation: Math.random()<0.4,
        bonusFidelite: Math.random()<0.3 ? Math.round((salaire||c.cout)*0.05/1e3)*1e3 : 0,
        bonusVoiture: junior ? rint(2,5) : 0,
        risque: clamp(Math.round(20 + (c.niv-catAct.niv)*16 + Math.max(0,-ecart)*3.4 - (junior?12:0)), 5, 92),
        progression: junior
            ? (c.niv>catAct.niv ? 'Programme jeunes : montée en '+c.court+' avec le soutien de l’écurie'
                                : 'Programme jeunes : 1 an de plus en '+c.court+', fort soutien')
            : c.niv>catAct.niv ? 'Montée directe en '+c.court
            : c.niv<catAct.niv ? 'Retour en '+c.court+' pour se relancer'
            : 'Maintien en '+c.court,
        tours:0, retiree:false,
        montee: c.niv>catAct.niv,
      });
    }
  }
  // On garde les meilleures, sans doublon d'écurie
  const vus=new Set(); const out=[];
  offres.sort((a,b)=> (CAT[b.catId].niv-CAT[a.catId].niv) || (b.prestige-a.prestige));
  for(const o of offres){ const k=o.catId+o.ecurieId; if(vus.has(k))continue; vus.add(k); out.push(o); }
  return out.slice(0, 6);
}

/* Négociation en plusieurs tours : chaque relance peut faire fuir l'écurie (GDD §9.4) */
const LEVIERS = [
  {id:'apport',  lab:'Demander une prise en charge supplémentaire', desc:'Faire baisser l’apport exigé de 15 %.'},
  {id:'salaire', lab:'Demander un meilleur salaire',                desc:'+18 % sur le fixe (F1 uniquement).'},
  {id:'duree',   lab:'Raccourcir l’engagement',                     desc:'Contrat plus court : plus de liberté.'},
  {id:'clause',  lab:'Exiger une clause de libération',             desc:'Partir librement si l’écurie ne tient pas ses promesses.'},
  {id:'objectif',lab:'Assouplir l’objectif de résultat',            desc:'Objectif contractuel relevé de 2 places : moins de risque de renvoi.'},
];
function negocier(offre, levierId){
  offre.tours++;
  const rp=repPalier(S.manager.repPoints).p;
  const base = 0.62 + rp*0.028 + (S.pilote.reputation/100)*0.18;
  const proba = clamp(base - offre.tours*0.16, 0.06, 0.9);
  const risqueRetrait = clamp(0.05 + offre.tours*0.13 - rp*0.012, 0.02, 0.6);

  if(Math.random() < risqueRetrait){
    offre.retiree = true;
    return {issue:'retrait', txt:`${offre.ecurieNom} se retire de la négociation. Vous avez tiré sur la corde une fois de trop.`};
  }
  if(Math.random() < proba){
    switch(levierId){
      case 'apport':  offre.apport = Math.max(0, Math.round(offre.apport*0.85/1000)*1000);
                      offre.partEcurie = round(1 - offre.apport/Math.max(1,CAT[offre.catId].cout||1),2); break;
      case 'salaire': if(offre.salaire>0){ offre.salaire=Math.round(offre.salaire*1.18/1e4)*1e4; } break;
      case 'duree':   offre.duree = Math.max(1, offre.duree-1); break;
      case 'clause':  offre.clauseLiberation = true; break;
      case 'objectif':offre.objectifPos = Math.min(CAT[offre.catId].grille-1, offre.objectifPos+2); break;
    }
    return {issue:'ok', txt:`${offre.ecurieNom} accepte votre demande.`};
  }
  return {issue:'refus', txt:`${offre.ecurieNom} refuse mais reste à la table. Chaque relance supplémentaire augmente le risque de rupture.`};
}

function signerOffre(offre){
  const c=CAT[offre.catId];
  const com = offre.salaire>0
    ? Math.round(offre.salaire*(0.05 + (offre.prestige/100)*0.10))
    : Math.round(Math.max(2000, c.cout*0.02));
  argent('Commission de transfert — '+offre.ecurieNom, com, 'commission');
  S.contrat = {
    ecurieId:offre.ecurieId, ecurieNom:offre.ecurieNom, catId:offre.catId,
    duree:offre.duree, anneeDebut:S.annee, salaire:offre.salaire,
    primeVictoire:offre.primeVictoire, primePoint:offre.primePoint,
    partEcurie:offre.partEcurie, apport:offre.apport, objectifPos:offre.objectifPos,
    clauseLiberation:offre.clauseLiberation, bonusFidelite:offre.bonusFidelite,
    bonusVoiture:offre.bonusVoiture, junior:offre.junior, relationEcurie:62,
  };
  S.pilote.catId = offre.catId;
  gagnerRep(Math.round(8 + c.niv*7 + offre.prestige*0.12), 'signature');
  if(offre.catId==='f1' && !S.flags.f1Atteinte){
    S.flags.f1Atteinte = true;
    gagnerRep(500,'accès à la F1');
    msg('systeme','Paddock','La Formule 1',
      `${S.pilote.nom} est officiellement pilote de Formule 1 chez ${offre.ecurieNom}.\n\n`+
      `C’est l’aboutissement de tout ce que vous avez construit depuis le karting.`);
  }
  msg('ecurie', offre.ecurieNom, 'Contrat signé — saison '+S.annee,
    `${S.pilote.nom} rejoint ${offre.ecurieNom} en ${c.nom}.\n\n`+
    (offre.salaire>0 ? `Salaire annuel : <em>${fmtEurFull(offre.salaire)}</em>. Votre commission : 10 %.\n` :
                       `Apport exigé : <em>${fmtEurFull(offre.apport)}</em> sur la saison — à trouver auprès des sponsors.\n`)+
    `Objectif contractuel : ${ordinal(offre.objectifPos)} au championnat. Durée : ${offre.duree} an(s).`);
  S.offres = null;
  saveGame();
}

/* -------------------------------------- 19. STAFF (GDD §13, §19.7) */
function candidatsStaff(roleId){
  const rp=repPalier(S.manager.repPoints).p;
  const nivMax = clamp(1+Math.floor(rp/2), 1, 5);
  const out=[];
  for(let n=1;n<=nivMax;n++){
    out.push({roleId, niv:n, nom:nomAleatoire(), salaire:staffSalaire(roleId,n)});
  }
  return out;
}
function recruterStaff(roleId, niv, nom){
  const sal = staffSalaire(roleId,niv);
  S.staff[roleId] = {niv, salaire:sal, nom};
  msg('systeme','Ressources humaines','Recrutement — '+STAFF_ROLE[roleId].nom,
    `${nom} rejoint votre structure comme ${STAFF_ROLE[roleId].nom} (${NIV_LABEL[niv]}).\n\n`+
    `Coût : <em>${fmtEurFull(sal)} par mois</em>, prélevé sur votre trésorerie à chaque manche.`);
  saveGame();
}
function licencierStaff(roleId){
  const s=S.staff[roleId]; if(!s) return;
  const indem = Math.round(s.salaire*1.5);
  argent('Indemnité de départ — '+STAFF_ROLE[roleId].nom, -indem, 'staff');
  delete S.staff[roleId];
  saveGame();
}

/* ------------------------ 20. ACTIONS DE PRÉPARATION (entre 2 manches) */
const ACTIONS_SEMAINE = [
  {id:'entrainement', nom:'Séance d’entraînement', desc:'Progression ciblée, mais fatigue le pilote.'},
  {id:'repos',        nom:'Repos',                 desc:'Fait retomber la fatigue, un peu de moral.'},
  {id:'discussion',   nom:'Parler au pilote',      desc:'Choisir un ton — l’effet dépend de sa personnalité.'},
  {id:'dev',          nom:'Développement technique',desc:'Investir sur le matériel : performance de la voiture.'},
];
function entrainement(groupeId){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  S.actions--;
  const p=S.pilote, g=STAT_GROUPES.find(x=>x.id===groupeId);
  const cAge=coeffAge(p.age), cStaff=1+staffNiv('ingenieur')*0.045+staffNiv('prepa')*0.035;
  const cMoral=0.7+(p.moral/100)*0.6, cTrait=p.traits.includes('bosseur')?1.25:1;
  const gains={};
  for(const [k] of g.stats){
    const m=1-p.stats[k]/p.plafonds[k];
    if(m<=0){gains[k]=0;continue;}
    const gain = 0.85*cAge*cStaff*cMoral*cTrait*m*rnd(1.3,0.6);
    p.stats[k]=clamp(p.stats[k]+gain,1,99);
    gains[k]=gain;
  }
  p.fatigue=clamp(p.fatigue+rint(7,13)-staffNiv('prepa')*2,0,100);
  majForme();
  saveGame();
  return {groupe:g.nom, gains};
}
function repos(){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  S.actions--;
  const p=S.pilote;
  const r = 14 + staffNiv('prepa')*5;
  p.fatigue=clamp(p.fatigue-r,0,100);
  p.moral=clamp(p.moral+3,5,100);
  majForme();
  saveGame();
  return {recup:r};
}
function developpement(montant){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  if(!S.saison){ return null; }
  if(S.saison.caisse < montant){ showToast('La caisse de saison ne le permet pas'); return null; }
  S.actions--;
  caisse('Développement technique', -montant, 'dev');
  S.saison.devDepense += montant;
  // rendement décroissant : plus on a déjà investi, moins ça rapporte
  const ref = Math.max(20000, CAT[S.saison.catId].cout*0.25);
  const gain = 3.2 * Math.log10(1 + montant/ref*9) * (1 - S.saison.devDepense/(ref*14));
  const g = clamp(gain, 0, 4);
  S.saison.voiture = clamp(S.saison.voiture + g, 30, 99);
  saveGame();
  return {gain:g};
}

/* --------------------------------------------- 21. BOUCLE DE JEU */
function financementCouvert(){
  if(!S.saison) return 0;
  const c=CAT[S.saison.catId];
  const restants = c.courses - S.saison.courseIndex;
  const besoin = Math.round(S.saison.coutTotal/c.courses)*restants;
  const attendu = sum(S.sponsors.actifs, s=>Math.round(s.montant*(1-s.partConditionnelle)/c.courses)*restants);
  return besoin<=0 ? 1 : clamp((S.saison.caisse + attendu)/besoin, 0, 2);
}
function faillite(){ return S.manager.budget < -60000; }

function avancerSemaine(){
  // Fin des actions de préparation -> on part en week-end de course
  ouvrirWeekend();
}
function finirWeekend(){
  S.saison.courseIndex++;
  S.weekend=null;
  if(S.flags.ruptureEnCours){
    S.flags.ruptureEnCours=false;
    terminerSaison(true);
    saveGame();
    return;
  }
  if(faillite()){ S.phase='faillite'; saveGame(); return; }
  if(S.saison.courseIndex >= S.saison.calendrier.length){
    terminerSaison(false);
  }else{
    S.phase='semaine';
    S.actions=actionsParSemaine();
    S.flags.bonusReglages = 0;
    // Plusieurs semaines séparent deux manches : le pilote récupère seul.
    // Sans cela, un manager qui utilise tout son temps de piste finirait
    // la saison avec un pilote épuisé, ce qui n'a aucun sens.
    S.pilote.fatigue = clamp(S.pilote.fatigue - (9 + staffNiv('prepa')*2.5), 0, 100);
    majForme();
    majSponsorsProspects();
  }
  saveGame();
}

/* --- composants --- */
function bar(nom, val, plaf){
  const pct = clamp(val,0,99), pp = plaf?clamp(plaf,0,99):null;
  return `<div class="stat-line"><span class="n">${nom}</span>
    <span class="bar"><i style="width:${pct}%"></i>${pp?`<u style="left:${pp}%"></u>`:''}</span>
    <span class="v">${Math.round(val)}</span></div>`;
}
function gline(nom, val, coul, suffixe){
  return `<div class="gline"><span class="n">${nom}</span>
    <span class="gauge g-${coul}"><i style="width:${clamp(val,0,100)}%"></i></span>
    <span class="v">${Math.round(val)}${suffixe||''}</span></div>`;
}
function tag(txt, cls){ return `<span class="tag ${cls||'t-grey'}">${escapeHtml(txt)}</span>`; }
function couleurMoral(v){ return v>=65?'green':v>=40?'amber':'red'; }
function kpi(l,v,s,cls){ return `<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }
function noteBadge(n){
  const cls = n>=85?'top' : n>=72?'hi':'';
  return `<div class="big ${cls}">${Math.round(n)}</div>`;
}
function echelle(catId){
  return `<div class="ladder">`+CATS.map(c=>{
    const cls = c.id===catId?'now' : (catId && CAT[catId].niv>c.niv)?'done':'';
    return `<div class="st ${cls}">${c.court.replace('-','<br>')}</div>`;
  }).join('')+`</div>`;
}

function renderBureau(){
  const p=S.pilote, sa=S.saison, rp=repPalier(S.manager.repPoints), suiv=repProchain(S.manager.repPoints);
  let h='';

  if(S.phase==='faillite'){
    $('#v-bureau').innerHTML = `<div class="card accent center">
      <h2 style="justify-content:center">Fin de partie</h2>
      <div class="sect-title">Faillite</div>
      <div class="note mb">Votre trésorerie est descendue à ${fmtEurFull(S.manager.budget)}. Plus personne ne vous suit.</div>
      <div class="note mb">${S.stats.saisonsJouees} saison(s) · ${S.stats.coursesGagnees} victoire(s) · ${S.stats.titres} titre(s)</div>
      <button class="btn btn-cta btn-block mt" data-act="nouvellePartieDepuisFin">Recommencer une carrière</button>
    </div>`;
    return;
  }

  // ---- bandeau réputation / argent
  h += `<div class="kpis">
    ${kpi('Réputation', rp.p+'/10', rp.nom, '')}
    ${kpi('Trésorerie', fmtEur(S.manager.budget), 'Manager', S.manager.budget<0?'red':S.manager.budget<20000?'amber':'green')}
    ${sa?kpi('Caisse de saison', fmtEur(sa.caisse), 'Finance la saison', sa.caisse<0?'red':sa.caisse<Math.round(sa.coutTotal/CAT[sa.catId].courses)?'amber':'green'):kpi('Caisse de saison','—','Hors saison','')}
    ${kpi('Image médiatique', Math.round(S.manager.image), 'Attractivité sponsors','blue')}
  </div>`;

  if(suiv){
    const prev = rp.seuil, span = suiv.seuil-prev, fait = S.manager.repPoints-prev;
    h += `<div class="card"><h2>Progression de réputation<span class="hint">palier ${suiv.p} : ${suiv.nom}</span></h2>
      ${gline('Vers '+suiv.nom, fait/span*100, 'blue','%')}
      <div class="note mt">${suiv.acces}</div>
      <div class="note txt-muted mt">Chaque palier est plus long que le précédent : ${Math.round(span)} points à couvrir ici.</div>
    </div>`;
  }

  // ---- CTA principal selon la phase
  h += ctaBureau();

  // ---- pilote
  if(p){
    const n=notePilote(p);
    h += `<div class="card"><h2>Votre pilote</h2>
      <div class="ovr">${noteBadge(n)}
        <div style="flex:1">
          <div style="font-family:var(--cond);font-size:20px;font-weight:700">${escapeHtml(p.nom)}</div>
          <div class="note">${p.age} ans · ${p.pays} · ${CAT[p.catId].nom}</div>
          <div class="row tight mt">${p.traits.map(t=>tag(TRAITS[t].nom,TRAITS[t].coul)).join('')}</div>
        </div>
      </div>
      <div class="hr"></div>
      ${gline('Moral', p.moral, couleurMoral(p.moral))}
      ${gline('Forme', p.forme, couleurMoral(p.forme))}
      ${gline('Relation', p.relation, couleurMoral(p.relation))}
      ${gline('Réputation', p.reputation, 'blue')}
      ${p.relation<32?`<div class="note warn mt">⚠ La relation se dégrade sérieusement. Un pilote mal suivi change de manager — et vous perdez toutes vos commissions.</div>`:''}
    </div>`;
  }

  // ---- saison en cours
  if(sa && !sa.finie){
    const c=CAT[sa.catId], prochaine=sa.calendrier[sa.courseIndex];
    const cv = financementCouvert();
    h += `<div class="card"><h2>Saison ${sa.annee} — ${c.nom}<span class="hint">${sa.ecurieNom}</span></h2>
      ${echelle(sa.catId)}
      <div class="kpis" style="margin:10px 0 6px">
        ${kpi('Manche', (sa.courseIndex+1)+' / '+c.courses, prochaine?prochaine.nom:'—','')}
        ${kpi('Points', sa.pts, ordinal(positionChampionnat())+' au général','')}
        ${kpi('Victoires', sa.victoires, sa.podiums+' podium(s)', sa.victoires?'amber':'')}
        ${kpi('Voiture', Math.round(sa.voiture), 'Performance matériel','blue')}
      </div>
      ${gline('Financement couvert', cv*100, cv>=1?'green':cv>=0.7?'amber':'red','%')}
      ${cv<1?`<div class="note warn mt">Il manque du sponsoring pour boucler la saison. Chaque manche non financée est prélevée sur votre trésorerie.</div>`:''}
    </div>`;
  }

  // ---- derniers messages
  const derniers = S.inbox.slice(0,3);
  if(derniers.length){
    h += `<div class="card"><h2>Messagerie<span class="hint">${nbNonLus()} non lu(s)</span></h2>
      ${derniers.map(m=>`<div class="msg ${m.lu?'':'unread'}" data-act="ouvrirMsg" data-id="${m.id}">
        <div class="top"><span class="fr">${escapeHtml(m.from)}</span><span>${escapeHtml(m.date)}</span></div>
        <div class="sj">${escapeHtml(m.sujet)}</div></div>`).join('')}
      <button class="btn-ghost btn-sm btn-block mt" data-act="tab" data-tab="inbox">Toute la messagerie</button>
    </div>`;
  }

  $('#v-bureau').innerHTML = h;
}

  const p=S.pilote, sa=S.saison;
  if(S.phase==='scouting'){
    return `<div class="card accent"><h2>À faire maintenant</h2>
      <div class="note mb">Vous n’avez pas de pilote. Sans pilote, pas de commission, et le staff continue de coûter.</div>
      <button class="btn btn-cta btn-block" data-act="tab" data-tab="pilote">Consulter le vivier de jeunes pilotes</button></div>`;
  }
  if(S.phase==='intersaison'){
    if(!S.contrat || S.contrat.anneeDebut!==S.annee){
      return `<div class="card accent"><h2>Intersaison ${S.annee}</h2>
        <div class="note mb">Aucun engagement pour cette saison. Il faut trouver un baquet à ${escapeHtml(p.nom)}.</div>
        <button class="btn btn-cta btn-block" data-act="ouvrirOffres">Étudier les offres d’écuries</button></div>`;
    }
    const c=CAT[S.contrat.catId];
    const apport = S.contrat.apport;
    const sponsorise = sum(S.sponsors.actifs, s=>s.montant);
    return `<div class="card accent"><h2>Prêt pour la saison ${S.annee}</h2>
      <div class="note mb">Engagement en <b>${c.nom}</b> avec <b>${escapeHtml(S.contrat.ecurieNom)}</b>.
      ${apport>0?`Apport à financer : <b>${fmtEurFull(apport)}</b> — sponsors actuels : <b class="${sponsorise>=apport?'txt-green':'txt-amber'}">${fmtEurFull(sponsorise)}</b>.`:'Le pilote est payé par l’écurie.'}</div>
      ${apport>0 && sponsorise<apport*0.5 ? `<div class="note warn mb">Vous pouvez démarrer sans le budget complet, mais chaque manche non couverte tapera dans votre trésorerie.</div>`:''}
      <div class="row">
        <button class="btn-ghost" data-act="tab" data-tab="sponsors">Chercher des sponsors</button>
        <button class="btn btn-cta" style="flex:1" data-act="lancerSaison">Lancer la saison</button>
      </div></div>`;
  }
  if(S.phase==='semaine'){
    const prochaine=sa.calendrier[sa.courseIndex];
    return `<div class="card accent"><h2>Préparation — manche ${sa.courseIndex+1}<span class="hint">${S.actions} action(s) restante(s)</span></h2>
      <div class="note mb">Prochaine manche : <b>${prochaine.nom}</b> (${prochaine.pays}) — circuit ${prochaine.type.toLowerCase()}.</div>
      <div class="row tight mb">
        <button class="btn-ghost btn-sm" data-act="modalEntrainement" ${S.actions<=0?'disabled':''}>Entraînement</button>
        <button class="btn-ghost btn-sm" data-act="actionRepos" ${S.actions<=0?'disabled':''}>Repos</button>
        <button class="btn-ghost btn-sm" data-act="modalDiscussion" ${S.actions<=0?'disabled':''}>Parler au pilote</button>
        <button class="btn-ghost btn-sm" data-act="modalDev" ${S.actions<=0?'disabled':''}>Développement</button>
        <button class="btn-ghost btn-sm" data-act="tab" data-tab="sponsors" ${S.actions<=0?'disabled':''}>Démarcher un sponsor</button>
      </div>
      <div class="row">
        <button class="btn-ghost" style="flex:1" data-act="simRapide">Simulation rapide</button>
        <button class="btn btn-cta" style="flex:2" data-act="allerWeekend">Aller au week-end de course</button>
      </div>
      <div class="note txt-muted mt">La simulation rapide règle la voiture toute seule (selon votre ingénieur) et donne le résultat immédiatement.</div>
    </div>`;
  }
  if(S.phase==='weekend'){
    const w=S.weekend, et=w.etapes[Math.min(w.etape,w.etapes.length-1)];
    return `<div class="card accent"><h2>Week-end en cours</h2>

  return '';
}

function renderPilote(){
  if(!S.pilote){ renderScouting(); return; }
  const p=S.pilote, n=notePilote(p), plaf=notePlafond(p);
  const ePlaf = estimTexte(p, plaf, 'plafGlobal');
  let h='';
  h += `<div class="card">
    <div class="ovr">${noteBadge(n)}
      <div style="flex:1">
        <div style="font-family:var(--cond);font-size:23px;font-weight:700;line-height:1.05">${escapeHtml(p.nom)}</div>
        <div class="note">${p.age} ans · ${p.pays} · ${CAT[p.catId].nom}${S.contrat?' · '+escapeHtml(S.contrat.ecurieNom):''}</div>
        <div class="row tight mt">${p.traits.map(t=>tag(TRAITS[t].nom,TRAITS[t].coul)).join('')}</div>
      </div>
    </div>
    <div class="note txt-muted mt">Plafond <b>estimé</b> de la note globale : <b>${ePlaf}</b> — potentiel estimé « ${estimPotentiel(p)} ».
    Les repères clairs sur les barres situent le plafond estimé de chaque statistique : vous ne connaîtrez jamais sa vraie limite,
    seulement une fourchette qui se resserre avec un bon scout et les saisons passées ensemble.</div>
  </div>`;

  h += `<div class="card"><h2>Statistiques<span class="hint">Note = Pace×0,40 + Consistency×0,30 + Racecraft×0,30</span></h2>`;
  for(const g of STAT_GROUPES){
    const gv = noteGroupe(p,g.id);
    h += `<div class="grp"><div class="h"><b>${g.nom}</b><span>${Math.round(gv)}</span></div>
      ${g.stats.map(([k,nom])=>bar(nom,p.stats[k],estim(p,p.plafonds[k],'plaf'+k).c)).join('')}</div>`;
  }
  h += `</div>`;

  h += `<div class="card"><h2>État du pilote</h2>
    ${gline('Moral', p.moral, couleurMoral(p.moral))}
    ${gline('Forme physique', p.forme, couleurMoral(p.forme))}
    ${gline('Fatigue', p.fatigue, p.fatigue>60?'red':p.fatigue>35?'amber':'green')}
    ${gline('Relation avec vous', p.relation, couleurMoral(p.relation))}
    ${gline('Réputation du pilote', p.reputation, 'blue')}
    ${gline('Agressivité', p.agressivite, p.agressivite>75?'red':'amber')}
    <div class="note txt-muted mt">Une agressivité élevée multiplie les dépassements… et les abandons.</div>
  </div>`;

  // superlicence
  const tot = totalSuperlicence();
  h += `<div class="card"><h2>Superlicence FIA<span class="hint">${SUPERLIC_REQUIS} points sur 3 ans</span></h2>
    ${gline('Points acquis', tot/SUPERLIC_REQUIS*100, tot>=SUPERLIC_REQUIS?'green':'amber', '%')}
    <div class="note mt"><b>${tot} / ${SUPERLIC_REQUIS} points</b> ${tot>=SUPERLIC_REQUIS?'— éligible à la Formule 1'+(p.age<18?' dès ses 18 ans':''):'— la F1 reste fermée'}.</div>
    ${p.superlicence.length?`<div class="tw mt"><table><thead><tr><th>Année</th><th>Catégorie</th><th>Classement</th><th class="num">Points</th></tr></thead><tbody>
      ${p.superlicence.slice().reverse().map(s=>`<tr><td>${s.annee}</td><td>${CAT[s.catId].court}</td><td>${ordinal(s.pos)}</td><td class="num">${s.pts}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="note txt-muted mt">Aucun point pour l’instant. Seuls la KZ, la F4, la F3 et la F2 en rapportent.</div>'}
  </div>`;

  // palmarès
  if(p.palmares.length){
    h += `<div class="card"><h2>Palmarès</h2><div class="tw"><table>
      <thead><tr><th>Saison</th><th>Catégorie</th><th>Écurie</th><th>Class.</th><th class="num">Pts</th><th class="num">V</th><th class="num">P</th></tr></thead><tbody>
      ${p.palmares.slice().reverse().map((x,i)=>{
        const hi=S.historique.filter(z=>z.annee===x.annee)[0]||{};
        return `<tr><td>${x.annee}</td><td>${CAT[x.catId].nom}</td><td>${escapeHtml(hi.ecurie||'—')}</td>
        <td><span class="pos p${x.pos<=3?x.pos:''}">${x.pos}</span></td><td class="num">${x.pts}</td>
        <td class="num">${x.victoires}</td><td class="num">${x.podiums}</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  }

  h += `<div class="card"><h2>Parcours</h2>${echelle(p.catId)}
    <div class="note txt-muted mt">Karting Mini → Cadet → Junior → Senior → KZ → F4 → F3 → F2 → F1</div></div>`;

  $('#v-pilote').innerHTML = h;
}

/* -------------------------- ÉCRAN : SCOUTING (pas encore de pilote) */
function renderScouting(){
  const rp=repPalier(S.manager.repPoints);
  const sc=staffNiv('scout');
  let h = `<div class="card accent"><h2>Repérage</h2>
    <div class="note mb">Votre réputation (« ${rp.nom} ») détermine qui accepte de vous rencontrer.
    ${sc? `Votre scout ${NIV_LABEL[sc].toLowerCase()} affine les estimations.` : `<b class="txt-amber">Vous n’avez aucun scout :</b> les estimations sont très larges.`}</div>
    <div class="note txt-muted">Vous ne verrez <b>jamais</b> la valeur exacte d’un jeune. Une observation supplémentaire (payante) resserre la fourchette.</div>
    ${!sc?`<button class="btn-ghost btn-sm mt" data-act="tab" data-tab="staff">Recruter un scout</button>`:''}
  </div>`;

  for(const c of S.monde.scoutPool){
    const noteEst = estimTexte(c, notePilote(c), 'note');
    const pot = estimPotentiel(c);
    const coutObs = 400 + c.observe*700 + CAT[c.catId].niv*450;
    h += `<div class="card">
      <div class="row" style="align-items:flex-start">
        <div style="flex:1">
          <div style="font-family:var(--cond);font-size:19px;font-weight:700">${escapeHtml(c.nom)}</div>
          <div class="note">${c.age} ans · ${c.pays} · ${CAT[c.catId].nom}</div>
        </div>
        <div class="center">
          <div class="l small txt-muted">NOTE ESTIMÉE</div>
          <div style="font-family:var(--cond);font-size:24px;font-weight:700;color:var(--amber)">${noteEst}</div>
        </div>
      </div>
      <div class="hr"></div>
      <div class="row" style="gap:14px">
        <div><div class="small txt-muted">Potentiel estimé</div><div class="b">${pot}</div></div>
        <div><div class="small txt-muted">Observations</div><div class="b">${c.observe} · marge ±${round(marge(c),1)}</div></div>
      </div>
      <div class="row tight mt">${traitsRevele(c).map(t=>tag(TRAITS[t].nom,TRAITS[t].coul)).join('') || tag('Personnalité inconnue','t-grey')}</div>
      <div class="mt">${STAT_GROUPES.map(g=>{
        const v = noteGroupe(c,g.id);
        return `<div class="stat-line"><span class="n">${g.nom}</span>
          <span class="bar"><i style="width:${clamp(v,0,99)}%;opacity:.55"></i></span>
          <span class="v" style="width:70px;flex:0 0 70px">${estimTexte(c,v,g.id)}</span></div>`;
      }).join('')}</div>
      <div class="row mt">
        <button class="btn-ghost btn-sm" data-act="observer" data-id="${c.id}">Observer — ${fmtEur(coutObs)}</button>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-act="signerPilote" data-id="${c.id}">Proposer un management</button>
      </div>
    </div>`;
  }
  h += `<div class="card flat"><div class="note txt-muted">Le vivier se renouvelle à chaque nouvelle saison, et s’élargit avec votre réputation.</div></div>`;
  $('#v-pilote').innerHTML = h;
}
function traitsRevele(c){
  const niv=staffNiv('scout');
  if(niv>=4 || c.observe>=3) return c.traits;
  if(niv>=2 || c.observe>=2) return c.traits.slice(0,2);
  if(niv>=1 || c.observe>=1) return c.traits.slice(0,1);
  return [];
}
ACTIONS.observer = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  const cout = 400 + c.observe*700 + CAT[c.catId].niv*450;
  if(S.manager.budget<cout){ showToast('Trésorerie insuffisante'); return; }
  argent('Observation — '+c.nom, -cout, 'scouting');
  c.observe++;
  saveGame(); render();
  showToast('Fourchette resserrée : ±'+round(marge(c),1));
};
ACTIONS.signerPilote = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  const rp=repPalier(S.manager.repPoints).p;
  // Un jeune très prometteur ne signe pas avec n'importe qui
  const exigence = CAT[c.catId].niv*0.9 + (c.potId-1)*1.1;
  const proba = clamp(0.45 + (rp-exigence)*0.13, 0.08, 0.97);
  openModal('Proposer un management',
    `<div class="note mb">Vous proposez à <b>${escapeHtml(c.nom)}</b> (et à son entourage) de le représenter.</div>
     <div class="note mb">Votre réputation : <b>${rp}/10</b>. Chances estimées d’acceptation : <b>${Math.round(proba*100)} %</b>.</div>
     <div class="note txt-muted">Un refus ne coûte rien d’autre que du temps — mais un jeune approché trop tôt se souvient de vous.</div>`,
    `<button class="btn-ghost" data-act="fermerModal">Annuler</button>
     <button class="btn" data-act="confirmSignerPilote" data-id="${c.id}" data-proba="${proba}">Faire la proposition</button>`);
};
ACTIONS.confirmSignerPilote = d=>{
  const c=S.monde.scoutPool.find(x=>x.id===d.id); if(!c) return;
  if(Math.random() > +d.proba){
    c.refus=(c.refus||0)+1;
    closeModal(); render();
    showToast(c.nom+' décline votre proposition');
    return;
  }
  c.role='joueur'; c.relation=58; c.moral=Math.max(c.moral,62);
  S.pilote=c;
  S.monde.scoutPool = S.monde.scoutPool.filter(x=>x.id!==c.id);
  creerRivaux();
  S.phase='intersaison';
  S.actions=6;
  S.contrat=null;
  majSponsorsProspects();
  msg('pilote', c.nom, 'Ravi de travailler avec vous',
    `« Merci de croire en moi. Maintenant il faut trouver de quoi rouler. »\n\n`+
    `Prochaine étape : lui trouver un baquet (onglet Contrats) puis financer la saison (onglet Sponsors).`);
  closeModal(); saveGame(); go('bureau');
  showToast(c.nom+' rejoint votre écurie de management');
};
ACTIONS.fermerModal = ()=>closeModal();

/* ------------------------------------------------ ÉCRAN : MESSAGERIE */
const MSG_TAG = {sponsor:['Sponsor','t-green'], ecurie:['Écurie','t-red'], pilote:['Pilote','t-blue'],
  presse:['Presse','t-purple'], scout:['Scout','t-amber'], systeme:['Officiel','t-grey'], finance:['Finances','t-amber']};
function renderInbox(){
  let h = `<div class="row mb"><div class="sect-title" style="margin:0">Messagerie</div><div class="spacer"></div>
    <button class="btn-ghost btn-sm" data-act="toutLu">Tout marquer comme lu</button></div>`;
  if(!S.inbox.length) h += `<div class="card"><div class="empty">Aucun message.</div></div>`;
  for(const m of S.inbox){
    const t = MSG_TAG[m.type]||['Info','t-grey'];
    h += `<div class="msg ${m.lu?'':'unread'}" data-act="ouvrirMsg" data-id="${m.id}">
      <div class="top"><span class="fr">${escapeHtml(m.from)}</span>${tag(t[0],t[1])}<span class="spacer"></span><span>${escapeHtml(m.date)}</span></div>
      <div class="sj">${escapeHtml(m.sujet)}</div>
      ${m.ouvert?`<div class="bd">${m.corps}</div>
        ${m.reponse?`<div class="quote"><span class="who">Suite donnée</span>${escapeHtml(m.reponse)}</div>`:''}
        ${m.actions?renderMsgActions(m):''}`:''}
    </div>`;
  }
  $('#v-inbox').innerHTML = h;
}
function renderMsgActions(m){
  if(m.actions.kind==='demandePilote'){
    const d = DEMANDES_PILOTE.find(x=>x.id===m.actions.demandeId);
    return `<div class="msg-actions">`+d.options.map((o,i)=>
      `<button class="btn-ghost btn-sm" data-act="repDemande" data-id="${m.id}" data-i="${i}">${escapeHtml(o.lab)}</button>`).join('')+`</div>`;
  }
  return '';
}
ACTIONS.ouvrirMsg = d=>{
  const m=S.inbox.find(x=>x.id===d.id); if(!m) return;
  m.lu=true; m.ouvert=!m.ouvert;
  saveGame();
  if(UI.tab!=='inbox'){ go('inbox'); } else render();
};
ACTIONS.toutLu = ()=>{ S.inbox.forEach(m=>m.lu=true); saveGame(); render(); };
ACTIONS.repDemande = d=>{
  const m=S.inbox.find(x=>x.id===d.id); if(!m||!m.actions) return;
  const r = repondreDemande(m, +d.i);
  if(r) showToast(r.txt.slice(0,80));
  render();
};

/* ------------------------------------------- ÉCRAN : WEEK-END */
function renderWeekend(){
  if(S.phase!=='weekend' || !S.weekend){
    $('#v-weekend').innerHTML = `<div class="card"><div class="empty">Aucun week-end de course en cours.<br>Lancez-le depuis le Bureau.</div></div>`;
    return;
  }
  const w=S.weekend, sa=S.saison, course=sa.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  const et = w.etape>=w.etapes.length ? 'debrief' : w.etapes[w.etape];
  let h='';

  h += `<div class="card">
    <div class="row"><div style="flex:1">
      <div class="sect-title" style="margin:0">${escapeHtml(course.nom)}</div>
      <div class="note">${course.pays} · circuit ${course.type.toLowerCase()} · manche ${w.courseIdx+1}/${sa.calendrier.length}</div>
    </div>
    <div class="center"><div style="font-size:26px">${meteo.ico}</div><div class="small txt-2">${meteo.nom}</div></div></div>
    <div class="strip mt">
      ${w.etapes.map((e,i)=>`<div class="it">${i<w.etape?'✓':i===w.etape?'▶':'·'} <b class="${i===w.etape?'txt-red':''}">${ETAPE_NOM[e]}</b></div>`).join('<div class="sep"></div>')}
      <div class="sep"></div><div class="it">${w.etape>=w.etapes.length?'▶ <b class="txt-red">Débrief</b>':'· Débrief'}</div>
    </div>
  </div>`;

  if(et==='libres'||et==='essais') h += vueEssais(course, meteo);
  else if(et==='qualifs')          h += vueQualifs(course);
  else if(et==='course')           h += vueCourse(course, meteo);
  else                             h += vueDebrief(course);

  $('#v-weekend').innerHTML = h;
  // brancher les sliders
  $$('input[data-setup]').forEach(inp=>{
    inp.oninput = e=>{
      S.weekend.setup[e.target.dataset.setup] = +e.target.value;
      const lab = e.target.closest('.setup-row').querySelector('.lab span');
      if(lab) lab.textContent = e.target.value;
    };
    inp.onchange = ()=>saveGame();
  });
}

/* Le « meilleur » run est le meilleur selon ce que le stand croit savoir.
   Sans ingénieur, ce jugement est celui du pilote — et il peut se tromper. */
function meilleurRun(){
  const w=S.weekend;
  if(!w || !w.runs.length) return null;
  return w.runs.reduce((b,r)=> !b || (r.percu??r.score)>(b.percu??b.score) ? r : b, null);
}
function memeSetup(a,b){
  return setupParams(S.saison.catId).every(p=>(a[p.k]??10)===(b[p.k]??10));
}
/* Bandeau proposant de revenir au meilleur réglage trouvé pendant les essais.
   Affiché aussi avant les qualifs et avant la course : c'est là qu'on en a besoin. */
function rappelMeilleurReglage(course){
  const w=S.weekend, best=meilleurRun();
  if(!best) return '';
  const dejaDessus = memeSetup(w.setup, best.setup);
  const niv = staffNiv('ingenieur');
  const runMonte = w.runs.find(r=>memeSetup(w.setup, r.setup));
  const aff = afficheScore(best.percu??best.score, best.nivIng);
  const affMonte = runMonte ? afficheScore(runMonte.percu??runMonte.score, runMonte.nivIng) : null;
  return `<div class="card ${dejaDessus?'flat':'accent'}">
    <h2>Réglage retenu<span class="hint">${w.runs.length} run(s) fait(s)</span></h2>
    <div class="row" style="align-items:center">
      <div style="flex:1">
        <div class="note">Sur la voiture : ${runMonte
          ? `réglage du run ${runMonte.n} — <b class="${affMonte.cls==='t-green'?'txt-green':affMonte.cls==='t-amber'?'txt-amber':'txt-red'}">${affMonte.txt}</b>`
          : `<span class="txt-muted">un réglage jamais essayé en piste</span>`}</div>
        <div class="note txt-muted">${niv>=3?'Meilleur':'Le mieux ressenti'} en essais : <b>${aff.txt}</b> (run ${best.n})</div>
      </div>
      ${dejaDessus
        ? tag(niv>=3?'C’est le meilleur':'C’est celui-là','t-green')
        : `<button class="btn btn-sm" data-act="reprendreReglage" data-n="${best.n}">Reprendre ${niv>=3?'le meilleur':'celui-là'}</button>`}
    </div>
    ${niv<3?`<div class="note txt-muted mt">Sans ingénieur confirmé, personne ne mesure vraiment le réglage :
      ce classement est le ressenti du pilote, et il peut se tromper.</div>`:''}
  </div>`;
}

function vueEssais(course, meteo){
  const w=S.weekend, params=setupParams(S.saison.catId);
  const sc = scoreReglages(course, w.setup, S.pilote).score;
  const ing = staffNiv('ingenieur');
  const best = meilleurRun();
  let h = `<div class="card"><h2>Réglages<span class="hint">${w.runsRestants} run(s) restant(s)</span></h2>
    <div class="note mb">Chaque circuit a un réglage optimal <b>caché</b>, décalé par les préférences du pilote.
    Vous le cherchez par essais successifs — et vous repartez de zéro au circuit suivant.</div>
    ${params.map(p=>`<div class="setup-row">
      <div class="lab"><b>${p.n}</b><span>${w.setup[p.k]}</span></div>
      <input type="range" min="1" max="20" step="1" value="${w.setup[p.k]}" data-setup="${p.k}">
    </div>`).join('')}
    <div class="row mt">
      <button class="btn" style="flex:1" data-act="faireRun" ${w.runsRestants<=0?'disabled':''}>Envoyer en piste</button>
      <button class="btn-ghost" data-act="etapeSuivante">Passer à « ${ETAPE_NOM[w.etapes[w.etape+1]]} »</button>
    </div>
    ${w.runsRestants<=0?`<div class="note warn mt">Plus de temps de piste. Vous pouvez encore ajuster les curseurs
      ou reprendre un réglage déjà essayé — mais vous ne saurez pas ce que ça donne avant la course.</div>`:''}
  </div>`;

  h += rappelMeilleurReglage(course);

  if(w.runs.length){
    h += `<div class="card"><h2>Retour du pilote<span class="hint">${ing?NIV_LABEL[ing]+' à l’ingénierie':'Aucun ingénieur'}</span></h2>`;
    w.runs.forEach((r,i)=>{
      const estBest = best && r.n===best.n;
      const monte = memeSetup(w.setup, r.setup);
      h += `<div class="${i?'mt2':''}">
        <div class="row tight">
          <b class="small">Run ${r.n}</b>
          ${(()=>{const a=afficheScore(r.percu??r.score, r.nivIng);return tag(a.txt,a.cls);})()}
          ${estBest?tag(staffNiv('ingenieur')>=3?'meilleur':'le mieux ressenti','t-amber'):''}
          <div class="spacer"></div>
          ${monte
            ? `<span class="small txt-muted">monté sur la voiture</span>`
            : `<button class="btn-ghost btn-xs" data-act="reprendreReglage" data-n="${r.n}">Reprendre</button>`}
        </div>
        ${r.lignes.map(l=>`<div class="quote"><span class="who">${escapeHtml(S.pilote.nom)}</span>${escapeHtml(l)}</div>`).join('')}
        <div class="note txt-muted">${escapeHtml(r.ing)}</div>
      </div>`;
    });
    h += `</div>`;
  }else{
    h += `<div class="card flat"><div class="note">Envoyez le pilote en piste pour obtenir ses sensations.
      Sans ingénieur de course, il décrira ce qu’il ressent sans que personne ne traduise ça en réglage —
      à vous de faire le lien.</div></div>`;
  }

  h += `<div class="card flat">
    <h2>Traduire ce que dit le pilote<span class="hint">aide-mémoire</span></h2>
    <div class="note mb">Ce tableau ne change jamais : c’est le métier. Ce qui reste caché, c’est
    <b>à quelle valeur</b> le circuit et le pilote sont bons.</div>
    <div class="tw"><table><thead><tr><th>Il se plaint de…</th><th>Paramètre</th><th>Correction</th></tr></thead><tbody>
    ${params.map(pm=>`
      <tr><td class="wrap">${escapeHtml(pm.lo)}</td><td>${pm.n}</td><td class="txt-green">${escapeHtml(pm.loFix)}</td></tr>
      <tr><td class="wrap">${escapeHtml(pm.hi)}</td><td>${pm.n}</td><td class="txt-blue">${escapeHtml(pm.hiFix)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="note txt-muted mt">${staffNiv('ingenieur')>=5
      ? `Votre ingénieur expert mesure le réglage actuel à <b>${Math.round(sc)}/100</b>.`
      : `La qualité d’un réglage ne se mesure qu’en piste, et seul un ingénieur expert la chiffre exactement.`}
      Cette variable pèse 15 % de la performance en course.</div>
  </div>`;
  return h;
}

function vueQualifs(course){
  const w=S.weekend;
  if(!w.grille){
    return `<div class="card accent"><h2>Qualifications</h2>
      <div class="note mb">Un tour lancé, sans trafic, avec les réglages trouvés en essais. La grille de départ compte beaucoup — surtout sur un circuit ${course.type.toLowerCase()}.</div>
      <button class="btn btn-cta btn-block" data-act="etapeSuivante">Lancer les qualifications</button></div>`;
  }
  const moi = w.grille.find(g=>g.id===S.pilote.id);
  let h = rappelMeilleurReglage(course);
  h += `<div class="card"><h2>Grille de départ<span class="hint">${ordinal(moi.pos)} sur ${w.grille.length}</span></h2>
    <div class="tw"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th></tr></thead><tbody>
    ${w.grille.slice(0,14).map(g=>`<tr class="${g.moi?'me':''}"><td><span class="pos p${g.pos<=3?g.pos:''}">${g.pos}</span></td>
      <td>${escapeHtml(g.nom)}</td><td class="txt-2">${escapeHtml(g.ecurie)}</td></tr>`).join('')}
    ${moi.pos>14?`<tr class="me"><td><span class="pos">${moi.pos}</span></td><td>${escapeHtml(moi.nom)}</td><td class="txt-2">${escapeHtml(moi.ecurie)}</td></tr>`:''}
    </tbody></table></div>
    <button class="btn btn-cta btn-block mt" data-act="etapeSuivante">Aller à la course</button></div>`;
  return h;
}

function vueCourse(course, meteo){
  const w=S.weekend;
  const moi = w.grille ? w.grille.find(g=>g.id===S.pilote.id) : null;
  const kart = CAT[S.saison.catId].format==='kart';
  let h = rappelMeilleurReglage(course);
  h += `<div class="card"><h2>Stratégie de course</h2>
    <div class="note mb">Départ ${moi?`en ${ordinal(moi.pos)} position`:''} · ${meteo.nom.toLowerCase()}.
    ${kart?'En karting, pas d’arrêt : tout se joue sur la gestion des pneus et l’agressivité.':'Une stratégie agressive gagne du temps mais use le matériel et augmente le risque d’abandon.'}</div>
    <div class="pills mb">${STRATS.map(s=>`<button class="pill ${w.strat===s.id?'on':''}" data-act="setStrat" data-id="${s.id}">${s.nom}</button>`).join('')}</div>
    <div class="note">${escapeHtml(STRATS.find(s=>s.id===w.strat).desc)}</div>
    <button class="btn btn-cta btn-block mt" data-act="lancerCourse">Départ</button>
  </div>`;
  return h;
}

function vueDebrief(course){
  const w=S.weekend, r=w.resultat, sa=S.saison;
  if(!r) return `<div class="card"><div class="empty">—</div></div>`;
  const moi = r.classement.find(x=>x.moi);
  let h = `<div class="card ${moi.pos===1?'accent':''}"><h2>Résultat — ${escapeHtml(course.nom)}</h2>
    <div class="row" style="align-items:center;gap:16px">
      <div class="center"><div class="pos p${moi.pos<=3?moi.pos:''}" style="font-size:44px;width:auto">${moi.abandon?'AB':moi.pos}</div>
        <div class="small txt-muted">${moi.abandon?escapeHtml(moi.abandon):'à l’arrivée'}</div></div>
      <div style="flex:1">
        <div class="note">Parti ${r.grillePos?ordinal(r.grillePos):'—'} · réglages ${Math.round(r.reglages)}/100${r.rapide?' (simulation rapide)':''}</div>
        <div class="note mt">Points marqués : <b>${moi.abandon?0:pointsPour(sa.catId,moi.pos)}</b> · total saison <b>${sa.pts}</b> (${ordinal(positionChampionnat())} au général)</div>
      </div>
    </div>
    <div class="log mt">${r.log.map(l=>`<div class="li ${l.c}"><span class="lp">${escapeHtml(l.t)}</span><span>${escapeHtml(l.s)}</span></div>`).join('')}</div>
  </div>`;

  h += `<div class="card"><h2>Classement de la course</h2><div class="tw"><table>
    <thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th><th></th></tr></thead><tbody>
    ${r.classement.slice(0,12).map(x=>`<tr class="${x.moi?'me':''}">
      <td><span class="pos p${x.pos<=3&&!x.abandon?x.pos:''}">${x.abandon?'AB':x.pos}</span></td>
      <td>${escapeHtml(x.nom)}</td><td class="txt-2">${escapeHtml(x.ecurie)}</td>
      <td>${x.abandon?tag(x.abandon,'t-red'):''}</td></tr>`).join('')}
    ${moi.pos>12?`<tr class="me"><td><span class="pos">${moi.abandon?'AB':moi.pos}</span></td><td>${escapeHtml(moi.nom)}</td>
      <td class="txt-2">${escapeHtml(moi.ecurie)}</td><td>${moi.abandon?tag(moi.abandon,'t-red'):''}</td></tr>`:''}
  </tbody></table></div></div>`;

  // conférence de presse
  if(w.presse && !w.presse.repondu){
    h += `<div class="card accent"><h2>Conférence de presse</h2>
      <div class="quote"><span class="who">Journaliste</span>${escapeHtml(w.presse.q)}</div>
      ${w.presse.reps.map(rp=>`<button class="choice" data-act="repPresse" data-id="${rp.t}">
        <b>${escapeHtml(rp.lab)}</b><small>${escapeHtml(rp.d)}</small></button>`).join('')}
      <div class="note txt-muted">Chaque réponse joue sur trois jauges : moral du pilote, relation avec l’écurie, image médiatique.</div>
    </div>`;
  }else if(w.presse){
    h += `<div class="card"><h2>Conférence de presse</h2>
      <div class="quote"><span class="who">Journaliste</span>${escapeHtml(w.presse.q)}</div>
      <div class="note">Votre réponse : <b>${escapeHtml(w.presse.repondu)}</b></div></div>`;
  }

  h += `<div class="card"><h2>Après la course</h2>
    <div class="row">

  if(!S.sponsors.prospects.length) h += `<div class="empty">Aucune piste. Faites grimper votre réputation.</div>`;

ACTIONS.demarcher = d=>{

/* GDD §8.2, condition 2 : le budget de la saison suivante doit être sécurisé.
   Les sponsors sous contrat le sécurisent ; la trésorerie du manager ne fait que
   combler un manque, et cela se voit. */
function etatBudgetOffre(o){
  if(o.apport<=0) return '';
  const secure = budgetSecurise();
  const manque = Math.max(0, o.apport - secure);
  if(manque<=0){
    return `<div class="note txt-green mt">✓ Budget sécurisé : ${fmtEur(secure)} de sponsors sous contrat couvrent l’apport.</div>`;
  }
  const couvrable = S.manager.budget >= manque;
  return `<div class="note ${couvrable?'warn':'txt-red'} mt">
    ${couvrable?'⚠':'✗'} Budget non sécurisé : ${fmtEur(secure)} de sponsors pour ${fmtEur(o.apport)} d’apport,
    il manque <b>${fmtEur(manque)}</b>.<br>
    ${couvrable
      ? `Vous pouvez vous porter garant sur votre trésorerie (${fmtEur(S.manager.budget)}), mais elle y passera.`
      : `Votre trésorerie (${fmtEur(S.manager.budget)}) ne comble pas le manque. Trouvez des sponsors avant de signer.`}
  </div>`;
}
function boutonSignature(o){
  if(o.apport<=0) return `<button class="btn btn-sm" data-act="accepterOffre" data-id="${o.id}">Accepter</button>`;
  const manque = Math.max(0, o.apport - budgetSecurise());
  if(manque<=0) return `<button class="btn btn-sm" data-act="accepterOffre" data-id="${o.id}">Accepter</button>`;
  if(S.manager.budget >= manque)
    return `<button class="btn-warn btn-sm" data-act="accepterOffre" data-id="${o.id}">Signer et se porter garant</button>`;
  return `<button class="btn btn-sm" disabled>Budget insuffisant</button>`;
}

/* Baquet de secours. GDD §8.2 : « Descendre d'une catégorie survient après un
   renvoi, ou lorsqu'aucun budget n'a pu être réuni pour la saison suivante. »
   On redescend donc jusqu'à la première catégorie réellement finançable, chez
   l'écurie la plus modeste — qui prend une part du budget à sa charge, faute
   de mieux. Le bas de l'échelle est toujours accessible : c'est le filet. */
function categorieDeSecours(){
  const dispo = budgetSecurise() + Math.max(0, S.manager.budget);
  const age = S.pilote.age;
  // On ne redescend pas plus bas que ce que l'âge du pilote autorise : un pilote
  // de 17 ans n'a rien à faire en Karting Mini, dont la limite est 13 ans.
  const nivPlancher = Math.max(0, ...CATS.filter(c=>age<=c.ageMax).map(c=>c.niv).length
    ? [Math.min(...CATS.filter(c=>age<=c.ageMax).map(c=>c.niv))] : [0]);
  let niv = CAT[S.pilote.catId].niv;
  while(niv>nivPlancher){
    const c = catByNiv(niv);
    if(c.cout*0.65 <= dispo) break;      // l'écurie modeste prend 35 % à sa charge
    niv--;
  }
  return catByNiv(niv);
}
ACTIONS.baquetSecours = ()=>{
  const c = categorieDeSecours();
  const e = ecuriesPour(c.id).slice(-1)[0];
  const partEcurie = 0.35;
  const apport = Math.max(0, Math.round(c.cout*(1-partEcurie)/1000)*1000);
  const descente = c.niv < CAT[S.pilote.catId].niv;
  signerOffre({id:uid(), catId:c.id, ecurieId:e.id, ecurieNom:e.nom, prestige:e.prestige, voiture:e.voiture,
    junior:false, partEcurie, apport, salaire:0, primeVictoire:0, primePoint:0, duree:1,
    objectifPos:Math.round(c.grille*0.7), clauseLiberation:false, bonusFidelite:0, bonusVoiture:0});
  if(descente){
    msg('systeme','Paddock','Retour en '+c.nom,
      `Faute de budget et d’offre, ${S.pilote.nom} redescend en ${c.nom} chez ${e.nom}.\n\n`+
      `Ce n’est pas la fin : c’est là qu’on reconstruit une réputation et qu’on retrouve des sponsors.`);
    gagnerRep(-Math.round(15 + CAT[S.pilote.catId].niv*5), 'descente de catégorie');
  }
  S.phase='intersaison';
  closeModal(); saveGame(); go('bureau');
};

/* Panneau des trois conditions cumulatives du GDD §8.2. C'est ce qui explique
   au joueur pourquoi la montée est ouverte ou fermée, avant qu'il ne cherche. */
function panneauMontee(){
  const p=S.pilote, catAct=CAT[p.catId];
  const sup = catByNiv(catAct.niv+1);
  if(!sup) return `<div class="card"><h2>Montée de catégorie</h2>
    <div class="note">${escapeHtml(p.nom)} est en Formule 1 : il n’y a rien au-dessus.</div></div>`;
  const apportType = Math.round(sup.cout * 0.6);
  const k = conditionsMontee(sup.id, apportType);
  if(!k) return '';
  const ligne = (ok, titre, detail) => `<div class="row" style="align-items:flex-start;gap:8px;padding:6px 0">
      <span style="flex:0 0 18px;font-weight:700" class="${ok?'txt-green':'txt-red'}">${ok?'✓':'✗'}</span>
      <div style="flex:1"><div class="b small">${titre}</div><div class="note txt-muted">${detail}</div></div>
    </div>`;

  const posTxt = k.pos===null
    ? 'Aucune saison complète terminée pour l’instant.'
    : `Dernier championnat : <b>${ordinal(k.pos)}</b> — il faut ${k.titre?'un titre':'un top '+k.posRequise}`
      + (k.bonus>0?` (top ${k.cond.pos} assoupli de ${k.bonus} places par le budget apporté)`:'')+'.';
  const slTxt = k.slRequis===0
    ? 'Aucun point de superlicence exigé à ce palier.'
    : `<b>${k.sl} / ${k.slRequis}</b> points sur 3 ans glissants. Les points ne s’achètent pas.`;
  const budTxt = `Sponsors sous contrat : <b>${fmtEur(k.secure)}</b>. `
    + `Un baquet type en ${sup.court} demande environ <b>${fmtEur(apportType)}</b> d’apport`
    + (k.manque>0 ? `, il manquerait <b class="txt-amber">${fmtEur(k.manque)}</b>.` : ` — c’est couvert.`);

  return `<div class="card ${k.ok?'':'accent'}">
    <h2>Monter en ${sup.nom}<span class="hint">3 conditions cumulatives</span></h2>
    <div class="note mb">${escapeHtml(k.cond.lib)} · âge conseillé ${k.cond.age[0]}-${k.cond.age[1]} ans.</div>
    ${ligne(k.sportifOk, 'Résultat sportif', posTxt)}
    ${ligne(k.slOk, 'Superlicence', slTxt)}
    ${ligne(k.ageOk, 'Âge', k.ageOk
      ? `${p.age} ans : les écuries de ${sup.court} peuvent l’engager${k.ageConseille?'':' — hors de la fenêtre idéale, elles seront plus difficiles à convaincre'}.`
      : `${p.age} ans : trop ${p.age<k.cond.age[0]?'jeune':'âgé'} pour la ${sup.court}, qui recrute entre ${k.cond.age[0]-1} et ${sup.ageMax} ans.`)}
    ${ligne(k.budgetOk, 'Budget sécurisé', budTxt)}
    <div class="note txt-muted mt">La troisième condition — qu’une écurie veuille du pilote — se lit dans les offres.
      Un champion sans budget ne monte pas : c’est l’argent le vrai filtre.</div>
  </div>`;
}

  h += `<div class="card flat"><div class="note">Le staff est payé sur <b>votre</b> trésorerie, pas sur la caisse de saison.

function renderChamp(){
  if(!S.saison){ $('#v-champ').innerHTML=`<div class="card"><div class="empty">Aucune saison en cours.</div></div>`; return; }
  const sa=S.saison, c=CAT[sa.catId], cl=classementChampionnat();
  let h=`<div class="card"><h2>${c.nom} ${sa.annee}<span class="hint">manche ${Math.min(sa.courseIndex+1,c.courses)}/${c.courses}</span></h2>
    <div class="tw"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Écurie</th><th class="num">Pts</th><th class="num">V</th><th class="num">P</th><th class="num">AB</th></tr></thead><tbody>
    ${cl.slice(0,16).map(x=>`<tr class="${x.moi?'me':''}"><td><span class="pos p${x.pos<=3?x.pos:''}">${x.pos}</span></td>
      <td>${escapeHtml(x.nom)}${x.rival?' '+tag('rival','t-amber'):''}</td><td class="txt-2">${escapeHtml(x.ecurie)}</td>
      <td class="num">${x.pts}</td><td class="num">${x.victoires}</td><td class="num">${x.podiums}</td><td class="num">${x.abandons}</td></tr>`).join('')}
    ${(cl.find(x=>x.moi)||{}).pos>16?(()=>{const m=cl.find(x=>x.moi);return `<tr class="me"><td><span class="pos">${m.pos}</span></td>
      <td>${escapeHtml(m.nom)}</td><td class="txt-2">${escapeHtml(m.ecurie)}</td><td class="num">${m.pts}</td>
      <td class="num">${m.victoires}</td><td class="num">${m.podiums}</td><td class="num">${m.abandons}</td></tr>`;})():''}
  </tbody></table></div></div>`;

  h+=`<div class="card"><h2>Calendrier</h2><div class="tw"><table>
    <thead><tr><th>#</th><th>Circuit</th><th class="hide-s">Pays</th><th class="hide-s">Type</th><th>Résultat</th><th class="num">Pts</th></tr></thead><tbody>
    ${sa.calendrier.map((ci,i)=>{
      const r=sa.resultats.find(x=>x.i===i);
      return `<tr class="${i===sa.courseIndex&&!sa.finie?'me':''}"><td class="num">${i+1}</td><td>${escapeHtml(ci.nom)}</td>
      <td class="txt-2 hide-s">${escapeHtml(ci.pays)}</td><td class="txt-2 hide-s">${ci.type}</td>
      <td>${r? (r.dnf?tag(r.dnf,'t-red'):`<span class="pos p${r.pos<=3?r.pos:''}" style="width:auto">${ordinal(r.pos)}</span>`) : '<span class="txt-muted">—</span>'}</td>
      <td class="num">${r?r.pts:''}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;

  // comparaison avec le coéquipier (GDD §14)
  const coequipier = sa.grille.find(g=>g.ecurieId===sa.ecurieId);
  if(coequipier){
    const clC = cl.find(x=>x.id===coequipier.id)||{}, clM=cl.find(x=>x.moi)||{};
    h+=`<div class="card"><h2>Comparaison avec le coéquipier<span class="hint">le vrai juge de paix</span></h2>
      <div class="tw"><table><thead><tr><th></th><th>${escapeHtml(S.pilote.nom)}</th><th>${escapeHtml(coequipier.nom)}</th></tr></thead><tbody>
        <tr><td class="txt-2">Points</td><td class="num">${clM.pts??0}</td><td class="num">${clC.pts??0}</td></tr>
        <tr><td class="txt-2">Classement</td><td class="num">${clM.pos??'—'}</td><td class="num">${clC.pos??'—'}</td></tr>
        <tr><td class="txt-2">Victoires</td><td class="num">${clM.victoires??0}</td><td class="num">${clC.victoires??0}</td></tr>
        <tr><td class="txt-2">Podiums</td><td class="num">${clM.podiums??0}</td><td class="num">${clC.podiums??0}</td></tr>
        <tr><td class="txt-2">Abandons</td><td class="num">${clM.abandons??0}</td><td class="num">${clC.abandons??0}</td></tr>
        <tr><td class="txt-2">Note estimée</td><td class="num">${Math.round(notePilote(S.pilote))}</td><td class="num">${Math.round(coequipier.note)}</td></tr>
      </tbody></table></div>
      <div class="note txt-muted mt">Même voiture, même écurie : l’écart avec le coéquipier est ce que regardent réellement les recruteurs.</div>
    </div>`;
  }
  $('#v-champ').innerHTML=h;
}

    rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(o&&o.v===1){S=o;saveGame();UI.tab='bureau';render();showToast('Partie importée');} else showToast('Fichier invalide'); }catch(err){ showToast('Fichier illisible'); } };

  const r=developpement(+d.m); if(!r) return;
  openModal('Développement livré',
    `<div class="note">Performance de la voiture : <b class="txt-green">+${round(r.gain,2)}</b> → ${Math.round(S.saison.voiture)}/100.</div>
     <div class="note txt-muted mt">Caisse restante : ${fmtEur(S.saison.caisse)}</div>`,
    `<button class="btn" data-act="fermerEtRender">Fermer</button>`);
};
ACTIONS.fermerEtRender = ()=>{ closeModal(); render(); };

/* --------------------------------- MODALE : bilan de fin de saison */
ACTIONS.bilanSaison = ()=>{
  const sa=S.saison, c=CAT[sa.catId], p=S.pilote;
  const pos=sa.posChamp||positionChampionnat();
  const gainsCommission = sum(S.finances.filter(f=>f.annee===S.annee&&f.type==='commission'), f=>f.montant);
  const depenses = sum(S.finances.filter(f=>f.annee===S.annee&&f.montant<0), f=>f.montant);
  const sl = ptsSuperlicence(sa.catId,pos);
  const body = `
    <div class="center mb">
      <div class="pos p${pos<=3?pos:''}" style="font-size:50px;width:auto">${pos}</div>
      <div class="note">${ordinal(pos)} du championnat ${c.nom} ${sa.annee}</div>
    </div>
    <div class="omat mb">
      <div><div class="l">Points</div><div class="v">${sa.pts}</div></div>
      <div><div class="l">Victoires</div><div class="v">${sa.victoires}</div></div>
      <div><div class="l">Podiums</div><div class="v">${sa.podiums}</div></div>
      <div><div class="l">Abandons</div><div class="v">${sa.abandons}</div></div>
    </div>
    <div class="card flat"><h2>Bilan financier</h2>
      <div class="tw"><table><tbody>
        <tr><td>Commissions encaissées</td><td class="num txt-green">${fmtEurFull(gainsCommission)}</td></tr>
        <tr><td>Dépenses du manager</td><td class="num txt-red">${fmtEurFull(depenses)}</td></tr>
        <tr><td>Solde de caisse de saison</td><td class="num ${sa.caisse<0?'txt-red':''}">${fmtEurFull(sa.caisse)}</td></tr>
        <tr><td><b>Trésorerie</b></td><td class="num ${S.manager.budget<0?'txt-red':'txt-green'}"><b>${fmtEurFull(S.manager.budget)}</b></td></tr>
      </tbody></table></div>
    </div>
    ${sl?`<div class="note mt">Superlicence : <b>+${sl} points</b> — total ${totalSuperlicence()}/${SUPERLIC_REQUIS} sur 3 ans.</div>`:''}
    <div class="note mt">Progression de ${escapeHtml(p.nom)} : note globale <b>${Math.round(notePilote(p))}</b> (plafond estimé ${estimTexte(p, notePlafond(p), 'plafGlobal')}).</div>
    ${p.age>=32?`<div class="note warn mt">${p.nom} a ${p.age} ans. Le déclin physique est engagé, la retraite approche.</div>`:''}`;
  openModal('Saison '+sa.annee+' — bilan', body,
    `<button class="btn btn-cta" data-act="allerIntersaison">Passer à l’intersaison</button>`);
};
ACTIONS.allerIntersaison = ()=>{
  passerAnneeSuivante();
  closeModal();
  if(S.pilote){
    S.offres = genererOffres();
    saveGame();
    go('bureau');
    afficherOffres();
  }else{
    go('pilote');
  }
};

/* ------------------------------------------------------- INIT */
function boot(){
  const sv = loadGame();
  if(sv){ S=sv; UI.tab = S.phase==='weekend'?'weekend':'bureau'; }
  render();
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
