   choix:[
     {lab:'Tenter le dépassement', d:'Une seule occasion, il faut la prendre.', perf:+3.0, risque:1.7, stat:'depassement'},
     {lab:'Rester dans son sillage',d:'On attend une meilleure occasion.',      perf:+0.4, risque:0.95},
     {lab:'Assurer la position',   d:'On protège ce qu’on a.',                  perf:-1.2, risque:0.55},
   ]},
];

/* --------------------------------- 10. SIMULATION DE COURSE (GDD §17.3) */

/* Note pondérée du pilote selon le profil du circuit et la météo */
function notePondere(p, course, meteo){
  const [wp,wc,wr] = course.w;
  const pace = noteGroupe(p,'pace'), cons = noteGroupe(p,'consistency'), race = noteGroupe(p,'racecraft');
  let n = pace*wp + cons*wc + race*wr;
  // Sous la pluie, la régularité et l'adaptabilité pèsent bien plus lourd
  if(meteo.pluie>0){
    const adapt = p.stats.adaptabilite, ctrl = p.stats.controle;
    n = n*(1-meteo.adapt) + (cons*0.45 + adapt*0.35 + ctrl*0.20)*meteo.adapt;
  }
  // Moral et forme physique
  const mf = 1 + ((p.moral-60)/100)*0.10 + ((p.forme-85)/100)*0.14;
  return n*mf;
}
function notePondereIA(g, course, meteo){
  return notePondere(g.p, course, meteo);
}

/* GDD §17.3 : PerfTotale = Pilote×0,40 + Voiture×0,35 + Réglages×0,15 + Aléa×0,10 */
function perfTotale(notePilote_, voiture, reglages, aleaMult=1){
  const alea = clamp(50 + gauss()*45, 0, 100);
  return notePilote_*0.40 + voiture*0.35 + reglages*0.15 + alea*0.10*aleaMult;
}

function meteoPour(course){
  const h = hash01(course.seed+'meteo');
  return h<0.55 ? METEOS[0] : h<0.75 ? METEOS[1] : h<0.9 ? METEOS[2] : METEOS[3];
}

/* Réglages de l'IA. Les écuries adverses ont elles aussi des ingénieurs et le
   même temps de piste : leur niveau de réglage suit leurs moyens. Le joueur qui
   travaille ses essais garde l'avantage, mais il n'a plus la piste pour lui seul. */
function reglagesIA(g){ return clamp(62 + (g.voiture-60)*0.55 + rnd(14,-7), 30, 96); }

/* Session de qualification / essais chronométrés */
function simulerQualif(course, meteo, reglagesJoueur){
  const res = [];
  const p = S.pilote;
  res.push({id:p.id, nom:p.nom, moi:true, ecurie:S.saison.ecurieNom,
    perf: perfTotale(notePondere(p,course,meteo), voitureEffective(course), reglagesJoueur, 0.7)});
  for(const g of S.saison.grille){
    res.push({id:g.id, nom:g.nom, moi:false, ecurie:g.ecurie,
      perf: perfTotale(notePondereIA(g,course,meteo), g.voiture, reglagesIA(g), 0.7)});
  }
  res.sort((a,b)=>b.perf-a.perf);
  res.forEach((r,i)=>r.pos=i+1);
  return res;
}

/* Course complète : grille de départ + incidents + fiabilité + récit */
/* La course se joue en deux temps : on prépare la grille et les performances,
   on laisse le manager arbitrer un événement à mi-course, puis on résout.
   En simulation rapide, les deux temps s'enchaînent sans interruption. */
function preparerCourse(course, meteo, reglagesJoueur, grilleDepart, strat){
  const p = S.pilote;
  const st = STRATS.find(s=>s.id===strat) || STRATS[1];
  const field = [];

  // Les longs relais des essais libres se paient en rythme de course (GDD §12).
  const prog = S.weekend ? S.weekend.programme : null;
  const perfJoueur = perfTotale(notePondere(p,course,meteo), voitureEffective(course), reglagesJoueur, 1)
                   + st.perf
                   + (prog==='relais' ? 1.2 : 0)
                   + (p.traits.includes('regulier')?1.0:0);
  field.push({id:p.id, nom:p.nom, moi:true, ecurie:S.saison.ecurieNom, perf:perfJoueur,
    fiab:S.saison.fiab, agr:p.agressivite, racecraft:noteGroupe(p,'racecraft')});
  for(const g of S.saison.grille){
    field.push({id:g.id, nom:g.nom, moi:false, ecurie:g.ecurie,
      perf: perfTotale(notePondereIA(g,course,meteo), g.voiture, reglagesIA(g), 1),
      fiab:g.fiab, agr:g.agressivite, racecraft:noteGroupe(g.p,'racecraft')});
  }
  // position de départ : la grille compte, mais la course peut tout changer
  const gridPos = Object.fromEntries(grilleDepart.map(r=>[r.id, r.pos]));
  for(const f of field){
    const gp = gridPos[f.id] || field.length;
    f.perf += (field.length - gp) * 0.28;
  }
  const scChance = 0.16*meteo.incident + (CAT[S.saison.catId].format==='kart'?-0.05:0.04);
  const safetyCar = Math.random() < scChance;

  // classement provisoire à mi-course, avant incidents
  const provisoire = [...field].sort((a,b)=>b.perf-a.perf);
  const posMi = provisoire.findIndex(f=>f.moi)+1;

  return {field, gridPos, safetyCar, posMi, strat};
}

/* Choisit l'événement de mi-course à soumettre au manager, ou null. */
function choisirEvenement(etat, course, meteo){
  const kart = CAT[S.saison.catId].format==='kart';
  const ctx = {nom:S.pilote.nom, pos:etat.posMi, safetyCar:etat.safetyCar, meteo,
               grilleN:etat.field.length, kart};
  const possibles = EVENEMENTS_COURSE.filter(e=>(!e.mono || !kart) && e.cond(ctx));
  if(!possibles.length) return null;
  // la voiture de sécurité et la météo priment sur les événements de routine
  const prioritaires = possibles.filter(e=>e.id==='safety'||e.id==='pluie'||e.id==='seche');
  const e = pick(prioritaires.length?prioritaires:possibles);
  return {
    id:e.id, titre:e.titre, texte:e.texte(ctx),
    choix: e.choix.map((c,i)=>({i, lab:c.lab, d:c.d})),
    _choix: e.choix,
  };
}

/* Résout la course. `choix` est l'option retenue à mi-course, ou null. */
function resoudreCourse(etat, course, meteo, choix){
  const p = S.pilote;
  const log = [];
  const st = STRATS.find(s=>s.id===etat.strat) || STRATS[1];
  const {field, gridPos, safetyCar} = etat;
  let risqueChoix = 1;

  if(choix){
    const moi0 = field.find(f=>f.moi);
    // un choix qui repose sur une qualité du pilote paie selon cette qualité
    const coef = choix.stat ? (0.45 + p.stats[choix.stat]/100) : 1;
    moi0.perf += choix.perf * coef;
    risqueChoix = choix.risque;
    log.push({t:'Mi-course', s:choix.recit || (choix.lab+' — '+choix.d), c:'big'});
  }
  if(safetyCar) log.push({t:'Course', s:'Voiture de sécurité en piste, le peloton se regroupe.', c:'big'});

  const regl = reglSaison();
  // Ce qu'on a fait de la séance d'essais libres ne vaut que pour notre voiture.
  const progEssais = S.weekend ? S.weekend.programme : null;
  const usureEL  = progEssais==='relais'   ? 0.82 : 1;
  const risqueELs = progEssais==='economie' ? 0.78 : 1;
  for(const f of field){
    f.abandon = null;
    const risqueMeca = (100-f.fiab)/100 * 0.55 * st.usure * (regl.mUsure||1)
                     * (f.moi ? usureEL : 1);
    if(Math.random() < risqueMeca){ f.abandon='Panne mécanique'; continue; }
    const risqueCrash = (0.035 + (f.agr/100)*0.055) * meteo.incident * (regl.mRisque||1)
                      * (f.moi ? st.risque*risqueChoix*risqueELs : 1)
                      * (1 - (f.racecraft-50)/280);
    if(Math.random() < risqueCrash){ f.abandon = Math.random()<0.5?'Accrochage':'Sortie de piste'; }
  }
  if(safetyCar){
    const m = avg(field.filter(f=>!f.abandon), f=>f.perf);
    for(const f of field) f.perf = f.perf*0.82 + m*0.18;
  }

  const finishers = field.filter(f=>!f.abandon).sort((a,b)=>b.perf-a.perf);
  const dnf       = field.filter(f=> f.abandon);
  finishers.forEach((f,i)=>f.pos=i+1);
  dnf.forEach((f,i)=>f.pos=finishers.length+i+1);
  const classement = [...finishers, ...dnf];

  const moi = field.find(f=>f.moi);
  const gp  = gridPos[p.id] || field.length;
  log.unshift({t:'Départ', s:`${p.nom} s’élance de la ${ordinal(gp)} place. Météo : ${meteo.nom.toLowerCase()}.`, c:''});
  if(!moi.abandon){
    const delta = gp - moi.pos;
    if(delta>=4) log.push({t:'Course', s:`Départ canon : ${Math.abs(delta)} places gagnées dans les premiers tours.`, c:'good'});
    else if(delta<=-4) log.push({t:'Course', s:`Départ manqué, ${Math.abs(delta)} places perdues.`, c:'bad'});
    if(meteo.pluie>0) log.push({t:'Piste', s: p.stats.adaptabilite>72
      ? 'Sur le mouillé, il trouve des trajectoires que les autres n’osent pas.'
      : 'Sur le mouillé, il peine à trouver ses repères.', c: p.stats.adaptabilite>72?'good':'bad'});
    if(moi.pos===1) log.push({t:'Arrivée', s:'VICTOIRE ! Drapeau à damier pour '+p.nom+'.', c:'big'});
    else if(moi.pos<=3) log.push({t:'Arrivée', s:'Podium — '+ordinal(moi.pos)+' place.', c:'good'});
    else log.push({t:'Arrivée', s:p.nom+' termine '+ordinal(moi.pos)+'.', c:''});
  }else{
    log.push({t:'Abandon', s:moi.abandon+' — la course de '+p.nom+' s’arrête là.', c:'bad'});
  }
  const top3 = finishers.slice(0,3).map((f,i)=>`${i+1}. ${f.nom}`).join('  ·  ');
  log.push({t:'Podium', s:top3, c:''});

  return {classement, log, safetyCar, moi};
}

/* Points de championnat */
function pointsPour(catId, pos){
  const bareme = PTS[CAT[catId].ptsSys];
  return pos>=1 && pos<=bareme.length ? bareme[pos-1] : 0;
}

/* ------------------------------------ 11. WEEK-END DE COURSE (GDD §21.2) */

/* --- 11.1 Essais libres (GDD §12) ---
   Le §12 veut un « week-end complet en trois temps : EL / Qualifs / Course ».
   La séance existait de nom, en F1 seulement, et se contentait de dupliquer les
   essais de réglages — un clic pour rien. Elle porte maintenant une décision et
   une seule : on ne peut pas tout travailler en une séance.
   Chaque programme ferme une porte en en ouvrant une autre, et ses effets
   courent sur tout le reste du week-end. */
const PROGRAMMES_EL = [
  {id:'reglages', nom:'Travail des réglages', ico:'🔧',
   desc:'Le stand consacre la séance à la voiture, tour après tour.',
   effet:'Un run d’essais supplémentaire.',
   pour:'Un circuit que vous ne réglez jamais bien.'},
  {id:'tracage', nom:'Repérage du tracé', ico:'🗺️',
   desc:'Le pilote enchaîne les tours pour apprendre la piste et sentir la voiture.',
   effet:'Le retour du stand devient bien plus fiable sur tout le week-end.',
   pour:'Quand vous n’avez pas d’ingénieur — ou pas confiance en lui.'},
  {id:'relais', nom:'Simulation de course', ico:'⏱️',
   desc:'Longs relais, plein d’essence : on apprend à gérer les pneus.',
   effet:'Moins de casse en course, et un peu plus de rythme.',
   pour:'Une longue épreuve, ou une stratégie agressive.'},
  {id:'economie', nom:'Séance au ralenti', ico:'🛑',
   desc:'On ne roule presque pas : matériel et pilote préservés.',
   effet:'Le pilote arrive frais et prend nettement moins de risques.',
   pour:'Un pilote fatigué, ou un circuit dangereux.'},
];
const PROG_EL = Object.fromEntries(PROGRAMMES_EL.map(x=>[x.id,x]));
const progEL = ()=> (S.weekend && PROG_EL[S.weekend.programme]) || null;
/* Un seul programme conseillé, et pour une raison lisible : un badge posé sur
   trois cartes sur quatre ne conseille plus rien. */
function conseilEL(){
  const p = S.pilote;
  if(!p) return null;
  if(p.fatigue>55)
    return {id:'economie', raison:'votre pilote est déjà entamé ('+Math.round(p.fatigue)+' de fatigue)'};
  if(staffNiv('ingenieur')<=1)
    return {id:'tracage', raison:'sans ingénieur, vous ne savez pas ce que valent vos réglages'};
  if(S.saison && CAT[S.saison.catId].niv>=4)
    return {id:'relais', raison:'à ce niveau les courses sont longues et la mécanique souffre'};
  return {id:'reglages', raison:'rien d’urgent ailleurs : autant chercher la voiture'};
}
/* Atténuation du bruit de mesure obtenue en repérant le tracé. */
const attenuationEL = ()=> (S.weekend && S.weekend.programme==='tracage') ? 0.4 : 1;

function etapesWeekend(catId){
  const f = CAT[catId].format;
  if(f==='kart') return ['libres','essais','course'];
  return ['libres','essais','qualifs','course'];
}
const ETAPE_NOM = {libres:'Essais libres', essais:'Essais', qualifs:'Qualifications', course:'Course'};

function ouvrirWeekend(){
  // Garde de fond : cacher le bouton ne suffit pas, un pilote blessé ne doit
  // pas pouvoir prendre le départ par un autre chemin (GDD §7.3).
  if(blesse(S.pilote)) return;
  const course = S.saison.calendrier[S.saison.courseIndex];
  if(!course) return;
  const meteo  = meteoPour(course);
  course.meteo = meteo.id;
  const params = setupParams(S.saison.catId);
  // On repart d'un réglage neutre : le pilote perd son réglage à chaque circuit (GDD §18.3)
  const setup = Object.fromEntries(params.map(p=>[p.k,10]));
  S.weekend = {
    courseIdx:S.saison.courseIndex, meteoId:meteo.id,
    etapes: etapesWeekend(S.saison.catId), etape:0,
    setup, runs:[], runsRestants: runsDisponibles(),
    programme:null,                  // programme d'essais libres (GDD §12)
    grille:null, resultat:null, strat:'equi', debrief:null, presse:null,
    courseEtat:null, evenement:null,
  };
  S.phase='weekend';
  saveGame();
}

/* Choix du programme d'essais libres : il s'applique tout de suite et vaut pour
   le reste du week-end. Une fois posé, on ne revient pas dessus. */
function choisirProgrammeEL(id){
  const w=S.weekend;
  if(!w || w.etapes[w.etape]!=='libres') return null;
  const prog = PROG_EL[id];
  if(!prog) return null;
  w.programme = id;
  if(id==='reglages') w.runsRestants++;
  // Rouler use le pilote ; ne pas rouler le repose.
  const cout = id==='economie' ? -6 : id==='relais' ? 4 : 2;
  S.pilote.fatigue = clamp(S.pilote.fatigue + cout - staffNiv('prepa'), 0, 100);
  majForme();
  w.etape++;
  saveGame();
  return prog;
}

function faireRun(){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  if(w.runsRestants<=0) return;
  w.runsRestants--;
  const sc = scoreReglages(course, w.setup, S.pilote);
  const ret= retourPilote(course, w.setup, S.pilote);
  const n = w.runs.length+1;
  const att = attenuationEL();
  w.runs.unshift({setup:{...w.setup}, score:sc.score,
    percu: scorePercu(sc.score, course.seed+'|run'+n+'|'+Math.round(sc.score), att),
    nivIng: staffNiv('ingenieur'), att,
    lignes:ret.lignes, ing:ret.commentaireIng, n});
  // Un run coûte quelques tours de fraîcheur, pas beaucoup plus.
  S.pilote.fatigue = clamp(S.pilote.fatigue + rint(0,2) - staffNiv('prepa'), 0, 100);
  majForme();
  saveGame();
}

function reglagesActuels(){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx];
  return scoreReglages(course, w.setup, S.pilote).score;
}

function etapeSuivante(){
  const w=S.weekend;
  const course = S.saison.calendrier[w.courseIdx];
  const meteo  = METEOS.find(m=>m.id===w.meteoId);
  const etape  = w.etapes[w.etape];

  if(etape==='libres'){
    // On ne quitte pas les essais libres sans avoir décidé du programme :
    // sortir sans rien faire serait un clic pour rien, ce qu'on voulait éviter.
    if(!w.programme) return;
    w.etape++;
  }else if(etape==='essais'){
    w.etape++;
    // Karting : pas de qualif, la grille sort directement des essais (GDD §21.2)
    if(w.etapes[w.etape]==='course'){
      w.grille = simulerQualif(course, meteo, reglagesActuels());
    }
  }else if(etape==='qualifs'){
    // 1er appel : on qualifie et on affiche la grille. 2e appel : on part en course.
    if(!w.grille) w.grille = simulerQualif(course, meteo, reglagesActuels());
    else w.etape++;
  }else if(etape==='course'){
    lancerCourse(false);
  }
  saveGame();
}

/* Simulation rapide d'un week-end complet (GDD §21.1) */
function simulationRapide(){
  if(blesse(S.pilote)) return;
  ouvrirWeekend();
  if(!S.weekend) return;
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  // Sans travail d'essais, l'ingénieur règle seul : le résultat se situe au
  // niveau des écuries adverses, un peu en dessous. Travailler soi-même les
  // essais reste le seul moyen de dépasser 90 (GDD §18, §21.1).
  const base = 54 + staffNiv('ingenieur')*5.5 + rnd(6,-6);
  w.setupAuto = clamp(base,40,88);
  w.grille = simulerQualif(course, meteo, w.setupAuto);
  lancerCourse(true);
}

function lancerCourse(rapide){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  const reg = rapide ? w.setupAuto : reglagesActuels();
  const etat = preparerCourse(course, meteo, reg, w.grille, w.strat);
  // En course détaillée, le manager arbitre un événement à mi-course (GDD §12).
  const ev = rapide ? null : choisirEvenement(etat, course, meteo);
  if(ev){
    w.courseEtat = {...etat, reg, rapide:!!rapide};
    w.evenement = ev;
    saveGame();
    return;                          // la course reprend après le choix du manager
  }
  finaliserCourse(null);
}

/* Reprend et termine la course, une fois l'événement de mi-course arbitré. */
function finaliserCourse(indexChoix){
  const w=S.weekend, course=S.saison.calendrier[w.courseIdx], meteo=METEOS.find(m=>m.id===w.meteoId);
  const etat = w.courseEtat || preparerCourse(course, meteo, reglagesActuels(), w.grille, w.strat);
  const reg = etat.reg ?? reglagesActuels();
  let choix = null;
  if(w.evenement && indexChoix!=null){
    const c = w.evenement._choix[indexChoix];
    if(c) choix = {...c, recit:'« '+c.lab+' » — '+c.d};
  }
  const r = resoudreCourse(etat, course, meteo, choix);
  w.resultat = {
    classement: r.classement.map(f=>({id:f.id,nom:f.nom,ecurie:f.ecurie,pos:f.pos,moi:!!f.moi,abandon:f.abandon||null})),
    log:r.log, reglages:round(reg,1), rapide:!!etat.rapide,
    grillePos: (w.grille.find(g=>g.id===S.pilote.id)||{}).pos || null,
    choixMiCourse: choix ? choix.lab : null,
    evenement: w.evenement ? w.evenement.titre : null,
  };
  w.courseEtat = null; w.evenement = null;
  w.etape = w.etapes.length;         // on passe au débrief
  traiterResultat(course, meteo, r, reg);
  saveGame();
}

/* ------------------------------- 12. APRÈS-COURSE : effets & progression */
function traiterResultat(course, meteo, r, reg){
  const p=S.pilote, sa=S.saison, c=CAT[sa.catId];
  const moi = r.classement.find(f=>f.moi);
  const pos = moi.pos, dnf = !!moi.abandon;
  if(dnf) verifierBlessure(course, moi.abandon);       // GDD §7.3
  if(!S.pilote || !S.saison) return;                   // la famille l'a repris
  const pts = dnf?0:pointsPour(sa.catId,pos);

  // --- championnat
  sa.pts += pts;
  if(!dnf && pos===1){ sa.victoires++; S.stats.coursesGagnees++; }
  if(!dnf && pos<=3){ sa.podiums++; S.stats.podiums++; }
  if(dnf) sa.abandons++;
  if(!dnf) sa.meilleur = Math.min(sa.meilleur,pos);
  for(const f of r.classement){
    if(f.moi) continue;
    const g = sa.grille.find(x=>x.id===f.id);
    if(!g) continue;
    g.pts += f.abandon?0:pointsPour(sa.catId,f.pos);
    if(!f.abandon && f.pos===1) g.victoires++;
    if(!f.abandon && f.pos<=3) g.podiums++;
    if(f.abandon) g.abandons++;
  }
  sa.resultats.push({i:sa.courseIndex, circuit:course.nom, pays:course.pays, meteo:meteo.id,
    grille:(S.weekend&&S.weekend.resultat)?S.weekend.resultat.grillePos:null,
    pos: dnf?null:pos, dnf:dnf?moi.abandon:null, pts, reglages:round(reg)});

  // --- argent (GDD §19.1 option A : gains dans la caisse, commission au manager)
  verserSponsors();
  const coutManche = Math.round(sa.coutTotal / c.courses);
  if(coutManche>0) caisse('Engagement, transport, pneus — '+course.nom, -coutManche, 'course');
  let gain = 0;
  if(!dnf){
    if(pos===1) gain = c.vict;
    else if(pos===2) gain = Math.round(c.vict*0.6);
    else if(pos===3) gain = Math.round(c.vict*0.4);
    else if(pos<=6) gain = Math.round(c.vict*0.18);
    else if(pos<=10) gain = Math.round(c.vict*0.07);
  }
  if(gain>0){
    caisse('Prime de course — '+ordinal(pos), gain, 'gain');
    const tx = tauxCommission('course');
    const com = Math.round(gain*tx);
    argent('Commission course '+course.nom+' ('+Math.round(tx*100)+' %)', com, 'commission');
  }
  // salaire F1 : versé par manche
  if(sa.catId==='f1' && S.contrat && S.contrat.salaire>0){
    const parManche = Math.round(S.contrat.salaire/c.courses);
    const tx = tauxCommission('course');
    const com = Math.round(parManche*tx);
    argent('Commission sur salaire — '+course.nom+' ('+Math.round(tx*100)+' %)', com, 'commission');
    // primes de résultat
    let prime=0;
    if(!dnf && pos===1) prime = S.contrat.primeVictoire||0;
    else if(!dnf && pos<=3) prime = Math.round((S.contrat.primeVictoire||0)*0.4);
    else if(pts>0) prime = (S.contrat.primePoint||0)*pts;
    if(prime>0) argent('Commission primes '+course.nom+' ('+Math.round(tauxCommission('course')*100)+' %)',
      Math.round(prime*tauxCommission('course')), 'commission');
  }
  // staff : 12 mois de salaire répartis sur la saison
  const staffManche = Math.round(staffCoutMensuel()*12/c.courses);
  if(staffManche>0) argent('Salaires du staff', -staffManche, 'staff');
  // caisse négative -> le manager comble de sa poche
  if(sa.caisse<0){
    const trou = -sa.caisse;
    argent('Comblement de la caisse de saison', -trou, 'sauvetage');
    caisse('Avance du manager', trou, 'avance');
    msg('finance','Comptabilité','La caisse de saison est à sec',
      `Vous avez dû avancer <em>${fmtEurFull(trou)}</em> de votre trésorerie pour couvrir la manche.\n\n`+
      `C’est exactement ce que le métier ne doit pas être : trouvez des sponsors, vite.`);
  }

  // --- progression du pilote (GDD §17.1)
  progresserPilote(dnf?null:pos);
  // --- moral, fatigue, réputation
  effetsPsy(pos, dnf, r.classement.length);
  // Le pilote peut claquer la porte à la seconde où la course se termine :
  // relation au plus bas (§9.6) ou famille à bout (§7.4). Il n'y a alors plus
  // ni pilote ni saison, et tout ce qui suit n'a plus d'objet.
  if(!S.pilote || !S.saison) return;
  // --- rivaux et IA progressent aussi
  progresserGrille();
  // --- contrat : évaluation, avertissements (GDD §9.5)
  evaluerContrat(pos, dnf);
  // --- sponsors : objectifs, obligations, ruptures
  evaluerSponsors(pos, dnf);
  // --- réputation du manager
  if(!dnf){
    if(pos===1) gagnerRep(Math.round(6+c.niv*2.6), 'victoire en '+c.court);
    else if(pos<=3) gagnerRep(Math.round(2.5+c.niv*1.1), 'podium en '+c.court);
    else if(pos<=6) gagnerRep(Math.round(0.8+c.niv*0.35), '');
  }
  // --- conférence de presse (GDD §20.2)
  if(S.weekend) S.weekend.presse = genererQuestionPresse(pos, dnf, c);
  // --- message du pilote (GDD §20.3)
  peutEtreMessagePilote(pos, dnf);
}

function progresserPilote(pos){
  const p=S.pilote, c=CAT[S.saison.catId];
  const cAge = coeffAge(p.age);
  const cStaff = 1 + staffNiv('ingenieur')*0.045 + staffNiv('prepa')*0.035;   // 1,0 → ~1,4
  const cMoral = 0.7 + (p.moral/100)*0.6;                                     // 0,7 → 1,3
  const cTrait = p.traits.includes('bosseur')?1.18:1;
  const base = GAIN_SAISON / c.courses;
  const gains = {};
  for(const k of ALL_STATS){
    const marge = 1 - p.stats[k]/p.plafonds[k];
    if(marge<=0){ gains[k]=0; continue; }
    // Chaque stat progresse à son rythme : profil unique
    const g = base * cAge * cStaff * cMoral * cTrait * marge * rnd(1.35,0.55);
    p.stats[k] = clamp(p.stats[k] + g, 1, 99);
    gains[k]=g;
  }
  // Déclin après 32 ans (GDD §17.1)
  if(p.age>=33){
    const perte = rnd(3,1)/c.courses;
    p.stats.reactions = clamp(p.stats.reactions-perte,1,99);
    p.forme = clamp(p.forme - perte*0.6, 20, 100);
  }
  p.progression = gains;
}

function progresserGrille(){
  if(!S.saison) return;
  const c=CAT[S.saison.catId];
  const base = GAIN_SAISON/c.courses;
  for(const g of S.saison.grille){
    const cAge=coeffAge(g.p.age), cM=1.0;
    for(const k of ALL_STATS){
      const m = 1 - g.p.stats[k]/g.p.plafonds[k];
      if(m<=0) continue;
      g.p.stats[k] = clamp(g.p.stats[k] + base*cAge*cM*m*rnd(1.2,0.6), 1, 99);
    }
    g.note = notePilote(g.p);
  }
}

function majForme(){
  const p=S.pilote;
  const recup = 4 + staffNiv('prepa')*2.4;
  p.fatigue = clamp(p.fatigue, 0, 100);
  p.forme = clamp(96 - p.fatigue*0.55 - Math.max(0,p.age-32)*1.6 + staffNiv('prepa')*1.2, 25, 100);
  return recup;
}

function effetsPsy(pos, dnf, grilleN){
  const p=S.pilote, c=CAT[S.saison.catId];
  // attente = position moyenne attendue vu la voiture et le niveau du pilote
  const attendu = positionAttendue();
  let d = dnf ? -6 : (attendu - pos);          // positif = mieux que prévu
  let dm = clamp(d*1.7, -22, 22);
  if(dnf) dm = -10;
  if(p.traits.includes('fragile') && dm<0) dm *= 1.75;
  if(p.traits.includes('regulier')) dm *= 0.8;
  // Finir loin reste une contre-performance, même si la voiture ne valait pas mieux :
  // on plafonne le gain de moral sur un résultat absolu médiocre.
  if(dm>0 && !dnf && pos > grilleN*0.4) dm = Math.min(dm, 4);
  if(dm>0 && !dnf && pos > grilleN*0.65) dm = Math.min(dm, 1.5);
  p.moral = clamp(p.moral + dm, 5, 100);
  p.fatigue = clamp(p.fatigue + rint(6,12) - staffNiv('prepa')*2, 0, 100);
  majForme();
  // réputation du pilote
  let dr = 0;
  if(!dnf){
    if(pos===1) dr = 3.2 + c.niv*0.55;
    else if(pos<=3) dr = 1.6 + c.niv*0.3;
    else if(pos<=6) dr = 0.6;
    else if(pos>grilleN*0.7) dr = -0.5;
  }else dr = -0.4;
  if(p.traits.includes('medias')) dr *= 1.3;
  p.reputation = clamp(p.reputation + dr, 1, 100);
  // image médiatique du manager suit doucement
  S.manager.image = clamp(S.manager.image + dr*0.25 + staffNiv('presse')*0.08, 0, 100);
  // relation : de bons résultats et de la considération l'entretiennent
  p.relation = clamp(p.relation + (dnf?-1: pos<=3?1.2 : pos<=attendu?0.4:-0.8), 0, 100);
  usureRelation();
}

/* Un pilote laissé à l'abandon finit par partir — de lui-même, sans que le
   joueur ait à choisir. La fiche du pilote promettait « un pilote mal suivi
   change de manager » : ce n'était vrai que si le joueur acceptait de le
   laisser partir dans un message rare, donc jamais pour qui répondait toujours
   « je renégocie ». Trois manches sous le seuil et il s'en va, avec deux
   avertissements avant. */
const RELATION_RUPTURE = 20;

/* Ce qu'il en coûte de lâcher son pilote. Rompre doit être une décision, pas
   une touche « recommencer » : le paddock retient qu'on a lâché quelqu'un, et
   d'autant plus que le pilote valait quelque chose. En pleine saison, on laisse
   en plus une écurie sans interlocuteur. */
function coutRupture(){
  const p = S.pilote;
  if(!p) return null;
  const enSaison = !!(S.saison && !S.saison.finie);
  const niveau = clamp(notePilote(p), 0, 99);
  const rep = Math.round(30 + niveau*0.9 + (enSaison?45:0));
  const indem = enSaison && S.contrat
    ? Math.round(CAT[S.saison.catId].cout * 0.06 / 500)*500
    : 0;
  return {rep, indem, enSaison, niveau};
}
function usureRelation(){
  const p = S.pilote;
  if(!p) return;
  if(p.relation >= RELATION_RUPTURE){ p.rupture = 0; return; }
  p.rupture = (p.rupture||0) + 1;
  if(p.rupture===1){
    msg('pilote', p.nom, 'Il faut qu’on parle',
      `« Je ne me sens plus suivi. J’ai l’impression de faire ma carrière tout seul.\n\n`+
      `Si ça continue comme ça, je vais regarder ailleurs. »\n\n`+
      `<em>Relation ${Math.round(p.relation)}/100. Parlez-lui, offrez-lui des essais, `+
      `montez au créneau auprès de l’écurie — ou perdez-le.</em>`);
  }else if(p.rupture===2){
    msg('pilote', p.nom, 'J’ai pris contact avec quelqu’un',
      `« J’ai rencontré un autre manager. Rien n’est signé, mais je ne t’ai pas menti : `+
      `je cherche. »\n\n<em>Dernier avertissement — relation ${Math.round(p.relation)}/100.</em>`);
  }else if(p.rupture>=3){
    perdrePilote('relation');
  }
}

/* Position que l'on peut raisonnablement attendre du duo pilote/voiture */
function positionAttendue(){
  const sa=S.saison;
  const perfMoi = notePilote(S.pilote)*0.53 + (sa.voiture + bonusDevMoyen())*0.47;
  const tous = sa.grille.map(g=>g.note*0.53 + g.voiture*0.47);
  const mieux = tous.filter(v=>v>perfMoi).length;
  return mieux+1;
}

/* -------------------------------- 13. RÉPUTATION MANAGER (GDD §3) */
function gagnerRep(pts, motif){
  if(!pts) return;
  const avant = repPalier(S.manager.repPoints).p;
  S.manager.repPoints = Math.max(0, S.manager.repPoints + pts);
  const apres = repPalier(S.manager.repPoints).p;
  if(apres>avant){
    const r = REP_PALIERS[apres-1];
    msg('systeme','Paddock','Votre réputation grandit — palier '+apres+' : '+r.nom,
      `Vous êtes désormais reconnu comme « <em>${r.nom}</em> » (${apres}/10).\n\n${r.acces}\n\n`+
      (pilotesMax(apres)>pilotesMax(avant)
        ? `À ce palier, vous pouvez suivre jusqu’à <em>${pilotesMax(apres)} pilotes</em> en parallèle. `
          + `Une place vient de s’ouvrir : le vivier vous attend.`
        : ''));
    majSponsorsProspects();
  }else if(apres<avant){
    msg('systeme','Paddock','Votre réputation recule — palier '+apres,
      `Le paddock vous fait moins confiance. Vous retombez au palier ${apres} : « ${REP_PALIERS[apres-1].nom} ».`);
  }
}

/* ------------------------------------ 14. CONTRATS (GDD §9.5) */
function evaluerContrat(pos, dnf){
  const ct = S.contrat; if(!ct || !ct.objectifPos) return;
  const sa = S.saison;
  const derniers = sa.resultats.slice(-4);
  if(derniers.length<4) return;
  // L'écurie fait le point toutes les 4 manches, pas après chaque course :
  // c'est une série de résultats qui déclenche un avertissement, pas une seule.
  if(sa.dernierBilan!=null && sa.courseIndex - sa.dernierBilan < 4) return;
  sa.dernierBilan = sa.courseIndex;
  const moyenne = avg(derniers, r=> r.pos===null ? CAT[sa.catId].grille : r.pos);
  if(moyenne > ct.objectifPos + 3.5){
    sa.avertissements++;
    if(sa.avertissements===1 || sa.avertissements===2){
      msg('ecurie', ct.ecurieNom, 'Avertissement — résultats insuffisants',
        `Vos quatre dernières manches donnent une moyenne de ${round(moyenne,1)}, loin de l’objectif contractuel `+
        `(${ordinal(ct.objectifPos)} au championnat).\n\n`+
        (sa.avertissements===1 ? 'Considérez ceci comme un premier avertissement.'
                               : '<em>Deuxième avertissement.</em> Le prochain sera une rupture de contrat.'));
    }
    if(sa.avertissements>=3){ rompreContrat(); }
  }else if(sa.avertissements>0 && moyenne <= ct.objectifPos+1){
    sa.avertissements = Math.max(0, sa.avertissements-1);
  }
}
function rompreContrat(){
  const ct=S.contrat, sa=S.saison;
  msg('ecurie', ct.ecurieNom, 'Rupture de contrat',
    `${ct.ecurieNom} met fin au contrat de ${S.pilote.nom} avec effet immédiat.\n\n`+
    `La saison s’arrête ici. Il faudra redescendre d’une catégorie pour reconstruire sa réputation.`);
  gagnerRep(-Math.round(60+CAT[sa.catId].niv*18), 'renvoi');
  S.pilote.moral = clamp(S.pilote.moral-25,5,100);
  S.pilote.relation = clamp(S.pilote.relation-12,0,100);
  S.flags.renvoye = true;
  S.flags.ruptureEnCours = true;
}

/* ------------------------------------ 15. SPONSORS (GDD §4, §19.5) */
function slotsSponsors(){ return CAT[S.pilote?S.pilote.catId:'kmini'].slots; }
function slotsLibres(){ return slotsSponsors() - S.sponsors.actifs.length; }
function secteursOccupes(){ return S.sponsors.actifs.map(s=>s.secteur); }

function genererSponsor(niv){
  const N = SPONSOR_NIVEAUX[niv-1];
  const pool = SPONSOR_POOLS[N.pool];
  const dispo = pool.filter(x=>!S.sponsors.actifs.some(s=>s.nom===x[0]) && !S.sponsors.prospects.some(s=>s.nom===x[0]));
  if(!dispo.length) return null;
  const [nom,secteur] = pick(dispo);
  const spread = N.max-N.min;
  // Le département marketing (GDD §22.1) fait monter les montants proposés.
  const montant = Math.round((N.min + spread*Math.pow(Math.random(),1.6)) * bonusMarketing()/100)*100;
  const obl = [];
  if(Math.random()<0.45) obl.push('presse');
  if(Math.random()<0.30) obl.push('objectif');
  if(Math.random()<0.25) obl.push('pub');
  if(niv>=3) obl.push('exclu');
  if(!obl.length) obl.push('aucune');
  return {
    id:uid(), nom, secteur, niv, montant,
    objectifPos: obl.includes('objectif') ? rint(3, Math.max(5, Math.round(CAT[S.pilote.catId].grille*0.45))) : null,
    partConditionnelle: obl.includes('objectif') ? 0.3 : 0,
    obligations: obl,
    duree: rint(1,niv>=3?3:2),
    // critères d’intérêt (GDD §4.2)
    exigeRepManager: Math.max(1, N.repMin - 1 + rint(0,1)),
    exigeRepPilote: clamp(Math.round((niv-1)*16 + rnd(14)), 0, 92),
    approches:0, statut:'prospect',
  };
}

function majSponsorsProspects(){
  if(!S.pilote){ S.sponsors.prospects = []; return; }
  const rp = repPalier(S.manager.repPoints).p;
  const niveauxOuverts = SPONSOR_NIVEAUX.filter(n=>rp >= n.repMin-1).map(n=>n.niv);
  const cible = clamp(3 + rp, 4, 11);
  // On retire les prospects devenus hors sujet, on complète
  S.sponsors.prospects = S.sponsors.prospects.filter(s=>niveauxOuverts.includes(s.niv));
  let garde=0;
  while(S.sponsors.prospects.length<cible && garde++<40){
    const niv = pick(niveauxOuverts);
    const s = genererSponsor(niv);
    if(s) S.sponsors.prospects.push(s);
  }
  S.sponsors.prospects.sort((a,b)=>b.niv-a.niv || b.montant-a.montant);
}

/* Score d’intérêt d'un sponsor pour le duo manager/pilote (GDD §4.2) */
function interetSponsor(s){
  const p=S.pilote, rp=repPalier(S.manager.repPoints).p;
  let sc = 0;
  sc += clamp((rp - s.exigeRepManager)*11, -55, 30);
  sc += clamp((p.reputation - s.exigeRepPilote)*0.75, -45, 28);
  // résultats récents
  if(S.saison && S.saison.resultats.length){
    const der = S.saison.resultats.slice(-4);
    const moy = avg(der, r=>r.pos===null?CAT[S.saison.catId].grille:r.pos);
    const att = positionAttendue();
    sc += clamp((att-moy)*3.2, -18, 18);
  }
  sc += (S.manager.image-40)*0.30;                    // image médiatique
  sc += staffNiv('presse')*5.5;                       // attaché de presse
  if(p.traits.includes('medias')) sc += 9;
  sc += (CAT[p.catId].niv - (s.niv*1.4))*3.2;         // cohérence catégorie / niveau du sponsor
  sc += s.approches*4;                                // relancer paie un peu
  return sc;
}
function probaSponsor(s){
  // Le département marketing (GDD §22.1) améliore les chances d'aboutir.
  return clamp((0.5 + interetSponsor(s)/120) * bonusMarketing(), 0.03, 0.94);
}

function demarcher(sponsorId){
  const s = S.sponsors.prospects.find(x=>x.id===sponsorId); if(!s) return null;
  const N = SPONSOR_NIVEAUX[s.niv-1];
  if(S.manager.budget < N.coutDemarche){ showToast('Trésorerie insuffisante pour monter le dossier'); return null; }
  if(S.actions<=0){ showToast('Plus d’action disponible cette semaine'); return null; }
  S.actions--;
  argent('Démarchage — '+s.nom+' (dossier, déplacement)', -N.coutDemarche, 'demarchage');
  s.approches++;
  const pr = probaSponsor(s);
  const r = Math.random();
  let issue;
  if(r < pr*0.72){
    issue = {type:'accepte', montant:s.montant};
  }else if(r < pr*0.72 + 0.30){
    const coef = rnd(0.80,0.45);
    issue = {type:'contre', montant: Math.max(N.min, Math.round(s.montant*coef/100)*100)};
  }else if(s.approches>=3){
    issue = {type:'definitif'};
  }else{
    issue = {type:'refus'};
  }
  s.derniereIssue = issue;
  saveGame();
  return issue;
}

function signerSponsor(sponsorId, montant){
  const s = S.sponsors.prospects.find(x=>x.id===sponsorId); if(!s) return false;
  if(slotsLibres()<=0){ showToast('Aucun emplacement publicitaire libre'); return false; }
  if(secteursOccupes().includes(s.secteur)){ showToast('Conflit de secteur avec un sponsor déjà en place'); return false; }
  s.montant = montant;
  s.statut='actif';
  s.anneeSignature = S.annee;
  s.verseSaison = 0;
  S.sponsors.actifs.push(s);
  S.sponsors.prospects = S.sponsors.prospects.filter(x=>x.id!==s.id);
  S.stats.sponsorsSignes++;
  const txS = tauxCommission('sponsor');
  const com = Math.round(montant*txS);
  argent('Commission sponsor — '+s.nom+' ('+Math.round(txS*100)+' %)', com, 'commission');
  gagnerRep(Math.round(4 + s.niv*9), 'sponsor');
  // Le montant alimente la caisse de saison, pas la poche du manager (GDD §19.1)
  if(S.saison){
    const parManche = Math.round(montant / Math.max(1, CAT[S.saison.catId].courses - S.saison.courseIndex));
    s.parManche = parManche;
  }
  msg('sponsor', s.nom, 'Contrat de partenariat signé',
    `${s.nom} s’engage pour <em>${fmtEurFull(montant)}</em> sur la saison`+(s.duree>1?` (contrat de ${s.duree} ans)`:'')+`.\n\n`+
    `Secteur : ${s.secteur}. Contreparties : ${s.obligations.map(o=>OBLIGATIONS.find(x=>x.id===o).lab).join(', ')}.\n\n`+
    `Votre commission de ${Math.round(txS*100)} % (${fmtEurFull(com)}) est créditée. Le reste finance la saison du pilote.`);
  majSponsorsProspects();
  saveGame();
  return true;
}

/* Versement des sponsors : à chaque manche, par tranches */
function verserSponsors(){
  if(!S.saison) return;
  const c = CAT[S.saison.catId];
  for(const s of S.sponsors.actifs){
    const partFixe = s.montant*(1-s.partConditionnelle);
    const tranche = Math.round(partFixe / c.courses);
    caisse('Sponsor — '+s.nom, tranche, 'sponsor');
    s.verseSaison = (s.verseSaison||0)+tranche;
    // obligations d'image : elles coûtent de la fraîcheur (GDD §4.3)
    if(s.obligations.includes('presse') && Math.random()<0.35){
      S.pilote.fatigue = clamp(S.pilote.fatigue+rint(3,7),0,100);
      S.manager.image = clamp(S.manager.image+1.2,0,100);
    }
  }
  majForme();
}

function evaluerSponsors(pos, dnf){
  if(!S.saison) return;
  const restants = CAT[S.saison.catId].courses - S.saison.courseIndex - 1;
  for(const s of [...S.sponsors.actifs]){
    // rupture si la saison est catastrophique
    const der = S.saison.resultats.slice(-5);
    if(der.length>=5){
      const moy = avg(der, r=>r.pos===null?CAT[S.saison.catId].grille:r.pos);
      const att = positionAttendue();
      if(moy > att+6 && Math.random()<0.16){
        S.sponsors.actifs = S.sponsors.actifs.filter(x=>x.id!==s.id);
        msg('sponsor', s.nom, 'Fin de partenariat anticipée',
          `${s.nom} met fin au partenariat : les résultats ne sont pas au rendez-vous et l’exposition n’est plus jugée suffisante.\n\n`+
          `Le versement des tranches restantes (environ ${fmtEurFull(Math.round(s.montant/CAT[S.saison.catId].courses*restants))}) est annulé.`);
        gagnerRep(-8,'rupture sponsor');
      }
    }
  }
}

/* Primes conditionnelles versées en fin de saison */
function primesSponsorsFinSaison(posChamp){
  let total=0;
  for(const s of S.sponsors.actifs){
    if(!s.objectifPos) continue;
    if(posChamp && posChamp<=s.objectifPos){
      const prime = Math.round(s.montant*s.partConditionnelle);
      total += prime;
      caisse('Prime d’objectif — '+s.nom, prime, 'sponsor');
      argent('Commission prime sponsor — '+s.nom+' ('+Math.round(tauxCommission('sponsor')*100)+' %)',
        Math.round(prime*tauxCommission('sponsor')), 'commission');
    }
  }
  return total;
}

/* ------------------------- 16. INTERACTIONS HUMAINES (GDD §20) */

/* 20.1 — Le manager s'adresse à son pilote. L'effet dépend du trait. */
const TONS = [
  {id:'feliciter', nom:'Féliciter',      desc:'Souligner ce qu’il a réussi.'},
  {id:'encourager',nom:'Encourager',     desc:'Le remettre en confiance sans en faire trop.'},
  {id:'recadrer',  nom:'Recadrer',       desc:'Hausser le ton, exiger davantage.'},
  {id:'rassurer',  nom:'Rassurer',       desc:'Dédramatiser, protéger la tête.'},
  {id:'ultimatum', nom:'Fixer un ultimatum',desc:'Mettre la pression, sans filet.'},
];
function parlerAuPilote(tonId, contexteBon){
  const p=S.pilote;
  const t = TONS.find(x=>x.id===tonId);
  let dm=0, dr=0, dagr=0, txt='';
  const fragile = p.traits.includes('fragile');
  const brulee  = p.traits.includes('tetebrulee');
  const merc    = p.traits.includes('mercenaire');
  const leader  = p.traits.includes('leader');

  switch(tonId){
    case 'feliciter':
      if(contexteBon){ dm=+12; dr=+4; txt='Il rayonne. Le message est passé au bon moment.'; }
      else { dm=+3; dr=-3; txt='Le féliciter après ça sonne faux : il ne vous croit pas vraiment.'; }
      if(contexteBon && merc){ dm=+7; dr=+1; txt='Il encaisse le compliment sans s’émouvoir. Ce qui l’intéresse, c’est le contrat.'; }
      break;
    case 'encourager':
      dm=+6; dr=+2; txt='Un mot juste, sans excès. Il repart plus léger.';
      if(fragile){ dm=+10; txt='Il avait besoin exactement de ça.'; }
      break;
    case 'recadrer':
      if(brulee){ dm=+7; dagr=+7; dr=+3; txt='Sursaut d’orgueil : il veut vous prouver quelque chose dès la prochaine course.'; }
      else if(fragile){ dm=-20; dr=-11; txt='Il se referme complètement. Vous venez de casser quelque chose.'; }
      else if(contexteBon){ dm=-9; dr=-6; txt='Le recadrer après une bonne course : il ne comprend pas.'; }
      else { dm=-3; dagr=+4; dr=-2; txt='Il encaisse, tête basse, et promet de faire mieux.'; }
      break;
    case 'rassurer':
      dm = contexteBon ? +2 : +9; dr=+3;
      txt = contexteBon ? 'Rien à rassurer aujourd’hui, mais l’intention est notée.' : 'Il souffle. La pression retombe.';
      if(fragile && !contexteBon){ dm=+14; dr=+5; txt='Vous venez d’éviter une spirale.'; }
      break;
    case 'ultimatum':
      if(brulee || leader){ dm=+10; dagr=+9; dr=-2; txt='Il prend le défi de plein fouet. Ça va attaquer.'; }
      else if(fragile){ dm=-26; dr=-18; txt='Rupture de confiance. Il doute désormais de vous autant que de lui.'; }
      else { dm=-6; dagr=+6; dr=-9; txt='Il accepte, mais la relation se refroidit nettement.'; }
      break;
  }
  p.moral = clamp(p.moral+dm,5,100);
  p.relation = clamp(p.relation+dr,0,100);
  p.agressivite = clamp(p.agressivite+dagr,10,99);
  return {txt, dm, dr, dagr, ton:t.nom};
}

/* 20.2 — Conférence de presse (GDD §20.2)
   Le barème d'effets reste celui du GDD — moral du pilote, relation avec
   l'écurie, image médiatique — mais chaque question a ses propres réponses,
   rédigées pour la situation. Une victoire n'appelle pas « reconnaître l'échec ». */
const PRESSE_EFFETS = {
  defendre:    {moral:+9,  ecurie:-7,  image:-5, relation:+4},
  admettre:    {moral:-8,  ecurie:+3,  image:+8, relation:-3},
  blamer:      {moral:+6,  ecurie:-16, image:+2, relation:+5},
  eluder:      {moral:0,   ecurie:0,   image:-1, relation:0},
  creditPilote:{moral:+11, ecurie:-5,  image:+1, relation:+5},
  creditEcurie:{moral:-4,  ecurie:+12, image:+4, relation:-2},
  ambition:    {moral:+7,  ecurie:-2,  image:+9, relation:+2, repPilote:+1.5},
  humilite:    {moral:+3,  ecurie:+6,  image:+5, relation:+1},
};

/* Chaque entrée : à quel type de résultat elle s'applique, la question, et 4 réponses.
   ctx = {nom, pos, cat, circuit, ecurie, coequipier, att, serie} */
const PRESSE_QUESTIONS = [
  /* ---------------------------------------------------------------- VICTOIRE */
  {id:'v1', cat:'victoire',
   q:c=>`Belle victoire à ${c.circuit}. Certains disent dans le paddock que c’est surtout la voiture. Vous répondez quoi ?`,
   reps:[
     {t:'creditPilote', lab:'Créditer le pilote',   d:'« Mettez n’importe qui dedans, vous verrez la différence. »'},
     {t:'creditEcurie', lab:'Créditer l’écurie',    d:'« L’équipe lui a donné une voiture parfaite. Il l’a juste bien pilotée. »'},
     {t:'blamer',       lab:'Retourner la question',d:'« Curieux, personne ne disait ça quand il finissait 12e avec la même. »'},
     {t:'eluder',       lab:'Ne pas entrer dedans', d:'« On a gagné. Le reste, ça ne m’intéresse pas. »'},
   ]},
  {id:'v2', cat:'victoire',

function categoriePresse(pos, dnf, att, grilleN){
  if(dnf) return 'abandon';
  if(pos===1) return 'victoire';
  if(pos<=3) return 'podium';
  if(pos > att+4) return 'deception';
  if(pointsPour(S.saison.catId, pos) > 0) return 'points';
  return 'neutre';
}

function genererQuestionPresse(pos, dnf, c){
  const p=S.pilote, sa=S.saison, att=positionAttendue();
  const cat = categoriePresse(pos, dnf, att, c.grille);
  const coequipier = (sa.grille.find(g=>g.ecurieId===sa.ecurieId)||{}).nom || 'son coéquipier';
  const ctx = {
    nom:p.nom, pos, cat:c.nom, circuit:sa.calendrier[sa.courseIndex].nom,
    ecurie:sa.ecurieNom, coequipier, att,
  };
  // On évite de reposer une question déjà servie récemment.
  sa.pressePosees = sa.pressePosees || [];
  let pool = PRESSE_QUESTIONS.filter(x=>x.cat===cat);
  const frais = pool.filter(x=>!sa.pressePosees.includes(x.id));
  if(frais.length) pool = frais;
  const q = pick(pool);
  sa.pressePosees.push(q.id);
  if(sa.pressePosees.length>8) sa.pressePosees.shift();
  return {qid:q.id, q:q.q(ctx), reps:q.reps, pos, dnf, repondu:false};
}

function repondrePresse(typeId){
  const w = S.weekend;
  if(!w || !w.presse) return null;
  const rep = w.presse.reps.find(r=>r.t===typeId);
  const e = PRESSE_EFFETS[typeId];
  if(!rep || !e) return null;
  const p=S.pilote;
  let dm=e.moral;
  if(p.traits.includes('fragile') && dm<0) dm*=1.6;
  if(p.traits.includes('medias')) dm = dm>0?dm*1.2:dm*0.8;
  p.moral = clamp(p.moral+dm,5,100);
  p.relation = clamp(p.relation + e.relation, 0, 100);
  p.reputation = clamp(p.reputation + (e.repPilote||0), 1, 100);
  S.manager.image = clamp(S.manager.image + e.image, 0, 100);
  if(S.contrat) S.contrat.relationEcurie = clamp((S.contrat.relationEcurie ?? 60) + e.ecurie, 0, 100);
  w.presse.repondu = rep.lab;
  // Une écurie vraiment vexée resserre la vis
  if(S.contrat && S.contrat.relationEcurie < 22 && Math.random()<0.4){
    msg('ecurie', S.contrat.ecurieNom, 'Mise au point',
      `Vos déclarations publiques passent mal. ${S.contrat.ecurieNom} vous rappelle que le contrat contient une clause de bonne conduite médiatique.`);
    S.contrat.relationEcurie = clamp(S.contrat.relationEcurie+8,0,100);
  }
  saveGame();
  return {...rep, ...e};
}

function peutEtreMessagePilote(pos, dnf){
  const p=S.pilote;
  let proba = 0.16;
  if(p.relation<45) proba += 0.14;
  if(p.moral<45) proba += 0.12;
  if(Math.random()>proba) return;
  let d;
  if(p.relation<35) d = DEMANDES_PILOTE.find(x=>x.id==='offre');
  else if(p.moral<45) d = pick(DEMANDES_PILOTE.filter(x=>x.id!=='offre'));
  else d = pick(DEMANDES_PILOTE.filter(x=>x.id!=='offre'));
  msg('pilote', p.nom, d.sujet, d.corps, {kind:'demandePilote', demandeId:d.id});
}
function repondreDemande(msgObj, choix){
  const p=S.pilote, d=DEMANDES_PILOTE.find(x=>x.id===msgObj.actions.demandeId);
  let txt='';
  if(d.id==='essais'){
    if(choix===0){
      const cout = Math.round(CAT[p.catId].cout*0.035);
      if(S.manager.budget<cout){ showToast('Trésorerie insuffisante'); return null; }
      argent('Journée d’essais privés', -cout, 'pilote');
      p.relation=clamp(p.relation+9,0,100); p.moral=clamp(p.moral+5,5,100);
      p.fatigue=clamp(p.fatigue+6,0,100);
      S.flags.bonusReglages = 12;
      txt=`Journée réservée pour ${fmtEurFull(cout)}. Il arrivera avec des repères sur le prochain circuit (+12 sur les réglages).`;
    }else{ p.relation=clamp(p.relation-7,0,100); txt='Il comprend, mais il n’est pas dupe : l’argent manque.'; }
  }
  if(d.id==='materiel'){
    if(choix===0){
      p.relation=clamp(p.relation+11,0,100);
      if(S.contrat) S.contrat.relationEcurie=clamp((S.contrat.relationEcurie??60)-12,0,100);
      txt='Vous montez au créneau. Le pilote apprécie, l’écurie beaucoup moins.';
    }else{ p.relation=clamp(p.relation-8,0,100); p.moral=clamp(p.moral-7,5,100); txt='Il se sent seul. Le message est reçu, mal.'; }
  }
  if(d.id==='confiance'){
    if(choix===0){ p.moral=clamp(p.moral+8,5,100); p.relation=clamp(p.relation+6,0,100); txt='Il repart apaisé.'; }
    else{ p.moral=clamp(p.moral+14,5,100); p.relation=clamp(p.relation+12,0,100); S.flags.promesseTransfert=S.annee;
          txt='Vous vous êtes engagé. S’il reste dans la même écurie l’an prochain, il ne l’oubliera pas.'; }
  }
  if(d.id==='offre'){
    if(choix===0){ p.relation=clamp(p.relation+14,0,100); txt='Il reste. Pour l’instant.'; }
    else{
      if(Math.random() < (1 - p.relation/100)*0.7){ perdrePilote(); return {txt:'Il a signé ailleurs.'}; }
      p.relation=clamp(p.relation+3,0,100); txt='Il décline l’offre… de justesse.';
    }
  }
  msgObj.actions=null; msgObj.reponse=txt;
  saveGame();
  return {txt};
}
function perdrePilote(cause){
  const p = S.pilote;
  msg('pilote', p.nom, cause==='manager' ? 'Vous mettez fin à la collaboration' : 'Fin de collaboration',
    cause==='manager'
      ? `Vous ne représentez plus ${p.nom}. Les commissions à venir sur lui vous échappent, `+
        `et le paddock retiendra que vous avez lâché un pilote en cours de route.`
      : cause==='transfert'
        ? `${p.nom} est désormais représenté par un autre manager.`
      : `${p.nom} change de manager. Toutes vos commissions futures sur lui sont perdues.\n\n`+
        (cause==='famille'
          ? `Ce n’est pas lui qui a tranché, mais sa famille : elle finançait la saison, elle a décidé.`
          : `« Tu ne m’as pas suivi. Je pars avec quelqu’un qui croit en moi. »\n\n`+
            `C’était le risque d’une relation laissée se dégrader.`));
  // Quand c'est le manager qui rompt, le coût en réputation a déjà été prélevé
  // par confirmRompre() — celui qui l'a annoncé au joueur. En rajouter ici
  // ferait payer plus que le montant affiché.
  if(cause==='transfert') gagnerRep(-40, 'pilote débauché');
  else if(cause!=='manager') gagnerRep(cause==='famille' ? -70 : -120, 'départ du pilote');
  S.historique.push({annee:S.annee, type:'depart', pilote:p.nom, cause:cause||'relation'});
  S.pilote=null; S.contrat=null; S.mandat=null; S.saison=null; S.weekend=null;
  S.sponsors.actifs=[]; S.sponsors.prospects=[]; S.sponsors.vus=[];
  S.offres=null;
  syncDossier();
  // Les autres pilotes gérés continuent : on ne retombe au repérage que si la
  // structure se retrouve vide (GDD §15).
  if(!nbPilotes()){ S.phase='scouting'; genererScoutPool(); }
  // Il ne disparaît pas du monde : il retourne au vivier, où un rival le
  // signera peut-être — et où vous pourrez le regretter. Après la régénération
  // du vivier, sans quoi elle l'effacerait.
  p.role='candidat'; p.relation=45; p.rupture=0;
  p.moral=clamp(p.moral-8,5,100);
  S.monde.scoutPool = S.monde.scoutPool.filter(x=>x.id!==p.id);
  S.monde.scoutPool.unshift(p);
  saveGame();
}

function classementChampionnat(){
  const sa=S.saison;
  const l = [{id:S.pilote.id, nom:S.pilote.nom, ecurie:sa.ecurieNom, pts:sa.pts, victoires:sa.victoires,
              podiums:sa.podiums, abandons:sa.abandons, moi:true}];
  for(const g of sa.grille) l.push({id:g.id,nom:g.nom,ecurie:g.ecurie,pts:g.pts,victoires:g.victoires,
              podiums:g.podiums,abandons:g.abandons,moi:false,rival:g.rival});
  l.sort((a,b)=> b.pts-a.pts || b.victoires-a.victoires || b.podiums-a.podiums);
  l.forEach((x,i)=>x.pos=i+1);
  return l;
}
function positionChampionnat(){ const c=classementChampionnat(); return (c.find(x=>x.moi)||{}).pos || null; }

function ptsSuperlicence(catId, posChamp){
  const t = SUPERLIC[catId];
  if(!t) return 0;
  return posChamp>=1 && posChamp<=t.length ? t[posChamp-1] : 0;
}
function totalSuperlicence(){
  if(!S.pilote) return 0;
  // Une fois la F1 atteinte, la superlicence est acquise et se renouvelle.
  if(S.pilote.palmares.some(x=>x.catId==='f1') || S.pilote.catId==='f1') return SUPERLIC_REQUIS;
  return sum(S.pilote.superlicence.filter(x=>x.annee > S.annee-3), x=>x.pts);
}

function terminerSaison(interrompue){
  const sa=S.saison, c=CAT[sa.catId], p=S.pilote;
  const cl = classementChampionnat();
  const pos = (cl.find(x=>x.moi)||{}).pos || cl.length;
  sa.finie=true;
  sa.posChamp=pos;

  if(!interrompue){
    // primes conditionnelles des sponsors
    primesSponsorsFinSaison(pos);
    // titre
    if(pos===1){
      S.stats.titres++;
      if(c.titre>0){
        caisse('Prime de champion — '+c.nom, c.titre, 'gain');
        argent('Commission titre ('+Math.round(tauxCommission('titre')*100)+' %)',
          Math.round(c.titre*tauxCommission('titre')), 'commission');
      }
      gagnerRep(Math.round(80+c.niv*46), 'titre');
      msg('systeme','Fédération','Champion !', `${p.nom} est sacré champion de ${c.nom} ${S.annee}.\n\nVotre réputation en profite pleinement.`);
    }else if(pos<=3){
      gagnerRep(Math.round(24+c.niv*13),'podium championnat');
    }
    // points de superlicence
    const sl = ptsSuperlicence(sa.catId, pos);
    if(sl>0){
      p.superlicence.push({annee:S.annee, pts:sl, catId:sa.catId, pos});
      msg('systeme','FIA','Points de superlicence attribués',
        `${ordinal(pos)} en ${c.nom} : <em>${sl} points</em> de superlicence.\n\n`+
        `Total sur les 3 dernières années : ${totalSuperlicence()} / ${SUPERLIC_REQUIS}.`);
    }
  }

  // --- l'entourage se manifeste (GDD §7.4)
  if(!interrompue && CAT[sa.catId].format==='kart'){
    const att = positionAttendue() || Math.round(CAT[sa.catId].grille*0.5);
    pressionFamille(pos, att);
    const mot = motDeLaFamille(pos, att);
    const ent = ENTOURAGE[p.entourage||'discret'];
    if(mot){
      msg('pilote','Famille de '+p.nom.split(' ').slice(-1)[0],
        mot.ton==='rupture' ? 'Nous voulons revoir la situation'
        : mot.ton==='bon'   ? 'Merci pour cette saison'
        : 'Un mot sur la saison',
        `${mot.txt}\n\n<em>${ent.nom} — ils ont financé ${Math.round(ent.part*100)} % de la saison `+
        `et leur patience est à ${Math.round(p.patienceFamille)} / 100.</em>`);
    }
    // À bout de patience, une famille qui paie peut retirer le pilote.
    if(p.patienceFamille<=8 && ent.exigence>=2 && Math.random()<0.45){
      msg('pilote','Famille de '+p.nom.split(' ').slice(-1)[0],'Nous arrêtons là',
        `« Nous avons décidé de confier ${p.nom} à quelqu’un d’autre. Merci pour ce que vous avez fait. »\n\n`+
        `C’est le revers de l’apport familial : plus ils paient, plus ils décident.`);
      S.flags.familleRetire = true;
    }
  }

  p.palmares.push({annee:S.annee, catId:sa.catId, pos, pts:sa.pts, victoires:sa.victoires,
                   podiums:sa.podiums, abandons:sa.abandons, interrompue:!!interrompue});
  // Une saison complète passée avec lui vaut une observation de scout.
  p.observe = (p.observe||0) + 1;

  // Stagnation : rester dans une catégorie qu'on domine déjà use la motivation.
  const memeCat = p.palmares.filter(x=>x.catId===sa.catId);
  if(!interrompue && memeCat.length>=2 && pos<=3){
    const perte = 8 + (memeCat.length-2)*7;
    p.moral = clamp(p.moral - perte, 5, 100);
    p.relation = clamp(p.relation - perte*0.6, 0, 100);
    msg('pilote', p.nom, 'Je tourne en rond ici',
      `« ${memeCat.length} saisons en ${CAT[sa.catId].nom}, et je finis encore devant. `+
      `Si on ne monte pas, je vais finir par me demander ce que je fais avec toi. »`);
  }
  S.historique.push({annee:S.annee, catId:sa.catId, pos, pts:sa.pts, victoires:sa.victoires,
                     podiums:sa.podiums, pilote:p.nom, ecurie:sa.ecurieNom, interrompue:!!interrompue,
                     soldeManager:Math.round(S.manager.budget)});

  // Solde de caisse : un reliquat positif reste au pilote/à la structure, il n'enrichit pas le manager
  if(sa.caisse<0){
    argent('Régularisation de fin de saison', sa.caisse, 'sauvetage');
  }

  S.phase='finSaison';
  S.weekend=null;
  saveGame();
}

/* Vieillissement, retraite et progression du monde */
function passerAnneeSuivante(){
  S.annee++;
  S.manche = 0;
  S.manches = 0;
  // Le règlement de la nouvelle saison tombe AVANT les offres de baquet et
  // avant le premier euro de R&D : le joueur doit pouvoir s'y adapter (GDD §11).
  majReglements(true);
  for(const r of S.monde.rivaux){ r.age++; progresserPiloteAbstrait(r); }
  // Chaque dossier vieillit pour son compte : un pilote peut raccrocher pendant
  // que les autres continuent (GDD §7.2 et §15).
  pourChaqueDossier(d=>{
    const p=S.pilote;
    if(!p) return;
    // Une famille à bout de patience reprend son pilote (GDD §7.4)
    if(S.flags.familleRetire){
      S.flags.familleRetire = false;
      perdrePilote('famille');
      return;
    }
    p.age++;
    const proba = p.age<33?0 : clamp((p.age-32)*0.13 + (notePilote(p)<55?0.15:0), 0, 1);
    if(p.age>=34 && Math.random()<proba){ partirRetraite(); return; }
    S.saison=null; S.weekend=null;
    // sponsors : ceux dont le contrat pluriannuel court restent, les autres partent
    const gardes=[];
    for(const sp of S.sponsors.actifs){
      sp.duree--;
      if(sp.duree>0){ sp.verseSaison=0; gardes.push(sp); }
      else msg('sponsor', sp.nom, 'Fin de contrat', `Le partenariat avec ${sp.nom} pour ${p.nom} arrive à son terme. Il faudra le renégocier ou trouver mieux.`);
    }
    S.sponsors.actifs=gardes;
    majSponsorsProspects();
  });
  S.flags.renvoye=false;
  for(const k of Object.keys(S.flags)) if(k.startsWith('retrait_')) delete S.flags[k];
  // Mandats arrivés à échéance : le pilote est libre tant qu'on n'a pas
  // renégocié, et un concurrent peut le prendre sans rien verser.
  pourChaqueDossier(()=>{
    if(!S.pilote || !S.mandat) return;
    if(S.mandat.anneeFin < S.annee){
      msg('pilote', S.pilote.nom, 'Mon mandat est arrivé à terme',
        `« Notre accord s’arrête là. Je ne suis lié à personne pour ${S.annee}.\n\n`+
        `Si tu veux qu’on continue, il va falloir en reparler — et d’autres me font déjà les yeux doux. »\n\n`+
        `<em>Tant que le mandat n’est pas renouvelé, un concurrent peut le prendre sans vous indemniser.</em>`);
    }
  });
  formerEleves();                                    // GDD §22.2
  progresserManagers();
  if(!S.monde.managers || !S.monde.managers.length) creerManagersRivaux();
  tourDeMarche(1.2);      // un mouvement avant que le joueur ouvre le vivier
  S.phase = nbPilotes() ? 'intersaison' : 'scouting';
  S.actions=6;
  if(!nbPilotes()) genererScoutPool();
  saveGame();
}
function progresserPiloteAbstrait(r){
  const cA=coeffAge(r.age);
  for(const k of ALL_STATS){
    const m=1-r.stats[k]/r.plafonds[k];
    if(m>0) r.stats[k]=clamp(r.stats[k]+GAIN_SAISON*cA*m*rnd(1.1,0.7),1,99);
  }
  // le rival monte d'une catégorie s'il est prêt
  const c=CAT[r.catId];
  if(notePilote(r) > 42+c.niv*6.2 && c.niv<8 && r.age>=catByNiv(c.niv+1).ageMin){
    r.catId = catByNiv(c.niv+1).id;
    msg('scout','Votre réseau','Un rival progresse',
      `${r.nom}, que vous croisez depuis les débuts de ${S.pilote?S.pilote.nom:'votre pilote'}, vient de signer en ${CAT[r.catId].nom}.`);
  }
}
function partirRetraite(){
  const p=S.pilote;
  const meilleur = p.palmares.reduce((b,x)=> (!b || CAT[x.catId].niv>CAT[b.catId].niv || (CAT[x.catId].niv===CAT[b.catId].niv&&x.pos<b.pos))?x:b, null);
  msg('pilote', p.nom, 'Fin de carrière',
    `Après ${p.palmares.length} saisons, ${p.nom} raccroche le casque à ${p.age} ans.\n\n`+
    (meilleur ? `Meilleure saison : ${ordinal(meilleur.pos)} en ${CAT[meilleur.catId].nom} (${meilleur.annee}).\n\n` : '')+
    `La carrière de manager continue : à vous de trouver le prochain.`);
  S.historique.push({annee:S.annee, type:'retraite', pilote:p.nom, palmares:p.palmares});
  gagnerRep(Math.round(10 + (meilleur?CAT[meilleur.catId].niv*6:0)), 'carrière accomplie');
  S.pilote=null; S.contrat=null; S.saison=null; S.weekend=null;
  S.sponsors.actifs=[]; S.sponsors.prospects=[]; S.sponsors.vus=[];
  S.offres=null;
  syncDossier();
  // Les autres pilotes gérés continuent : on ne retombe au repérage que si la
  // structure se retrouve vide (GDD §15).
  if(!nbPilotes()){ S.phase='scouting'; genererScoutPool(); }
  saveGame();
}

/* ------------------- 17bis. CONDITIONS DE MONTÉE (GDD §8.2) */

/* Budget déjà sécurisé pour la saison à venir : les sponsors sous contrat.
   La trésorerie du manager n'en fait pas partie (GDD §19.1, option A) — elle
   ne peut que combler un manque, et cela se paie. */
function budgetSecurise(){
  return sum(S.sponsors.actifs, x=>x.montant);
}

/* Dernier classement de championnat connu du pilote. */
function dernierClassement(){
  if(S.saison && S.saison.posChamp) return S.saison.posChamp;
  const p=S.pilote;
  if(p && p.palmares.length){
    const d=p.palmares[p.palmares.length-1];
    if(!d.interrompue) return d.pos;
  }
  return null;
}

/* Assouplissement du résultat sportif obtenu par le budget apporté
   (GDD §8.2, « voie du pilote payant »). N'assouplit jamais la superlicence :
   c'est une règle FIA, elle ne s'achète pas. */
function assouplissementPayant(catCibleId){
  const c=CAT[catCibleId];
  if(!c.cout) return 0;
  return clamp(Math.floor(budgetSecurise() / c.cout * 6), 0, 6);
}

/* Âge autorisé pour monter dans une catégorie. C'est la table du §8.2 qui fait
   foi — une seule source de vérité. On tolère un an avant la fenêtre conseillée
   (un talent précoce), et jusqu'à la limite d'âge de la catégorie ensuite. */
function ageAutoriseMontee(catCibleId, age){
  const cond = MONTEE[catCibleId], c = CAT[catCibleId];
  if(!cond) return age>=c.ageMin-1 && age<=c.ageMax;
  return age >= cond.age[0]-1 && age <= c.ageMax;
}

/* Les trois conditions du §8.2, évaluées pour une catégorie visée.
   `ecurieOk` est fourni par l'existence d'une offre : on le passe de l'extérieur. */
function conditionsMontee(catCibleId, apport){
  const p=S.pilote, cond=MONTEE[catCibleId];
  const c=CAT[catCibleId];
  if(!cond) return null;
  const pos = dernierClassement();
  const bonus = assouplissementPayant(catCibleId);
  const posRequise = cond.pos + bonus;
  const titre = cond.titreSuffit && pos===1;
  const sportifOk = pos===null ? false : (pos<=posRequise || titre);
  const sl = totalSuperlicence();
  const slOk = sl >= cond.sl;
  const secure = budgetSecurise();
  const budgetOk = apport<=0 || secure >= apport;
  const manque = Math.max(0, apport - secure);
  return {
    cond, pos, posRequise, bonus, titre, sportifOk,
    sl, slRequis:cond.sl, slOk,
    secure, apport, budgetOk, manque,
    ageIdeal: cond.age, ageOk: ageAutoriseMontee(catCibleId, p.age),
    ageConseille: p.age>=cond.age[0] && p.age<=cond.age[1],
    ok: sportifOk && slOk && budgetOk && ageAutoriseMontee(catCibleId, p.age),
  };
}
/* Une montée est-elle envisageable sportivement ? (avant même de parler d'argent) */
function montePossibleSportivement(catCibleId){
  const k=conditionsMontee(catCibleId, 0);
  return k ? (k.sportifOk && k.slOk) : true;
}

/* --------------------------- 18. OFFRES & NÉGOCIATION (GDD §9.2, §9.4) */
/* Un « contrat » en catégorie junior est surtout un baquet à financer.
   En F1, le pilote est payé. Les pilotes payants (GDD §4.6) obtiennent
   un baquet au-dessus de leur niveau en apportant du budget. */
function genererOffres(){
  const p=S.pilote, rp=repPalier(S.manager.repPoints).p;
  const catAct = CAT[p.catId];
  const posChamp = S.saison ? (S.saison.posChamp||positionChampionnat()) : null;
  const note = notePilote(p);
  const budgetSponsors = sum(S.sponsors.actifs, s=>s.montant);
  const offres=[];

  const cibles=[];
  const sup = catByNiv(catAct.niv+1);
  // Monter d'une catégorie : le résultat sportif et la superlicence font barrage
  // avant même qu'une écurie se manifeste (GDD §8.2, conditions 1 et 3).
  if(sup && ageAutoriseMontee(sup.id, p.age)){
    if(montePossibleSportivement(sup.id) && (sup.id!=='f1' || p.age>=18)) cibles.push(sup.id);
  }
  // Rester, tant que la catégorie accepte encore son âge. Les catégories de
  // karting sont bornées : passé la limite, le pilote doit bouger, comme dans
  // la réalité — c'est l'âge qui pousse vers le haut de l'échelle.
  if(p.age <= catAct.ageMax) cibles.push(catAct.id);
  // Redescendre est la porte de sortie quand la saison n'est pas finançable, et
  // la seule option après un renvoi — mais pas dans une catégorie que l'âge du
  // pilote interdit : un pilote de 22 ans n'a rien à faire en Karting Mini.
  if(catAct.niv>0){
    const inf = catByNiv(catAct.niv-1);
    if(p.age <= inf.ageMax) cibles.push(inf.id);
  }
  // Trop vieux pour sa catégorie et pour celle du dessous : on lui ouvre la plus
  // basse qui l'accepte encore, sans quoi il n'aurait aucune offre du tout.
  if(!cibles.length){
    const possibles = CATS.filter(c=>p.age>=c.ageMin-1 && p.age<=c.ageMax);
    if(possibles.length) cibles.push(possibles.sort((a,b)=>a.niv-b.niv)[0].id);
  }
  // Voies alternatives (GDD §8.4) : elles s'ouvrent quand la F1 cesse d'être un
  // horizon réaliste. Un pilote « raté » en F1 peut devenir une légende en
  // endurance — c'est ce qui évite le sentiment de partie perdue.
  for(const alt of voiesOuvertes()) cibles.push(alt.id);

  for(const catId of [...new Set(cibles)]){
    const c=CAT[catId];
    const ecus = ecuriesPour(catId);
    for(const e of ecus){
      // Exigence sportive de l'écurie
      const exigNote = NIVEAU_GRILLE[catId] - 9 + (e.prestige-45)*0.30;
      const exigRep  = Math.max(1, Math.round(1 + c.niv*0.9 + (e.prestige-40)/22));
      // Un gros budget compense un déficit de niveau (pilote payant)
      const compensation = clamp(budgetSponsors / Math.max(60000, c.cout||3e6) * 16, 0, 22);
      const ecart = note + compensation - exigNote;
      if(ecart < -6) continue;
      if(rp < exigRep-2) continue;
      // Âge conseillé du §8.2 : hors de la fenêtre, les écuries se montrent
      // nettement moins intéressées — un pilote qui stagne perd de son attractivité.
      let appetit = clamp(0.35 + ecart/22, 0.12, 0.95);
      const mc = MONTEE[catId];
      if(mc && c.niv>catAct.niv){
        if(p.age < mc.age[0]-1) appetit *= 0.55;
        else if(p.age > mc.age[1]) appetit *= clamp(1 - (p.age-mc.age[1])*0.22, 0.15, 1);
      }
      const saisonsIci = p.palmares.filter(x=>x.catId===catAct.id).length;
      if(saisonsIci>=3) appetit *= clamp(1 - (saisonsIci-2)*0.18, 0.3, 1);
      if(Math.random() > appetit) continue;

      const junior = c.niv<8 && Math.random() < clamp(0.10 + ecart/45 + (posChamp&&posChamp<=3?0.25:0), 0, 0.55);
      // Part du budget prise en charge par l'écurie
      let partEcurie = 0;
      if(c.niv===8 || c.alt) partEcurie = 1;
      else if(junior) partEcurie = clamp(0.45 + ecart/60 + rnd(0.2), 0.4, 1);
      else partEcurie = clamp(ecart/55 + rnd(0.18) - 0.05, 0, 0.65);
      const apport = Math.max(0, Math.round(coutEngagement(catId)*(1-partEcurie)/1000)*1000);

      // Salaire : en F1, et dans les voies alternatives où le pilote est payé
      // au lieu de payer (GDD §8.4). C'est le basculement économique du jeu.
      let salaire=0, primeVictoire=0, primePoint=0;
      if(c.niv===8){
        const base = e.prestige>85 ? 6e6 : e.prestige>65 ? 2.4e6 : 0.8e6;
        salaire = Math.round(base * clamp(0.6+ (note-70)/40, 0.5, 3.2) / 1e4)*1e4;
        primeVictoire = Math.round(salaire*0.06/1e3)*1e3;
        primePoint    = Math.round(salaire*0.002/100)*100;
      }else if(c.alt){
        const [bas, haut] = c.salaire;
        const rang = clamp((e.prestige-35)/55, 0, 1);
        const niveau = clamp((note-62)/28, 0, 1);
        salaire = Math.round((bas + (haut-bas)*(rang*0.6+niveau*0.4)) / 1e4)*1e4;
        primeVictoire = Math.round(salaire*0.05/1e3)*1e3;
        primePoint    = Math.round(salaire*0.0015/100)*100;
      }
      const objectifPos = Math.max(1, Math.round(clamp(c.grille*0.5 - (e.prestige-45)*0.16 - ecart*0.30, 1, c.grille-2)));
      offres.push({
        id:uid(), catId, ecurieId:e.id, ecurieNom:e.nom, prestige:e.prestige, voiture:e.voiture,
        junior, partEcurie:round(partEcurie,2), apport, salaire, primeVictoire, primePoint,
        duree: junior?2:rint(1,2), objectifPos,
        clauseLiberation: Math.random()<0.4,
        bonusFidelite: Math.random()<0.3 ? Math.round((salaire||c.cout)*0.05/1e3)*1e3 : 0,
        bonusVoiture: junior ? rint(2,5) : 0,
        risque: clamp(Math.round(20 + (c.niv-catAct.niv)*16 + Math.max(0,-ecart)*3.4 - (junior?12:0)), 5, 92),
        progression: junior
            ? (c.niv>catAct.niv ? 'Programme jeunes : montée en '+c.court+' avec le soutien de l’écurie'
                                : 'Programme jeunes : 1 an de plus en '+c.court+', fort soutien')
            : c.niv>catAct.niv ? 'Montée directe en '+c.court
            : c.niv<catAct.niv ? 'Retour en '+c.court+' pour se relancer'
            : 'Maintien en '+c.court,
        tours:0, retiree:false,
        montee: c.niv>catAct.niv,
      });
    }
  }
  // On garde les meilleures, sans doublon d'écurie
  const vus=new Set(); const out=[];
  offres.sort((a,b)=> (CAT[b.catId].niv-CAT[a.catId].niv) || (b.prestige-a.prestige));
  for(const o of offres){ const k=o.catId+o.ecurieId; if(vus.has(k))continue; vus.add(k); out.push(o); }
  return out.slice(0, 6);
}

/* Négociation en plusieurs tours : chaque relance peut faire fuir l'écurie (GDD §9.4) */
const LEVIERS = [
  {id:'apport',  lab:'Demander une prise en charge supplémentaire', desc:'Faire baisser l’apport exigé de 15 %.'},
  {id:'salaire', lab:'Demander un meilleur salaire',                desc:'+18 % sur le fixe (F1 uniquement).'},
  {id:'duree',   lab:'Raccourcir l’engagement',                     desc:'Contrat plus court : plus de liberté.'},
  {id:'clause',  lab:'Exiger une clause de libération',             desc:'Partir librement si l’écurie ne tient pas ses promesses.'},
  {id:'objectif',lab:'Assouplir l’objectif de résultat',            desc:'Objectif contractuel relevé de 2 places : moins de risque de renvoi.'},
];
function negocier(offre, levierId){
  offre.tours++;
  const rp=repPalier(S.manager.repPoints).p;
  const jur = bonusJuridique();                 // GDD §22.1
  const base = 0.62 + rp*0.028 + (S.pilote.reputation/100)*0.18 + jur*0.05;
  const proba = clamp(base - offre.tours*0.16, 0.06, 0.94);
  const risqueRetrait = clamp(0.05 + offre.tours*0.13 - rp*0.012 - jur*0.025, 0.02, 0.6);

  if(Math.random() < risqueRetrait){
    offre.retiree = true;
    return {issue:'retrait', txt:`${offre.ecurieNom} se retire de la négociation. Vous avez tiré sur la corde une fois de trop.`};
  }
  if(Math.random() < proba){
    switch(levierId){
      case 'apport':  offre.apport = Math.max(0, Math.round(offre.apport*0.85/1000)*1000);
                      offre.partEcurie = round(1 - offre.apport/Math.max(1,coutEngagement(offre.catId)||1),2); break;
      case 'salaire': if(offre.salaire>0){ offre.salaire=Math.round(offre.salaire*1.18/1e4)*1e4; } break;
      case 'duree':   offre.duree = Math.max(1, offre.duree-1); break;
      case 'clause':  offre.clauseLiberation = true; break;
      case 'objectif':offre.objectifPos = Math.min(CAT[offre.catId].grille-1, offre.objectifPos+2); break;
    }
    return {issue:'ok', txt:`${offre.ecurieNom} accepte votre demande.`};
  }
  return {issue:'refus', txt:`${offre.ecurieNom} refuse mais reste à la table. Chaque relance supplémentaire augmente le risque de rupture.`};
}

function signerOffre(offre){
  const c=CAT[offre.catId];
  const com = offre.salaire>0
    ? Math.round(offre.salaire*(0.05 + (offre.prestige/100)*0.10))
    : Math.round(Math.max(2000, c.cout*0.02));
  argent('Commission de transfert — '+offre.ecurieNom, com, 'commission');
  S.contrat = {
    ecurieId:offre.ecurieId, ecurieNom:offre.ecurieNom, catId:offre.catId,
    duree:offre.duree, anneeDebut:S.annee, salaire:offre.salaire,
    primeVictoire:offre.primeVictoire, primePoint:offre.primePoint,
    partEcurie:offre.partEcurie, apport:offre.apport, objectifPos:offre.objectifPos,
    clauseLiberation:offre.clauseLiberation, bonusFidelite:offre.bonusFidelite,
    bonusVoiture:offre.bonusVoiture, junior:offre.junior, relationEcurie:62,
  };
  S.pilote.catId = offre.catId;
  gagnerRep(Math.round(8 + c.niv*7 + offre.prestige*0.12), 'signature');
  if(offre.catId==='f1' && !S.flags.f1Atteinte){
    S.flags.f1Atteinte = true;
    gagnerRep(500,'accès à la F1');
    msg('systeme','Paddock','La Formule 1',
      `${S.pilote.nom} est officiellement pilote de Formule 1 chez ${offre.ecurieNom}.\n\n`+
      `C’est l’aboutissement de tout ce que vous avez construit depuis le karting.`);
  }
  S.flags.signatureRecente = {ecurie:offre.ecurieNom, cat:c.court, annee:S.annee};
  msg('ecurie', offre.ecurieNom, 'Contrat signé — saison '+S.annee,
    `${S.pilote.nom} rejoint ${offre.ecurieNom} en ${c.nom}.\n\n`+
    (offre.salaire>0 ? `Salaire annuel : <em>${fmtEurFull(offre.salaire)}</em>. Votre commission : 10 %.\n` :
                       `Apport exigé : <em>${fmtEurFull(offre.apport)}</em> sur la saison — à trouver auprès des sponsors.\n`)+
    `Objectif contractuel : ${ordinal(offre.objectifPos)} au championnat. Durée : ${offre.duree} an(s).`);
  S.offres = null;
  saveGame();
}

/* -------------------------------------- 19. STAFF (GDD §13, §19.7) */
function candidatsStaff(roleId){
  const rp=repPalier(S.manager.repPoints).p;
  const nivMax = clamp(1+Math.floor(rp/2), 1, 5);
  const out=[];
  for(let n=1;n<=nivMax;n++){
    out.push({roleId, niv:n, nom:nomAleatoire(), salaire:staffSalaire(roleId,n)});
  }
  return out;
}
function recruterStaff(roleId, niv, nom){
  const sal = staffSalaire(roleId,niv);
  S.staff[roleId] = {niv, salaire:sal, nom};
  msg('systeme','Ressources humaines','Recrutement — '+STAFF_ROLE[roleId].nom,
    `${nom} rejoint votre structure comme ${STAFF_ROLE[roleId].nom} (${NIV_LABEL[niv]}).\n\n`+
    `Coût : <em>${fmtEurFull(sal)} par mois</em>, prélevé sur votre trésorerie à chaque manche.`);
  saveGame();
}
function licencierStaff(roleId){
  const s=S.staff[roleId]; if(!s) return;
  const indem = Math.round(s.salaire*1.5);
  argent('Indemnité de départ — '+STAFF_ROLE[roleId].nom, -indem, 'staff');
  delete S.staff[roleId];
  saveGame();
}

/* ------------------------ 20. ACTIONS DE PRÉPARATION (entre 2 manches) */
const ACTIONS_SEMAINE = [
  {id:'entrainement', nom:'Séance d’entraînement', desc:'Progression ciblée, mais fatigue le pilote.'},
  {id:'repos',        nom:'Repos',                 desc:'Fait retomber la fatigue, un peu de moral.'},
  {id:'discussion',   nom:'Parler au pilote',      desc:'Choisir un ton — l’effet dépend de sa personnalité.'},
  {id:'dev',          nom:'Développement technique',desc:'Investir sur le matériel : performance de la voiture.'},
];
function entrainement(groupeId){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  S.actions--;
  const p=S.pilote, g=STAT_GROUPES.find(x=>x.id===groupeId);
  const cAge=coeffAge(p.age), cStaff=1+staffNiv('ingenieur')*0.045+staffNiv('prepa')*0.035;
  const cMoral=0.7+(p.moral/100)*0.6, cTrait=p.traits.includes('bosseur')?1.25:1;
  const gains={};
  for(const [k] of g.stats){
    const m=1-p.stats[k]/p.plafonds[k];
    if(m<=0){gains[k]=0;continue;}
    const gain = 0.85*cAge*cStaff*cMoral*cTrait*m*rnd(1.3,0.6);
    p.stats[k]=clamp(p.stats[k]+gain,1,99);
    gains[k]=gain;
  }
  p.fatigue=clamp(p.fatigue+rint(7,13)-staffNiv('prepa')*2,0,100);
  majForme();
  saveGame();
  return {groupe:g.nom, gains};
}
function repos(){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  S.actions--;
  const p=S.pilote;
  const r = 14 + staffNiv('prepa')*5;
  p.fatigue=clamp(p.fatigue-r,0,100);
  p.moral=clamp(p.moral+3,5,100);
  majForme();
  saveGame();
  return {recup:r};
}
function developpement(axe, montant){
  if(S.actions<=0){ showToast('Plus d’action disponible'); return null; }
  if(!S.saison){ return null; }
  if(!S.saison.dev) S.saison.dev = {chassis:0, aero:0, moteur:0};
  if(!(axe in S.saison.dev)){ return null; }
  const plafAxe = plafondAxeCourant(axe);
  if(S.saison.dev[axe] >= plafAxe-0.01){
    showToast('Cet axe est au plafond ('+round(plafAxe,0)+') — l’argent serait perdu');
    return null;
  }
  if(S.saison.caisse < montant){ showToast('La caisse de saison ne le permet pas'); return null; }
  // Plafond budgétaire réglementaire (GDD §11) : on refuse plutôt que de rogner
  // le montant en silence, sinon le joueur croit avoir investi ce qu'il a vu.
  const plafBudget = devPlafondSaison();
  if(S.saison.devDepense + montant > plafBudget){
    showToast('Plafond budgétaire : il reste '+fmtEurFull(Math.max(0, plafBudget-S.saison.devDepense)));
    return null;
  }
  S.actions--;
  const nom = axesDev().find(a=>a.k===axe).nom;
  caisse('Développement — '+nom, -montant, 'dev');
  S.saison.devDepense += montant;
  // rendement décroissant : plus on a déjà investi sur cet axe, moins ça rapporte
  const ref = Math.max(20000, CAT[S.saison.catId].cout*0.25);
  // Rendement décroissant sur la dépense totale, mais pas par axe : sinon se
  // spécialiser est toujours perdant, puisque les poids somment à 1 et que
  // répartir capte alors 100 % de chaque euro investi.
  // La décroissance est asymptotique : elle ralentit le gain sans jamais
  // l'annuler, contrairement à une pénalité linéaire qui finit par passer
  // sous zéro et rendre tout investissement supplémentaire inutile.
  const fatigue = 1 / (1 + S.saison.devDepense/(ref*9));
  const g = clamp(6.0 * Math.log10(1 + montant/ref*9) * fatigue, 0, 5);
  S.saison.dev[axe] = clamp(S.saison.dev[axe] + g, 0, plafondAxeCourant(axe));
  saveGame();
  return {gain:g, axe, nom};
}

/* --------------------------------------------- 21. BOUCLE DE JEU */
function financementCouvert(){
  if(!S.saison) return 0;
  const c=CAT[S.saison.catId];
  const restants = c.courses - S.saison.courseIndex;
  const besoin = Math.round(S.saison.coutTotal/c.courses)*restants;
  const attendu = sum(S.sponsors.actifs, s=>Math.round(s.montant*(1-s.partConditionnelle)/c.courses)*restants);
  return besoin<=0 ? 1 : clamp((S.saison.caisse + attendu)/besoin, 0, 2);
}
function faillite(){ return S.manager.budget < -60000; }

function avancerSemaine(){
  // Fin des actions de préparation -> on part en week-end de course
  ouvrirWeekend();
}
function finirWeekend(){
  // Le pilote peut avoir claqué la porte pendant le débrief : plus de saison à
  // faire avancer, mais le calendrier commun des autres dossiers, lui, doit
  // continuer de tourner (GDD §15).
  if(!S.saison){
    S.weekend=null;
    syncDossier(); avancerCalendrier();
    saveGame();
    return;
  }
  S.saison.courseIndex++;
  S.weekend=null;
  if(S.flags.ruptureEnCours){
    S.flags.ruptureEnCours=false;
    terminerSaison(true);
    syncDossier(); avancerCalendrier();
    saveGame();
    return;
  }
  if(faillite()){ S.phase='faillite'; saveGame(); return; }
  if(S.saison.courseIndex >= S.saison.calendrier.length) terminerSaison(false);
  syncDossier();
  avancerCalendrier();
  saveGame();
}
