const staffCoutMensuel = ()=> sum(Object.values(S.staff), s=>s.salaire) + coutScoutsRegion()
  + coutLocauxMensuel() + coutAcademieMensuel();
function staffNiv(roleId){ return S.staff[roleId] ? S.staff[roleId].niv : 0; }

/* --------------------------------------- 7. SCOUTING (GDD §5, §13) */
/* Taille et qualité du vivier selon la réputation du manager. */
function genererScoutPool(){
  const rp = repPalier(S.manager.repPoints).p;
  // Chaque antenne régionale ouverte élargit le vivier (GDD §5.2).
  const regions = regionsCouvertes();
  const n  = clamp(4 + Math.floor(rp*0.9) + (regions.length-1)*2, 4, 20);
  const pays = paysCouverts();
  const pool = [];
  for(let i=0;i<n;i++){
    // Plus la réputation est haute, plus on tombe sur de vrais talents.
    const r = Math.random() + rp*0.045;
    const potId = r>1.02?4 : r>0.78?3 : r>0.38?2 : 1;
    const age = rint(9,14);
    const catKart = age<=10?'kmini' : age<=12?'kcadet' : 'kjunior';
    const p = creerPilote({age, potId, role:'candidat', catId:catKart, pays:pick(pays)});
    ecoleRegionale(p);
    pool.push(p);
  }
  // Un manager très réputé voit aussi des pilotes déjà installés en monoplace —
  // mais seulement dans une catégorie qu'il peut réellement financer. Proposer un
  // pilote de F3 à un manager qui a 20 000 € n'est pas une opportunité, c'est un
  // piège : le §8.2 bloquera la suite et la trésorerie fondra pour rien.
  if(rp>=4){
    const vise = rp>=9?'f2' : rp>=7?'f3' : 'f4';
    let c = null;
    for(let niv=CAT[vise].niv; niv>=5; niv--){
      const cand = catByNiv(niv);
      if(S.manager.budget + potentielSponsorsSaison(cand.id) >= cand.cout*0.6){ c = cand.id; break; }
    }
    if(c){
      for(let i=0;i<(rp>=7?3:2);i++){
        const p = creerPiloteIA(c);
        p.role='candidat'; p.observe=0; p.seedEst=Math.random();
        p.pays = pick(pays);                 // eux aussi viennent des régions couvertes
        ecoleRegionale(p);
        p.reputation = clamp(Math.round(20+CAT[c].niv*6+rnd(18)),5,90);
        pool.push(p);
      }
    }
  }
  S.monde.scoutPool = pool;
  S.monde.poolAnnee = S.annee;
}

/* Chaque région a son école : la formation locale penche vers une qualité, au
   détriment des autres. Le total reste constant — on ne recrute pas au Brésil
   pour avoir un pilote meilleur partout, mais pour un profil différent. */
function ecoleRegionale(p){
  const reg = REGION[PAYS_REGION[p.pays]];
  if(!reg || !reg.ecole) return;
  for(const g of STAT_GROUPES){
    const favorise = g.id===reg.ecole;
    for(const [k] of g.stats){
      const d = favorise ? rint(3,6) : -rint(1,3);
      p.plafonds[k] = clamp(p.plafonds[k]+d, 20, 99);
      p.stats[k]    = clamp(p.stats[k]+Math.round(d*0.6), 8, p.plafonds[k]);
    }
  }
}

/* Ce qu'un manager de cette réputation peut raisonnablement lever en sponsors
   sur une saison, compte tenu des emplacements publicitaires de la catégorie.
   Sert à ne proposer que des pilotes dont la saison est finançable. */
function potentielSponsorsSaison(catId){
  const rp = repPalier(S.manager.repPoints).p;
  const slots = CAT[catId].slots;
  const acc = SPONSOR_NIVEAUX.filter(n=>rp >= n.repMin-1);
  if(!acc.length) return 0;
  const med = n => (n.min+n.max)/2 * 0.55;      // estimation prudente
  const top = acc[acc.length-1];
  const sous = acc[Math.max(0, acc.length-2)];
  return Math.round(Math.ceil(slots/2)*med(top) + Math.floor(slots/2)*med(sous));
}

/* Estimation floue d'une valeur — la marge dépend du scout et des observations.
   GDD §5.1 : le joueur ne voit jamais la vraie valeur exacte. */
function marge(p){
  // Un pilote sorti de votre académie n'a plus de secret : c'est la contrepartie
  // de cinq à sept saisons de formation (GDD §22.2).
  if(p.formeParVous) return 0;
  const niv = staffNiv('scout') + niveauLocal('scouting');   // la cellule vaut un niveau de scout
  const base = [16,11,8,5.5,3.5,2][Math.min(niv,5)];         // niv 0 = aucun scout
  return Math.max(1, base - p.observe*1.6);
}
function estim(p, val, salt){
  const m = marge(p);
  if(m===0) { const v=clamp(Math.round(val),1,99); return {lo:v, hi:v, c:v}; }
  // Biais stable par pilote+stat pour que l'estimation ne change pas à chaque rendu
  const biais = (hash01(p.id+salt+p.seedEst)*2-1) * m;
  const c = clamp(Math.round(val + biais), 1, 99);
  return {lo:clamp(Math.round(c-m),1,99), hi:clamp(Math.round(c+m),1,99), c};
}
function estimTexte(p, val, salt){
  const e = estim(p,val,salt);
  return marge(p)<=2.2 ? String(e.c) : e.lo+'–'+e.hi;
}
/* Estimation du potentiel : fourchette de libellés (ex. « Moyen à Élevé ») */
function estimPotentiel(p){
  const m = marge(p);
  const span = m>13?3 : m>9?2 : m>5?1 : 0;
  const biais = Math.round((hash01(p.id+'pot'+p.seedEst)*2-1)*span*0.7);
  const c  = clamp(p.potId+biais,1,4);
  const lo = clamp(c-Math.ceil(span/2),1,4), hi = clamp(c+Math.floor(span/2),1,4);
  return lo===hi ? POT[lo].nom : POT[lo].nom+' à '+POT[hi].nom;
}

/* ------------------------------------------- 8. SAISON & CALENDRIER */
function genererCalendrier(catId, annee){
  const c = CAT[catId];
  const src = c.format==='kart' ? CIRCUITS_KART : CIRCUITS_MONO;
  const list = shuffle(src);
  const cal = [];
  for(let i=0;i<c.courses;i++){
    const ci = list[i % list.length];
    cal.push({
      i, nom:ci.n, pays:ci.p, type:ci.t, w:ci.w,
      seed: ci.n+'|'+annee+'|'+catId+'|'+i,
      meteo: null, fait:false,
    });
  }
  return cal;
}

/* Grille adverse d'une saison. Les rivaux persistants y sont injectés
   quand ils courent dans la même catégorie. */
function genererGrille(catId){
  const c = CAT[catId];
  const ecu = ecuriesPour(catId);
  const n = c.grille - 1;                 // -1 : la place du pilote du joueur
  const g = [];
  for(let i=0;i<n;i++){
    // Répartition : chaque écurie aligne ~2 pilotes, les meilleures écuries
    // attirent les meilleurs pilotes.
    const e = ecu[Math.min(ecu.length-1, Math.floor(i/Math.ceil(n/ecu.length)))];
    const cible = NIVEAU_GRILLE[catId] + (e.prestige-50)*0.30 + gauss()*6;
    const p = creerPiloteIA(catId, cible);
    g.push({
      id:p.id, nom:p.nom, pays:p.pays, note:notePilote(p), age:p.age,
      agressivite:p.agressivite, ecurieId:e.id, ecurie:e.nom,
      voiture:clamp(e.voiture + rint(-2,2),30,99), fiab:e.fiab,
      pts:0, victoires:0, podiums:0, abandons:0, rival:false, p,
    });
  }
  // Injection des rivaux persistants présents dans la catégorie
  for(const r of S.monde.rivaux){
    if(r.catId!==catId || r.retraite) continue;
    const e = pick(ecu.slice(0, Math.max(2,Math.ceil(ecu.length/2))));
    g.pop();
    g.push({
      id:r.id, nom:r.nom, pays:r.pays, note:notePilote(r), age:r.age,
      agressivite:r.agressivite, ecurieId:e.id, ecurie:e.nom,
      voiture:clamp(e.voiture+rint(-1,2),30,99), fiab:e.fiab,
      pts:0, victoires:0, podiums:0, abandons:0, rival:true, p:r,
    });
  }
  return g;
}

function creerRivaux(){
  // 3 rivaux qui suivront la carrière du joueur (GDD §5.3 en germe côté pilotes)
  const cat = S.pilote ? S.pilote.catId : 'kmini';
  S.monde.rivaux = [];
  for(let i=0;i<3;i++){
    const r = creerPilote({age: (S.pilote?S.pilote.age:12)+rint(-1,1), potId: i===0?4:3, catId:cat, role:'rival',
      part: clamp(0.34+gauss()*0.05,0.24,0.55)});
    S.monde.rivaux.push(r);
  }
}

/* ================= MANDAT ET MARCHÉ DES TRANSFERTS =====================
   Jusqu'ici, représenter un pilote n'était encadré par rien : on le signait, on
   le gardait, et la commission était figée. Le mandat en fait un vrai contrat —
   une durée, un taux négocié — et ouvre un marché : on peut aller chercher le
   pilote d'un concurrent en l'indemnisant, et se faire prendre le sien. */
const COMMISSION_BASE = 0.10;        // taux de référence sur les gains de course
const COMMISSION_MIN  = 0.04;
const COMMISSION_MAX  = 0.22;

/* Taux effectivement appliqué. Les trois assiettes gardent leur rapport
   historique : course ×1, sponsors ×1,5, titre ×2. */
function tauxCommission(assiette){
  const m = S.mandat;
  const base = m && m.commission ? m.commission : COMMISSION_BASE;
  const mult = assiette==='sponsor' ? 1.5 : assiette==='titre' ? 2 : 1;
  return clamp(base*mult, 0.02, 0.5);
}
function mandatActif(){ return !!(S.mandat && S.mandat.anneeFin >= S.annee); }
/* Un mandat qui expire ne se prolonge pas tout seul : il faut le renégocier à
   l'intersaison, sinon le pilote se retrouve libre et n'importe quel
   concurrent peut le prendre sans rien vous verser. */
function mandatEchu(){ return !!(S.pilote && S.mandat && S.mandat.anneeFin < S.annee); }
function mandatDerniereAnnee(){ return !!(S.pilote && S.mandat && S.mandat.anneeFin === S.annee); }

/* Ce que le pilote pense d'une proposition de renouvellement. Il compare le
   taux, ce qu'il vaut désormais, et ce que vous lui avez fait vivre. */
function interetRenouvellement(taux){
  const p = S.pilote;
  if(!p) return 0;
  const rp = repPalier(S.manager.repPoints).p;
  const ancien = S.mandat ? S.mandat.commission : COMMISSION_BASE;
  // Un pilote qui a progressé sous votre houlette accepte plus facilement.
  const progres = p.palmares.length ? clamp((p.palmares[p.palmares.length-1].pos<=5?18:-8), -12, 20) : 0;
  return (ancien - taux)*380 + (p.relation-45)*0.9 + rp*4 + progres;
}
function probaRenouvellement(taux){ return clamp(0.28 + interetRenouvellement(taux)/120, 0.04, 0.96); }

/* Renouveler pour trois saisons au taux proposé. */
function renouvelerMandat(taux){
  const p = S.pilote;
  if(!p) return {issue:'sanspilote'};
  if(Math.random() > probaRenouvellement(taux)){
    p.relation = clamp(p.relation-5, 0, 100);
    S.flags['renouRefus_'+p.id] = (S.flags['renouRefus_'+p.id]||0)+1;
    return {issue:'refus', essais:S.flags['renouRefus_'+p.id]};
  }
  S.mandat = {anneeDebut:S.annee, anneeFin:S.annee+2, duree:3, commission:taux,
              indemnite:S.mandat?S.mandat.indemnite:0};
  delete S.flags['renouRefus_'+p.id];
  p.relation = clamp(p.relation+10, 0, 100);
  msg('pilote', p.nom, 'Mandat renouvelé',
    `${p.nom} vous renouvelle sa confiance pour trois saisons, à ${Math.round(taux*100)} %.`);
  return {issue:'accord', taux};
}
function anneesMandatRestantes(){ return S.mandat ? Math.max(0, S.mandat.anneeFin - S.annee + 1) : 0; }

/* Valeur marchande d'un pilote : ce qu'il rapportera, pondéré par sa jeunesse.
   Sert d'indemnité de transfert et de repère de négociation. */
function valeurMarchande(p, catId){
  const cat = CAT[catId || p.catId] || CAT.kmini;
  // Accepte aussi bien un pilote complet qu'un résumé détenu par un rival, qui
  // ne porte que deux nombres et pas les neuf statistiques.
  const plaf = p.plafonds ? notePlafond(p) : (p.plafond ?? 60);
  const note = p.stats    ? notePilote(p)  : (p.note ?? 40);
  const jeunesse = clamp((26 - (p.age||18))/12, 0.15, 1);
  const socle = 3000 + cat.niv*cat.niv*900;
  return Math.round((socle + plaf*plaf*14 + note*260) * (0.5 + jeunesse*0.8) / 500)*500;
}
/* Indemnité due au manager sortant : il perd ses commissions à venir. */
function indemniteTransfert(p, catId, anneesRestantes){
  return Math.round(valeurMarchande(p, catId) * (0.35 + clamp(anneesRestantes,0,3)*0.22) / 500)*500;
}

/* Ce qu'un pilote pense d'une proposition de mandat. Il compare le taux qu'on
   lui prend, la réputation du manager, et ce qu'il vit chez le sien. */
function interetMandat(p, commission, repManager, relationActuelle, repActuel){
  const gain = (COMMISSION_BASE - commission) * 420;      // un taux bas le séduit
  const prestige = (repManager - (repActuel||0)) * 6;
  const lassitude = relationActuelle===null ? 12 : clamp((55 - relationActuelle)*0.7, -25, 40);
  return gain + prestige + lassitude;
}
function probaMandat(interet){ return clamp(0.30 + interet/110, 0.03, 0.95); }

/* Un rival ne stocke qu'un résumé de ses pilotes. Pour en faire un pilote
   jouable, on reconstruit ses statistiques autour de sa note et de son plafond. */
function pilotePourTransfert(e){
  const p = creerPilote({age:e.age, potId:3, catId:e.catId, nom:e.nom, id:e.id});
  const cible = clamp(e.note, 5, 99), plaf = clamp(e.plafond, cible+1, 99);
  for(const k of ALL_STATS){
    p.plafonds[k] = clamp(Math.round(plaf + rint(-3,3)), 20, 99);
    p.stats[k]    = clamp(Math.round(cible + rint(-3,3)), 5, p.plafonds[k]);
  }
  p.role='joueur'; p.relation=52; p.moral=clamp(p.moral,55,90);
  p.observe=2; p.blessure=null; p.rupture=0;
  return p;
}

/* Approcher le pilote d'un concurrent. Deux étapes : il faut d'abord qu'il
   accepte le principe, puis payer l'indemnité à son manager. */
function approcherPilote(eleveId, commission){
  const cible = marcheTransferts().find(x=>x.eleve.id===eleveId);
  if(!cible) return {issue:'introuvable'};
  const {eleve, manager} = cible;
  const rp = repPalier(S.manager.repPoints).p;
  // Un pilote bien traité chez lui n'écoute pas : on approxime sa satisfaction
  // par la réputation de son manager et son niveau de catégorie.
  const relationChezLui = clamp(45 + manager.rep*3 + CAT[eleve.catId].niv*2, 20, 92);
  const interet = interetMandat(eleve, commission, rp, relationChezLui, manager.rep);
  const proba = probaMandat(interet);
  if(Math.random() > proba){
    eleve.approches = (eleve.approches||0)+1;
    return {issue:'refus', proba, nom:eleve.nom, manager:manager.nom};
  }
  return {issue:'accord', proba, eleve, manager,
          indemnite: indemniteTransfert(eleve, eleve.catId, 2)};
}

/* L'inverse : un concurrent vient chercher VOTRE pilote. Il vise ceux qui
   valent quelque chose et dont la relation avec vous s'est distendue. Le joueur
   peut répondre en baissant sa commission — ce qui coûte, mais retient. */
function offreSurMonPilote(){
  if(!S.pilote || !S.monde.managers || !S.monde.managers.length) return null;
  const p = S.pilote;
  const rp = repPalier(S.manager.repPoints).p;
  // Un manager plein peut quand même venir, s'il est prêt à se séparer de son
  // moins bon pour votre pilote — sans quoi le marché se fige dès que les
  // rivaux ont rempli leurs places, et plus personne ne débauche personne.
  const monPlafond = notePlafond(p);
  const pretendants = S.monde.managers.filter(m => {
    if(m.rep < rp-3) return false;
    if(m.pilotes.length < placesRival(m)) return true;
    const faible = m.pilotes.reduce((b,x)=> !b || x.plafond<b.plafond ? x : b, null);
    return !!faible && faible.plafond < monPlafond - 4;
  });
  if(!pretendants.length) return null;
  const m = pretendants[Math.floor(Math.random()*pretendants.length)];
  const tx = pick([0.05,0.06,0.08]);
  const interet = interetMandat(p, tx, m.rep, p.relation, rp);
  if(interet < 10) return null;                 // il n'est pas tenté
  return {managerId:m.id, manager:m.nom, repRival:m.rep, commission:tx,
          interet:Math.round(interet), valeur:valeurMarchande(p)};
}

/* Un concurrent tente sa chance sur l'un de vos pilotes. Rare, et seulement
   quand la relation laisse une prise. */
function demarchageRivaux(){
  if(!S.dossiers) return;
  const retour = S.actif;
  syncDossier();
  for(let i=0;i<S.dossiers.length;i++){
    const v = S.dossiers[i];
    if(!v.pilote) continue;
    const enCours = S.flags['offreEnCours_'+v.pilote.id];
    if(enCours){
      // Une offre laissée sans réponse ne bloque pas la mécanique : au bout de
      // trois manches, ne rien avoir proposé compte comme une réponse.
      if((S.manche||0) - (enCours.manche||0) >= 3){
        // On retient l'identifiant : répondre peut faire partir le pilote, et
        // v.pilote devient alors nul.
        const pilId = v.pilote.id;
        S.actif = i;
        for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[i][k];
        const r = repondreOffreRivale(pilId, 'refuser');
        const m = S.inbox.find(x=>x.actions && x.actions.kind==='offreRivale' && x.actions.pilId===pilId);
        if(m){ m.actions=null; m.reponse = r ? r.txt : 'Sans réponse de votre part.'; }
        syncDossier();
      }
      continue;
    }
    const libre = v.mandat && v.mandat.anneeFin < S.annee;
    // Un pilote sous mandat et bien traité n'est pas approché ; un pilote libre
    // l'est quoi qu'il arrive, c'est tout l'enjeu de l'échéance.
    if(!libre && v.pilote.relation > 70) continue;
    if(Math.random() > (libre ? 0.42 : 0.055)) continue;
    S.actif = i;
    for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[i][k];
    const o = offreSurMonPilote();
    if(o){
      o.manche = S.manche||0;
      S.flags['offreEnCours_'+S.pilote.id] = o;
      msg('pilote', S.pilote.nom, 'Un manager est venu me voir',
        `« ${escapeHtml(o.manager)} m’a fait une proposition : `+
        `il ne prendrait que <em>${Math.round(o.commission*100)} %</em>.\n\n`+
        `Je ne te cache rien, mais j’attends de savoir ce que tu proposes. »\n\n`+
        `<em>Sans réponse de votre part d’ici trois manches, il tranchera seul.</em>`,
        {kind:'offreRivale', pilId:S.pilote.id});
    }
    syncDossier();
  }
  S.actif = retour;
  for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[retour][k];
}

/* Réponse du joueur à une offre rivale. */
function repondreOffreRivale(pilId, choix){
  const o = S.flags['offreEnCours_'+pilId];
  const p = S.pilote;
  if(!o || !p || p.id!==pilId) return null;
  delete S.flags['offreEnCours_'+pilId];
  const rp = repPalier(S.manager.repPoints).p;
  if(choix==='aligner'){
    // On s'aligne sur le taux du rival : il reste, mais vos revenus baissent.
    if(!S.mandat) S.mandat = {anneeDebut:S.annee, anneeFin:S.annee+2, duree:3, commission:COMMISSION_BASE};
    S.mandat.commission = Math.max(COMMISSION_MIN, o.commission);
    S.mandat.anneeFin = S.annee+2;
    p.relation = clamp(p.relation+16, 0, 100);
    p.moral = clamp(p.moral+6, 5, 100);
    saveGame();
    return {txt:`Il reste. Votre commission tombe à ${Math.round(S.mandat.commission*100)} %, `+
      `et le mandat repart pour trois saisons.`};
  }
  if(choix==='prolonger'){
    // On ne baisse pas le taux mais on s'engage : moins efficace, gratuit.
    const interet = interetMandat(p, S.mandat?S.mandat.commission:COMMISSION_BASE, rp, p.relation, o.repRival);
    if(Math.random() < clamp(0.30 + (p.relation-45)/110, 0.08, 0.85)){
      if(S.mandat) S.mandat.anneeFin = S.annee+2;
      p.relation = clamp(p.relation+8, 0, 100);
      saveGame();
      return {txt:'Il accepte de prolonger sans changer vos conditions. La confiance a suffi.'};
    }
    cederPilote(o);
    return {txt:'Il n’a pas été convaincu. Il part.'};
  }
  // refuser de discuter
  p.relation = clamp(p.relation-12, 0, 100);
  if(Math.random() < clamp(0.45 + (55-p.relation)/120, 0.15, 0.9)){
    cederPilote(o);
    return {txt:'Il part. Vous n’avez rien proposé.'};
  }
  saveGame();
  return {txt:'Il reste, sans enthousiasme. Le sujet reviendra.'};
}

/* Le pilote part chez le rival qui l'a approché. */
function cederPilote(o){
  const p = S.pilote;
  const m = (S.monde.managers||[]).find(x=>x.id===o.managerId);
  if(m && m.pilotes.length >= placesRival(m)){
    // Il fait de la place : son moins bon pilote retourne au vivier.
    const faible = m.pilotes.reduce((b,x)=> !b || x.plafond<b.plafond ? x : b, null);
    if(faible) m.pilotes = m.pilotes.filter(x=>x.id!==faible.id);
  }
  if(m && m.pilotes.length < placesRival(m)){
    m.pilotes.push({id:p.id, nom:p.nom, catId:p.catId, note:round(notePilote(p),1),
                    plafond:round(notePlafond(p),1), age:p.age, annee:S.annee});
    m.signatures++;
  }
  // On touche l'indemnité que le rival verse : c'est la contrepartie du départ.
  // Mandat échu : le pilote est libre, personne ne vous doit rien.
  const echu = !!(S.mandat && S.mandat.anneeFin < S.annee);
  const indem = echu ? 0 : indemniteTransfert(p, p.catId, anneesMandatRestantes());
  if(indem>0) argent('Indemnité de transfert — '+(m?m.nom:'un concurrent'), indem, 'transfert');
  msg('pilote', p.nom, 'Il part chez '+(m?m.nom:'un concurrent'),
    `${p.nom} accepte la proposition de ${m?m.nom:'un concurrent'}.\n\n`+
    (indem>0
      ? `Vous touchez une indemnité de <em>${fmtEurFull(indem)}</em> pour les commissions perdues — `+
        `mais c'est lui qui touchera les suivantes.`
      : `<b>Son mandat était échu : vous ne touchez rien.</b> C'est le prix d'une échéance laissée passer.`));
  const id = p.id;
  perdrePilote('transfert');
  // Il est chez un rival, pas au vivier : on le retire de la liste des libres.
  S.monde.scoutPool = S.monde.scoutPool.filter(x=>x.id!==id);
  saveGame();
}

/* Pilotes sous mandat rival, visibles au marché. On ne voit que ceux dont la
   catégorie est à portée de la réputation du manager — comme pour le vivier. */
/* Jusqu'où porte votre nom sur le marché : un inconnu ne débauche pas un pilote
   de Formule 2. Une seule table, pour que l'écran des transferts annonce
   exactement ce que le code applique. */
const PALIERS_MARCHE = [
  {rep:1, niv:2}, {rep:3, niv:4}, {rep:5, niv:6}, {rep:7, niv:7}, {rep:9, niv:8},
];
function niveauMarche(rp){
  let n = PALIERS_MARCHE[0].niv;
  for(const x of PALIERS_MARCHE) if(rp>=x.rep) n = x.niv;
  return n;
}
function prochainPalierMarche(rp){
  return PALIERS_MARCHE.find(x=>x.rep>rp && x.niv>niveauMarche(rp)) || null;
}
/* `tout` renvoie aussi les pilotes hors de portée, marqués comme tels : les
   montrer grisés vaut mieux que de les cacher, on voit à quoi sert la
   réputation qu'on n'a pas encore. */
function marcheTransferts(tout){
  const rp = repPalier(S.manager.repPoints).p;
  const plafondNiv = niveauMarche(rp);
  const l = [];
  for(const m of (S.monde.managers||[])){
    for(const e of m.pilotes){
      const horsPortee = !!(CAT[e.catId] && CAT[e.catId].niv > plafondNiv);
      if(horsPortee && !tout) continue;
      l.push({eleve:e, manager:m, horsPortee});
    }
  }
  return l.sort((a,b)=> b.eleve.plafond - a.eleve.plafond);
}

/* Le détail de ce qui pousse — ou retient — un pilote, aux valeurs réelles.
   C'est ce que l'écran des transferts affiche : les trois termes de
   `interetMandat`, nommés et chiffrés. */
function detailInteret(eleve, manager, commission){
  const rp = repPalier(S.manager.repPoints).p;
  const relChezLui = clamp(45 + manager.rep*3 + CAT[eleve.catId].niv*2, 20, 92);
  const gain      = (COMMISSION_BASE - commission) * 420;
  const prestige  = (rp - manager.rep) * 6;
  const lassitude = clamp((55 - relChezLui)*0.7, -25, 40);
  const interet   = gain + prestige + lassitude;
  return {rp, relChezLui, gain, prestige, lassitude, interet, proba:probaMandat(interet)};
}

/* ================= ACADÉMIE DE PILOTES (GDD §22.2) =====================
   Le vrai contenu de fin de partie : au lieu de chercher des talents, le manager
   les forme. Recrutement d'enfants de 8 à 12 ans, plusieurs saisons de formation,
   coût élevé et retour long. En contrepartie il connaît leur **potentiel réel** —
   plus d'estimation floue — et peut revendre les pilotes en surplus. */
const ACADEMIE = {
  achat: 450000, charges: 6500, places: 4,
  ageMin: 8, ageMax: 12,
  coutFormation: 9000,            // par élève et par saison
  sortie: 15,                     // âge auquel l'élève sort de l'académie
};
function academieOuverte(){ return !!(S.academie && S.academie.ouverte); }
function elevesAcademie(){ return (S.academie && S.academie.eleves) || []; }
function placesAcademie(){ return ACADEMIE.places + niveauLocal('scouting'); }
function coutAcademieMensuel(){
  if(!academieOuverte()) return 0;
  return ACADEMIE.charges + Math.round(elevesAcademie().length*ACADEMIE.coutFormation/12);
}

/* Les enfants repérés pour l'académie viennent des régions couvertes, comme le
   reste du repérage. Ils sont plus jeunes et bien moins formés que le vivier. */
function candidatsAcademie(){
  const pays = paysCouverts();
  const n = 3 + niveauLocal('scouting');
  const l = [];
  for(let i=0;i<n;i++){
    const age = rint(ACADEMIE.ageMin, ACADEMIE.ageMax);
    const r = Math.random() + repPalier(S.manager.repPoints).p*0.03;
    const potId = r>1.05?4 : r>0.80?3 : r>0.40?2 : 1;
    const p = creerPilote({age, potId, role:'eleve', catId:'kmini', pays:pick(pays), part:0.12});
    ecoleRegionale(p);
    p.observe = 99;                 // formé par vous : plus aucune incertitude
    l.push(p);
  }
  return l;
}

/* Une saison de formation. La progression est plus forte qu'en course parce
   qu'elle est encadrée, mais elle n'apporte ni résultat ni réputation : c'est
   l'investissement long que décrit le GDD. */
function formerEleves(){
  if(!academieOuverte()) return;
  const sortis = [];
  for(const e of elevesAcademie()){
    e.age++;
    const cA = coeffAge(e.age);
    for(const k of ALL_STATS){
      const marge = 1 - e.stats[k]/e.plafonds[k];
      if(marge>0) e.stats[k] = clamp(e.stats[k] + GAIN_SAISON*1.35*cA*marge*rnd(1.15,0.85), 1, e.plafonds[k]);
    }
    e.anneesFormation = (e.anneesFormation||0)+1;
    if(e.age>=ACADEMIE.sortie) sortis.push(e);
  }
  for(const e of sortis) diplomer(e);
}

/* Un élève sort de l'académie : il rejoint le vivier avec son potentiel connu. */
function diplomer(e){
  S.academie.eleves = elevesAcademie().filter(x=>x.id!==e.id);
  e.role = 'candidat';
  e.catId = e.age<=13 ? 'kcadet' : 'kjunior';
  e.observe = 99;                 // vous l'avez formé : vous savez ce qu'il vaut
  e.formeParVous = true;
  S.monde.scoutPool.unshift(e);
  msg('scout','Votre académie','Fin de formation — '+e.nom,
    `${e.nom} sort de l’académie à ${e.age} ans après ${e.anneesFormation} saison(s) de formation.\n\n`+
    `Note actuelle <em>${Math.round(notePilote(e))}</em>, plafond réel <em>${Math.round(notePlafond(e))}</em> — `+
    `vous l’avez formé, vous connaissez sa vraie valeur.\n\n`+
    `Il vous attend dans le vivier. Vous pouvez le signer, ou le vendre à une autre écurie.`);
}

/* Valeur de revente d'un élève ou d'un diplômé (GDD §22.2). */
function valeurEleve(e){
  const plaf = notePlafond(e), note = notePilote(e);
  const jeunesse = clamp((18-e.age)/8, 0, 1);
  return Math.round((plaf*plaf*22 + note*400) * (0.55 + jeunesse*0.75) / 1000)*1000;
}

/* ================= LOCAUX DU MANAGER (GDD §22.1) =======================
   Contenu de fin de partie : une fois la F1 atteinte et les revenus assurés, le
   manager réinvestit dans sa propre structure. Le GDD lie explicitement les
   locaux à la capacité de gestion — « sans structure adaptée, le manager ne peut
   pas suivre correctement plusieurs pilotes ». La réputation donne le droit de
   suivre plusieurs pilotes, les locaux en donnent les moyens. */
const LOCAUX = [
  {id:'bureau', nom:'Bureau de management', achat:180000, charges:3500, niveaux:3,
   d:'Des locaux, du personnel administratif, de quoi suivre plusieurs carrières de front.',
   effet:'+1 pilote suivi par niveau, au-delà des deux que vous pouvez gérer depuis chez vous.'},
  {id:'scouting', nom:'Cellule de recrutement', achat:140000, charges:2800, niveaux:3,
   d:'Une équipe qui centralise les rapports et fait tourner les antennes régionales.',
   effet:'Estimations resserrées comme un scout d’un niveau de plus, et deux antennes régionales de plus par niveau.'},
  {id:'marketing', nom:'Département marketing', achat:220000, charges:4200, niveaux:3,
   d:'Des gens dont le métier est de vendre votre pilote à des marques.',
   effet:'+8 % sur les montants de sponsoring et sur les chances d’aboutir, par niveau.'},
  {id:'juridique', nom:'Cabinet juridique', achat:200000, charges:3800, niveaux:3,
   d:'Des avocats qui lisent les contrats à votre place, et savent où pousser.',
   effet:'Négociations plus solides : plus de chances d’obtenir, moins de risque de retrait.'},
];
const LOCAL = Object.fromEntries(LOCAUX.map(l=>[l.id,l]));

function niveauLocal(id){ return (S.locaux && S.locaux[id]) ? S.locaux[id] : 0; }
function coutLocauxMensuel(){
  return sum(LOCAUX, l => niveauLocal(l.id) * l.charges);
}
/* Prix du niveau suivant : chaque palier coûte plus cher que le précédent. */
function coutAchatLocal(id){
  const l = LOCAL[id], n = niveauLocal(id);
  if(!l || n>=l.niveaux) return null;
  return Math.round(l.achat * Math.pow(1.7, n) / 1000)*1000;
}
/* Capacité de gestion : deux pilotes depuis chez soi, plus un par niveau de
   bureau. C'est le plafond qui s'applique en plus de celui de la réputation. */
function capaciteLocaux(){ return 2 + niveauLocal('bureau'); }
/* Antennes régionales que la structure peut faire tourner. */
function antennesMax(){ return 2 + niveauLocal('scouting')*2; }
/* Multiplicateurs appliqués ailleurs dans le jeu. */
function bonusMarketing(){ return 1 + niveauLocal('marketing')*0.08; }
function bonusJuridique(){ return niveauLocal('juridique'); }

/* ================= ENTOURAGE DU PILOTE (GDD §7.4) ======================
   « Parents envahissants en karting, qui financent une partie de la saison mais
   mettent la pression sur les résultats et les choix de carrière. » L'apport
   familial existait déjà, anonyme et sans contrepartie. Il a maintenant un
   visage : plus la famille paie, plus elle a son mot à dire. */
const ENTOURAGES = [
  {id:'absent',    nom:'Famille absente',   part:0.04, exigence:0,
   d:'Le pilote se débrouille seul. Personne pour payer, personne pour peser.'},
  {id:'discret',   nom:'Famille discrète',  part:0.14, exigence:1,
   d:'Ils suivent de loin, aident quand ils peuvent, et vous laissent travailler.'},
  {id:'present',   nom:'Famille présente',  part:0.26, exigence:2,
   d:'Ils sont à chaque course et financent une bonne part de la saison. Ils attendent des résultats.'},
  {id:'envahissant',nom:'Famille envahissante', part:0.42, exigence:3,
   d:'Ils paient beaucoup, et le font savoir. Chaque week-end sans podium devient une discussion.'},
];
const ENTOURAGE = Object.fromEntries(ENTOURAGES.map(e=>[e.id,e]));

/* Tiré à la création du pilote : l'entourage fait partie du personnage. */
function tirerEntourage(){
  const r = Math.random();
  return r<0.18 ? 'absent' : r<0.52 ? 'discret' : r<0.83 ? 'present' : 'envahissant';
}
/* L'apport familial ne vaut qu'en karting : au-delà, les budgets sont hors de
   portée d'une famille et c'est le sponsoring qui prend le relais. */
function apportFamilial(catId, p){
  if(CAT[catId].format!=='kart') return 0;
  const e = ENTOURAGE[p.entourage||'discret'];
  return Math.round(CAT[catId].cout * e.part * rnd(1.25,0.8));
}
/* La patience de la famille : elle s'use sur les mauvais résultats et se
   reconstitue sur les bons. À zéro, elle vous retire le pilote. */
function pressionFamille(pos, attendu){
  const p = S.pilote;
  if(!p || CAT[p.catId].format!=='kart') return;
  const e = ENTOURAGE[p.entourage||'discret'];
  if(!e.exigence) return;
  if(p.patienceFamille===undefined) p.patienceFamille = 100;
  // Appelé une fois par saison. Calibré pour qu'une famille envahissante tienne
  // trois ou quatre saisons décevantes avant de reprendre le pilote : assez pour
  // que le joueur voie venir, pas assez pour qu'il puisse l'ignorer.
  const ecart = attendu - pos;                       // positif = mieux qu'attendu
  const d = ecart>=0 ? 4 + ecart*1.8 : ecart*0.9*(0.6 + e.exigence*0.5);
  p.patienceFamille = clamp(p.patienceFamille + d, 0, 100);
}
/* Message de la famille, au bilan de saison. Elle parle d'autant plus fort
   qu'elle paie et qu'elle est déçue. */
function motDeLaFamille(pos, attendu){
  const p = S.pilote;
  if(!p || CAT[p.catId].format!=='kart') return null;
  const e = ENTOURAGE[p.entourage||'discret'];
  if(!e.exigence) return null;
  const pat = p.patienceFamille===undefined ? 100 : p.patienceFamille;
  if(pos<=attendu){
    if(e.id!=='envahissant' && Math.random()<0.5) return null;
    return {ton:'bon', txt:`« ${ordinal(pos)} au championnat, on est fiers. `+
      `Continuez comme ça, on suivra. »`};
  }
  if(pat<25) return {ton:'rupture', txt:`« On a payé ${e.part>0.3?'une grosse partie':'notre part'} `+
    `de la saison pour ${ordinal(pos)}. On se demande sérieusement si vous êtes le bon manager pour lui. »`};
  if(pat<55) return {ton:'tendu', txt:`« ${ordinal(pos)}. Ce n’est pas ce qu’on espérait. `+
    `On aimerait comprendre ce que vous comptez changer. »`};
  return {ton:'neutre', txt:`« La saison n’a pas été celle qu’on voulait, mais on garde confiance. `+
    `L’an prochain doit être différent. »`};
}

/* ================= BLESSURES (GDD §7.3) ================================
   Un gros crash peut coûter plusieurs manches. C'est le seul aléa du jeu que
   le manager ne peut pas anticiper — il ne peut que s'en prémunir, en payant
   un préparateur physique et en ne demandant pas au pilote de tout risquer à
   chaque course. */
const BLESSURES = [
  {id:'contusion', nom:'Contusions',            manches:[0,1], gravite:1,
   txt:'Secoué mais entier. Quelques jours de repos suffiront.'},
  {id:'poignet',   nom:'Poignet fracturé',      manches:[1,2], gravite:2,
   txt:'Le poignet a pris le choc. Plâtre, et pas de volant avant plusieurs semaines.'},
  {id:'cotes',     nom:'Côtes fêlées',          manches:[2,3], gravite:3,
   txt:'Respirer fait mal, alors piloter… Il faut attendre que ça se ressoude.'},
  {id:'jambe',     nom:'Jambe fracturée',       manches:[3,5], gravite:4,
   txt:'Opération, broches, rééducation. La saison est compromise.'},
  {id:'commotion', nom:'Commotion cérébrale',   manches:[2,4], gravite:4,
   txt:'Aucun médecin ne le laissera repartir avant les examens. On ne discute pas avec ça.'},
];

/* Un pilote blessé compte-t-il des manches à purger ? */
function blesse(p){ return !!(p && p.blessure && p.blessure.manches>0); }

/* Risque de blessure après un abandon. Un accrochage à 200 km/h en F2 n'a rien
   à voir avec une sortie de piste en Karting Mini : la gravité suit la vitesse
   de la catégorie. Le préparateur physique n'empêche pas le choc, il raccourcit
   la convalescence. */
function risqueBlessure(catId, abandon){
  if(!abandon || abandon==='Panne mécanique') return 0;
  const c = CAT[catId];
  // Calibré pour qu'une carrière de quinze saisons croise la mécanique trois ou
  // quatre fois : assez pour qu'elle existe, assez peu pour ne pas frustrer.
  const base = abandon==='Accrochage' ? 0.30 : 0.20;
  // Les voies alternatives ne s'équivalent pas : les ovales de l'IndyCar sont
  // bien plus exposés que l'endurance (GDD §8.4).
  return base * (0.45 + c.niv*0.11) * (c.risque || 1) * (reglSaison().mBlessure || 1);
}
function tirerBlessure(catId){
  const c = CAT[catId];
  // plus la catégorie est rapide, plus le tirage penche vers le grave
  const r = Math.random() + c.niv*0.035;
  const b = r>0.93 ? BLESSURES[4] : r>0.80 ? BLESSURES[3]
          : r>0.58 ? BLESSURES[2] : r>0.30 ? BLESSURES[1] : BLESSURES[0];
  const soin = staffNiv('prepa');            // le préparateur raccourcit l'arrêt
  const manches = Math.max(0, rint(b.manches[0], b.manches[1]) - (soin>=4?1:0));
  return {id:b.id, nom:b.nom, txt:b.txt, gravite:b.gravite, manches, total:manches};
}

/* Appliqué après la course, quand le pilote a abandonné. */
function verifierBlessure(course, abandon){
  const p = S.pilote, sa = S.saison;
  if(!p || !sa) return null;
  if(Math.random() >= risqueBlessure(sa.catId, abandon)) return null;
  const b = tirerBlessure(sa.catId);
  p.blessure = b;
  p.moral = clamp(p.moral - (6 + b.gravite*4), 5, 100);
  p.fatigue = clamp(p.fatigue + b.gravite*8, 0, 100);
  msg('pilote', p.nom, b.manches>0 ? 'Blessé — '+b.nom : 'Plus de peur que de mal',
    `${escapeHtml(course.nom)} : ${b.txt}\n\n`+
    (b.manches>0
      ? `<em>${b.nom}</em> — ${b.manches} manche${b.manches>1?'s':''} sans rouler.\n\n`+
        `Un préparateur physique de bon niveau raccourcit ce genre d’arrêt.`
      : `<em>${b.nom}</em> — il sera au départ de la prochaine manche.`));
  return b;
}

/* Une manche purgée à chaque tour de calendrier où le pilote aurait dû courir. */
function purgerBlessure(){
  const p = S.pilote;
  if(!blesse(p)) return false;
  p.blessure.manches--;
  if(p.blessure.manches<=0){
    msg('pilote', p.nom, 'De retour',
      `${p.nom} est déclaré apte. Il reprend le volant à la prochaine manche.\n\n`+
      `Il lui faudra quelques tours pour retrouver ses repères.`);
    p.blessure = null;
    p.forme = clamp((p.forme||70) - 12, 20, 100);   // reprise difficile
  }
  return true;
}

/* ================= MANAGERS RIVAUX (GDD §5.3) ==========================
   Sans eux le vivier est une boutique où personne ne double le joueur : on peut
   observer un jeune dix fois avant de le signer, sans risque. Des managers IA
   convoitent les mêmes talents, et un jeune repéré trop tard est signé par un
   concurrent. La convoitise est annoncée avant la signature — le joueur doit
   pouvoir arbitrer entre affiner son estimation et sécuriser le pilote. */
const MANAGERS_PRENOMS = ['Bruno','Carla','Dieter','Elena','Farid','Gino','Helena','Ivan',
  'Joana','Karl','Lucia','Marek','Nadia','Otto','Paulo','Rita','Sergio','Tomas'];
const MANAGERS_NOMS = ['Vandenberghe','Castellani','Okonkwo','Lindqvist','Baumgartner','Moreira',
  'Delacroix','Yamashita','Ferreira','Novak','Haddad','Ellingsen','Rossetti','Pereira'];
const STYLES_MANAGER = [
  {id:'flair',  nom:'Flair',      d:'mise sur le potentiel brut'},
  {id:'sur',    nom:'Prudent',    d:'préfère les valeurs sûres'},
  {id:'argent', nom:'Financier',  d:'suit l’argent avant le talent'},
];

function creerManagersRivaux(){
  const rp = repPalier(S.manager.repPoints).p;
  const pris = new Set();
  S.monde.managers = [];
  // On tire dans des listes mélangées : six « Yamashita » dans le même
  // classement font tout de suite faux.
  const prenoms = shuffle(MANAGERS_PRENOMS), patronymes = shuffle(MANAGERS_NOMS);
  for(let i=0;i<6;i++){
    const nom = prenoms[i]+' '+patronymes[i];
    pris.add(nom);
    // Chaque rival a son propre réseau : il ne voit que ce qu'il couvre.
    const regions = REGIONS.filter(r=>Math.random() < REGION_SURVEILLANCE[r.id]).map(r=>r.id);
    if(!regions.length) regions.push('eur');
    S.monde.managers.push({
      id: uid(), nom, regions,
      rep: clamp(rp + rint(-2,3), 1, 10),
      style: STYLES_MANAGER[Math.floor(Math.random()*STYLES_MANAGER.length)].id,
      appetit: round(rnd(1.35,0.55),2),
      pilotes: [],            // {nom, catId, note, plafond, age, annee}
      titres: 0, signatures: 0,
    });
  }
}

/* Ce qu'un rival voit dans un jeune, selon son style. */
function attraitPour(m, c){
  const n = notePilote(c), plaf = notePlafond(c);
  if(m.style==='flair')  return plaf*1.25 - c.age*1.5;
  if(m.style==='sur')    return n*1.15 + plaf*0.35;
  return n*0.5 + plaf*0.5 + (CAT[c.catId].niv*4);   // financier : vise le haut de l'échelle
}
/* Places libres chez un rival, même table que le joueur (GDD §15). */
function placesRival(m){ return pilotesMax(m.rep); }

/* Un tour de marché : les rivaux s'intéressent, puis l'un d'eux signe.
   `intensite` module la pression — forte à l'intersaison, faible en cours de
   saison, pour que le vivier bouge sans devenir une loterie. */
function mouvementsRivaux(intensite){
  if(!S.monde.managers || !S.monde.managers.length) return null;
  const pool = S.monde.scoutPool;
  if(!pool.length) return null;
  for(const c of pool) c.convoite = 0;

  let signe = null;
  for(const m of S.monde.managers){
    if(m.pilotes.length >= placesRival(m)) continue;
    // il ne regarde que ce que sa réputation lui ouvre
    const acces = pool.filter(c =>
      CAT[c.catId].niv <= (m.rep>=9?8 : m.rep>=7?6 : m.rep>=4?5 : 2) &&
      (!m.regions || m.regions.includes(PAYS_REGION[c.pays] || 'fr')));
    if(!acces.length) continue;
    const cible = acces.reduce((b,c)=> !b || attraitPour(m,c)>attraitPour(m,b) ? c : b, null);
    cible.convoite = (cible.convoite||0) + 1;
    // il ne passe à l'acte que si le jeune l'intéresse vraiment
    const seuil = 40 + m.rep*2.5;
    if(!signe && attraitPour(m,cible) > seuil && Math.random() < 0.18*intensite*m.appetit){
      signe = {m, c:cible};
    }
  }
  if(!signe) return null;
  const {m, c} = signe;
  m.pilotes.push({id:c.id, nom:c.nom, catId:c.catId, note:round(notePilote(c),1),
                  plafond:round(notePlafond(c),1), age:c.age, annee:S.annee});
  m.signatures++;
  S.monde.scoutPool = pool.filter(x=>x.id!==c.id);
  return {manager:m.nom, pilote:c.nom, observe:c.observe||0};
}

/* Appelé aux moments où le vivier peut bouger. Prévient le joueur seulement
   quand il avait investi sur ce jeune : sinon c'est du bruit. */
function tourDeMarche(intensite){
  const r = mouvementsRivaux(intensite);
  if(!r) return;
  if(r.observe>0){
    msg('scout','Votre réseau','Vous vous êtes fait doubler',
      `<b>${escapeHtml(r.manager)}</b> vient de signer <b>${escapeHtml(r.pilote)}</b>, `+
      `que vous aviez observé ${r.observe} fois.\n\n`+
      `Observer affine l’estimation, mais pendant ce temps le jeune reste sur le marché. `+
      `À un moment il faut trancher.`);
  }
}

/* Progression annuelle des écuries de management rivales. */
function progresserManagers(){
  if(!S.monde.managers) return;
  for(const m of S.monde.managers){
    for(const p of m.pilotes){
      p.age++;
      // il progresse vers son plafond, plus vite s'il est jeune
      const marge = Math.max(0, p.plafond - p.note);
      p.note = round(p.note + marge*rnd(0.22,0.08)*coeffAge(p.age), 1);
      // montée de catégorie quand le niveau et l'âge le permettent
      const c = CAT[p.catId], sup = catByNiv(c.niv+1);
      if(sup && p.note > NIVEAU_GRILLE[sup.id]-4 && p.age>=sup.ageMin-1 && p.age<=sup.ageMax)
        p.catId = sup.id;
      else if(p.age > c.ageMax){
        const possible = CATS.filter(x=>p.age>=x.ageMin-1 && p.age<=x.ageMax).sort((a,b)=>a.niv-b.niv)[0];
        if(possible) p.catId = possible.id;
      }
    }
    // Les pilotes trop vieux raccrochent, et un manager lâche celui qui stagne
    // sous le niveau de sa catégorie : sans ce renouvellement les rivaux
    // remplissaient leurs places une fois pour toutes et le marché se figeait.
    m.pilotes = m.pilotes.filter(p=>{
      if(p.age>=36) return false;
      const enRetard = p.note < NIVEAU_GRILLE[p.catId] - 10 && p.age >= 17;
      return !(enRetard && Math.random()<0.5);
    });
    // la réputation du manager suit le niveau de son écurie
    const meilleur = m.pilotes.reduce((b,p)=> !b || CAT[p.catId].niv>CAT[b.catId].niv ? p : b, null);
    if(meilleur){
      const vise = clamp(2 + CAT[meilleur.catId].niv, 1, 10);
      m.rep = clamp(m.rep + Math.sign(vise-m.rep)*(Math.random()<0.45?1:0), 1, 10);
    }else if(Math.random()<0.3) m.rep = clamp(m.rep-1, 1, 10);
  }
}

/* Classement des managers : le joueur y figure, c'est sa place dans le métier. */
function classementManagers(){
  const score = m => m.pilotes.reduce((s,p)=> s + CAT[p.catId].niv*10 + p.note*0.5, 0) + m.rep*8 + m.titres*30;
  const l = (S.monde.managers||[]).map(m=>({
    nom:m.nom, rep:m.rep, pilotes:m.pilotes.length, titres:m.titres,
    meilleur: m.pilotes.reduce((b,p)=> !b || CAT[p.catId].niv>CAT[b.catId].niv ? p : b, null),
    score: score(m), moi:false,
  }));
  const mesPilotes = [];
  if(S.dossiers) for(let i=0;i<S.dossiers.length;i++){
    const v = vueDossier(i);
    if(v.pilote) mesPilotes.push({catId:v.pilote.catId, note:notePilote(v.pilote)});
  }
  l.push({
    nom:S.manager.nom, rep:repPalier(S.manager.repPoints).p, pilotes:mesPilotes.length,
    titres:S.stats.titres,
    meilleur: mesPilotes.reduce((b,p)=> !b || CAT[p.catId].niv>CAT[b.catId].niv ? p : b, null),
    score: mesPilotes.reduce((s,p)=> s + CAT[p.catId].niv*10 + p.note*0.5, 0)
           + repPalier(S.manager.repPoints).p*8 + S.stats.titres*30,
    moi:true,
  });
  l.sort((a,b)=>b.score-a.score);
  l.forEach((x,i)=>x.pos=i+1);
  return l;
}

/* Coût d'engagement d'une saison sous le règlement en vigueur : un plafond
   budgétaire fait baisser la facture de tout le monde, une dérégulation la
   fait grimper (GDD §11). */
function coutEngagement(catId){
  const c = CAT[catId];
  if(!c) return 0;
  return Math.round(c.cout * (reglMonde(catId).mCout || 1) / 1000)*1000;
}

function demarrerSaison(catId, ecurieId){
  const c = CAT[catId];
  // Le règlement est figé à l'engagement, comme le nombre de manches : un
  // changement de règles à l'intersaison ne doit pas réécrire une saison
  // encore ouverte dans un autre dossier (GDD §11 et §15).
  const regl = reglMonde(catId);
  const coutRegl = coutEngagement(catId);
  const ecu = ecuriesPour(catId).find(e=>e.id===ecurieId) || ecuriesPour(catId)[Math.floor(ecuriesPour(catId).length/2)];
  S.pilote.catId = catId;
  S.saison = {
    annee: S.annee, catId, courseIndex:0,
    calendrier: genererCalendrier(catId, S.annee),
    grille: genererGrille(catId),
    ecurieId: ecu.id, ecurieNom: ecu.nom,
    voiture: clamp(ecu.voiture + (S.contrat && S.contrat.bonusVoiture ? S.contrat.bonusVoiture : 0) + rint(-2,2), 30, 99),
    fiab: ecu.fiab,
    pts:0, victoires:0, podiums:0, abandons:0, meilleur:99,
    dernierBilan: null,
    regl: regl.id,
    coutTotal: coutRegl,
    coutRestant: coutRegl,
    caisse: 0,
    mouvements: [],
    resultats: [],
    avertissements: 0,
    devDepense: 0,
    dev: {chassis:0, aero:0, moteur:0},
    finie:false,
  };
  // Apport de l'écurie (programme jeunes) : elle prend une part du budget à sa charge
  if(S.contrat && S.contrat.partEcurie>0){
    const part = Math.round(coutRegl * S.contrat.partEcurie);
    S.saison.coutRestant -= part;
    S.saison.coutTotal   -= part;
    S.saison.priseEnCharge = part;
  }
  // Apport familial en karting : son montant dépend de l'entourage (GDD §7.4)
  const fam = apportFamilial(catId, S.pilote);
  if(fam>0){
    const e = ENTOURAGE[S.pilote.entourage||'discret'];
    caisse('Apport familial — '+e.nom.toLowerCase(), fam, 'famille');
  }
  // Le tour du calendrier commun ne repart à zéro que pour la première saison
  // engagée dans l'année : engager un second pilote ne rembobine pas l'année.
  let premiere = true;
  if(S.dossiers) for(let i=0;i<S.dossiers.length;i++){
    if(i===S.actif) continue;
    const sa2 = S.dossiers[i].saison;
    if(sa2 && sa2.annee===S.annee && !sa2.finie) premiere = false;
  }
  if(premiere){ S.manche = 0; S.manches = 0; }
  syncDossier();
  recalcManches();
  S.phase = 'semaine';
  S.actions = actionsParSemaine();
  S.stats.saisonsJouees++;
  S.flags.signatureRecente = null;
  majSponsorsProspects();
  msg('systeme','Fédération','Engagement validé — saison '+S.annee,
    `${S.pilote.nom} est engagé en ${c.nom} avec ${ecu.nom}.\n\n`+
    `Budget de saison à financer : <em>${fmtEurFull(S.saison.coutTotal)}</em> sur ${c.courses} manches.\n`+
    `Chaque manche prélève ${fmtEurFull(Math.round(S.saison.coutTotal/c.courses))} sur la caisse de saison.\n\n`+
    `Règlement ${S.annee} : <b>${regl.ico} ${regl.nom}</b> — ${regl.effet}\n\n`+
    `Rappel : cet argent vient des sponsors, pas de votre trésorerie. Si la caisse est vide, c’est vous qui comblez.`);
  saveGame();
}

/* Trois actions par semaine, plus une par pilote supplémentaire. La hausse est
   volontairement sous-linéaire : gérer trois pilotes doit peser (GDD §15 —
   « plus de revenus, mais aussi plus de charge de gestion »). */
const actionsParSemaine = ()=> 3 + Math.max(0, nbPilotes()-1);

/* ---- Calendrier commun (GDD §15) ----------------------------------------
   Les pilotes gérés n'ont pas le même nombre de manches : 6 en karting, 24 en
   F2. La saison du manager compte donc autant de tours que le plus long des
   calendriers engagés, et chaque pilote y répartit ses courses régulièrement.
   Avec un seul pilote, un tour vaut une course — le déroulé est identique à
   celui de la V1. */
/* Le nombre de manches est arrêté au moment où les saisons sont engagées et ne
   bouge plus de l'année. Le recalculer en cours de route serait un piège : si le
   pilote au calendrier le plus long se fait renvoyer, le total s'effondrerait
   sous la manche en cours et clôturerait la saison de tout le monde d'un coup. */
function manchesTotales(){
  if(!S.dossiers) return S.saison ? S.saison.calendrier.length : 0;
  return S.manches || 0;
}
function recalcManches(){
  let n = S.manches || 0;
  if(S.dossiers) for(let i=0;i<S.dossiers.length;i++){
    const sa = i===S.actif ? S.saison : S.dossiers[i].saison;
    if(sa && !sa.finie && sa.annee===S.annee) n = Math.max(n, sa.calendrier.length);
  }
  S.manches = n;
  return n;
}
/* Courses encore à disputer, tous pilotes confondus. */
function coursesRestantes(){
  if(!S.dossiers) return S.saison && !S.saison.finie ? S.saison.calendrier.length-S.saison.courseIndex : 0;
  let n=0;
  for(let i=0;i<S.dossiers.length;i++){
    const sa = i===S.actif ? S.saison : S.dossiers[i].saison;
    if(sa && !sa.finie) n += Math.max(0, sa.calendrier.length - sa.courseIndex);
  }
  return n;
}
/* Index de course que ce calendrier dispute au tour donné, ou -1. */
function courseDuTour(sa, tour){
  if(!sa || sa.finie) return -1;
  const C = sa.calendrier.length, N = manchesTotales() || C;
  if(C>=N) return tour<C ? tour : -1;
  const idx = Math.floor(tour*C/N), prec = tour===0 ? -1 : Math.floor((tour-1)*C/N);
  return (idx>prec && idx<C) ? idx : -1;
}
/* Pilotes qui doivent encore courir au tour en cours. */
function coursesDuTour(){
  const l=[];
  if(!S.dossiers) return l;
  for(let i=0;i<S.dossiers.length;i++){
    const sa = i===S.actif ? S.saison : S.dossiers[i].saison;
    const pi = i===S.actif ? S.pilote : S.dossiers[i].pilote;
    if(!pi || !sa || sa.finie) continue;
    const idx = courseDuTour(sa, S.manche||0);
    if(idx>=0 && sa.courseIndex<=idx && !blesse(pi)) l.push({i, idx, sa, pilote:pi});
  }
  return l;
}
/* Pilotes qui devraient courir cette manche mais sont blessés (GDD §7.3). */
function forfaitsDuTour(){
  const l=[];
  if(!S.dossiers) return l;
  for(let i=0;i<S.dossiers.length;i++){
    const sa = i===S.actif ? S.saison : S.dossiers[i].saison;
    const pi = i===S.actif ? S.pilote : S.dossiers[i].pilote;
    if(!pi || !sa || sa.finie || !blesse(pi)) continue;
    const idx = courseDuTour(sa, S.manche||0);
    if(idx>=0 && sa.courseIndex<=idx) l.push({i, idx, sa, pilote:pi});
  }
  return l;
}
/* Passe au tour suivant une fois que tous les engagés ont couru. */
function avancerCalendrier(){
  syncDossier();
  // Les blessés déclarent forfait pour la manche : elle est purgée de leur
  // convalescence et comptée comme non disputée (GDD §7.3).
  const forfaits = forfaitsDuTour();
  if(forfaits.length){
    const retour = S.actif;
    for(const f of forfaits){
      S.actif = f.i;
      for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[f.i][k];
      const course = S.saison.calendrier[S.saison.courseIndex];
      S.saison.courseIndex++;
      S.saison.forfaits = (S.saison.forfaits||0)+1;
      msg('systeme','Fédération','Forfait — '+(course?course.nom:'manche'),
        `${S.pilote.nom} est déclaré forfait : ${S.pilote.blessure.nom}.\n\n`+
        `Encore ${Math.max(0,S.pilote.blessure.manches-1)} manche(s) d’indisponibilité.`);
      purgerBlessure();
      if(S.saison.courseIndex >= S.saison.calendrier.length) terminerSaison(false);
      syncDossier();
    }
    S.actif = retour;
    for(const k of CHAMPS_DOSSIER) S[k] = S.dossiers[retour][k];
  }
  if(coursesDuTour().length){ S.phase='semaine'; return; }   // un autre pilote attend
  const N = manchesTotales();
  if(N===0 || coursesRestantes()===0 || (S.manche||0)+1 >= N){
    pourChaqueDossier(d=>{ if(d.pilote && d.saison && !d.saison.finie) terminerSaison(false); });
    S.phase='finSaison';
    return;
  }
  S.manche = (S.manche||0)+1;
  S.phase='semaine';
  S.actions=actionsParSemaine();
  tourDeMarche(0.5);                 // le vivier bouge aussi pendant la saison
  demarchageRivaux();                // et vos pilotes se font approcher

  S.flags.bonusReglages = 0;
  // Plusieurs semaines séparent deux manches : les pilotes récupèrent seuls.
  // Sans cela, un manager qui utilise tout son temps de piste finirait la
  // saison avec des pilotes épuisés, ce qui n'a aucun sens.
  pourChaqueDossier(d=>{
    if(!d.pilote || !d.saison || d.saison.finie) return;
    d.pilote.fatigue = clamp(d.pilote.fatigue - (9 + staffNiv('prepa')*2.5), 0, 100);
    majForme();
    majSponsorsProspects();
  });
}

/* Temps de piste disponible sur un week-end. Trois runs de base : c'est court,
   et c'est voulu — quand c'est trop juste, la réponse est de recruter un
   ingénieur de course, qui en dégage jusqu'à trois de plus.
   0 → 3 runs · 1-2 → 4 · 3-4 → 5 · 5 → 6 (un de plus en F1). */
function runsDisponibles(){
  const base = CAT[S.saison.catId].format==='f1' ? 4 : 3;
  return base + Math.ceil(staffNiv('ingenieur')/2);
}

/* ------------------------------------ 9. RÉGLAGES (GDD §18) */
function optimalCircuit(course, k){
  // valeur cachée 1..20, stable pour un circuit / une saison / un paramètre
  return 1 + Math.floor(hash01(course.seed+'#'+k)*20);
}
function cibleReglage(course, k, pilote){
  return clamp(optimalCircuit(course,k) + (pilote.prefs[k]||0), 1, 20);
}
/* GDD §18.2 : Écart = |choisi - (optimal + préférence)| ; Réglages = 100 - somme normalisée */
function scoreReglages(course, setup, pilote){
  const params = setupParams(S.saison.catId);
  const ecarts = params.map(p=>Math.abs((setup[p.k]??10) - cibleReglage(course,p.k,pilote)));
  const moy = avg(ecarts);
  const score = 100 * (1 - Math.pow(Math.min(1, moy/9), 1.25)) + (S.flags.bonusReglages||0);
  return {score: clamp(score,0,100), ecarts, moy};
}
/* Ce que le stand croit savoir de la qualité d'un réglage.
   Sans ingénieur il n'y a pas de mesure : il ne reste que le ressenti du pilote,
   qui se trompe. C'est ce qui justifie d'investir dans le staff (GDD §18.3) —
   sinon il suffirait d'optimiser un chiffre affiché sans jamais écouter personne. */
const BRUIT_MESURE = [12, 9, 7, 5, 2.5, 0];
function scorePercu(scoreReel, seed, attenuation){
  const niv = staffNiv('ingenieur');
  const bruit = BRUIT_MESURE[niv] * (attenuation ?? 1);
  if(bruit<=0) return scoreReel;
  return clamp(scoreReel + (hash01(String(seed))*2-1)*bruit, 0, 100);
}
/* Rendu du score selon ce que l'ingénieur permet de savoir. */
function afficheScore(percu, nivForce, att){
  const niv = nivForce ?? staffNiv('ingenieur');
  if(niv>=5) return {txt:Math.round(percu)+'/100', cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
  if(niv>=3){
    const m = BRUIT_MESURE[niv] * (att ?? 1);
    return {txt:Math.max(0,Math.round(percu-m))+'–'+Math.min(100,Math.round(percu+m))+'/100',
            cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
  }
  const lab = percu<45 ? 'il n’est pas à l’aise'
            : percu<62 ? 'ça reste moyen'
            : percu<78 ? 'ça commence à venir'
            : percu<90 ? 'il est bien dedans'
            : 'il adore la voiture';
  return {txt:lab, cls: percu>78?'t-green':percu>55?'t-amber':'t-red'};
}

/* Retour du pilote en langage naturel. La précision dépend de l'ingénieur (GDD §18.3). */
function retourPilote(course, setup, pilote){
  const params = setupParams(S.saison.catId);
  const niv = staffNiv('ingenieur');
  const detail = params.map(p=>{
    const cible = cibleReglage(course,p.k,pilote);
    const d = (setup[p.k]??10) - cible;
    return {p, d, abs:Math.abs(d)};
  }).sort((a,b)=>b.abs-a.abs);

  const lignes = [];
  // Chaque niveau d'ingénieur achète quelque chose de précis :
  //   0-1 : le pilote décrit ce qu'il sent, à vous de traduire (aide-mémoire)
  //   2-3 : l'ingénieur nomme le correctif, sans son ampleur
  //     4 : il chiffre l'ampleur, et repère les écarts à partir de 2 crans
  //     5 : il repère jusqu'au cran près, sur tous les paramètres
  const nbSymptomes = niv>=4 ? params.length : niv===3 ? 4 : niv===2 ? 3 : 2;
  const seuil       = niv>=5 ? 1 : niv>=3 ? 2 : niv===2 ? 3 : 4;

  for(const it of detail.slice(0,nbSymptomes)){
    if(it.abs<seuil) continue;
    const symptome = it.d<0 ? it.p.lo : it.p.hi;
    const correctif= it.d<0 ? it.p.loFix : it.p.hiFix;
    if(niv<=1){
      lignes.push(symptome);                                    // symptôme seul
    }else if(niv<=3){
      lignes.push(symptome+' Il faudrait '+correctif+'.');      // + direction
    }else{
      const crans = Math.max(1, Math.round(it.abs));
      lignes.push(symptome+' Il faudrait '+correctif+', environ '+crans+' cran'+(crans>1?'s':'')+'.');
    }
  }
  if(!lignes.length){
    lignes.push(niv>=3 ? 'La voiture est équilibrée, je n’ai plus rien à redire.' : 'Ça va, je m’y retrouve bien.');
  }
  // Le commentaire doit décrire exactement ce que les lignes ci-dessus disent.
  const commentaireIng = niv===0
    ? 'Sans ingénieur, personne ne traduit ces sensations en réglages : à vous de faire le lien.'
    : niv===1 ? 'Votre ingénieur confirme les sensations sans savoir quoi corriger.'
    : niv<=3 ? 'Votre ingénieur nomme le correctif, mais pas son ampleur.'
    : niv===4 ? 'Votre ingénieur chiffre la correction à un cran près.'
    : 'Votre ingénieur lit la voiture comme un livre : correctif et ampleur exacts.';
  return {lignes, commentaireIng};
}

/* Événements de mi-course. Le §12 demande que la stratégie se décide aussi
   *pendant* la course : sans cela, une course détaillée se résume à un bouton.
   Chaque choix modifie la performance de la seconde moitié et le risque pris.
   Certains dépendent du pilote : tenter un dépassement paie si son Racecraft suit. */
const EVENEMENTS_COURSE = [

   choix:[

     {lab:'Rester en piste',   d:'On garde la position, avec des pneus usés.',    perf:-1.6, risque:1.20},
   ]},
  {id:'pluie',
   cond:c=>c.meteo.pluie>0 && c.meteo.id!=='pluie',
   titre:'La pluie arrive',
   texte:c=>`Des gouttes tombent sur le tracé. ${c.nom} est ${ordinal(c.pos)} et demande quoi faire.`,
   choix:[
     {lab:'Changer de pneus maintenant', d:'On perd du temps tout de suite, on sécurise la suite.', perf:+1.2, risque:0.75},
     {lab:'Attendre un tour de plus',    d:'Pari sur une averse passagère.',
      perf:+3.6, risque:1.55, stat:'adaptabilite'},
   ]},
  {id:'seche', 
   cond:c=>c.meteo.id==='pluie',
   titre:'La piste sèche',
   texte:c=>`La trajectoire s’assèche. ${c.nom}, ${ordinal(c.pos)}, glisse sur ses pneus pluie usés.`,
   choix:[
     {lab:'Repasser en slicks',   d:'Le bon moment, si on ne se trompe pas.',   perf:+3.2, risque:1.25},
     {lab:'Finir sur ces pneus',  d:'Prudent, mais on va perdre du rythme.',    perf:-1.4, risque:0.8},
   ]},
  {id:'usure',
   cond:c=>true,
   titre:'Usure des pneus',

   choix:[
     {lab:'Lui dire de gérer',    d:'On lève le pied, on assure l’arrivée.',    perf:-2.0, risque:0.6},
     {lab:'Lui dire de pousser',  d:'On garde le rythme, quitte à tout casser.',perf:+2.6, risque:1.6},
   ]},
  {id:'bagarre',
