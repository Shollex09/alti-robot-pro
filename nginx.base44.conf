server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html ALTI_Robot_PRO.html;

    location / {
        try_files $uri $uri/ /ALTI_Robot_PRO.html;
    }

    # never cache the service worker / manifest
    location ~* (sw\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }
}
